# ----------------------------------------------------------------------------------------------------------------------
# Playwright setup for multi-node
# ----------------------------------------------------------------------------------------------------------------------

services:
  artemis-app-node-1:
    &artemis-app-base
    image: ghcr.io/ls1intum/artemis:${ARTEMIS_DOCKER_TAG}
    extends:
      file: ./artemis.yml
      service: artemis-app
    restart: always
    user: 0:0
    depends_on:
      &depends-on-base
      postgres:
        condition: service_healthy
      jhipster-registry:
        condition: service_healthy
      activemq-broker:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    container_name: artemis-app-node-1
    env_file:
      - ./artemis/config/prod-multinode.env
      - ./artemis/config/postgres.env
      - ./artemis/config/node1.env
      - ./artemis/config/playwright.env

  artemis-app-node-2:
    <<: *artemis-app-base
    container_name: artemis-app-node-2
    depends_on:
      <<: *depends-on-base
      artemis-app-node-1:
        condition: service_healthy
    env_file:
      - ./artemis/config/prod-multinode.env
      - ./artemis/config/postgres.env
      - ./artemis/config/node2.env
      - ./artemis/config/playwright.env

  artemis-app-node-3:
    <<: *artemis-app-base
    container_name: artemis-app-node-3
    depends_on:
      <<: *depends-on-base
      artemis-app-node-1:
        condition: service_healthy
    env_file:
      - ./artemis/config/prod-multinode.env
      - ./artemis/config/postgres.env
      - ./artemis/config/node3.env
      - ./artemis/config/playwright.env

  jhipster-registry:
    extends:
      file: ./broker-registry.yml
      service: jhipster-registry
    networks:
      - artemis

  activemq-broker:
    extends:
      file: ./broker-registry.yml
      service: activemq-broker
    networks:
      - artemis

  postgres:
    extends:
      file: ./postgres.yml
      service: postgres
    restart: always

  nginx:
    extends:
      file: ./nginx.yml
      service: nginx
    depends_on:
      artemis-app-node-1:
        condition: service_started
      artemis-app-node-2:
        condition: service_started
      artemis-app-node-3:
        condition: service_started
    restart: always
    ports:
      - '80:80'
      - '443:443'
      # see comments in artemis/config/playwright.env why this port is necessary
      - '54321:54321'
    volumes:
      - ./nginx/artemis-upstream-multi-node.conf:/etc/nginx/includes/artemis-upstream.conf:ro
      - ./nginx/artemis-ssh-upstream-multi-node.conf:/etc/nginx/includes/artemis-ssh-upstream.conf:ro
      - ./nginx/artemis-nginx-playwright.conf:/etc/nginx/conf.d/artemis-nginx-playwright.conf:ro
      # Lift the nginx request rate limits for the E2E run (see the geo block in artemis-nginx.conf):
      # a full suite drives hundreds of logins and git operations from one source address.
      - ./nginx/artemis-rate-limit-exempt-e2e.conf:/etc/nginx/rate-limit-exempt/e2e.conf:ro
      - type: bind
        source: ${NGINX_PROXY_SSL_CERTIFICATE_PATH:-../src/test/playwright/certs/artemis-nginx+4.pem}
        target: "/certs/fullchain.pem"
      - type: bind
        source: ${NGINX_PROXY_SSL_CERTIFICATE_KEY_PATH:-../src/test/playwright/certs/artemis-nginx+4-key.pem}
        target: "/certs/priv_key.pem"


  artemis-playwright:
    extends:
      file: ./playwright.yml
      service: artemis-playwright
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      PLAYWRIGHT_DB_TYPE: 'Postgres'
      # Opt this stack into the @multi-node Playwright project. run-tests.sh checks for this
      # variable; the test reads the value to assert the expected cluster size.
      #
      # The cluster is asymmetric:
      #   - node-1 (profiles: core, scheduling, localvc, localci, docker)         -> core node
      #   - node-2 (profiles: core, buildagent, localvc, localci, docker)         -> core node + build agent
      #   - node-3 (profiles: buildagent only)                                    -> build agent only
      # Only core nodes register with the distributed node registry that the websocket nodes
      # endpoint reads, so it reports two. node-3 is exposed via the build-agents endpoint instead.
      EXPECTED_CLUSTER_NODE_COUNT: '2'
      # node-2 and node-3 both run a build agent, each with its own short name (see node2.env / node3.env).
      EXPECTED_MIN_BUILD_AGENTS: '2'
      # Which distributed data backend the stack runs on. ClusterFormation.spec.ts uses it to decide which node-identity
      # shape it may assert: Hazelcast publishes `[host]:port`, the Redis provider publishes a client name with no port.
      DISTRIBUTED_DATA_PROVIDER: '${DISTRIBUTED_DATA_PROVIDER:-hazelcast}'
      # Direct per-core-node URLs, so the cross-node specs can address one specific node instead of whichever
      # the load balancer picks.
      MULTI_NODE_URLS: 'http://artemis-app-node-1:8080,http://artemis-app-node-2:8080'
    networks:
      - artemis

networks:
  artemis:
    driver: "bridge"
    name: artemis

volumes:
  artemis-postgres-data:
    name: artemis-postgres-data
  artemis-data:
    name: artemis-data
