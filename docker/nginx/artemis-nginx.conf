# Load balancing
upstream artemis {
    include includes/artemis-upstream.conf;
}

# Remove nginx version from HTTP response
server_tokens off;

# Answer throttled requests with 429 rather than nginx's default 503. 503 reads as "the server is
# down", which clients and monitoring retry; 429 is the honest status and matches what the
# application-level limiter returns (RateLimitExceededException -> 429).
limit_req_status 429;

# Clients exempt from the request rate limits below. Empty in production and in the dev stack: the
# glob matches nothing and every client is limited (nginx does not fail on a mask that matches no
# file, unlike a plain `include`).
#
# The Playwright compose files mount an exemption drop-in here, because an E2E run drives hundreds of
# logins and git operations from a single source address and would otherwise be throttled to a halt:
# `loginlimit` alone budgets 30 requests per minute per address, while `Commands.login` issues one
# POST /api/core/public/authenticate per test across 5 parallel workers. The E2E stack is a throwaway
# environment, so the drop-in exempts everything rather than trying to pin down the Playwright source
# address, which differs between the host-run and containerised runners.
geo $rate_limit_exempt {
    default 0;
    include rate-limit-exempt/*.conf;
}

# An empty key is not accounted by nginx, which is how an exempt client bypasses a zone. Every zone
# keyed on the client address below uses this variable rather than $binary_remote_addr directly.
map $rate_limit_exempt $rate_limit_key {
    1       "";
    default $binary_remote_addr;
}

# Rate limit for the login REST call, at most one request every two seconds
limit_req_zone $rate_limit_key zone=loginlimit:10m rate=30r/m;
# Rate limit for the login-options lookup that drives the identifier-first login form. The client calls it once per
# login attempt, right before POST authenticate, so it gets the same budget as the login zone - but in a zone of its
# own, so that consuming it does not halve the number of logins a shared campus address can perform.
limit_req_zone $rate_limit_key zone=loginoptionslimit:10m rate=30r/m;
# Rate limit for account recovery and registration (password reset init/finish, register).
# Stricter than the login zone: these endpoints send mail and mutate credentials, and no
# legitimate client calls them repeatedly.
limit_req_zone $rate_limit_key zone=accountrecoverylimit:10m rate=5r/m;
# Rate limit for the git credential handshake (/info/refs), bounded separately from the bulk transfer
# below - which has to stay generous for real clones and pushes.
#
# Keyed on the client address only for requests that actually carry credentials. A git-over-HTTP
# operation always starts with an unauthenticated probe, which is answered 401, and only then sends the
# authenticated retry - verified against a running Artemis, where a single `git ls-remote` issues
# exactly those two /info/refs requests even with credentials embedded in the URL:
#     GET .../info/refs?service=git-upload-pack            -> 401
#     GET .../info/refs?service=git-upload-pack + Authorization -> 200
# Charging both would halve the budget (60r/m would allow only ~30 operations and burst=10 only ~5
# concurrent ones), so the credential-free probe maps to an empty key, which nginx does not account.
# The probe is not left unbounded: the location applies the general git zone alongside this one.
map $http_authorization $git_credential_present {
    ""      0;
    default 1;
}
# Only a non-exempt client presenting credentials is accounted; every other combination maps to the
# empty key.
map $rate_limit_exempt$git_credential_present $git_credential_attempt_key {
    "01"    $binary_remote_addr;
    default "";
}
limit_req_zone $git_credential_attempt_key zone=gitauthlimit:10m rate=60r/m;
# Rate limit for git data transfer, at most 5 requests per second
limit_req_zone $rate_limit_key zone=gitlimit:10m rate=5r/s;

# ----------------------------------------------------------------------------------------------------
# Cache for the client bundle. The location that uses it lives in artemis-server.conf.
#
# Without it every request for a chunk reaches a core node, which reads the file out of the WAR and
# gzips it, because server.compression is on. A cohort opening the page at once turns that into a very
# large number of application requests for a few hundred distinct files: measured against 2000
# simulated students, roughly 1.2 million of them in a few minutes, which is what limits how fast a
# lecture hall can load Artemis.
#
# Sizing: a build's bundle is tens of megabytes, so max_size is generous rather than tight and exists
# only to bound the disk. Old builds evict themselves, because their file names vanish with them;
# inactive=30d then removes what nothing has asked for since. 20m of keys is far more than the few
# hundred entries a build needs.
proxy_cache_path /var/cache/nginx/artemis-assets levels=1:2 keys_zone=artemis_assets:20m
                 max_size=2g inactive=30d use_temp_path=off;

# Collapses the many Accept-Encoding strings browsers send ("gzip, deflate, br, zstd" and friends) into
# the two representations Artemis can actually return. Both the upstream request and the cache key use
# this, so the cache holds two entries per file rather than one per browser variant.
# The zero-quality form is matched first because nginx takes the first regex that matches: a client
# sending "gzip;q=0" is explicitly refusing gzip, and the generic rule below would otherwise hand it a
# gzipped body it said it could not accept. q=0.5 and friends are not affected - the pattern requires the
# zero to end the value.
map $http_accept_encoding $artemis_asset_encoding {
    default                                 "identity";
    "~*gzip\s*;\s*q=0(\.0+)?(\s|,|$)"      "identity";
    "~*gzip"                                "gzip";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 ssl;
    listen [::]:443 quic reuseport;
    http2 on;
    http3 on;
    http3_hq on;
    quic_retry on;

    server_name _;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/priv_key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # TODO: dynamic dh param generation not needed here? Otherwise have to generate them somehow if not available at container entrypoint
    ssl_dhparam /etc/nginx/dhparam.pem;
    ssl_prefer_server_ciphers   on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';
    ssl_ecdh_curve secp384r1;
    ssl_session_timeout  10m;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
#   ssl_early_data on;
    quic_gso on;

    include includes/artemis-server.conf;
}
