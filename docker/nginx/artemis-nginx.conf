# Load balancing
upstream artemis {
    include includes/artemis-upstream.conf;
}

# Remove nginx version from HTTP response
server_tokens off;

# Answer throttled requests with 429 rather than nginx's default 503. 503 reads as "the server is
# down", which clients and monitoring retry; 429 is the honest status and matches what the
# application-level limiter returns (RateLimitExceededException -> 429).
limit_req_status 429;

# Rate limit for the login REST call, at most one requests per two seconds
limit_req_zone $binary_remote_addr zone=loginlimit:10m rate=30r/m;
# Rate limit for account recovery and registration (password reset init/finish, register).
# Stricter than the login zone: these endpoints send mail and mutate credentials, and no
# legitimate client calls them repeatedly.
limit_req_zone $binary_remote_addr zone=accountrecoverylimit:10m rate=5r/m;
# Rate limit for the git credential handshake (/info/refs). Every git-over-HTTP operation starts with
# exactly one such request, and it is the one that carries credentials, so it is bounded separately from
# the bulk transfer below - which has to stay generous for real clones and pushes.
limit_req_zone $binary_remote_addr zone=gitauthlimit:10m rate=60r/m;
# Rate limit for git data transfer, at most 5 requests per second
limit_req_zone $binary_remote_addr zone=gitlimit:10m rate=5r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic reuseport;
    listen [::]:443 ssl;
    listen [::]:443 quic reuseport;
    http2 on;
    http3 on;
    http3_hq on;
    quic_retry on;

    server_name _;

    ssl_certificate     /certs/fullchain.pem;
    ssl_certificate_key /certs/priv_key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # TODO: dynamic dh param generation not needed here? Otherwise have to generate them somehow if not available at container entrypoint
    ssl_dhparam /etc/nginx/dhparam.pem;
    ssl_prefer_server_ciphers   on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';
    ssl_ecdh_curve secp384r1;
    ssl_session_timeout  10m;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
#   ssl_early_data on;
    quic_gso on;

    include includes/artemis-server.conf;
}
