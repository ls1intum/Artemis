resolver 127.0.0.11;
resolver_timeout 5s;
client_max_body_size 10m;
client_body_buffer_size 1m;

location / {
    proxy_pass http://artemis;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
#   proxy_set_header Early-Data $ssl_early_data;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    proxy_max_temp_file_size 0;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    fastcgi_send_timeout 900s;
    fastcgi_read_timeout 900s;
    client_max_body_size 128M;
    # used to advertise the availability of HTTP/3
    add_header alt-svc 'h3=":443"; ma=2592000,h3-29=":443"; ma=2592000';
 }

# Login. NOTE: this must match the real endpoint served by PublicUserJwtResource
# (@RequestMapping("api/core/public/") + @PostMapping("authenticate")). The former
# /api/authenticate path is not served by any controller, so a block pointing at it
# silently throttles nothing. If you move the endpoint, move this location with it.
location /api/core/public/authenticate {
    proxy_pass http://artemis/api/core/public/authenticate;
    # For a given violation of the rate limit defined in the zone
	# * the first 2 (delay) requests will be allowed without delay
	# * the next (burst - delay) request waits until it fits in the rate limit
	# * the rest will be denied
	# If an attacker spams this endpoint, only the first three requests will come through.
	# This only resets if the violation of the rate limit stops.
   limit_req zone=loginlimit burst=3 delay=2;
}

# Account recovery and registration. These send mail and mutate credentials, and no legitimate client
# calls them repeatedly, so they get the stricter zone. These limits key on $binary_remote_addr (the
# real TCP peer) and so complement the application-level @LimitRequestsPerMinute buckets.
location /api/core/public/account/reset-password/init {
    proxy_pass http://artemis/api/core/public/account/reset-password/init;
    limit_req zone=accountrecoverylimit burst=3 nodelay;
}

location /api/core/public/account/reset-password/finish {
    proxy_pass http://artemis/api/core/public/account/reset-password/finish;
    limit_req zone=accountrecoverylimit burst=3 nodelay;
}

location /api/core/public/register {
    proxy_pass http://artemis/api/core/public/register;
    limit_req zone=accountrecoverylimit burst=3 nodelay;
}

location /api/core/public/activate {
    proxy_pass http://artemis/api/core/public/activate;
    limit_req zone=accountrecoverylimit burst=3 nodelay;
}

# SAML2 login callback: exchanges an established SAML2 context for an Artemis JWT cookie.
location /api/core/public/saml2 {
    proxy_pass http://artemis/api/core/public/saml2;
    limit_req zone=loginlimit burst=3 delay=2;
}

location /login/webauthn {
    proxy_pass http://artemis/login/webauthn;
    # For a given violation of the rate limit defined in the zone
	# * the first 2 (delay) requests will be allowed without delay
	# * the next (burst - delay) request waits until it fits in the rate limit
	# * the rest will be denied
	# If an attacker spams this endpoint, only the first three requests will come through.
	# This only resets if the violation of the rate limit stops.
   limit_req zone=loginlimit burst=3 delay=2;
}

# Git credential handshake. Every git-over-HTTP operation starts with exactly one /info/refs request,
# and it is the one that carries credentials, so it gets a tighter bound than the bulk transfer below -
# which has to stay generous for real clones and pushes. A regex location wins over the /git/ prefix
# location, and proxy_pass must have no URI part in a regex location (which passes the URI unchanged).
location ~ ^/git/.*/info/refs$ {
    proxy_pass http://artemis;
    limit_req zone=gitauthlimit burst=10 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
}

location /git/ {
    proxy_pass http://artemis/git/;
    # For a given violation of the rate limit defined in the zone
    # * the first 30 requests will be allowed without delay
    # * the rest will be denied
    # This only resets if the violation of the rate limit stops.
    limit_req zone=gitlimit burst=30 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    proxy_max_temp_file_size 0;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    fastcgi_send_timeout 900s;
    fastcgi_read_timeout 900s;
    client_max_body_size 128M;
}

location /favicon.ico {
    return 404;
}

error_page 502 =503 /503.html;
location /503.html {
    root /usr/share/nginx/html;
    internal;
}
