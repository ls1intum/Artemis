resolver 127.0.0.11;
resolver_timeout 5s;
client_max_body_size 10m;
client_body_buffer_size 1m;

# Forwarding headers at *server* level, so every proxying location inherits them.
#
# nginx inherits proxy_set_header from the enclosing level (http -> server -> location) and only while the
# current level declares no proxy_set_header of its own -- it never inherits from a sibling location. Setting
# these solely in `location /` therefore left every other location sending `Host: $proxy_host`, no
# X-Forwarded-For and no X-Forwarded-Proto, which is exactly wrong for the rate-limited endpoints below:
#   * Spring would see the nginx container address as the client, collapsing the per-IP
#     @LimitRequestsPerMinute buckets into one bucket shared by all users;
#   * the wrong Host would end up in the absolute links Artemis mails out for password reset,
#     registration and activation;
#   * a missing X-Forwarded-Proto makes Spring treat the request as plain http.
# Locations that need extra headers (websocket upgrade, git) restate the full set, because declaring any
# proxy_set_header in a location drops the inherited ones.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location / {
    proxy_pass http://artemis;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
#   proxy_set_header Early-Data $ssl_early_data;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    proxy_max_temp_file_size 0;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    fastcgi_send_timeout 900s;
    fastcgi_read_timeout 900s;
    client_max_body_size 128M;
    # used to advertise the availability of HTTP/3
    add_header alt-svc 'h3=":443"; ma=2592000,h3-29=":443"; ma=2592000';
 }

# The client bundle, answered from nginx's own cache instead of from a core node.
#
# Everything matched here is versioned in its URL: Angular emits content-hashed names for JavaScript,
# CSS and the media they reference, and the translation loader appends the build's I18N_HASH as a query
# parameter, which is part of the cache key. A cached copy therefore cannot go stale - a new build is a
# new URL - and the entries the old build left behind are never asked for again.
#
# The regex deliberately anchors the file name to the first path segment. It must not grow into
# something that also matches /api/..., because a regex location beats a prefix location: it would take
# the rate-limited endpoints below out of their zones without any other sign that it had happened.
location ~* ^/(?:[^/]+\.(?:js|css)|media/|i18n/) {
    proxy_pass http://artemis;

    # Declaring any proxy_set_header in a location drops every one inherited from the server level, so
    # the three forwarding headers have to be restated here - see the comment at the top of this file.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Normalised, so a core node returns one of two representations rather than one per browser.
    proxy_set_header Accept-Encoding $artemis_asset_encoding;

    proxy_cache artemis_assets;
    # The encoding is in the key because Vary is ignored below.
    proxy_cache_key "$scheme$request_method$host$request_uri$artemis_asset_encoding";
    # Artemis answers these with Vary: Accept-Encoding, and nginx would then key the entry on the
    # client's raw Accept-Encoding rather than on the normalised one set above, which is what the
    # normalisation is there to avoid. Safe to ignore only because encoding is the sole dimension these
    # responses vary on, and the key already covers it.
    proxy_ignore_headers Vary;

    # One request fills an entry and the rest wait for it. This is the line that matters at the start of
    # a lecture: without it a cold cache still sends the whole cohort upstream simultaneously, which is
    # exactly the moment the cache exists to protect.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30s;
    # Serve what we have rather than pile onto a node that is already struggling.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;

    # Only used for responses that carry no caching directives of their own. Artemis sends Cache-Control
    # on these paths and stays authoritative; this is the floor, not the policy.
    proxy_cache_valid 200 30d;
    # A 404 here means a build no longer ships that file. Cache it briefly so a stale client asking
    # repeatedly cannot turn into load, but not so long that a deploy race is remembered.
    proxy_cache_valid 404 1m;

    # add_header does not accumulate across levels: naming one here drops those set in `location /`,
    # so alt-svc is repeated to keep advertising HTTP/3 on these responses.
    add_header alt-svc 'h3=":443"; ma=2592000,h3-29=":443"; ma=2592000';
    add_header X-Cache-Status $upstream_cache_status always;
}

# Login. NOTE: this must match the real endpoint served by PublicUserJwtResource
# (@RequestMapping("api/core/public/") + @PostMapping("authenticate")). The former
# /api/authenticate path is not served by any controller, so a block pointing at it
# silently throttles nothing. If you move the endpoint, move this location with it.
location /api/core/public/authenticate {
    proxy_pass http://artemis/api/core/public/authenticate;
    # For a given violation of the rate limit defined in the zone
	# * the first 2 (delay) requests will be allowed without delay
	# * the next (burst - delay) request waits until it fits in the rate limit
	# * the rest will be denied
	# If an attacker spams this endpoint, only the first three requests will come through.
	# This only resets if the violation of the rate limit stops.
   limit_req zone=loginlimit burst=3 delay=2;
}

# Login options lookup for the identifier-first login form. NOTE: this must match the real endpoint served by
# PublicAccountResource (@RequestMapping("api/core/public/") + @GetMapping("login-options")). Bounded here as well as by
# the application-level @LimitRequestsPerMinute bucket, so that a flood is dropped at the edge instead of reaching a
# database lookup per request. The zone keys on $rate_limit_key, which maps to $binary_remote_addr (the real TCP peer,
# which the application-level limiter cannot see directly) for every client except an exempted one, which maps to the
# empty key that nginx does not account - see the geo/map blocks in artemis-nginx.conf.
location /api/core/public/login-options {
    proxy_pass http://artemis/api/core/public/login-options;
    # Same shape as the login block above: the first 2 requests pass immediately, the third waits for a slot, the rest
    # are answered 429. A real client sends exactly one of these per login attempt.
    limit_req zone=loginoptionslimit burst=3 delay=2;
}

# Account recovery and registration. These send mail and mutate credentials, and no legitimate client
# calls them repeatedly, so they get the stricter zone. These limits key on $binary_remote_addr (the
# real TCP peer) and so complement the application-level @LimitRequestsPerMinute buckets.
location /api/core/public/account/reset-password/init {
    proxy_pass http://artemis/api/core/public/account/reset-password/init;
    limit_req zone=accountrecoverylimit burst=3 nodelay;
}

location /api/core/public/account/reset-password/finish {
    proxy_pass http://artemis/api/core/public/account/reset-password/finish;
    limit_req zone=accountrecoverylimit burst=3 nodelay;
}

location /api/core/public/register {
    proxy_pass http://artemis/api/core/public/register;
    limit_req zone=accountrecoverylimit burst=3 nodelay;
}

location /api/core/public/activate {
    proxy_pass http://artemis/api/core/public/activate;
    limit_req zone=accountrecoverylimit burst=3 nodelay;
}

# SAML2 login callback: exchanges an established SAML2 context for an Artemis JWT cookie.
location /api/core/public/saml2 {
    proxy_pass http://artemis/api/core/public/saml2;
    limit_req zone=loginlimit burst=3 delay=2;
}

location /login/webauthn {
    proxy_pass http://artemis/login/webauthn;
    # For a given violation of the rate limit defined in the zone
	# * the first 2 (delay) requests will be allowed without delay
	# * the next (burst - delay) request waits until it fits in the rate limit
	# * the rest will be denied
	# If an attacker spams this endpoint, only the first three requests will come through.
	# This only resets if the violation of the rate limit stops.
   limit_req zone=loginlimit burst=3 delay=2;
}

# Git credential handshake. Every git-over-HTTP operation starts with an unauthenticated /info/refs
# probe answered 401, followed by the authenticated retry, so this is where credentials are presented and
# it gets a tighter bound than the bulk transfer below - which has to stay generous for real clones and
# pushes. A regex location wins over the /git/ prefix location, and proxy_pass must have no URI part in a
# regex location (which passes the URI unchanged).
#
# Two zones apply, and nginx evaluates both: gitauthlimit counts only the credential-bearing retry (see
# the $git_credential_attempt_key map), while gitlimit keeps the credential-free probe bounded as well -
# without it, exempting the probe from gitauthlimit would leave it unlimited here, because this regex
# location overrides the /git/ prefix location that would otherwise apply gitlimit.
location ~ ^/git/.*/info/refs$ {
    proxy_pass http://artemis;
    limit_req zone=gitauthlimit burst=10 nodelay;
    limit_req zone=gitlimit burst=30 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
}

location /git/ {
    proxy_pass http://artemis/git/;
    # For a given violation of the rate limit defined in the zone
    # * the first 30 requests will be allowed without delay
    # * the rest will be denied
    # This only resets if the violation of the rate limit stops.
    limit_req zone=gitlimit burst=30 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    proxy_max_temp_file_size 0;
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    fastcgi_send_timeout 900s;
    fastcgi_read_timeout 900s;
    client_max_body_size 128M;
}

location /favicon.ico {
    return 404;
}

error_page 502 =503 /503.html;
location /503.html {
    root /usr/share/nginx/html;
    internal;
}
