server {
    listen 54321 default_server;
    listen [::]:54321 default_server;
    server_name _;

    include includes/artemis-server.conf;

    # Content-hashed build assets (Angular emits `name-<HASH>.js/.css` with an 8+ char uppercase base32
    # hash) are immutable. Without a long-lived Cache-Control the browser re-fetches every lazy chunk on
    # each navigation; under the Angular 22 runtime that chunk-fetch churn evicts the small /api response
    # bodies from Chromium's per-renderer network buffer before tests read them ("Network.getResponseBody:
    # No data found for resource"). Caching the hashed assets lets the existing per-worker chunk pre-warm
    # actually stick and stops the churn. Scoped to E2E (this vhost is used only by the Playwright compose
    # stacks); the case-sensitive uppercase-hash match excludes ngsw-worker.js, index.html and other
    # non-hashed files.
    location ~ "-[A-Z0-9]{8,}\.(?:js|mjs|css)$" {
        proxy_pass http://artemis;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
