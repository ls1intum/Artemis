# Playwright's API interception disables caching, allowing lazy module bursts to
# exceed 1000 requests. Avoid HTTP/2 GOAWAY here; contexts close after each test.
keepalive_requests 10000;

server {
    listen 54321 default_server;
    listen [::]:54321 default_server;
    server_name _;

    include includes/artemis-server.conf;
}
