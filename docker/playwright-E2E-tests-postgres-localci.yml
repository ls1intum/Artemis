# ----------------------------------------------------------------------------------------------------------------------
# Playwright Setup Local (Postgres)
# ----------------------------------------------------------------------------------------------------------------------

services:
    postgres:
        extends:
            file: ./postgres.yml
            service: postgres

    artemis-app:
        image: ghcr.io/ls1intum/artemis:${ARTEMIS_DOCKER_TAG}
        extends:
            file: ./artemis.yml
            service: artemis-app
        user: 0:0
        depends_on:
            postgres:
                condition: service_healthy
        ports:
          - "8080:8080"
        env_file:
            - ./artemis/config/postgres.env
            - ./artemis/config/playwright.env
            - ./artemis/config/playwright-local.env
        environment:
            # Pass through ARM64 architecture setting from host (for Apple Silicon Macs)
            - ARTEMIS_CONTINUOUSINTEGRATION_IMAGEARCHITECTURE=${ARTEMIS_CONTINUOUSINTEGRATION_IMAGEARCHITECTURE:-amd64}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock

    nginx:
        extends:
            file: ./nginx.yml
            service: nginx
        # the artemis-app service needs to be started, otherwise there are problems with name resolution in docker
        depends_on:
            artemis-app:
                condition: service_started
        volumes:
            - ./nginx/artemis-nginx-playwright.conf:/etc/nginx/conf.d/artemis-nginx-playwright.conf:ro
            # Lift the nginx request rate limits for the E2E run (see the geo block in artemis-nginx.conf):
            # a full suite drives hundreds of logins and git operations from one source address.
            - ./nginx/artemis-rate-limit-exempt-e2e.conf:/etc/nginx/rate-limit-exempt/e2e.conf:ro
        ports:
            - '80:80'
            - '443:443'
            # see comments in artemis/config/playwright.env why this port is necessary
            - '54321:54321'

    artemis-playwright:
        extends:
            file: ./playwright.yml
            service: artemis-playwright
        depends_on:
            artemis-app:
                condition: service_healthy
        environment:
            PLAYWRIGHT_DB_TYPE: 'Postgres'
            # Build-result budgets are sized from measured build durations of two full CI runs (416 builds):
            # median 17-23 s, p99 124-133 s, max 138 s, with 55-78 "more processing jobs than the build agents'
            # capacity" warnings per run. At the previous 90 s, 5-8 % of builds finished too late and roughly one
            # test per run failed on it; the tests are impatient, not the builds broken. MAX_RETRIES in
            # ExerciseAPIRequests is derived from BUILD_FINISH_TIMEOUT_MS, so this also covers the setup path that
            # waits for the solution build to produce test cases. Raising these costs nothing on a green run: a
            # timeout is only ever paid when it fires.
            # Pass through configurable timeouts from host (defaults are CI values)
            BUILD_RESULT_TIMEOUT_MS: ${BUILD_RESULT_TIMEOUT_MS:-180000}
            BUILD_FINISH_TIMEOUT_MS: ${BUILD_FINISH_TIMEOUT_MS:-180000}
            EXAM_DASHBOARD_TIMEOUT_MS: ${EXAM_DASHBOARD_TIMEOUT_MS:-60000}
            # Pass through Playwright test timeouts
            TEST_TIMEOUT_SECONDS: ${TEST_TIMEOUT_SECONDS:-300}
            FAST_TEST_TIMEOUT_SECONDS: ${FAST_TEST_TIMEOUT_SECONDS:-60}
            SLOW_TEST_TIMEOUT_SECONDS: ${SLOW_TEST_TIMEOUT_SECONDS:-360}
        network_mode: service:artemis-app

networks:
    artemis:
        driver: 'bridge'
        name: artemis
volumes:
    artemis-postgres-data:
        name: artemis-postgres-data
    artemis-data:
        name: artemis-data
