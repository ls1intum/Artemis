rootProject.name=Artemis
profile=dev

# Build properties
node_version=24.20.0
pnpm_version=11.25.0

# Dependency versions
spring_boot_version=4.1.1
spring_cloud_version=2025.1.3
opensaml_version=5.2.3
jwt_version=0.13.0
jaxb_runtime_version=4.0.9
hazelcast_version=5.7.0
# Jackson 2 versions are managed by the Spring Boot BOM; only jackson-datatype-hibernate7 is explicitly declared
jgit_version=7.7.1.202607240634-r
sshd_version=2.19.0
checkstyle_version=13.11.0
jplag_version=6.3.0
# Not really used by Artemis, JPlag, or the Stanford CoreNLP release we depend on, but kept at the latest patch of
# this line to avoid security vulnerability warnings.
# NOTE: stay on the 8.x line as long as Stanford CoreNLP does not reference a newer major; bump only together with it.
lucene_version=8.11.4
slf4j_version=2.0.18
sentry_version=8.55.0
liquibase_version=5.0.4
docker_java_version=3.7.1
kubernetes_client_version=7.7.0
# logback versions managed by Spring Boot BOM
byte_buddy_version=1.18.11
mysql_connector_version=9.7.0
# micrometer versions managed by Spring Boot BOM
snakeyaml_version=2.6
helios_status_version=1.2.0
# Version forced onto every Netty module pulled in transitively (Spring AI, reactor-netty,
# azure-core-http-netty, …) via the resolutionStrategy in build.gradle. Older releases carry
# multiple high-severity CVEs, so keep this on the latest patched release and bump as advisories land.
netty_version=4.2.17.Final
bucket4j_version=8.19.0
weaviate_client_version=6.3.1
# Must be compatible with the Java client: https://docs.weaviate.io/weaviate/release-notes
weaviate_server_version=1.37.14
commons_lang3_version=3.20.0
commons_text_version=1.15.0
redisson_version=4.7.0
# Pinned to override the older version pulled in transitively via the Spring Boot / Micrometer tracing
# BOM; older releases have a W3C Baggage unbounded-memory-allocation advisory (GHSA-rcgg-9c38-7xpx).
opentelemetry_version=1.65.0


# testing
# make sure both versions are compatible
junit_version=6.1.3
mockito_version=5.23.0
testcontainers_version=2.0.5
ryuk_version=0.14.0


# gradle plugin version
gradle_node_plugin_version=7.1.0
apt_plugin_version=0.21
liquibase_plugin_version=3.1.0
modernizer_plugin_version=1.15.0
spotless_plugin_version=8.10.1

org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.country=US -Duser.language=en \
  --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED \
  --add-modules java.se \
  --add-exports java.base/jdk.internal.ref=ALL-UNNAMED \
  --add-opens java.base/java.lang=ALL-UNNAMED \
  --add-opens java.base/sun.nio.ch=ALL-UNNAMED \
  --add-opens java.management/sun.management=ALL-UNNAMED \
  --add-opens jdk.management/com.sun.management.internal=ALL-UNNAMED
