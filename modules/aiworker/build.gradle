apply from: rootProject.file('gradle/isolated-module.gradle')
apply plugin: 'org.springframework.boot'
apply plugin: 'org.cyclonedx.bom'

dependencies {
    implementation project(':aiworker:api')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.springframework.boot:spring-boot-starter-artemis'
    implementation "com.github.docker-java:docker-java-core:${docker_java_version}"
    implementation "com.github.docker-java:docker-java-transport-zerodep:${docker_java_version}"
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'tools.jackson.core:jackson-databind'
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml'
    implementation 'org.springframework.ai:spring-ai-client-chat'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit:1.5.0'
    testImplementation 'org.apache.artemis:artemis-server'
    testImplementation 'org.apache.artemis:artemis-jakarta-server'
}

springBoot {
    mainClass = 'de.tum.cit.aet.artemis.aiworker.config.AiWorkerApplication'
}

jar {
    enabled = true
}

bootJar {
    archiveFileName = 'aiworker.jar'
}

processTestResources {
    from(rootProject.file('src/main/resources')) {
        // Negative coverage: a valid Maven harness must still fail Gradle-only admission.
        include 'templates/java/maven_maven/test/projectTemplate/pom.xml'
    }
    from(rootProject.file('docker/aiworker/broker.xml')) {
        rename 'broker.xml', 'aiworker-broker.xml'
    }
}

cyclonedxDirectBom {
    includeConfigs = ['runtimeClasspath']
    includeLicenseText = false
    xmlOutput.unsetConvention()
}

test {
    // The embedded broker's journal releases JDK-allocated direct buffers, which Netty's Java 25 cleaner cannot release.
    systemProperty 'io.netty.noUnsafe', 'false'
}


// Verify the actual deployable dependency graph, not a filtered test classloader.
tasks.named('verifyRuntimeBoundary') {
    doLast {
        def forbidden = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            it.name == 'hyperion' || it.moduleVersion.id.group in ['org.eclipse.jgit', 'com.thoughtworks.qdox', 'net.sourceforge.plantuml'] || it.name.contains('openai')
        }
        if (!forbidden.empty) {
            throw new GradleException("Workload dependencies in generic AI Worker: ${forbidden*.moduleVersion*.id}")
        }
    }
}
