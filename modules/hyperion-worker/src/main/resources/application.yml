spring:
    application:
        name: artemis-hyperion-worker
    main:
        web-application-type: none
    autoconfigure:
        # Generation uses chat only. Do not instantiate unrelated provider clients.
        exclude:
            - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
            - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
            - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
            - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
            - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
    artemis:
        mode: native
        broker-url: ${HYPERION_BROKER_URL}
        user: ${HYPERION_BROKER_USER}
        password: ${HYPERION_BROKER_PASSWORD}
artemis:
    hyperion:
        worker:
            id: ${HYPERION_WORKER_ID}
            image: ${HYPERION_SANDBOX_IMAGE}
management:
    tracing:
        sampling:
            probability: 1.0
        export:
            otlp:
                enabled: false
    logging:
        export:
            otlp:
                enabled: false
    otlp:
        metrics:
            export:
                enabled: false
