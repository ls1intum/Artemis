name: Artemis CodeQL configuration

# Used by ci-codeql.yml (`config-file`). `paths-ignore` removes files from the JavaScript/TypeScript
# database, which is what the extraction and query time scales with. For Java, which is traced
# through the Gradle build, it only filters alerts; the build compiles main sources only, so test
# code is not in that database in the first place.
#
# Keep in sync with the `codeql` filter in ci.yml: a change confined to these paths does not
# start a scan, because there is nothing in it for CodeQL to analyse.
paths-ignore:
  - '**/*.spec.ts'
  - 'src/test/**'
  # Generated by openapi-generator from config/openapi/openapi.yaml; edit the spec, not this code.
  - 'src/main/webapp/app/openapi/**'
