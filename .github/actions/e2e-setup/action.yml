name: 'E2E Test Setup'
description: 'Common setup steps for E2E test jobs'

inputs:
  workflow-run-id:
    description: 'Run ID that holds the `docker-tag` artifact (the umbrella run id under workflow_call).'
    required: true
  commit-sha:
    description: 'Exact source revision the image must contain.'
    required: true
  github-token:
    description: 'Token for the cross-job artifact download.'
    required: true
  test-notice:
    description: 'Optional human-readable notice describing the test selection (logged for the run).'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Clear evidence before downloads or validation can fail, so teardown cannot publish a previous run's manifests.
    - name: Clear stale Playwright execution evidence
      shell: bash
      run: |
        rm -f src/test/playwright/test-reports/collection-*.json \
              src/test/playwright/test-reports/completion-*.json \
              src/test/playwright/test-reports/runner-status.env

    - name: Add link to triggering workflow
      shell: bash
      env:
        RUN_ID: ${{ inputs.workflow-run-id }}
        REPO: ${{ github.repository }}
        # `test-notice` is composed from determine-relevant-tests.sh output; route through
        # env to keep its content out of shell-injection paths.
        NOTICE: ${{ inputs.test-notice }}
      run: |
        echo "::notice title=Triggered by workflow run::This E2E test was triggered by workflow run #$RUN_ID - View it at https://github.com/$REPO/actions/runs/$RUN_ID"
        if [ -n "$NOTICE" ]; then
          echo "::notice title=Test Selection::$NOTICE"
        fi

    - name: Download Docker tag
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: docker-tag
        github-token: ${{ inputs.github-token }}
        run-id: ${{ inputs.workflow-run-id }}

    - name: Set Docker Tag Environment Variable
      shell: bash
      env:
        EXPECTED_COMMIT_SHA: ${{ inputs.commit-sha }}
      run: |
        set -Eeuo pipefail
        if ! [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Expected a full source commit SHA."
          exit 1
        fi
        if [ ! -f docker-tag.txt ]; then
          echo "::error::Missing docker-tag.txt build artifact."
          exit 1
        fi
        ARTEMIS_DOCKER_TAG=$(cat docker-tag.txt)
        if [ "$ARTEMIS_DOCKER_TAG" != "sha-${EXPECTED_COMMIT_SHA}" ]; then
          echo "::error::Docker tag artifact does not identify expected commit ${EXPECTED_COMMIT_SHA}."
          exit 1
        fi
        {
          echo "ARTEMIS_DOCKER_TAG=${ARTEMIS_DOCKER_TAG}"
          echo "ARTEMIS_EXPECTED_COMMIT_SHA=${EXPECTED_COMMIT_SHA}"
        } >> "$GITHUB_ENV"
        echo "Using Docker tag: ${ARTEMIS_DOCKER_TAG}"

    - name: Run cleanup script (before E2E)
      shell: bash
      run: supporting_scripts/ci/E2E-tests/cleanup.sh

    # Must run after the cleanup (which stops containers but leaves images) and before the tests, so
    # no build job ever races a multi-gigabyte on-demand pull. See the script header for the failure
    # this prevents.
    - name: Pre-pull exercise images
      shell: bash
      run: supporting_scripts/ci/E2E-tests/prepull-exercise-images.sh

    - name: Clean old test results
      shell: bash
      run: |
        # `rm -rf`/`rm -f` of non-existent paths exit 0; no fallback needed.
        rm -rf src/test/playwright/test-reports/*.xml \
               src/test/playwright/test-reports/monocart-report-* \
               src/test/playwright/test-reports/client-coverage \
               src/test/playwright/test-reports/.reporter-failed
