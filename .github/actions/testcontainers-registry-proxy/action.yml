name: Route Testcontainers pulls through the registry proxy
description: >
  Makes Testcontainers pull Docker Hub images through the AET Harbor proxy cache and never from Docker Hub itself.
  Docker Hub limits anonymous pulls per IP address and the self-hosted runners share few addresses, so a pull can stall
  until Testcontainers gives up ("Docker image pull has not made progress"). The step fails when the cache cannot be
  reached. Run it after the checkout and before the server tests.

inputs:
  docker-hub-proxy:
    description: Registry path that mirrors Docker Hub
    required: false
    default: harbor.aet.cit.tum.de/dockerhub-ghr-proxy

runs:
  using: composite
  steps:
    # Testcontainers prepends TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX to every Docker Hub image it starts, so those
    # pulls go to the cache. Ryuk is the first container of every test JVM: fetching it here makes an unreachable
    # cache fail in this step, where the cause is visible, instead of as an initializationError in every shard.
    - name: Route Testcontainers pulls through the registry proxy
      shell: bash
      env:
        DOCKER_HUB_PROXY: ${{ inputs.docker-hub-proxy }}
      run: |
        ryuk="testcontainers/ryuk:$(sed -n 's/^ryuk_version=//p' gradle.properties)"
        bash supporting_scripts/ci/pull-through-registry-proxy.sh "$ryuk"
        echo "TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX=${DOCKER_HUB_PROXY}/" >> "$GITHUB_ENV"
        echo "Testcontainers pulls Docker Hub images through ${DOCKER_HUB_PROXY}."
