name: 'Query report'
description: >-
  Turns the query report of an E2E run into the PR comment text, the HTML artifact and the
  baseline keys (see supporting_scripts/analyze_query_report.sh). Advisory: no step fails the job.

inputs:
  tests-outcome:
    description: 'Outcome of the E2E test step. Anything but "success" withholds the baseline keys and the inline comments.'
    required: true
  artifact-name:
    description: 'Name of the uploaded HTML report artifact'
    required: true
  compare-with-develop:
    description: 'Download the latest develop baseline, so the report can mark what the run adds'
    required: false
    default: 'true'
  publish-baseline:
    description: 'Upload this run''s finding keys as the baseline of later runs (develop runs only)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Download the develop baseline
      if: ${{ !cancelled() && inputs.compare-with-develop == 'true' }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          // demo: compare against the keys of a pinned run of a demo branch that had none of the demo's changes
          const fs = require('fs');
          fs.rmSync('query-baseline.zip', { force: true });  // self-hosted workspaces persist between runs
          const zip = await github.rest.actions.downloadArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: 13185960699, archive_format: 'zip' });
          fs.writeFileSync('query-baseline.zip', Buffer.from(zip.data));

    - name: Rename the keys of the pinned demo baseline
      if: ${{ !cancelled() && inputs.compare-with-develop == 'true' }}
      continue-on-error: true
      shell: bash
      # demo: the pinned artifact was uploaded before the report files were renamed
      run: |
        python3 - <<'PY'
        import zipfile
        with zipfile.ZipFile('query-baseline.zip') as old:
            keys = old.read('slow-query-keys.json')
        with zipfile.ZipFile('query-baseline.zip', 'w') as new:
            new.writestr('query-keys.json', keys)
        PY

    - name: Collect the report
      if: ${{ !cancelled() }}
      shell: bash
      env:
        E2E_TESTS_OUTCOME: ${{ inputs.tests-outcome }}
      run: bash supporting_scripts/analyze_query_report.sh || true

    - name: Upload the HTML report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      continue-on-error: true
      with:
        name: ${{ inputs.artifact-name }}
        path: query-report.html
        if-no-files-found: warn

    - name: Upload the baseline keys
      if: ${{ !cancelled() && inputs.publish-baseline == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      continue-on-error: true
      with:
        name: Query Baseline
        path: query-keys.json
        retention-days: 90
        if-no-files-found: warn
