name: Nightly LTI Interop

# The workflow runs on a fixed schedule against the default branch and on manual dispatch.
# It does not consume any untrusted GitHub event inputs (issue/PR titles, commit messages, etc.),
# so command injection vectors from such inputs are not applicable here.

on:
  schedule:
    - cron: '0 3 * * *'        # 03:00 UTC daily
  workflow_dispatch:           # manual ad-hoc runs

concurrency:
  group: nightly-lti-interop
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  moodle-interop:
    name: nightly-lti / moodle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Setup Gradle
        # Sole Gradle dependency-cache mechanism (prunes unused artifacts -> leaner cache, less eviction). See ci-build.yml.
        uses: gradle/actions/setup-gradle@v6
      - name: Run nightly LTI Moodle interop suite
        run: ./gradlew test --tests "de.tum.cit.aet.artemis.lti.nightly.NightlyLtiMoodleInteropTest" -DincludeTags='nightly-lti' -x webapp
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-lti-reports-moodle
          path: build/reports/tests/test
      - name: Open a tracking issue on failure
        # Only on the scheduled nightly: manual workflow_dispatch runs are actively watched by whoever
        # triggered them, so they should not create tracking issues.
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/open-failure-issue
        with:
          title: Nightly LTI interop failed (Moodle)
          assignee: krusche
          github-token: ${{ github.token }}
          body: >-
            The nightly LTI Moodle interop suite failed on develop. This is a non-blocking monitor;
            investigate the linked workflow run to see whether the Moodle <-> Artemis LTI contract drifted.
