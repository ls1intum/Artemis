name: Release TUM UI

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: tum-ui-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  build:
    if: github.repository == 'ls1intum/Artemis'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      integrity: ${{ steps.artifact.outputs.integrity }}
      filename: ${{ steps.artifact.outputs.filename }}
      node: ${{ steps.artifact.outputs.node }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Validate release identity
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import semver from 'semver';
          const { name, version } = JSON.parse(readFileSync('packages/tum-ui/package.json', 'utf8'));
          assert.equal(semver.valid(version), version, 'Version must be canonical SemVer');
          assert.equal(semver.prerelease(version), null, 'Use a regular release version');
          assert.equal(semver.parse(version).build.length, 0, 'Build metadata is not a release identity');
          if (process.env.RELEASE_REF_TYPE === 'tag') assert.equal(process.env.RELEASE_REF, `${name}@${version}`);
          NODE
          if [ "$RELEASE_REF_TYPE" = tag ]; then
            git merge-base --is-ancestor HEAD origin/develop
          fi
      - run: pnpm run tum-ui:lint && pnpm run tum-ui:stylelint
      - run: pnpm exec vitest run --config rules/vitest.config.mjs rules/tum-ui-package.spec.mjs rules/tum-ui-release.spec.mjs
      - run: pnpm run tum-ui:test:coverage
      - run: pnpm --dir packages/tum-ui exec playwright install --with-deps --only-shell chromium
      - run: pnpm --dir packages/tum-ui run storybook:validate
      - run: pnpm run tum-ui:pack:check
      - name: Record immutable artifact
        id: artifact
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { filename, integrity } = JSON.parse(readFileSync('build/tum-ui-package/package.json', 'utf8'));
          const node = readFileSync('.nvmrc', 'utf8').trim();
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${filename}\nintegrity=${integrity}\nnode=${node}\n`);
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: tum-ui-package
          path: build/tum-ui-package/
          if-no-files-found: error
          retention-days: 14

  consumer:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        peers: [minimum, latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: tum-ui-package
          path: build/tum-ui-package
      - run: pnpm --dir packages/tum-ui exec playwright install --with-deps --only-shell chromium
      - run: pnpm run tum-ui:test:consumer ${{ matrix.peers }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: tum-ui-consumer-${{ matrix.peers }}
          path: build/test-results/tum-ui-consumer/
          if-no-files-found: ignore
          retention-days: 7

  stage:
    needs: [build, consumer]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-tum-ui
    permissions:
      contents: read
      id-token: write
    steps:
      # Keep package code out of the credentialed job.
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.build.outputs.node }}
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: tum-ui-package
          path: artifact
      - name: Verify and stage the tested tarball
        env:
          PACKAGE_FILE: ${{ needs.build.outputs.filename }}
          PACKAGE_INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const bytes = readFileSync(`artifact/${process.env.PACKAGE_FILE}`);
          assert.equal(`sha512-${createHash('sha512').update(bytes).digest('base64')}`, process.env.PACKAGE_INTEGRITY);
          NODE
          npm stage publish "artifact/$PACKAGE_FILE" --ignore-scripts --access public
          echo 'Review the staged package on npm and approve it with 2FA to complete publication.' >> "$GITHUB_STEP_SUMMARY"
