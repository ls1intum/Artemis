name: Liquibase Schema

# Proves that the changelogs produce the schema they claim to, on both supported databases.
#
# The baseline under config/liquibase/baseline is generated, and generated by a script that never
# touches a database. Nothing about the file itself establishes that it describes the same schema as
# the changelogs it folded — this workflow is what establishes that, which is why cutting a baseline
# is allowed to be routine. See documentation/docs/developer/guidelines/database-migration-consolidation.mdx.
#
# The layout check is pure source analysis and runs on its own, so the structural rules report before
# any container starts. The database checks need Docker but no Gradle build beyond resolving the JDBC
# drivers, and the whole matrix finishes in a couple of minutes.

on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'SHA to check. PR builds use the PR head SHA (matching ci-build.yml).'
        required: true
        type: string

permissions: {} # default-deny; each job grants only what it needs

env:
  CI: true
  java: 25

jobs:
  layout:
    name: Changelog Layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Changelog layout check
        run: python3 supporting_scripts/liquibase/verify_schema.py --check layout

  schema:
    name: Schema (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Both databases always report. A difference that only shows on one of them is the whole reason
      # this runs twice, so a failure on MySQL must not hide the PostgreSQL result or the other way round.
      fail-fast: false
      matrix:
        database: [postgres, mysql]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          # The upgrade-from-floor check reads the Liquibase resources out of the git tag of the oldest
          # supported release. A shallow checkout has no tags, so the script fetches the one it needs on
          # demand, which needs the credentials actions/checkout leaves behind.
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.java }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Only to resolve the JDBC drivers the Liquibase CLI image needs, so that the checks connect
      # with the same driver versions the application does. No compilation.
      - name: Export JDBC drivers
        run: ./gradlew exportLiquibaseDrivers -q
      - name: Schema checks
        run: python3 supporting_scripts/liquibase/verify_schema.py --database ${{ matrix.database }}
      - name: Reset-key migration with existing data
        run: python3 supporting_scripts/liquibase/test_reset_key_migration.py --database ${{ matrix.database }}
      - name: Memiris cleanup with existing data
        run: python3 supporting_scripts/liquibase/test_memiris_cleanup_migration.py --database ${{ matrix.database }}
      - name: One-to-one chat pair migration with existing data
        run: python3 supporting_scripts/liquibase/test_one_to_one_chat_pair_migration.py --database ${{ matrix.database }}
      - name: Course authorities migration with existing data
        run: python3 supporting_scripts/liquibase/test_course_authorities_migration.py --database ${{ matrix.database }}
