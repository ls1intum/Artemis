name: Agent Skills

# Run independently of ci-quality.yml so Markdown-only changes are checked.

on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'SHA to check. PR runs use the PR head SHA (matching ci-build.yml).'
        required: true
        type: string

permissions: {}

jobs:
  skill-references:
    name: Skill Path References
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Checker self-test
        run: python supporting_scripts/check_skill_references.py --self-test
      - name: Skill path references
        if: ${{ !cancelled() }}
        run: python supporting_scripts/check_skill_references.py
