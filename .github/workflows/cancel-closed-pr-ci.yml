name: Cancel Closed PR CI

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cancel-ci:
    name: Cancel CI for the closed PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # pull_request_target uses the trusted repository revision, including for forks.
      - name: Check out trusted cancellation script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Cancel active umbrella CI runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: await require('./.github/scripts/cancel-closed-pr-ci.js')({ github, context, core })
