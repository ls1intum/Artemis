name: Build

on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'SHA the build is for. PR builds use the PR head SHA, not the merge commit.'
        required: true
        type: string
      is_pr:
        description: 'True when the umbrella was triggered by pull_request.'
        required: true
        type: boolean
      is_internal_pr:
        description: 'True only for PRs from branches inside ls1intum/Artemis (fork PRs cannot push to GHCR).'
        required: true
        type: boolean
      is_release:
        description: 'True when the umbrella was triggered by a release.'
        required: true
        type: boolean
      is_release_build:
        description: 'True for release-eligible builds (release events + develop/main/release-branch pushes). Gates -Psbom. Computed once in ci.yml so the event/ref logic lives in a single place.'
        required: true
        type: boolean
      release_tag:
        description: 'Tag name of the release. Empty when is_release is false.'
        required: true
        type: string
      pr_number:
        description: 'PR number for chunk-eager-quality''s comment posting; 0 when not a PR (matches ci-e2e.yml''s convention).'
        required: true
        type: number

# Default-deny at workflow level; each job grants only what it needs.
permissions: {}

# Workflow-level node/java pins are drift-checked by ci-workflows.yml.
env:
  CI: true
  node: 24
  java: 25

jobs:
  build-war:
    name: Build .war artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Read-only: the release-asset upload (which needs `contents: write`) is the separate
      # `upload-release` job below, so the write token never sits on this every-PR build.
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.node }}'
          cache: 'pnpm'
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.java }}'
          # `cache: 'gradle'` is the legacy path; `setup-gradle@v6` below owns Gradle caching.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Angular Client
        # Build the Angular client separately so that Node.js/esbuild get full system
        # memory without competing with the Gradle JVM (which reserves up to 4g).
        # --optimization=false works around an esbuild crash during script optimization.
        #
        # The result is moved to build/webapp-dist rather than left at the Angular config's
        # default build/resources/main/static: Gradle deletes any declared task-output directory
        # it does not already recognize from a previous build in this workspace (see the `webapp`
        # task in gradle/profile_prod.gradle for the full explanation) — on a fresh checkout that
        # is every directory, every time. Since build/resources/main/static is processResources'
        # output directory, anything written there before Gradle even starts would be wiped again
        # before the first task runs. build/webapp-dist is not declared as any task's output, so
        # it survives; the `webapp` Gradle task picks it up from there.
        run: pnpm run clean-www && pnpm run prebuild && pnpm exec ng build --configuration production --optimization=false --stats-json && mv build/resources/main/static build/webapp-dist
      - name: Generate eager-chunk loading report
        # Feeds the chunk-eager-quality job below (PR runs) and, on develop pushes, becomes the
        # next baseline that PR runs compare against. See supporting_scripts/chunk-eager-loading/README.md.
        #
        # CHUNK_REPORT_SHA/_BRANCH override GITHUB_SHA/GITHUB_REF_NAME, which for pull_request
        # runs describe a synthetic merge commit (ref literally becomes "<pr-number>/merge"), not
        # the PR's real head -- confirmed by inspecting a real run's uploaded artifact. `inputs.commit_sha`
        # and `github.head_ref` resolve correctly in both the PR and push (develop) cases;
        # `github.head_ref` is empty on push events, so the script's own GITHUB_REF_NAME fallback
        # (correctly "develop" there, no synthetic ref involved) takes over.
        env:
          CHUNK_REPORT_SHA: ${{ inputs.commit_sha }}
          CHUNK_REPORT_BRANCH: ${{ github.head_ref }}
        run: node supporting_scripts/chunk-eager-loading/analyze_eager_chunks.mjs build/webapp-dist/stats.json --out chunk-eager-report.json
      - name: Upload eager-chunk report artifact
        uses: actions/upload-artifact@v7
        with:
          name: chunk-eager-report
          path: chunk-eager-report.json
          if-no-files-found: error
      - name: Build .war
        # SBOM generation (cdxgen + cyclonedxBom) adds ~60s to a cold WAR build and is only
        # needed for release-eligible artifacts, so `-Psbom` is gated behind `is_release_build`
        # (computed in ci.yml: release events + develop/main/release-branch pushes). PRs and
        # feature branches ship a WAR without SBOM — AdminSbomResource returns 404 and the admin
        # UI shows an info banner. The multi-arch docker-release image always builds with -Psbom
        # (see the Dockerfile); docker-pr reuses this WAR via external_builder, inheriting the
        # no-SBOM PR build.
        #
        # Resolve dependencies from the warm Gradle cache only (--offline). The dependency cache
        # (~426 MB) is restored on nearly every build, so going offline skips the slow per-request
        # metadata round-trips to the preferred Maven mirror (reposilite — a single, non-CDN server
        # that is far from the GitHub-hosted runners). Those round-trips happen during resolution
        # even though every jar is already cached, and they dominated the step (~5-6 min of silent
        # resolution before the first compile task). If a build legitimately needs an uncached
        # artifact (e.g. a dependency was added or bumped), the offline run fails fast and we retry
        # once online to fetch it (and repopulate the cache on develop, the cache writer).
        #
        # No `-x webapp` here (unlike other CI jobs that don't need a client at all): the `webapp`
        # task must run so it can materialize build/webapp-dist into build/resources/main/static.
        # It does so with a plain directory copy rather than rebuilding, so this costs milliseconds.
        run: |
          if ! ./gradlew -Pprod -Pwar bootWar --offline ${{ inputs.is_release_build && '-Psbom' || '' }}; then
            echo "Offline build failed (likely an uncached dependency); retrying online to fetch it and repopulate the cache."
            ./gradlew -Pprod -Pwar bootWar ${{ inputs.is_release_build && '-Psbom' || '' }}
          fi
      - name: Verify .war contains Angular client
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          wars=(build/libs/Artemis-*.war)
          if [ "${#wars[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Artemis WAR in build/libs, found ${#wars[@]}."
            printf 'Found WAR candidates:\n'
            printf '  %s\n' "${wars[@]:-<none>}"
            exit 1
          fi

          war_entries="$(jar tf "${wars[0]}")"
          if ! grep -qx 'WEB-INF/classes/static/index.html' <<< "$war_entries"; then
            echo "::error::${wars[0]} does not contain WEB-INF/classes/static/index.html. The Angular client is missing from the deployable WAR."
            exit 1
          fi
          if ! grep -Eq '^WEB-INF/classes/static/main-.*\.js$' <<< "$war_entries"; then
            echo "::error::${wars[0]} does not contain a WEB-INF/classes/static/main-*.js bundle. The Angular client build is incomplete."
            exit 1
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Artemis.war
          path: build/libs/Artemis-*.war
          if-no-files-found: error

  # Compares this PR's eager-chunk report (uploaded by build-war above) against the latest report
  # published by a develop push, and posts/updates a PR comment with the result. No dedicated
  # build: reuses build-war's own build, and develop's side is whatever the last develop push
  # already computed (see the "Generate eager-chunk loading report" step above), not rebuilt here.
  # Advisory only (never fails the job) -- this is a brand-new, unproven check; see
  # supporting_scripts/chunk-eager-loading/README.md before making it build-blocking.
  chunk-eager-quality:
    name: Client Eager-Chunk Loading Report
    needs: build-war
    if: ${{ inputs.is_pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '${{ env.node }}'
      - name: Download this PR's report
        uses: actions/download-artifact@v8
        with:
          name: chunk-eager-report
          path: pr-report
      - name: Resolve develop's latest commit
        id: develop-sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          sha=$(gh api "repos/${{ github.repository }}/commits/develop" --jq .sha)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Resolve develop's report run
        id: resolve-develop-run
        # Bootstraps false on the very first run of this check (before this PR has ever merged,
        # no develop push has published a chunk-eager-report yet) -- don't fail the job over it,
        # just skip the comparison. Self-resolves once this PR merges and develop rebuilds once.
        continue-on-error: true
        uses: ./.github/actions/resolve-artifact-run
        with:
          workflow: ci.yml
          sha: ${{ steps.develop-sha.outputs.sha }}
          artifact-name: chunk-eager-report
          branch: develop
          token: ${{ github.token }}
      - name: Download develop's report
        if: steps.resolve-develop-run.outcome == 'success'
        uses: actions/download-artifact@v8
        with:
          name: chunk-eager-report
          path: develop-report
          run-id: ${{ steps.resolve-develop-run.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Diff against develop
        if: steps.resolve-develop-run.outcome == 'success'
        id: diff
        # diff_eager_chunks.mjs exits 1 when it finds a regression -- that's an expected,
        # meaningful outcome (advisory reporting, not a merge gate), not a step failure. Without
        # this, a *detected* regression would fail this step and skip every step after it
        # (their `if:` conditions are implicitly ANDed with success()) -- silencing the comment
        # exactly when there's something to report.
        continue-on-error: true
        run: |
          node supporting_scripts/chunk-eager-loading/diff_eager_chunks.mjs \
            pr-report/chunk-eager-report.json \
            --baseline develop-report/chunk-eager-report.json \
            --out chunk-diff-report.md
      - name: Find existing PR comment
        if: steps.resolve-develop-run.outcome == 'success'
        id: find-comment
        continue-on-error: true  # cosmetic lookup; a transient API blip must not fail the job
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          result-encoding: string
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const marker = '<!-- Chunk Eager-Loading Report -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const found = comments.find((c) => c.body && c.body.includes(marker));
            return found ? String(found.id) : '';
      - name: Post eager-chunk report comment
        if: steps.resolve-develop-run.outcome == 'success'
        uses: actions/github-script@v9
        continue-on-error: true  # cosmetic PR comment; must not fail the job over an API blip
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXISTING_COMMENT_ID: ${{ steps.find-comment.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = Number(process.env.PR_NUMBER);
            const existingCommentId = Number(process.env.EXISTING_COMMENT_ID) || null;

            let body;
            try {
              body = fs.readFileSync('chunk-diff-report.md', 'utf8');
            } catch {
              return;
            }
            body += `\n\n🔗 [Workflow Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            body += `\n<!-- Chunk Eager-Loading Report -->`;

            if (existingCommentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existingCommentId, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber, body,
              });
            }

  # Release-asset upload, split out so it is the ONLY job holding `contents: write` (mirrors the
  # save-docker-tag split). Downloads the WAR `build-war` produced and attaches it to the release.
  upload-release:
    name: Upload Release Artifact
    needs: build-war
    if: ${{ inputs.is_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # `gh release upload`
    steps:
      - name: Download .war artifact
        uses: actions/download-artifact@v8
        with:
          name: Artemis.war
          path: build/libs
      - name: Upload to the GitHub release
        # Route the tag through env to keep it out of shell-injection paths.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -Eeuo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Refusing to upload release artifact: tag '$RELEASE_TAG' is not a valid version."
            exit 1
          fi
          mv "build/libs/Artemis-${RELEASE_TAG}.war" /tmp/Artemis.war
          gh release upload "$RELEASE_TAG" /tmp/Artemis.war --clobber --repo "${GITHUB_REPOSITORY}"

  # Fast PR path: single-arch (linux/amd64) image that reuses the .war from `build-war` via the
  # Dockerfile's `external_builder` stage, skipping the duplicate Angular + Gradle build the
  # multi-arch reusable would run in-image. Internal PRs only — fork PRs can't push to GHCR.
  docker-pr:
    name: Build and Push Docker Image (PR, amd64)
    needs: build-war
    if: ${{ inputs.is_pr && inputs.is_internal_pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Download .war artifact
        uses: actions/download-artifact@v8
        with:
          name: Artemis.war
          path: build/libs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ghcr.io/ls1intum/artemis
          # `type=ref,event=pr` → `pr-<N>` (priority 600, stays `meta.outputs.version`, so the
          # `docker-tag` artifact and e2e-setup are unaffected). The `sha-<commit>` tag is built from
          # `inputs.commit_sha` (the PR head this build checked out, not the merge commit), so it equals
          # the SHA a deploy resolves; `type=sha` is avoided because it reads github.sha = the merge commit.
          tags: |
            type=ref,event=pr
            type=raw,value=sha-${{ inputs.commit_sha }}
      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ./docker/artemis/Dockerfile
          platforms: linux/amd64
          # Skip the in-image .war build; COPY the artifact produced by `build-war` instead.
          build-args: WAR_FILE_STAGE=external_builder
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Consumed by .github/actions/e2e-setup, which downloads the `docker-tag` artifact
      # from the current parent run and pulls ghcr.io/ls1intum/artemis:<tag>.
      - name: Save Docker tag to file
        env:
          DOCKER_TAG: ${{ steps.meta.outputs.version }}
        run: |
          printf '%s' "$DOCKER_TAG" > docker-tag.txt
          echo "Using Docker tag: $DOCKER_TAG"
      - name: Upload Docker tag as artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-tag
          path: docker-tag.txt
          if-no-files-found: error

  # Release / default-branch path: multi-arch publish via the shared reusable workflow.
  # The reusable workflow runs its own checkout and cannot see `build-war`'s artifact,
  # so it rebuilds the .war inside the image. This path only fires for push/release.
  docker-release:
    name: Build and Push Docker Image
    if: ${{ !inputs.is_pr }}
    # The reusable only checks out and pushes to GHCR via GITHUB_TOKEN (no attestation/release).
    permissions:
      contents: read
      packages: write
    uses: ls1intum/.github/.github/workflows/build-and-push-docker-image.yml@v1.2.0
    with:
      # Check out the exact commit the sha-<commit> tag names (not the mutable branch tip), so image
      # content and the tag stay pinned to the same commit. The `type=ref` tags come from the event
      # context, not this ref, so they are unaffected.
      ref: ${{ inputs.commit_sha }}
      image-name: ls1intum/artemis
      docker-file: ./docker/artemis/Dockerfile
      # `type=ref` gives the release tag or branch name; `sha-<commit>` is the immutable per-commit
      # handle deployments pull by. The reusable turns the bare `sha-<sha>` line into `type=raw`.
      tags: |
        type=ref,event=tag
        type=ref,event=branch
        sha-${{ inputs.commit_sha }}

  # Mirrors the `docker-tag` artifact upload from `docker-pr` for the release path so that
  # .github/actions/e2e-setup can consume it uniformly regardless of which docker job produced
  # the image.
  save-docker-tag:
    name: Save Docker Image Tag
    needs: docker-release
    if: ${{ !inputs.is_pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Save Docker tag to file
        env:
          DOCKER_TAG: ${{ needs.docker-release.outputs.image_tag }}
        run: |
          printf '%s' "$DOCKER_TAG" > docker-tag.txt
          echo "Using Docker tag: $DOCKER_TAG"
      - name: Upload Docker tag as artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-tag
          path: docker-tag.txt
          if-no-files-found: error
