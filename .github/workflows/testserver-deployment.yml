name: Deploy to a test-server

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Which branch to deploy"
        required: true
        type: string
      commit_sha:
        description: "Exact commit SHA to deploy. When set, this commit's image is verified and deployed; otherwise the branch/PR head is used."
        required: false
        type: string
      environment_name:
        description: "Which environment to deploy (e.g. artemis-test7.artemis.cit.tum.de, etc.)."
        required: true
        type: string
      triggered_by:
        description: "Username that triggered deployment (not required, shown if triggered via GitHub UI, logged if triggered via GitHub app)"
        required: false
        type: string

# Serialize deployments per environment. `cancel-in-progress: false` means a running deploy is
# never interrupted; GitHub keeps at most ONE pending run per group, so rapid re-dispatches to the
# same environment coalesce to the most recent request.
concurrency:
  group: ${{ github.event.inputs.environment_name }}
  cancel-in-progress: false

# Default-deny; each job opts into the minimum scope it needs.
permissions: {}

env:
  IMAGE_NAME: ghcr.io/ls1intum/artemis

# ------------------------------------------------------------------------------
#  Deployment to a Test Server
#
#  Trigger             : workflow_dispatch                 (GitHub UI / API / Helios)
#  Required parameters : branch_name, environment_name
#  Optional            : commit_sha (pin an exact commit), triggered_by
#
#  Flow
#  ────
#  1. determine-build-context — resolve the exact commit to deploy (honoring commit_sha),
#     whether a PR exists, and the immutable deploy tag `sha-<commit>`.
#  2a. verify-image-build      — PR / develop / main: the image must already exist in GHCR
#      (registry is the source of truth; no per-run artifact lookup).
#  2b. conditional-build       — branch without a PR: build the image now, tagged sha-<commit>.
#  3. deploy                   — pull and deploy exactly `sha-<commit>` — the verified image.
# ------------------------------------------------------------------------------
jobs:
  determine-build-context:
    name: Determine Build Context
    runs-on: [self-hosted, artemis-test-deployment]
    timeout-minutes: 5
    permissions:
      contents: read        # git refs lookup
      pull-requests: read    # find the PR for the branch
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      needs_build: ${{ steps.resolve.outputs.needs_build }}
    steps:
      - name: Resolve deploy target (commit / PR / branch)
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH_NAME: ${{ github.event.inputs.branch_name }}
          REQUESTED_SHA: ${{ github.event.inputs.commit_sha }}
          ENVIRONMENT_NAME: ${{ github.event.inputs.environment_name }}
          TRIGGERED_BY: ${{ github.event.inputs.triggered_by }}
        run: |
          set -Eeuo pipefail
          echo "Branch=$BRANCH_NAME  Commit=${REQUESTED_SHA:-<head>}  Env=$ENVIRONMENT_NAME  By=${TRIGGERED_BY:-?}"

          # Security boundary: these inputs flow into API calls, the deploy tag, the concurrency
          # group and the target environment; allow only the characters each legitimately contains.
          if [[ ! "$BRANCH_NAME" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Refusing suspicious branch name '$BRANCH_NAME'."
            exit 1
          fi
          if [[ ! "$ENVIRONMENT_NAME" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Refusing suspicious environment name '$ENVIRONMENT_NAME'."
            exit 1
          fi
          # A commit_sha, when given, must be the full 40-char SHA: the deploy tag is sha-<commit>
          # and an abbreviated value would point at a tag that was never pushed.
          if [ -n "$REQUESTED_SHA" ] && [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha '$REQUESTED_SHA' is not a full 40-char commit SHA."
            exit 1
          fi

          # Exactly one internal PR for this branch -> develop, via a server-side filter instead of
          # paginating every open PR. `-X GET` is required: `-f` params otherwise default to POST
          # (which would attempt to *create* a PR); with GET they become URL-encoded query params.
          prs=$(gh api -X GET "repos/$REPO/pulls" \
            -f head="$OWNER:$BRANCH_NAME" -f base=develop -f state=open \
            --jq '[.[] | {number, sha: .head.sha}]')
          count=$(jq 'length' <<<"$prs")
          if [ "$count" -gt 1 ]; then
            echo "::error::$count open PRs from '$BRANCH_NAME' to develop; expected at most one."
            exit 1
          fi

          needs_build=false
          if [ "$count" -eq 1 ]; then
            pr_number=$(jq -r '.[0].number' <<<"$prs")
            head_sha=${REQUESTED_SHA:-$(jq -r '.[0].sha' <<<"$prs")}
          else
            pr_number=""
            branch_tip=$(gh api "repos/$REPO/git/refs/heads/$BRANCH_NAME" --jq '.object.sha')
            head_sha=${REQUESTED_SHA:-$branch_tip}
            if [ "$BRANCH_NAME" != "develop" ] && [ "$BRANCH_NAME" != "main" ]; then
              needs_build=true  # branch without a PR: no CI image exists -> build it on the fly
            fi
          fi

          # Output-boundary guard: head_sha (resolved from the PR, the branch tip, or commit_sha)
          # becomes the deploy tag sha-<commit> and, on the needs_build path, is pushed and deployed
          # with no further check (verify-image-build is skipped there). Assert it is a full commit
          # SHA before it turns into a side effect. This validates the *resolved* value, not the input.
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a full 40-char commit SHA for '$BRANCH_NAME'."
            exit 1
          fi

          {
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "tag=sha-$head_sha"
            echo "needs_build=$needs_build"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved commit $head_sha (pr='$pr_number', needs_build=$needs_build) -> deploy tag sha-$head_sha"

  # Branch without a PR: build the image now, tagged with its immutable sha-<commit>.
  conditional-build:
    name: Build Image On-The-Fly
    if: ${{ needs.determine-build-context.outputs.needs_build == 'true' }}
    needs: determine-build-context
    # The reusable workflow checks out and pushes the image to GHCR via GITHUB_TOKEN; a called
    # workflow cannot elevate beyond its caller, so grant packages: write here (matches ci-build.yml).
    permissions:
      contents: read
      packages: write
    uses: ls1intum/.github/.github/workflows/build-and-push-docker-image.yml@v1.2.0
    with:
      ref: ${{ needs.determine-build-context.outputs.head_sha }}
      image-name: ls1intum/artemis
      docker-file: ./docker/artemis/Dockerfile
      tags: ${{ needs.determine-build-context.outputs.tag }}

  # PR / develop / main: the image for this exact commit must already exist in the registry.
  # The registry (immutable sha-<commit> tag) is the source of truth — no per-run artifact lookup,
  # so a superseded/cancelled CI run for the same commit can no longer cause a false negative.
  verify-image-build:
    name: Verify Deployable Image
    if: ${{ needs.determine-build-context.outputs.needs_build == 'false' }}
    needs: determine-build-context
    runs-on: [self-hosted, artemis-test-deployment]
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      # Check out (only) the verification action from the workflow's own ref. Helios dispatches this
      # workflow from the branch being deployed, so github.ref is where this action lives — and is the
      # same trusted ref that already defines every job here. This is a build-correctness gate ("was an
      # image built for this commit?"), not a security boundary against the deployer, so it needs no
      # fixed-ref pin; pinning to the default branch would also break any branch that adds/edits it.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions/verify-image-build
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/verify-image-build
        with:
          image: ${{ env.IMAGE_NAME }}
          sha: ${{ needs.determine-build-context.outputs.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

  check-database-migration-approval:
    name: Check Database Migration Approval
    needs: determine-build-context
    if: ${{ needs.determine-build-context.outputs.pr_number != '' }}
    runs-on: [self-hosted, artemis-test-deployment]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Dependencies
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          cd supporting_scripts/database_approval_check
          pip install -r requirements.txt
      - name: Check Migration Approval
        env:
          GITHUB_TOKEN: ${{ secrets.DB_MIGRATON_APPROVAL_GITHUB_TOKEN }}
          GITHUB_PR: ${{ needs.determine-build-context.outputs.pr_number }}
        run: |
          set -Eeuo pipefail
          cd supporting_scripts/database_approval_check
          python main.py || {
            echo "::error::Database migration approval check failed. Ensure the latest database migration changes have been approved by a database maintainer."
            exit 1
          }

  # Deploy the verified/built image to the test-server.
  deploy:
    name: Deploy to Test-Server
    needs:
      - determine-build-context
      - conditional-build
      - verify-image-build
      - check-database-migration-approval
    # Deploy once the image is ready (verified in the registry OR just built) and the migration
    # gate passed or did not apply. `!cancelled()` (not `always()`) so a user Cancel truly stops
    # the deploy instead of letting a queued deploy fire after cancellation.
    #
    # check-database-migration-approval only runs when a PR exists (its if: is pr_number != '') — it
    # needs a PR to check approval against. Accepting its "skipped" result therefore also lets the
    # PR-less conditional-build path (an arbitrary branch built on the fly) deploy without a migration
    # check. Closing that gap would require the approval check to work without a PR number, which is
    # out of scope here; deploying an unreviewed migration via a PR-less branch to a test server
    # remains an accepted risk (test servers are restricted to accredited developers).
    if: >-
      !cancelled()
      && (needs.conditional-build.result == 'success' || needs.verify-image-build.result == 'success')
      && (needs.check-database-migration-approval.result == 'success' || needs.check-database-migration-approval.result == 'skipped')
    runs-on: [self-hosted, artemis-test-deployment]
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: ${{ github.event.inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_URL }}
    env:
      GATEWAY_USER: "jump"
      GATEWAY_HOST: "gateway2.aet.cit.tum.de:2010"
      GATEWAY_HOST_PUBLIC_KEY: "[gateway2.aet.cit.tum.de]:2010 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKtTLiKRILjKZ+Qg4ReWKsG7mLDXkzHfeY5nalSQUNQ4"
    steps:
      # Check out the deploy CLI from the workflow's own ref (a proper checkout, replacing the old
      # wget of the script from a mutable URL). Helios dispatches this workflow from the branch being
      # deployed, so github.ref already sources every job here and is where the CLI lives. Test-server
      # deploys are restricted to accredited developers, so branch-sourced deploy code is within the
      # accepted trust model.
      - name: Check out deploy CLI
        uses: actions/checkout@v6
        with:
          sparse-checkout: artemis-server-cli
          sparse-checkout-cone-mode: false

      - name: Setup SSH Keys and known_hosts
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          GATEWAY_SSH_KEY: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          DEPLOYMENT_SSH_KEY: ${{ secrets.DEPLOYMENT_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          rm -f "$SSH_AUTH_SOCK"
          ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
          ssh-add - <<< "$GATEWAY_SSH_KEY"
          ssh-add - <<< "$DEPLOYMENT_SSH_KEY"
          cat - <<< "$GATEWAY_HOST_PUBLIC_KEY" >> ~/.ssh/known_hosts

      - name: Deploy Artemis with Docker
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          DEPLOYMENT_USER: ${{ vars.DEPLOYMENT_USER }}
          DEPLOYMENT_HOSTS: ${{ vars.DEPLOYMENT_HOSTS }}
          TAG: ${{ needs.determine-build-context.outputs.tag }}
          BRANCH_NAME: ${{ github.event.inputs.branch_name }}
          DEPLOYMENT_FOLDER: ${{ vars.DEPLOYMENT_FOLDER }}
        run: |
          set -Eeuo pipefail
          chmod +x artemis-server-cli
          ./artemis-server-cli docker-deploy "$DEPLOYMENT_USER@$DEPLOYMENT_HOSTS" \
            -g "$GATEWAY_USER@$GATEWAY_HOST" \
            -t "$TAG" -b "$BRANCH_NAME" -d "$DEPLOYMENT_FOLDER" -y

      - name: Cleanup
        if: always()
        run: rm -f /tmp/ssh_agent.sock
