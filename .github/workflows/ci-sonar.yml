name: Sonar

# SonarQube Cloud analysis of the deployed application (server + client), set up alongside Codacy so
# the two code-quality grades can be compared on the same code. Scope and rationale live in
# `gradle/sonar.gradle`; the CI contract is in this directory's README.md, section
# "The code quality analyses".
#
# ADVISORY WHEN CALLED BY CI. Never in another job's `needs:` and never gating: the job is
# `continue-on-error` when called by CI. Manual scans fail visibly on scanner errors.
# It publishes a grade; it does not decide whether code is mergeable — the enforcing gates are
# `ci-quality.yml` and `ci-test.yml`.
#
# That guarantee covers this workflow and not the commit status. SonarQube Cloud's GitHub App posts
# its own `SonarCloud Code Analysis` check with the quality gate verdict, which no job here produces
# and `continue-on-error` cannot reach, so a failed gate is a red X on develop beside a green job.
# It blocks nothing (branch protection requires only `All required CI Passed`), and the conditions
# it applies live in the quality gate the project is assigned in SonarQube Cloud, not in this file.

# Two entry points on purpose:
#   workflow_call     — from ci.yml on develop pushes, after a green `test`, importing its coverage.
#   workflow_dispatch — standalone, to get a grade on demand without waiting out a full CI run
#                       (~2 h with the e2e tail). Analyses the ref it is dispatched on. A manual run
#                       has no `test` job of its own, so it imports the coverage of the latest
#                       fully tested `ci.yml` run for exactly the commit it analyses (a pull request
#                       build counts) and falls back to no coverage when there is none. Without this
#                       the quality gate reads 0.0% coverage on new code for a dispatched run, which
#                       is a measurement artifact and not a property of the code.
on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'SHA to analyze. PR builds use the PR head SHA (matching ci-build.yml).'
        required: true
        type: string
      with_coverage:
        description: >-
          Whether the calling run produced the coverage artifacts this job imports. False skips the
          downloads and analyzes without coverage, which still yields the ratings and issue counts.
        required: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        description: 'SonarQube Cloud analysis token for the ls1intum organization.'
        required: true
  # Bounded recovery switch: select only the repository's own default branch, never an arbitrary
  # source SHA or build argument. This lets a repaired workflow refresh develop before it is merged.
  # checkov:skip=CKV_GHA_7:The boolean only selects the trusted repository default branch for analysis.
  workflow_dispatch:
    inputs:
      analyze_default_branch:
        description: 'Analyze the repository default branch using this workflow revision (recovery mode).'
        type: boolean
        default: false

permissions: {}  # default-deny; each job grants only what it needs

# Workflow-level node/java pins are drift-checked by ci-workflows.yml.
env:
  CI: true
  node: 24
  java: 25

jobs:
  sonar:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    # Generous on purpose: ~350k lines of Java plus ~260k of TypeScript is a long scan, and
    # Sonar's TypeScript analyzer dominates it. A timeout costs the run's result, not the build.
    timeout-minutes: 90
    continue-on-error: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: read  # lists the CI runs of the commit and downloads their coverage artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Recovery reads real default-branch sources while running the selected workflow revision.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze_default_branch && github.event.repository.default_branch || inputs.commit_sha || github.sha }}
          # Sonar attributes issues to authors and separates new code from old via git history, so a
          # shallow clone degrades the analysis rather than failing it. `0` is what Sonar documents.
          fetch-depth: 0

      - name: Record analyzed source revision
        id: source
        env:
          SONAR_BRANCH_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze_default_branch && github.event.repository.default_branch || github.head_ref || github.ref_name }}
        run: |
          set -Eeuo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Analyzing $SONAR_BRANCH_NAME at $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '${{ env.java }}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Before Setup Node.js, so that its `cache: 'pnpm'` finds the package manager it keys on.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      # Sonar's JavaScript/TypeScript analyzer shells out to Node. The runner image ships one, but
      # pinning it here keeps the analysis reproducible when that image changes, matching how every
      # other job in this repo pins Node rather than inheriting it.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '${{ env.node }}'
          cache: 'pnpm'

      # Also REQUIRED, for the same reason `compileJava` is below. Sonar's TypeScript analyzer runs
      # the real compiler: `tsconfig.json` resolves Angular, RxJS and the rest through
      # `node_modules`, and on a clean checkout every one of those imports is unresolved. The scan
      # still succeeds, silently, with the type-aware rules degraded to what syntax alone can see.
      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      # And this is required for the same reason again. `tsconfig.json` maps `@tumaet/ui-angular` to
      # `packages/tum-aet-ui/dist`, which is a build output: it is not tracked and `pnpm install` does not
      # create it. Without it every one of the ~240 application imports of the alias is unresolved,
      # which is the same silent degradation as the missing `node_modules`. Only the library build is
      # run, not the full `prebuild`: the rest of that script writes an angular.json file replacement
      # no source imports and runs a vite version check that would fail this job for a reason
      # unrelated to the scan.
      - name: Build the TUM AET UI package the client imports
        run: pnpm run tum-aet-ui:build

      # Match the checked-out source revision, which can differ from the workflow ref in recovery
      # mode. Complete tests and artifacts establish coverage; an unrelated CI failure does not
      # invalidate it. Never import a partial server matrix or coverage from another revision.
      - name: Find the CI run that produced coverage for this commit
        id: coverage-run
        continue-on-error: true
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SHA: ${{ steps.source.outputs.sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const options = { ...context.repo, per_page: 100 };
            const actions = '/repos/{owner}/{repo}/actions';
            const runs = await github.paginate(`GET ${actions}/workflows/{workflow_id}/runs`, {
              ...options, workflow_id: 'ci.yml', head_sha: process.env.SHA, status: 'completed',
            });
            let coverageRun;
            for (const run of runs) {
              if (run.head_sha !== process.env.SHA || run.status !== 'completed') continue;
              try {
                const artifacts = await github.paginate(`GET ${actions}/runs/{run_id}/artifacts`, { ...options, run_id: run.id });
                const names = new Set(artifacts.filter(artifact => !artifact.expired).map(artifact => artifact.name));
                if (!['Server JaCoCo XML', 'Vitest Coverage Report'].every(name => names.has(name))) continue;
                const jobs = await github.paginate(`GET ${actions}/runs/{run_id}/jobs`, { ...options, run_id: run.id, filter: 'latest' });
                const tests = jobs.filter(job => job.name.startsWith('Test / '));
                const required = ['Test / Client Tests', 'Test / Server Tests Report'];
                const shards = tests.filter(job => job.name.startsWith('Test / Server Tests ('));
                if (shards.length !== 7 || !required.every(name => tests.some(job => job.name === name && job.conclusion === 'success'))) continue;
                if (!shards.every(job => job.conclusion === 'success') || !tests.every(job => ['success', 'skipped'].includes(job.conclusion))) continue;
                core.info(`Importing complete test coverage from run ${run.id} for ${process.env.SHA}`);
                coverageRun = String(run.id);
                core.setOutput('run_id', coverageRun);
                break;
              } catch (error) {
                core.warning(`Cannot verify coverage for run ${run.id}: ${error.message}`);
              }
            }
            if (!coverageRun) core.warning(`No verified complete coverage exists for ${process.env.SHA}; analyzing without coverage.`);

      # Coverage is imported from the reports the `test` job already uploaded, so no suite is re-run
      # here. Both downloads are `continue-on-error`: a missing report costs the coverage metric and
      # nothing else, and must not lose us the ratings that are the point of this job.
      #
      # The download paths are the ones `gradle/sonar.gradle` names in
      # `sonar.coverage.jacoco.xmlReportPaths` / `sonar.javascript.lcov.reportPaths`. The artifact
      # unpacks to `aggregated/jacocoTestReport.xml`, hence the `build/reports/jacoco` target.
      - name: Download the server JaCoCo report
        if: ${{ inputs.with_coverage || steps.coverage-run.outputs.run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Server JaCoCo XML
          path: build/reports/jacoco
          run-id: ${{ steps.coverage-run.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download the client coverage report
        if: ${{ inputs.with_coverage || steps.coverage-run.outputs.run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Vitest Coverage Report
          path: build/test-results/vitest/coverage
          run-id: ${{ steps.coverage-run.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      # Gated on coverage having been requested, so a dispatched run for a commit with no successful CI
      # run does not emit two warnings that mean nothing. When coverage WAS requested, a missing report
      # is worth a warning: it means an artifact name drifted, which would otherwise show up only as a
      # silent coverage drop in Sonar.
      - name: Report which coverage inputs were found
        if: ${{ inputs.with_coverage || steps.coverage-run.outputs.run_id != '' }}
        run: |
          set -Eeuo pipefail
          jacoco=build/reports/jacoco/aggregated/jacocoTestReport.xml
          lcov=build/test-results/vitest/coverage/lcov.info
          for report in "$jacoco" "$lcov"; do
            if [ -s "$report" ]; then
              echo "Found $report"
            else
              echo "::warning::$report is missing or empty; Sonar will report no coverage for it." \
                   "The ratings and issue counts are unaffected."
            fi
          done

      # `compileJava` is REQUIRED, not an optimization. Sonar's Java analyzer needs bytecode, and the
      # Gradle plugin derives `sonar.java.binaries` from the main source set's output directory only
      # if that directory exists — with no prior compile the property is silently omitted and the
      # whole Java half of the analysis degrades without an error. Verified by dumping the computed
      # properties with and without a compile.
      #
      # `-x webapp` skips the Angular production build: Sonar analyzes the TypeScript sources, not
      # the bundled output, so the ~10 min build would buy nothing.
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Scanner 6+ forks a JVM; org.gradle.jvmargs does not configure its heap.
          SONAR_SCANNER_JAVA_OPTS: '-Xmx6g'
          # Keep the published branch and SCM revision aligned with the checked-out source.
          SONAR_BRANCH_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.analyze_default_branch && github.event.repository.default_branch || github.head_ref || github.ref_name }}
          SONAR_REVISION: ${{ steps.source.outputs.sha }}
        run: ./gradlew compileJava sonar -x webapp "-Dsonar.branch.name=${SONAR_BRANCH_NAME}" "-Dsonar.scm.revision=${SONAR_REVISION}"
