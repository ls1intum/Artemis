name: Sonar

# Required PR quality gate; waits for the server verdict without rerunning tests.
# Fork events only verify exact-source evidence using trusted base-branch tools.
on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'SHA to analyze. PR builds use the PR head SHA (matching ci-build.yml).'
        required: true
        type: string
      with_coverage:
        description: >-
          Whether the calling run produced the coverage artifacts this job imports. False skips the
          downloads and analyzes without coverage, which still yields the ratings and issue counts.
        required: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        description: 'SonarQube Cloud analysis token for the ls1intum organization.'
        required: false
  # Bounded recovery switch: select only the repository's own default branch, never an arbitrary
  # source SHA or build argument. This lets a repaired workflow refresh develop before it is merged.
  # checkov:skip=CKV_GHA_7:The boolean only selects the trusted repository default branch for analysis.
  workflow_dispatch:
    inputs:
      analyze_default_branch:
        description: 'Analyze the repository default branch using this workflow revision (recovery mode).'
        type: boolean
        default: false
      pull_request_number:
        description: 'Scan reviewed code promoted to internal chore/sonar/pr-<number>; 0 analyzes this ref.'
        type: number
        default: 0

permissions: {}  # default-deny; each job grants only what it needs

# Workflow-level node/java pins are drift-checked by ci-workflows.yml.
env:
  CI: true
  node: 24
  java: 25

jobs:
  sonar:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    # Generous on purpose: ~350k lines of Java plus ~260k of TypeScript is a long scan, and
    # Sonar's TypeScript analyzer dominates it. Timeout, upload and quality-gate errors fail closed.
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      actions: read  # lists the CI runs of the commit and downloads their coverage artifacts
    defaults:
      run:
        working-directory: .sonar-source
    steps:
      # Tools stay separate from source: a promoted commit may predate these helpers.
      - name: Check out trusted analysis tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || secrets.SONAR_TOKEN == '') && github.event.pull_request.base.sha || github.workflow_sha }}
          path: .sonar-tools
          persist-credentials: false
      - name: Resolve source identity or verify exact fork analysis
        id: analysis
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha || github.sha }}
          PULL_REQUEST: ${{ inputs.pull_request_number || 0 }}
          DEFAULT_BRANCH: ${{ inputs.analyze_default_branch || false }}
          HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
        with:
          script: |
            await require('./.sonar-tools/.github/scripts/sonar-pr.js').prepareAnalysis({
              github, context, core, requestedSha: process.env.REQUESTED_SHA,
              pullRequest: process.env.PULL_REQUEST,
              defaultBranch: process.env.DEFAULT_BRANCH === 'true',
              allowScan: process.env.HAS_SONAR_TOKEN === 'true',
            });
      - name: Check out analyzed source
        if: steps.analysis.outputs.scan == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.analysis.outputs.sha }}
          fetch-depth: 0
          path: .sonar-source
          persist-credentials: false

      - name: Record analyzed source revision
        if: steps.analysis.outputs.scan == 'true'
        id: source
        env:
          EXPECTED_SHA: ${{ steps.analysis.outputs.sha }}
          SONAR_BRANCH_NAME: ${{ steps.analysis.outputs.branch }}
        run: |
          set -Eeuo pipefail
          sha=$(git rev-parse HEAD)
          test "$sha" = "$EXPECTED_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Analyzing $SONAR_BRANCH_NAME at $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        if: steps.analysis.outputs.scan == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '${{ env.java }}'

      - name: Setup Gradle
        if: steps.analysis.outputs.scan == 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Before Setup Node.js, so that its `cache: 'pnpm'` finds the package manager it keys on.
      - name: Setup pnpm
        if: steps.analysis.outputs.scan == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          package_json_file: .sonar-source/package.json

      # Sonar's JavaScript/TypeScript analyzer shells out to Node. The runner image ships one, but
      # pinning it here keeps the analysis reproducible when that image changes, matching how every
      # other job in this repo pins Node rather than inheriting it.
      - name: Setup Node.js
        if: steps.analysis.outputs.scan == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '${{ env.node }}'
          cache: 'pnpm'
          cache-dependency-path: .sonar-source/pnpm-lock.yaml

      # Also REQUIRED, for the same reason `compileJava` is below. Sonar's TypeScript analyzer runs
      # the real compiler: `tsconfig.json` resolves Angular, RxJS and the rest through
      # `node_modules`, and on a clean checkout every one of those imports is unresolved. The scan
      # still succeeds, silently, with the type-aware rules degraded to what syntax alone can see.
      - name: Install client dependencies
        if: steps.analysis.outputs.scan == 'true'
        run: pnpm install --frozen-lockfile

      # And this is required for the same reason again. `tsconfig.json` maps `@tumaet/ui-angular` to
      # `packages/tum-aet-ui/dist`, which is a build output: it is not tracked and `pnpm install` does not
      # create it. Without it every one of the ~240 application imports of the alias is unresolved,
      # which is the same silent degradation as the missing `node_modules`. Only the library build is
      # run, not the full `prebuild`: the rest of that script writes an angular.json file replacement
      # no source imports and runs a vite version check that would fail this job for a reason
      # unrelated to the scan.
      - name: Build the TUM AET UI package the client imports
        if: steps.analysis.outputs.scan == 'true'
        run: pnpm run tum-aet-ui:build

      # Match the checked-out source revision, which can differ from the workflow ref in recovery
      # mode. Complete tests and artifacts establish coverage; an unrelated CI failure does not
      # invalidate it. Never import a partial server matrix or coverage from another revision.
      - name: Find the CI run that produced coverage for this commit
        id: coverage-run
        continue-on-error: true
        if: steps.analysis.outputs.scan == 'true' && (github.event_name == 'workflow_dispatch' && steps.analysis.outputs.pull_request == '0')
        env:
          SHA: ${{ steps.source.outputs.sha }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const options = { ...context.repo, per_page: 100 };
            const actions = '/repos/{owner}/{repo}/actions';
            const runs = await github.paginate(`GET ${actions}/workflows/{workflow_id}/runs`, {
              ...options, workflow_id: 'ci.yml', head_sha: process.env.SHA, status: 'completed',
            });
            let coverageRun;
            for (const run of runs) {
              if (run.head_sha !== process.env.SHA || run.status !== 'completed') continue;
              try {
                const artifacts = await github.paginate(`GET ${actions}/runs/{run_id}/artifacts`, { ...options, run_id: run.id });
                const names = new Set(artifacts.filter(artifact => !artifact.expired).map(artifact => artifact.name));
                if (!['Server JaCoCo XML', 'Vitest Coverage Report'].every(name => names.has(name))) continue;
                const jobs = await github.paginate(`GET ${actions}/runs/{run_id}/jobs`, { ...options, run_id: run.id, filter: 'latest' });
                const tests = jobs.filter(job => job.name.startsWith('Test / '));
                const required = ['Test / Client Tests', 'Test / Server Tests Report'];
                const shards = tests.filter(job => job.name.startsWith('Test / Server Tests ('));
                if (shards.length !== 7 || !required.every(name => tests.some(job => job.name === name && job.conclusion === 'success'))) continue;
                if (!shards.every(job => job.conclusion === 'success') || !tests.every(job => ['success', 'skipped'].includes(job.conclusion))) continue;
                core.info(`Importing complete test coverage from run ${run.id} for ${process.env.SHA}`);
                coverageRun = String(run.id);
                core.setOutput('run_id', coverageRun);
                break;
              } catch (error) {
                core.warning(`Cannot verify coverage for run ${run.id}: ${error.message}`);
              }
            }
            if (!coverageRun) core.warning(`No verified complete coverage exists for ${process.env.SHA}; analyzing without coverage.`);

      - name: Find promoted PR test coverage
        if: steps.analysis.outputs.scan == 'true' && (github.event_name == 'workflow_dispatch' && steps.analysis.outputs.pull_request != '0')
        id: pr-coverage-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            core.setOutput('run_id', await require('./.sonar-tools/.github/scripts/sonar-pr.js').findPrCoverage({
              github, context, sha: process.env.SOURCE_SHA,
            }));
      - name: Discover scope-labelled coverage artifacts
        if: steps.analysis.outputs.scan == 'true'
        id: reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COVERAGE_RUN: ${{ steps.pr-coverage-run.outputs.run_id || steps.coverage-run.outputs.run_id || inputs.with_coverage && github.run_id || '' }}
        with:
          script: |
            if (!process.env.COVERAGE_RUN) return;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: Number(process.env.COVERAGE_RUN), per_page: 100,
            });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: Number(process.env.COVERAGE_RUN), per_page: 100, filter: 'latest',
            });
            const names = require('./.sonar-tools/.github/scripts/sonar-pr.js').coverageArtifacts(jobs, artifacts);
            core.setOutput('run_id', process.env.COVERAGE_RUN);
            core.setOutput('server_full', String(names.has('Server JaCoCo XML')));
            core.setOutput('client_full', String(names.has('Vitest Coverage Report')));
            core.setOutput('server_selected', String(!names.has('Server JaCoCo XML') && names.has('Sonar Server Coverage')));
            core.setOutput('client_selected', String(!names.has('Vitest Coverage Report') && names.has('Sonar Client Coverage')));
      - name: Download complete server coverage
        if: steps.analysis.outputs.scan == 'true' && (steps.reports.outputs.server_full == 'true')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Server JaCoCo XML
          path: .sonar-source/build/reports/jacoco
          run-id: ${{ steps.reports.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download complete client coverage
        if: steps.analysis.outputs.scan == 'true' && (steps.reports.outputs.client_full == 'true')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Vitest Coverage Report
          path: .sonar-source/build/test-results/vitest/coverage
          run-id: ${{ steps.reports.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download selected server execution data
        if: steps.analysis.outputs.scan == 'true' && (steps.reports.outputs.server_selected == 'true')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Sonar Server Coverage
          path: .sonar-source/build/jacoco
          run-id: ${{ steps.reports.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download selected client coverage
        if: steps.analysis.outputs.scan == 'true' && (steps.reports.outputs.client_selected == 'true')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Sonar Client Coverage
          path: .sonar-source/build/test-results/vitest/sonar-coverage
          run-id: ${{ steps.reports.outputs.run_id }}
          github-token: ${{ github.token }}
      # `compileJava` is REQUIRED, not an optimization. Sonar's Java analyzer needs bytecode, and the
      # Gradle plugin derives `sonar.java.binaries` from the main source set's output directory only
      # if that directory exists — with no prior compile the property is silently omitted and the
      # whole Java half of the analysis degrades without an error. Verified by dumping the computed
      # properties with and without a compile.
      #
      # `-x webapp` skips the Angular production build: Sonar analyzes the TypeScript sources, not
      # the bundled output, so the ~10 min build would buy nothing.
      - name: Build and analyze
        if: steps.analysis.outputs.scan == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Scanner 6+ forks a JVM; org.gradle.jvmargs does not configure its heap.
          SONAR_SCANNER_JAVA_OPTS: '-Xmx6g'
          # Keep the published branch and SCM revision aligned with the checked-out source.
          SONAR_BRANCH_NAME: ${{ steps.analysis.outputs.branch }}
          SONAR_PULL_REQUEST: ${{ steps.analysis.outputs.pull_request }}
          SONAR_BASE_BRANCH: ${{ steps.analysis.outputs.base }}
          SONAR_SELECTED_SERVER: ${{ steps.reports.outputs.server_selected }}
          SONAR_REVISION: ${{ steps.source.outputs.sha }}
        run: bash ../.sonar-tools/.github/scripts/run-sonar.sh
