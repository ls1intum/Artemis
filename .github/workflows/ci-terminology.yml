name: Terminology

# Repo-wide prose check: no "frontend", no "backend" (terminology-check: allow). See
# documentation/docs/developer/guidelines/terminology.mdx for the rationale and the exceptions.
#
# Deliberately its own workflow rather than a job in ci-quality.yml: `quality` is gated on
# `build_relevant`, which is false for a documentation-only pull request, and documentation is
# where these words most often come back. This one runs on every pull request.

on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'SHA to check. PR builds use the PR head SHA (matching ci-build.yml).'
        required: true
        type: string

permissions: {}  # default-deny; the job grants only what it needs

jobs:
  terminology:
    name: Terminology Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pure source scan (no git diff), so pin the PR head and check exactly the tree
          # Build and Test run against.
          ref: ${{ inputs.commit_sha }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      # First, because every failure mode of a scan like this is a silent pass: a pattern that has
      # stopped matching, or an exemption that has grown too broad, reports a clean tree rather
      # than an error. The self-test proves the matcher still works before the scan is believed.
      - name: Checker self-test
        run: python3 supporting_scripts/check_terminology.py --self-test
      - name: Terminology check
        run: python3 supporting_scripts/check_terminology.py
