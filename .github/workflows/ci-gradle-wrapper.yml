name: Validate Gradle Wrapper

# Keep this workflow directly runnable on protected-branch pushes so OpenSSF Scorecard can
# associate wrapper validation with the latest default-branch commit. It remains reusable so
# ci.yml can gate Gradle-related pull requests without adding another required status check.
on:
  push:
    branches:
      - develop
      - main
      - release/*
  workflow_call: {}

permissions: {}

jobs:
  validate:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e  # v6.1.0
