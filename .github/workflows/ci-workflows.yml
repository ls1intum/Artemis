name: Lint Workflows

# Reusable workflow called by ci.yml when files under .github/ change.
# Runs actionlint (configured via .github/actionlint.yaml) and the node/java version
# drift check.

on:
  workflow_call: {}

permissions: {}

jobs:
  # Deploy-gating logic lives in checked-in scripts (not inline YAML) so it can be linted and
  # unit-tested. shellcheck runs strictly on them (unlike actionlint's repo-wide `-shellcheck=`,
  # disabled for legacy inline blocks), and bats exercises the run-resolution / image-verify logic.
  deploy-scripts:
    name: deploy scripts (shellcheck + bats)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install bats
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y bats
      - name: shellcheck deploy action scripts
        run: |
          set -Eeuo pipefail
          shellcheck .github/actions/verify-image-build/verify-image-build.sh \
                     .github/actions/resolve-artifact-run/resolve-artifact-run.sh
      - name: bats unit tests
        run: bats .github/actions/verify-image-build/tests .github/actions/resolve-artifact-run/tests

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Run actionlint
        # The install script is pinned to a release tag AND to its SHA-256, because piping it
        # straight into bash would execute whatever that URL returns. A tag can be moved; the
        # checksum cannot, so verify before running. Bump both together when raising the version.
        # `-shellcheck=` disables integrated shellcheck, which flags pre-existing style issues
        # in the legacy deploy workflows.
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_INSTALLER_SHA256: '72fa3e45ac20f3c3a512d6747b4fcf719e21f890e8c43e78d48a41fdfb900c4e'
        run: |
          curl --silent --show-error --fail --location \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            --output download-actionlint.bash
          echo "${ACTIONLINT_INSTALLER_SHA256}  download-actionlint.bash" | sha256sum --check --strict
          bash download-actionlint.bash "${ACTIONLINT_VERSION}"
          rm download-actionlint.bash
          ./actionlint -color -shellcheck=

      - name: Check version pins are in sync
        # Catches drift in top-level `env: { node, java }` blocks (auto-discovered).
        # Does NOT catch values hard-coded inline at `with: java-version: '...'` etc.
        run: |
          set -Eeuo pipefail
          for key in node java; do
            mapfile -t files < <(grep -lE "^  ${key}: " .github/workflows/*.yml)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::No workflow pins '${key}:'. Did the env blocks move?"
              exit 1
            fi
            mapfile -t values < <(grep -hE "^  ${key}: " "${files[@]}" | awk '{print $2}' | sort -u)
            if [ "${#values[@]}" -ne 1 ]; then
              echo "::error::Version drift on '${key}:' across ${files[*]} — values: ${values[*]}"
              exit 1
            fi
            echo "${key}: ${values[0]} (consistent across ${files[*]})"
          done

      - name: Check area filters exercise their own implementations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          text = Path(".github/workflows/ci.yml").read_text()
          filters: dict[str, list[str]] = {}
          current = None
          for line in text.splitlines():
              if line.startswith("            has_") and line.rstrip().endswith(":"):
                  current = line.strip()[:-1]
                  filters[current] = []
                  continue
              if current and line.startswith("              - "):
                  filters[current].append(line.split("- ", 1)[1].strip().strip("'\""))
                  continue
              if current and line and not line.startswith("              "):
                  current = None

          required = {
              "has_java": {
                  ".github/workflows/ci.yml",
                  ".github/workflows/ci-quality.yml",
                  "supporting_scripts/analyze_java_files.py",
                  "supporting_scripts/find_slow_queries.py",
              },
              "has_docs": {".github/workflows/ci.yml", ".github/workflows/ci-docs.yml"},
              "has_i18n": {".github/workflows/ci.yml", ".github/workflows/ci-translation.yml", ".ci/translation-file-checker/**"},
              "has_gradle": {".github/workflows/ci.yml", ".github/workflows/ci-gradle-wrapper.yml"},
              "has_version": {".github/workflows/ci.yml", ".github/workflows/ci-version-consistency.yml", "supporting_scripts/update_version.sh"},
              "has_beans": {".github/workflows/ci.yml", ".github/workflows/ci-bean-instantiations.yml"},
              "has_skills": {
                  ".github/workflows/ci.yml",
                  ".github/workflows/ci-skills.yml",
                  "supporting_scripts/check_skill_references.py",
              },
          }

          failed = False
          for name, paths in required.items():
              present = set(filters.get(name, []))
              missing = sorted(paths - present)
              if missing:
                  failed = True
                  print(f"::error::{name} is missing implementation self-test paths: {', '.join(missing)}")

          if failed:
              sys.exit(1)
          PY
