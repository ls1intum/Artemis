name: Lint Workflows

# Reusable workflow called by ci.yml when files under .github/ change.
# Runs actionlint (configured via .github/actionlint.yaml) and the node/java version
# drift check.

on:
  workflow_call: {}

permissions: {}

jobs:
  # Deploy-gating logic lives in checked-in scripts (not inline YAML) so it can be linted and
  # unit-tested. shellcheck runs strictly on them (unlike actionlint's repo-wide `-shellcheck=`,
  # disabled for legacy inline blocks), and bats exercises the run-resolution / image-verify logic.
  deploy-scripts:
    name: deploy scripts (shellcheck + bats)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y bats
      - name: shellcheck deploy action scripts
        run: |
          set -Eeuo pipefail
          shellcheck .github/actions/verify-image-build/verify-image-build.sh \
                     .github/actions/resolve-artifact-run/resolve-artifact-run.sh
      - name: bats unit tests
        run: bats .github/actions/verify-image-build/tests .github/actions/resolve-artifact-run/tests
      - name: Verify LocalCI installer safety
        run: |
          shellcheck -e SC1091 deployment/kubernetes/install-localci-kubernetes-ubuntu.sh supporting_scripts/update_python_dependency_locks.sh
          python3 supporting_scripts/test_verified_installers.py

  # The test templates are copied verbatim into every new exercise's test repository, so their
  # unit test lives under supporting_scripts/ instead of next to them.
  programming-template-tests:
    name: programming exercise template tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test requirement handling of the C and C++ test templates
        run: python3 supporting_scripts/test_template_test_requirements.py

  badge-tests:
    name: README badge and Sonar workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test supporting_scripts/badges/badges.test.mjs .github/scripts/sonar-workflow.test.cjs

  test-selection:
    name: CI selection and reporting tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Test revision gate, coverage reporting and affected client/E2E selection
        run: |
          node --test .github/scripts/sonar-pr.test.cjs supporting_scripts/tests/sonar-test-artifacts.test.mjs .github/scripts/pr-ready.test.cjs .github/scripts/ci-policy.test.cjs .github/scripts/update-pr-coverage.test.cjs \
            supporting_scripts/client/run-affected-tests.test.mjs \
            supporting_scripts/ci/E2E-tests/selection.test.mjs
          pnpm exec vitest run --config supporting_scripts/ci/E2E-tests/vitest.config.mjs
      - name: Setup Java for the Gradle filtering contract
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Cache the pinned Gradle distribution without configuring Artemis
        run: ./gradlew --version
      - name: Test affected server selection and Gradle filtering
        run: python3 -m unittest discover -s supporting_scripts/tests -p 'test_*.py'
      - name: Lint selection scripts
        run: |
          shellcheck supporting_scripts/get_changed_modules.sh supporting_scripts/ci/E2E-tests/determine-relevant-tests.sh supporting_scripts/ci/E2E-tests/verify-test-determination.sh
          for script in supporting_scripts/get_changed_modules.sh supporting_scripts/ci/E2E-tests/determine-relevant-tests.sh supporting_scripts/ci/E2E-tests/verify-test-determination.sh; do
            bash -n "$script"
          done

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        # The install script is pinned to a release tag AND to its SHA-256, because piping it
        # straight into bash would execute whatever that URL returns. A tag can be moved; the
        # checksum cannot, so verify before running. Bump both together when raising the version.
        # `-shellcheck=` disables integrated shellcheck, which flags pre-existing style issues
        # in the legacy deploy workflows.
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_INSTALLER_SHA256: '72fa3e45ac20f3c3a512d6747b4fcf719e21f890e8c43e78d48a41fdfb900c4e'
        run: |
          curl --silent --show-error --fail --location \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            --output download-actionlint.bash
          echo "${ACTIONLINT_INSTALLER_SHA256}  download-actionlint.bash" | sha256sum --check --strict
          bash download-actionlint.bash "${ACTIONLINT_VERSION}"
          rm download-actionlint.bash
          ./actionlint -color -shellcheck=

      - name: Check version pins are in sync
        # Catches drift in top-level `env: { node, java }` blocks (auto-discovered).
        # Does NOT catch values hard-coded inline at `with: java-version: '...'` etc.
        run: |
          set -Eeuo pipefail
          for key in node java; do
            mapfile -t files < <(grep -lE "^  ${key}: " .github/workflows/*.yml)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::No workflow pins '${key}:'. Did the env blocks move?"
              exit 1
            fi
            mapfile -t values < <(grep -hE "^  ${key}: " "${files[@]}" | awk '{print $2}' | sort -u)
            if [ "${#values[@]}" -ne 1 ]; then
              echo "::error::Version drift on '${key}:' across ${files[*]} — values: ${values[*]}"
              exit 1
            fi
            echo "${key}: ${values[0]} (consistent across ${files[*]})"
          done

      - name: Check every action is pinned to a commit SHA
        # A version tag is mutable, so `uses:` must name a full commit SHA with a `# vX.Y.Z` comment
        # (see "Action pinning policy" in .github/workflows/README.md). The unit test pins what the
        # checker accepts, so a loosened rule fails here instead of silently letting tags back in.
        run: |
          set -Eeuo pipefail
          python3 supporting_scripts/test_check_action_pinning.py
          python3 supporting_scripts/check_action_pinning.py

      - name: Check area filters exercise their own implementations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          text = Path(".github/workflows/ci.yml").read_text()
          filters: dict[str, list[str]] = {}
          current = None
          for line in text.splitlines():
              if line.startswith("            has_") and line.rstrip().endswith(":"):
                  current = line.strip()[:-1]
                  filters[current] = []
                  continue
              if current and line.startswith("              - "):
                  filters[current].append(line.split("- ", 1)[1].strip().strip("'\""))
                  continue
              if current and line and not line.startswith("              "):
                  current = None

          required = {
              "has_workflows": {
                  ".github/scripts/**",
                  "supporting_scripts/get_changed_modules.sh",
                  "supporting_scripts/select_server_test_modules.py",
                  "supporting_scripts/tests/**",
                  "supporting_scripts/client/run-affected-tests*",
                  "supporting_scripts/ci/E2E-tests/**",
              },
              "has_java": {
                  ".github/workflows/ci.yml",
                  ".github/workflows/ci-quality.yml",
                  "config/checkstyle/**",
                  "config/spotless/**",
                  "config/pmd/**",
                  "supporting_scripts/analyze_java_files.py",
                  "supporting_scripts/find_slow_queries.py",
              },
              "has_docs": {".github/workflows/ci.yml", ".github/workflows/ci-docs.yml"},
              "has_i18n": {".github/workflows/ci.yml", ".github/workflows/ci-translation.yml", "supporting_scripts/ci/translation-file-checker/**"},
              "has_gradle": {".github/workflows/ci.yml", ".github/workflows/ci-gradle-wrapper.yml"},
              "has_version": {".github/workflows/ci.yml", ".github/workflows/ci-version-consistency.yml", "supporting_scripts/update_version.sh"},
              "has_beans": {".github/workflows/ci.yml", ".github/workflows/ci-bean-instantiations.yml"},
              "has_skills": {
                  ".github/workflows/ci.yml",
                  ".github/workflows/ci-skills.yml",
                  "supporting_scripts/check_skill_references.py",
              },
          }

          failed = False
          for name, paths in required.items():
              present = set(filters.get(name, []))
              missing = sorted(paths - present)
              if missing:
                  failed = True
                  print(f"::error::{name} is missing implementation self-test paths: {', '.join(missing)}")

          if failed:
              sys.exit(1)
          PY
