name: Check Translation Keys

on:
  workflow_call: {}

permissions: {}

jobs:
  check:
    name: Check if translation keys are consistent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Check if translation keys match
        run: >-
          python supporting_scripts/ci/translation-file-checker/translation_file_checker.py
          --german-files src/main/webapp/i18n/de/
          --english-files src/main/webapp/i18n/en/
          --ignore-german-only-prefix modelingEditor.json:.artemisApp.modelingEditor.apollon
