name: Nightly Iris E2E

# Runs nightly against the latest develop of Artemis and the latest main of edutelligence (the Iris
# microservice). It brings up the REAL Pyris stack (real Pyris + Weaviate + a mock OpenAI-compatible
# LLM) and exercises the genuine Artemis <-> Pyris wire contract end to end, with ONLY the LLM mocked.
#
# Purpose: catch contract drift between the two repos early. This is a non-blocking monitoring job,
# NOT a PR gate. A failure means the Artemis <-> Pyris contract diverged (the cause may live in either
# repo) and should be investigated; it never blocks a merge.
#
# Note: edutelligence has no `develop` branch; its default (and the branch carrying the unified chat
# pipeline this Artemis branch targets) is `main`, so that is what we build Pyris from.
#
# The workflow runs on a fixed schedule against the default branch and on manual dispatch. It does not
# consume untrusted GitHub event inputs, so command-injection vectors are not applicable here.

on:
  schedule:
    - cron: '0 2 * * *'        # 02:00 UTC daily (offset from the LTI nightly at 03:00)
  workflow_dispatch:           # manual ad-hoc runs (use this to validate/iterate the workflow)
    inputs:
      edutelligence_ref:
        description: 'edutelligence git ref to build Pyris from'
        default: 'main'
        required: false

concurrency:
  group: nightly-iris-e2e
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  iris-e2e:
    name: nightly-iris / real-pyris
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Artemis
        uses: actions/checkout@v7

      - name: Pull the published Pyris image (edutelligence main)
        # edutelligence's own CI (iris_build-and-push-docker.yml) publishes
        # ghcr.io/ls1intum/edutelligence/iris:latest on every push to main (tagged with the exact
        # commit SHA in org.opencontainers.image.revision), so the default nightly run can just pull
        # it instead of rebuilding from source — saving the checkout plus a from-scratch apt/pip build.
        if: github.event.inputs.edutelligence_ref == '' || github.event.inputs.edutelligence_ref == 'main'
        run: |
          docker pull ghcr.io/ls1intum/edutelligence/iris:latest
          docker tag ghcr.io/ls1intum/edutelligence/iris:latest pyris-e2e:local

      - name: Checkout edutelligence (Pyris source)
        # Only needed for a non-main ref requested via manual dispatch (e.g. to validate an
        # in-progress edutelligence branch/PR before merge) — no published image exists for those.
        if: github.event.inputs.edutelligence_ref != '' && github.event.inputs.edutelligence_ref != 'main'
        uses: actions/checkout@v7
        with:
          repository: ls1intum/edutelligence
          ref: ${{ github.event.inputs.edutelligence_ref }}
          path: edutelligence

      - name: Build the Pyris image from source
        # Build context is the edutelligence repo root; the Dockerfile lives in its iris/ subdir.
        if: github.event.inputs.edutelligence_ref != '' && github.event.inputs.edutelligence_ref != 'main'
        run: docker build -f edutelligence/iris/Dockerfile -t pyris-e2e:local edutelligence

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright dependencies
        working-directory: src/test/playwright
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (with system deps for CI)
        working-directory: src/test/playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the Iris e2e against real Pyris
        # RUN_IRIS=true makes the runner bring up the Pyris stack (real Pyris + Weaviate + mock LLM),
        # wait for Pyris health, enable Iris on the server, and run the Iris-filtered suite.
        run: RUN_IRIS=true ./run-e2e-tests-local-fast.sh --filter "Iris"

      - name: Upload Playwright report + service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-iris-playwright-report
          path: |
            src/test/playwright/playwright-report
            src/test/playwright/test-results
            .e2e-local/server.log
            .e2e-local/client.log
          if-no-files-found: ignore

      - name: Open a tracking issue on failure
        # Runs on any failed run. On the nightly schedule this is the primary signal (nobody is watching);
        # on a manual workflow_dispatch it also lets us verify the notification works. Deduplicated by title,
        # so repeated failures update one open issue instead of piling up.
        if: failure()
        uses: ./.github/actions/open-failure-issue
        with:
          title: Nightly Iris e2e failed
          assignee: krusche
          github-token: ${{ github.token }}
          body: >-
            The nightly Iris e2e failed. This is a non-blocking monitor of the Artemis <-> Pyris wire
            contract (Artemis develop x edutelligence main, only the LLM mocked); a failure means the
            contract may have drifted and the cause can live in either repository.
