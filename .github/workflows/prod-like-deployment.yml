---
name: Deploy Artemis with Ansible
on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch for a CI deployment'
        required: false
      commit_sha:
        description: 'Exact commit SHA for a CI deployment'
        required: false
      release_tag:
        description: 'Numeric release tag to deploy (instead of a CI branch and SHA)'
        required: false
        type: string
      universal_rollback:
        description: 'Use the universal WAR of the specified rollback release'
        type: boolean
        default: false
      environment_name:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging1.artemis.cit.tum.de
          - staging2.artemis.cit.tum.de
          - artemis.tum.de
      triggered_by:
        description: "Username that triggered deployment (not required, shown if triggered via GitHub UI, logged if triggered via GitHub app)"
        required: false
        type: string

concurrency: ${{ github.event.inputs.environment_name }}

env:
  # The CI entry point that publishes the role WARs (via ci-build.yml).
  build_workflow_name: ci.yml

# Default-deny; each job opts into the minimum scope it needs.
permissions: {}

jobs:
  check-build-status:
    runs-on: [self-hosted, artemis-prod-deployment]
    permissions:
      contents: read
      actions: read
    outputs:
      build_workflow_run_id: ${{ steps.resolve.outputs.run-id }}
      artifact: ${{ steps.artifact.outputs.artifact }}
      legacy_filename: ${{ steps.artifact.outputs.legacy_filename }}
    env:
      BRANCH_NAME: ${{ github.event.inputs.branch_name }}
      COMMIT_SHA: ${{ github.event.inputs.commit_sha }}
    steps:
      - name: Print inputs
        env:
          ENVIRONMENT_NAME: ${{ github.event.inputs.environment_name }}
          TRIGGERED_BY: ${{ github.event.inputs.triggered_by }}
        run: |
          set -Eeuo pipefail
          echo "Branch: $BRANCH_NAME"
          echo "Commit SHA: $COMMIT_SHA"
          echo "Environment: $ENVIRONMENT_NAME"
          echo "Triggered by: $TRIGGERED_BY"

      - name: Validate deployment source
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          UNIVERSAL_ROLLBACK: ${{ inputs.universal_rollback }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ && -z "$BRANCH_NAME" && -z "$COMMIT_SHA" ]]
          else
            [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ && -n "$BRANCH_NAME" && "$UNIVERSAL_ROLLBACK" != true ]]
          fi

      # Check out only the resolver action, from the workflow's own ref (Helios dispatches this
      # workflow from the branch being deployed). Run-resolution is a build-correctness helper.
      - name: Check out resolver action
        if: inputs.release_tag == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/resolve-artifact-run
            .github/scripts/deployment-artifacts.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.release_tag == ''
        with:
          node-version: '26'

      - name: Select the artifact format supported by this exact revision
        id: artifact
        if: inputs.release_tag == ''
        run: |
          git fetch --no-tags --depth=1 origin "$COMMIT_SHA"
          node .github/scripts/deployment-artifacts.mjs wars "$COMMIT_SHA"

      # Resolve the CI run that actually carries the selected WARs for this exact commit — enumerating all
      # runs for the SHA rather than trusting `.workflow_runs[0]`, which fails when a superseded or
      # artifact-less run for the same commit sorts first (Helios#1196).
      - name: Resolve build run for the commit
        if: inputs.release_tag == ''
        id: resolve
        uses: ./.github/actions/resolve-artifact-run
        with:
          workflow: ${{ env.build_workflow_name }}
          sha: ${{ github.event.inputs.commit_sha }}
          branch: ${{ github.event.inputs.branch_name }}
          artifact-name: ${{ steps.artifact.outputs.artifact }}
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: check-build-status
    runs-on: [self-hosted, artemis-prod-deployment]
    permissions:
      contents: read  # checkout
      actions: read   # download-artifact by run-id
    environment:
      name: ${{ github.event.inputs.environment_name }}
      url: ${{ vars.DEPLOYMENT_URL }}
    env:
      DEPLOYMENT_HOSTS_PRIMARY: ${{ vars.DEPLOYMENT_HOSTS_PRIMARY }}
      DEPLOYMENT_HOSTS_SECONDARY: ${{ vars.DEPLOYMENT_HOSTS_SECONDARY }}
      DEPLOYMENT_USER: ${{ vars.DEPLOYMENT_USER }}
      DEPLOYMENT_FOLDER: ${{ vars.DEPLOYMENT_FOLDER }}
      HEALTH_CHECK_URL: "${{ vars.DEPLOYMENT_URL }}/management/health"
      WORKFLOW_RUN_ID: ${{ needs.check-build-status.outputs.build_workflow_run_id }}

    steps:
      - name: Setup SSH and Known Hosts
        env:
          DEPLOYMENT_SSH_KEY: ${{ secrets.DEPLOYMENT_SSH_KEY }}
          DEPLOYMENT_HOST_PUBLIC_KEYS: ${{ vars.DEPLOYMENT_HOST_PUBLIC_KEYS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write private key
          # shellcheck disable=SC2001 # Secrets can contain literal backslash-n separators.
          echo "$DEPLOYMENT_SSH_KEY" | sed 's/\\n/\n/g' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Write known hosts
          echo "$DEPLOYMENT_HOST_PUBLIC_KEYS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Checkout Artemis-Ansible repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'ls1intum/artemis-ansible'

      - name: Check out deployment configuration and Python dependency lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: artemis-deployment
          sparse-checkout: |
            .github/python-dependencies
            deployment/ansible
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install Artemis-Ansible dependencies
        run: |
          python3 -m pip install --require-hashes -r artemis-deployment/.github/python-dependencies/requirements.txt
          ansible-galaxy collection install -r requirements.yml --force
          ansible-galaxy install -r requirements.yml --force
          ansible-galaxy install -r ~/.ansible/collections/ansible_collections/ls1intum/artemis/requirements.yml

      - name: Download role WARs
        if: inputs.release_tag == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.check-build-status.outputs.artifact }}
          digest-mismatch: error
          path: ${{ runner.temp }}/artemis-role-wars-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.WORKFLOW_RUN_ID  }}

      # Historic CI artifacts did not include a separate SHA256SUMS. download-artifact
      # verifies the archive against GitHub's digest before the exact member is staged.
      - name: Stage the universal WAR from a pre-split build
        if: needs.check-build-status.outputs.legacy_filename != ''
        env:
          WAR_DIRECTORY: ${{ runner.temp }}/artemis-role-wars-${{ github.run_id }}-${{ github.run_attempt }}
          LEGACY_FILENAME: ${{ needs.check-build-status.outputs.legacy_filename }}
        run: |
          set -Eeuo pipefail
          cd "$WAR_DIRECTORY"
          test -s "$LEGACY_FILENAME"
          mv -- "$LEGACY_FILENAME" Artemis.war
          sha256sum Artemis.war > SHA256SUMS

      - name: Deploy Artemis
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          UNIVERSAL_ROLLBACK: ${{ inputs.universal_rollback }}
          LEGACY_FILENAME: ${{ needs.check-build-status.outputs.legacy_filename }}
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment_name }}
          WAR_DIRECTORY: ${{ runner.temp }}/artemis-role-wars-${{ github.run_id }}-${{ github.run_attempt }}
          ANSIBLE_PLAYBOOK_PATH: ${{ vars.ANSIBLE_PLAYBOOK_PATH }}
        run: |
          set -Eeuo pipefail
          case "$DEPLOYMENT_ENVIRONMENT" in
            staging1.artemis.cit.tum.de) cluster=artemis_staging1 ;;
            staging2.artemis.cit.tum.de) cluster=artemis_staging2 ;;
            artemis.tum.de) cluster=artemis_production ;;
            *) exit 1 ;;
          esac
          if [[ -n "$RELEASE_TAG" ]]; then
            source_args=(-e "artemis_release=$RELEASE_TAG" -e "artemis_universal_rollback=$UNIVERSAL_ROLLBACK")
          else
            source_args=(-e "artemis_war_directory=$WAR_DIRECTORY")
            if [[ -n "$LEGACY_FILENAME" ]]; then source_args+=(-e artemis_universal_rollback=true); fi
          fi
          ansible-playbook artemis-deployment/deployment/ansible/deploy-role-wars.yml \
            -e @artemis-deployment/deployment/ansible/role-wars.yml \
            -e "artemis_update_playbook=$(realpath -- "$ANSIBLE_PLAYBOOK_PATH")" \
            -e "artemis_cluster=$cluster" -e "ansible_user=$DEPLOYMENT_USER" "${source_args[@]}"

      # The ansible role itself already waits for node 1 individually (management/info, up to
      # 10 minutes) before restarting the other nodes, so ansible-playbook failing already
      # catches a node that never comes back up. This check is complementary, not redundant:
      # it goes through the real public/load-balanced URL (all nodes, through nginx) rather than
      # a single node's actuator endpoint, and /management/health runs deeper checks (DB, disk
      # space, etc.) than /management/info's static build metadata.
      # DEGRADED (HTTP 200) means that only an optional external system such as Athena, Pyris or Hermes is not available while the
      # core works, so it counts as healthy here. DOWN (HTTP 503) of a critical component still fails the check.
      - name: Verify deployment health
        run: |
          for tool in curl jq; do
            if ! command -v "$tool" > /dev/null; then
              echo "::error::'$tool' is required for the deployment health check but is not installed on this runner."
              exit 1
            fi
          done

          attempts=0
          max_attempts=30
          until curl --fail --silent --show-error --max-time 10 "$HEALTH_CHECK_URL" | jq -e '.status == "UP" or .status == "DEGRADED"' > /dev/null; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "::error::$HEALTH_CHECK_URL did not report healthy after $max_attempts attempts (~5-10 minutes, depending on how quickly each attempt fails) following deployment."
              exit 1
            fi
            echo "Waiting for $HEALTH_CHECK_URL to report healthy (attempt $attempts/$max_attempts)..."
            sleep 10
          done
          echo "Deployment health check passed: $HEALTH_CHECK_URL reports UP."

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519
          rm -rf -- "${RUNNER_TEMP}/artemis-role-wars-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
