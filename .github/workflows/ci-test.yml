name: Test

on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'SHA to test. PR builds use the PR head SHA (matching ci-build.yml) — not the GitHub-generated merge commit, so Build and Test exercise the same tree.'
        required: true
        type: string
      base_branch:
        description: 'Base branch used for module-affected test selection.'
        required: true
        type: string
      run_all_tests:
        description: 'When true, run every test. When false, only run tests in modules affected by changes vs base_branch.'
        required: true
        type: boolean
      run_sandbox_tests:
        description: 'Whether the AI Worker sandbox or Hyperion code changed and needs real Docker tests.'
        required: true
        type: boolean
      run_server_tests:
        description: 'When false, the server suite (planning, shards and report) is skipped. ci.yml passes false for a pull request that cannot affect it.'
        required: false
        type: boolean
        default: true
      run_client_tests:
        description: 'When false, the client suite is skipped. ci.yml passes false for a pull request that cannot affect it.'
        required: false
        type: boolean
        default: true
      is_internal_pr:
        description: 'True only for PRs from branches inside ls1intum/Artemis (external services like Codacy skip on fork PRs).'
        required: true
        type: boolean
      pr_author:
        description: 'PR author login. Used to skip noisy annotations for bots. Empty when not a PR.'
        required: true
        type: string
    outputs:
      affected_tests:
        description: 'True when either test suite used affected selection instead of producing full-suite coverage.'
        value: ${{ jobs.server-test-shards.outputs.full_suite == 'false' || jobs.client-tests.outputs.mode == 'affected' || jobs.client-tests.outputs.mode == 'none' }}
      server_full_suite:
        description: 'Whether the server planner selected the complete seven-shard suite. Empty when server tests were skipped.'
        value: ${{ jobs.server-test-shards.outputs.full_suite }}
      client_mode:
        description: 'Client test scope: full, affected, or none. Empty when the client job was skipped.'
        value: ${{ jobs.client-tests.outputs.mode }}
    secrets:
      CODACY_PROJECT_TOKEN:
        description: 'Coverage upload token. Optional — coverage is uploaded only on internal PRs by non-bot authors.'
        required: false

permissions: {}  # default-deny; each job grants only what it needs

# Workflow-level node/java pins are drift-checked by ci-workflows.yml.
env:
  CI: true
  node: 24
  java: 25

jobs:
  sandbox-tests:
    name: AI Worker Sandbox Tests
    if: inputs.run_sandbox_tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '${{ env.java }}'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the offline sandbox image
        run: |
          docker build -f deployment/docker/hyperion/gradle-sandbox.Dockerfile -t aiworker-sandbox-test .
          image=$(docker image inspect aiworker-sandbox-test --format '{{.Id}}')
          echo "AI_WORKER_TEST_IMAGE=$image" >> "$GITHUB_ENV"
          echo "HYPERION_GRADLE_TEST_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Test Docker isolation and offline Gradle builds
        run: ./gradlew test --tests '*DockerSandboxIsolationTest' --tests '*DockerGradleBuildTest' -x webapp
      - name: Verify both image-gated suites ran
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for name in ('DockerSandboxIsolationTest', 'DockerGradleBuildTest'):
              reports = list(Path('build/test-results/test').glob(f'TEST-*.{name}.xml'))
              if len(reports) != 1:
                  raise SystemExit(f'Expected one test report for {name}, found {len(reports)}')
              suite = ElementTree.parse(reports[0]).getroot()
              if int(suite.get('tests', '0')) == 0 or int(suite.get('skipped', '0')) != 0:
                  raise SystemExit(f'{name} did not run every image-gated test')
          PY
      - name: Test Report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a  # v3.2.0
        if: ${{ !cancelled() }}
        with:
          name: AI Worker Sandbox Tests
          path: build/test-results/test/*.xml
          reporter: java-junit

  # Decides how the server suite is cut up. A full run is split into one shard per test bucket; a
  # affected-class run stays a single shard, because its selection cuts across buckets.
  server-test-shards:
    name: Plan Server Test Shards
    if: ${{ inputs.run_server_tests }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      modules: ${{ steps.plan.outputs.modules }}
      tests: ${{ steps.plan.outputs.tests }}
      full_suite: ${{ steps.plan.outputs.full_suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - id: plan
        env:
          RUN_ALL_TESTS: ${{ inputs.run_all_tests }}
          DEFAULT_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -Eeuo pipefail
          CHANGED_MODULES=""
          SELECTED_TEST_CLASSES=""
          PLAN_REASON="Full validation requested"
          if [ "$RUN_ALL_TESTS" != "true" ]; then
            PLAN_REASON="Cannot safely determine an affected test plan"
            # Resolve the scope before choosing the matrix. A selector fallback must retain all seven
            # full-suite shards, rather than silently putting the full suite on a single machine.
            if git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"; then
              if PLAN=$(python3 supporting_scripts/select_server_test_modules.py --format json "origin/$DEFAULT_BRANCH"); then
                PLAN_REASON=$(jq -r 'if (.reason | type) == "string" then .reason else "Invalid selector plan; full fallback" end' <<< "$PLAN" 2>/dev/null) || PLAN_REASON="Invalid selector plan; full fallback"
                # Treat malformed/empty plans as full. Only exact class names may reach Gradle or outputs.
                if jq -e '
                  .mode == "selected" and (.modules | type == "array") and (.tests | type == "array" and length > 0) and
                  all(.modules[]; type == "string" and test("^[a-z][a-z0-9]*\\z")) and
                  all(.tests[]; type == "string" and startswith("de.tum.cit.aet.artemis.") and
                    test("^[A-Za-z_$][A-Za-z0-9_$]*(\\.[A-Za-z_$][A-Za-z0-9_$]*)+\\z"))
                ' <<< "$PLAN" > /dev/null; then
                  CHANGED_MODULES=$(jq -r '.modules | unique | join(",")' <<< "$PLAN")
                  SELECTED_TEST_CLASSES=$(jq -r '.tests | unique | join(",")' <<< "$PLAN")
                fi
              else
                echo "::warning::Server class selection failed; using the full suite."
              fi
            else
              echo "::warning::Cannot fetch the comparison branch; using the full suite."
            fi
          fi
          if [ -n "$SELECTED_TEST_CLASSES" ]; then
            {
              echo "modules=$CHANGED_MODULES"
              echo "tests=$SELECTED_TEST_CLASSES"
              echo 'full_suite=false'
              echo 'shards=[{"name":"PostgreSQL","bucket":""}]'
            } >> "$GITHUB_OUTPUT"
            TEST_COUNT=$(jq '.tests | unique | length' <<< "$PLAN")
            echo "Server tests: $TEST_COUNT affected/guard classes ($CHANGED_MODULES), one shard; no full-suite coverage." >> "$GITHUB_STEP_SUMMARY"
            printf '\nReason: %s\n' "$PLAN_REASON" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo 'modules='
            echo 'tests='
            echo 'full_suite=true'
          } >> "$GITHUB_OUTPUT"
          echo 'Server tests: full suite, seven shards with combined coverage.' >> "$GITHUB_STEP_SUMMARY"
          printf '\nReason: %s\n' "$PLAN_REASON" >> "$GITHUB_STEP_SUMMARY"
          # One shard per bucket. Each bucket owns one Spring context and holds an exclusive @ResourceLock, so its
          # classes run one at a time whatever else is going on; giving each its own machine removes the contention
          # between buckets without changing how many contexts the run starts in total. The two smallest buckets share
          # a shard, and the last shard takes everything that belongs to no bucket (plain unit and architecture tests).
          # Measured locally on 2026-09-05, longest shard first: 8m13, 7m06, 7m06, 6m55, 5m29, 5m18, 3m49 - against
          # 17m50 for the same 15404 tests in one job.
          cat > shards.json <<'JSON'
          [
            {"name": "LocalCILocalVC",      "bucket": "BucketLocalCILocalVC"},
            {"name": "LocalCILocalVCBatch", "bucket": "BucketLocalCILocalVCBatch"},
            {"name": "JenkinsBatch",        "bucket": "BucketJenkinsLocalVCBatch | BucketJenkinsLocalVCTemplate"},
            {"name": "JenkinsLocalVC",      "bucket": "BucketJenkinsLocalVC"},
            {"name": "Independent",         "bucket": "BucketIndependent"},
            {"name": "IndependentBatch",    "bucket": "BucketIndependentBatch"},
            {"name": "Remaining",           "bucket": "!(BucketIndependent | BucketIndependentBatch | BucketJenkinsLocalVC | BucketJenkinsLocalVCBatch | BucketJenkinsLocalVCTemplate | BucketLocalCILocalVC | BucketLocalCILocalVCBatch)"}
          ]
          JSON
          echo "shards=$(jq -c . shards.json)" >> "$GITHUB_OUTPUT"

  server-tests:
    name: Server Tests (${{ matrix.shard.name }})
    needs: server-test-shards
    if: ${{ inputs.run_server_tests }}
    runs-on: aet-large-ubuntu
    strategy:
      # One shard failing must not cancel the others: the reporting job needs every shard's results to
      # render a complete picture, and a single flaky bucket would otherwise hide the rest.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.server-test-shards.outputs.shards) }}
    # Outermost bound of the hang ladder: watchdog 45m (run_with_hang_dump.sh) < Gradle Test timeout
    # 70m (gradle/test.gradle) < this 80m. Keep it above 70 so a hang fails as a deterministic Gradle
    # `failure`, not an opaque job-level `cancelled`.
    timeout-minutes: 80
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          # The planner owns diff selection; execution shards need only the tested tree.
          fetch-depth: 1
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.java }}
          # `cache: 'gradle'` is the legacy path; `setup-gradle@v6` below owns Gradle caching.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Java Tests
        # Wrapped in run_with_hang_dump.sh so a hung test is thread-dumped before the Gradle task
        # timeout (gradle/test.gradle) fires - the only forensic data a silent hang leaves.
        # `jacocoTestReport` is deliberately not run here: a shard only ever sees part of the suite, so the report is
        # built once from every shard's execution data by the reporting job below.
        env:
          SHARD_BUCKET: ${{ matrix.shard.bucket }}
          SELECTED_TEST_CLASSES: ${{ needs.server-test-shards.outputs.tests }}
          FULL_SUITE: ${{ needs.server-test-shards.outputs.full_suite }}
        run: |
          set -Eeuo pipefail
          if [ "$FULL_SUITE" = "false" ] && [ -n "$SELECTED_TEST_CLASSES" ] && [ -z "$SHARD_BUCKET" ]; then
            echo "Executing planned test classes: $SELECTED_TEST_CLASSES"
            ./supporting_scripts/run_with_hang_dump.sh ./gradlew --console=plain test -x webapp -Dartemis.test.classes="$SELECTED_TEST_CLASSES"
            exit 0
          fi
          if [ "$FULL_SUITE" = "true" ] && [ -n "$SHARD_BUCKET" ] && [ -z "$SELECTED_TEST_CLASSES" ]; then
            echo "Executing the tests of bucket(s): $SHARD_BUCKET"
            ./supporting_scripts/run_with_hang_dump.sh ./gradlew --console=plain test -x webapp -Dartemis.test.bucket="$SHARD_BUCKET"
            exit 0
          fi
          echo "::error::Inconsistent server test plan; refusing an unplanned full-suite run."
          exit 1
      - name: Upload Thread Dumps (on hang)
        # `always()`, not `!cancelled()`: if a wedge defeats the Gradle timeout and the job hits its
        # own 80-min cap, the run is `cancelled` — and that is exactly when the watchdog's dump is the
        # only forensic data. `if-no-files-found: ignore` keeps the normal (no-hang) path quiet.
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Server Test Thread Dumps
          path: build/hang-thread-dumps/*.txt
          if-no-files-found: ignore
      - name: Upload JUnit Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Disambiguated from `JUnit Test Results` (E2E) because both jobs upload in the
          # same parent run; `actions/upload-artifact@v4+` rejects duplicate artifact names — which is
          # also why the shard name is part of it.
          name: Server JUnit Test Results (${{ matrix.shard.name }})
          path: build/test-results/test/*.xml
      - name: Upload Coverage Execution Data
        # Each shard covers only part of the suite. The reporting job below collects every shard's
        # execution data and builds one report from all of it.
        if: ${{ !cancelled() && needs.server-test-shards.outputs.full_suite == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Server Coverage Execution Data (${{ matrix.shard.name }})
          path: build/jacoco/test.exec
          if-no-files-found: ignore
      - name: Count Server Starts
        # Counted here, where the log is, and summed over the shards by the reporting job: the bound is
        # on what a whole run starts, and a single shard only starts the contexts of its own buckets.
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          mkdir -p server-starts
          grep -c ":: Powered by Spring Boot[^:]* ::" tests.log > "server-starts/${{ matrix.shard.name }}.txt" || echo 0 > "server-starts/${{ matrix.shard.name }}.txt"
      - name: Upload Server Start Count
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Server Start Count (${{ matrix.shard.name }})
          path: server-starts/*.txt
          if-no-files-found: ignore
      - name: Print failed tests
        if: failure()
        # DataExportResourceIntegrationTest (and others) have parameterized tests with a FAILED enum and
        # need to be excluded from matching 'Test > ... FAILED', as they are not actual test failures.
        run: |
          set -Eeuo pipefail
          FAILED_TESTS=$(grep "Test >.* FAILED\$" tests.log | grep -v "Starting logs for" || true)
          if [ -n "$FAILED_TESTS" ]; then
            echo "$FAILED_TESTS"
            exit 1
          else
            echo "No failed tests."
          fi

  # Everything that has to see the run as a whole rather than one shard of it: the coverage report and its
  # thresholds, the test-result check-run, and the bound on how many Spring contexts a run starts.
  server-tests-report:
    name: Server Tests Report
    needs: [server-test-shards, server-tests]
    # Without `run_server_tests` there are no shards to report, and `!cancelled()` alone would run this
    # job anyway (it is true for a skipped dependency) and fail on the missing coverage data.
    if: ${{ !cancelled() && inputs.run_server_tests }}
    # Affected reports only combine JUnit and server-start counts; save the large runner for coverage builds.
    runs-on: ${{ needs.server-test-shards.outputs.full_suite == 'false' && 'ubuntu-latest' || 'aet-large-ubuntu' }}
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Setup Java
        if: ${{ needs.server-test-shards.outputs.full_suite == 'true' && needs.server-tests.result == 'success' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ env.java }}
      - name: Setup Gradle
        if: ${{ needs.server-test-shards.outputs.full_suite == 'true' && needs.server-tests.result == 'success' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Download Coverage Execution Data
        if: ${{ needs.server-test-shards.outputs.full_suite == 'true' && needs.server-tests.result == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Server Coverage Execution Data (*)
          # Every shard's file is called test.exec, so they are kept apart by their artifact directory and
          # then given distinct names; `jacocoTestReport` reads every *.exec under build/jacoco.
          path: downloaded-exec
      - name: Collect Coverage Execution Data
        if: ${{ needs.server-test-shards.outputs.full_suite == 'true' && needs.server-tests.result == 'success' }}
        run: |
          set -Eeuo pipefail
          mkdir -p build/jacoco
          index=0
          find downloaded-exec -name '*.exec' -print0 | while IFS= read -r -d '' file; do
            cp "$file" "build/jacoco/shard-${index}.exec"
            index=$((index + 1))
          done
          ls -la build/jacoco
      - name: Download JUnit Test Results
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Server JUnit Test Results (*)
          merge-multiple: true
          path: build/test-results/test
      - name: Build Coverage Report
        if: ${{ needs.server-test-shards.outputs.full_suite == 'true' && needs.server-tests.result == 'success' }}
        run: |
          set -Eeuo pipefail
          ./gradlew --console=plain jacocoTestReport -x test -x webapp
      - name: JaCoCo Coverage Verification (advisory)
        id: jacoco-verification
        if: ${{ needs.server-test-shards.outputs.full_suite == 'true' && needs.server-tests.result == 'success' }}
        # Advisory: violations surface via ::error:: annotations from the next step but do
        # not fail the job. Tightening this to gating requires removing continue-on-error
        # AND dropping the `|| true` in the violation-print step.
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          ./gradlew --console=plain jacocoTestCoverageVerification -x test -x webapp 2>&1 | tee jacoco-verification.log
      - name: Print JaCoCo coverage violations
        if: steps.jacoco-verification.outcome == 'failure'
        run: |
          set -Eeuo pipefail
          VIOLATIONS=$(grep "Rule violated for bundle" jacoco-verification.log || true)
          if [ -n "$VIOLATIONS" ]; then
            MODULES=$(grep 'jacocoTestCoverageVerification-.*FAILED' jacoco-verification.log | sed 's/.*jacocoTestCoverageVerification-\([a-zA-Z]*\).*/\1/' | sort -u | tr '\n' ', ' | sed 's/, $//' || true)
            echo "::error::JaCoCo code coverage thresholds violated${MODULES:+ in module(s): $MODULES}"
            echo ""
            echo "$VIOLATIONS"
            echo ""
            if [ -n "$MODULES" ]; then
              echo "If this is not related to your PR, adjust the thresholds for module(s) [$MODULES] in gradle/jacoco.gradle (ModuleCoverageThresholds)."
            else
              echo "If this is not related to your PR, adjust the thresholds in gradle/jacoco.gradle (ModuleCoverageThresholds)."
            fi
          fi
      - name: 'Codacy: Report coverage'
        # Coverage upload runs only on internal PRs by non-bot authors; fork PRs lack the secret.
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699  # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/reports/jacoco/aggregated/jacocoTestReport.xml
        if: ${{ success() && needs.server-test-shards.outputs.full_suite == 'true' && needs.server-tests.result == 'success' && inputs.is_internal_pr && inputs.pr_author != 'dependabot[bot]' }}
      - name: Test Report
        # Renders JUnit results as a check-run with diff annotations.
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a  # v3.2.0
        if: ${{ !cancelled() && inputs.pr_author != 'dependabot[bot]' }}
        with:
          name: Server Tests (PostgreSQL)
          path: build/test-results/test/*.xml
          reporter: java-junit
      - name: Download Server Start Counts
        # Without this the step is skipped as soon as an earlier one fails, and the server-start check right below it
        # then fails for want of files rather than on what it actually measures.
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Server Start Count (*)
          merge-multiple: true
          path: server-starts
      - name: Number of Server Starts
        if: ${{ !cancelled() }}
        run: |
          set -Eeuo pipefail
          TOTAL=$(cat server-starts/*.txt | awk '{ sum += $1 } END { print sum + 0 }')
          bash supporting_scripts/extract_number_of_server_starts.sh "$TOTAL"
      - name: Upload Server Test Coverage Report
        if: ${{ success() && needs.server-test-shards.outputs.full_suite == 'true' && needs.server-tests.result == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Coverage Report Server Tests
          path: build/reports/jacoco/aggregated/html
      - name: Append Per-Module Coverage to Job Summary
        if: ${{ success() && needs.server-test-shards.outputs.full_suite == 'true' && needs.server-tests.result == 'success' }}
        run: |
          set -Eeuo pipefail
          AGGREGATED_REPORT_FILE=./module_coverage_report.md
          python3 ./supporting_scripts/code-coverage/per_module_cov_report/parse_module_coverage.py build/reports/jacoco "$AGGREGATED_REPORT_FILE"
          cat "$AGGREGATED_REPORT_FILE" > "$GITHUB_STEP_SUMMARY"
      - name: Upload JaCoCo XML Reports
        # Consumed by pullrequest-coverage-reporter.yml; only successful complete suites publish this artifact.
        if: ${{ success() && needs.server-test-shards.outputs.full_suite == 'true' && needs.server-tests.result == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Server JaCoCo XML
          path: build/reports/jacoco/**/jacocoTestReport.xml
          if-no-files-found: error

  client-tests:
    name: Client Tests
    outputs:
      mode: ${{ steps.client-tests.outputs.mode }}
      coverage: ${{ steps.client-tests.outputs.coverage }}
    if: ${{ inputs.run_client_tests }}
    runs-on: aet-large-ubuntu
    # 45 minutes proved too tight on slower runners: the suite finished green but the job was
    # cancelled during the final coverage aggregation (develop already peaks at ~40 minutes).
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      # test:ci:affected sets explicit Node limits. Keep tracked .npmrc intact so it cannot
      # contaminate the affected-change diff and force a full run on every pull request.
      # The self-hosted runners have no usable npm on PATH; install Node first so
      # pnpm/action-setup's npm-based self-installer (v6) finds a working npm.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile TypeScript Test Files With Typechecking
        run: pnpm run compile:tests
      - name: TypeScript Test Without Typechecking
        id: client-tests
        env:
          RUN_ALL_TESTS: ${{ inputs.run_all_tests }}
          DEFAULT_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -Eeuo pipefail
          # compile:tests already prepared assets and UI sources; reuse them in every mode.
          if [ "$RUN_ALL_TESTS" = "true" ]; then
            pnpm run test:ci:affected --full --prebuilt
          elif git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"; then
            pnpm run test:ci:affected --base-ref "origin/$DEFAULT_BRANCH" --prebuilt
          else
            echo "::warning::Cannot fetch the comparison branch; using the full client suite."
            pnpm run test:ci:affected --full --prebuilt
          fi
      - name: Custom ESLint Rule Tests
        # Runs the RuleTester specs (config/eslint/rules/*.spec.mjs) for our guardrail ESLint rules. Uses a
        # separate Vitest config (config/eslint/rules/vitest.config.mjs, plain-Node env) so these .spec.mjs do
        # not run under the Angular jsdom/Vite environment of the client suite above.
        run: pnpm run test:rules
      - name: Per-Module Coverage Gate
        # Enforces the per-module client coverage thresholds (admin, etc.) defined in
        # supporting_scripts/code-coverage/module-coverage-client/check-client-module-coverage.mjs.
        # The global Vitest threshold alone would let an individual module silently regress.
        # A selected PR run has no meaningful global/module coverage denominator.
        if: ${{ !cancelled() && steps.client-tests.outputs.coverage == 'true' }}
        run: pnpm run coverage:check-module
      - name: Upload Vitest JUnit Test Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vitest JUnit Test Results
          path: build/test-results/vitest/*junit.xml
          if-no-files-found: ignore
      - name: Upload Vitest Coverage Report
        if: ${{ success() && steps.client-tests.outputs.coverage == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vitest Coverage Report
          path: build/test-results/vitest/coverage/
      - name: Upload Client Coverage Summaries
        if: ${{ success() && steps.client-tests.outputs.coverage == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Client Coverage Summaries
          path: |
            build/test-results/vitest/coverage/coverage-summary.json
          if-no-files-found: error
