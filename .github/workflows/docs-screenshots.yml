name: Documentation Screenshots

# Screenshots go stale without anybody touching a page: a component changes its layout and the image keeps showing the old one. This
# workflow renders the screenshots that documentation/screenshots/manifest.json describes from the demo data, compares them with the
# checked-in images and keeps one open issue that lists the images that differ. It never commits an image and never fails a pull request.
# A maintainer replaces an image after looking at the artifact (see "Generated screenshots" in
# documentation/docs/developer/guidelines/documentation.mdx).
#
# The workflow starts everything itself with supporting_scripts/e2e/render-docs-screenshots.sh: a PostgreSQL container, the server with the
# `demo` profile, the client, and a Playwright container as the browser. The browser is the one of the script's default, which is also the
# one that rendered the checked-in images, so fonts and anti-aliasing do not differ between the runner and a developer's machine.
# It does not run in a pull request: a cold start (Gradle build of the server, development server of the client) takes more than half an hour.

on:
  schedule:
    - cron: '0 4 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-screenshots
  cancel-in-progress: false

env:
  node: 24
  java: 25

jobs:
  render:
    name: Render the screenshots
    if: github.repository == 'ls1intum/Artemis'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '${{ env.node }}'
          cache: 'pnpm'
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '${{ env.java }}'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Render
        run: ./supporting_scripts/e2e/render-docs-screenshots.sh --render-only
      - name: Upload the rendered images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots-rendered
          path: build/docs-screenshots
          if-no-files-found: error
          retention-days: 30
      - name: Upload the logs of the server and the client
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-screenshots-logs
          path: build/docs-screenshots-stack/*.log
          if-no-files-found: ignore
          retention-days: 7

  compare:
    name: Compare with the checked-in images
    needs: render
    if: github.repository == 'ls1intum/Artemis'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The age of an image is the date of its last commit, which needs the history.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Download the rendered images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-screenshots-rendered
          path: build/docs-screenshots
      - name: Compare
        run: |
          set -Eeuo pipefail
          python supporting_scripts/check_docs_screenshots.py --compare build/docs-screenshots > "${RUNNER_TEMP}/differ.md"
          python supporting_scripts/check_docs_screenshots.py --stale > "${RUNNER_TEMP}/stale.md"
          cat "${RUNNER_TEMP}/differ.md" "${RUNNER_TEMP}/stale.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Documentation: screenshots that differ from the application'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          existing=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number,title --jq "[.[] | select(.title == \"${TITLE}\")][0].number // empty")
          if grep -q '^0 of ' "${RUNNER_TEMP}/differ.md"; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Every rendered screenshot matches the checked-in image."
            fi
            exit 0
          fi
          {
            echo "### Rendered images that differ"
            cat "${RUNNER_TEMP}/differ.md"
            echo
            echo "### Images whose component or translations changed after the image"
            cat "${RUNNER_TEMP}/stale.md"
            echo
            echo "The rendered images are the artifact \`docs-screenshots-rendered\` of [this run](${RUN_URL}). Look at the difference first: a changed demo course is not a change of the page. To replace the images, run \`./supporting_scripts/e2e/render-docs-screenshots.sh --update\` and review the changed files, as described in \"Generated screenshots\" in the documentation guideline."
            echo "This issue is kept up to date by \`.github/workflows/docs-screenshots.yml\`."
          } > "${RUNNER_TEMP}/body.md"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "${RUNNER_TEMP}/body.md"
          else
            gh issue create --title "$TITLE" --body-file "${RUNNER_TEMP}/body.md"
          fi
