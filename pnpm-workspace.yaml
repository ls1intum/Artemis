  - 'packages/*'

catalog:
  '@analogjs/vite-plugin-angular': 2.7.1
  '@analogjs/vitest-angular': 2.7.1
  '@arethetypeswrong/cli': 0.18.5
  '@angular-devkit/architect': 0.2201.7
  '@angular-devkit/core': 22.1.7
  '@angular/build': 22.1.7
  '@angular/cdk': 22.1.5
  '@angular/cli': 22.1.7
  '@angular/common': 22.1.5
  '@angular/compiler': 22.1.5
  '@angular/compiler-cli': 22.1.5
  '@angular/core': 22.1.5
  '@angular/forms': 22.1.5
  '@angular/localize': 22.1.5
  '@angular/platform-browser': 22.1.5
  '@fortawesome/angular-fontawesome': 5.1.0
  '@fortawesome/fontawesome-svg-core': 7.3.1
  '@fortawesome/free-solid-svg-icons': 7.3.1
  '@compodoc/compodoc': 2.0.0
  '@playwright/test': 1.62.1
  '@storybook/addon-a11y': 10.6.0
  '@storybook/addon-docs': 10.6.0
  '@storybook/addon-themes': 10.6.0
  '@storybook/addon-vitest': 10.6.0
  '@storybook/angular-vite': 10.6.0
  '@tailwindcss/postcss': 4.3.3
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@vitest/browser': 4.1.11
  '@vitest/browser-playwright': 4.1.11
  '@vitest/coverage-istanbul': 4.1.11
  '@vitest/coverage-v8': 4.1.11
  chokidar: 5.0.0
  concurrently: 10.0.5
  cross-env: 10.1.0
  dayjs: 1.11.23
  eslint: 10.9.1
  eslint-plugin-storybook: 10.6.0
  jsdom: 30.0.1
  lodash-es: 4.18.1
  ng-packagr: 22.1.1
  postcss: 8.5.27
  publint: 0.3.24
  playwright: 1.62.1
