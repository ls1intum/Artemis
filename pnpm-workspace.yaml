# pnpm 11+ moved install/resolution settings out of `.npmrc` (which it now
# ignores for everything except registry/auth/Node settings like node-options)
# and into this file. Settings here govern the install behaviour in this
# project root.

packages:
  - 'packages/*'

catalog:
  '@analogjs/vite-plugin-angular': 2.7.2
  '@analogjs/vitest-angular': 2.7.2
  '@arethetypeswrong/cli': 0.18.5
  '@angular-devkit/architect': 0.2201.8
  '@angular-devkit/core': 22.1.8
  '@angular/build': 22.1.8
  '@angular/cdk': 22.1.7
  '@angular/cli': 22.1.8
  '@angular/common': 22.1.7
  '@angular/compiler': 22.1.7
  '@angular/compiler-cli': 22.1.7
  '@angular/core': 22.1.7
  '@angular/forms': 22.1.7
  '@angular/localize': 22.1.7
  '@angular/platform-browser': 22.1.7
  '@fortawesome/angular-fontawesome': 5.1.0
  '@fortawesome/fontawesome-svg-core': 7.3.1
  '@fortawesome/free-solid-svg-icons': 7.3.1
  '@compodoc/compodoc': 2.0.0
  '@playwright/test': 1.63.0
  '@storybook/addon-a11y': 10.6.0
  '@storybook/addon-docs': 10.6.0
  '@storybook/addon-themes': 10.6.0
  '@storybook/addon-vitest': 10.6.0
  '@storybook/angular-vite': 10.6.0
  '@tailwindcss/postcss': 4.3.3
  '@types/node': 24.13.4
  '@types/react': 19.2.18
  '@vitest/browser': 4.1.11
  '@vitest/browser-playwright': 4.1.11
  '@vitest/coverage-istanbul': 4.1.11
  '@vitest/coverage-v8': 4.1.11
  chokidar: 5.0.0
  concurrently: 10.0.5
  cross-env: 10.1.0
  dayjs: 1.11.23
  eslint: 10.10.0
  eslint-plugin-storybook: 10.6.0
  jsdom: 30.0.1
  lodash-es: 4.18.1
  ng-packagr: 22.1.1
  postcss: 8.5.28
  publint: 0.3.24
  playwright: 1.63.0
  # Only here to satisfy Storybook's peer requirement (packages/tum-ui declares it); Artemis itself is Angular.
  # Must equal the react and react-dom overrides below - see the note there.
  react: 19.2.8
  rxjs: 7.8.2
  sass: 1.104.1
  semver: 7.8.5
  storybook: 10.6.0
  stylelint: 17.15.0
  tailwindcss: 4.3.3
  tslib: 2.8.1
  typescript: 6.0.3
  vite: 8.1.5
  vitest: 4.1.11
  yaml: 2.9.1
  zone.js: 0.16.3

# No hoist shim: rely on pnpm's default isolated layout. Every package the
# project imports is declared as a direct dependency in package.json; patches
# go through pnpm.patchedDependencies (which works on the .pnpm symlink store
# directly, without requiring transitive deps at top-level node_modules).

# Auto-install peer dependencies (default in pnpm 10, opt-in since pnpm 11).
# Without this, peer deps are not installed, and the Angular esbuild bundle
# fails with "Could not resolve ..." errors.
autoInstallPeers: true

# Treat the lockfile as authoritative; never silently update it during install.
preferFrozenLockfile: true

# Allow our own pre/post lifecycle scripts (postinstall, prepare) to run.
enablePrePostScripts: true

# Tell pnpm that the Angular major this project is on is an acceptable peer for
# packages whose published peerDependencies range still lists only older majors.
# We already pin every relevant @angular/* dep under ng-mocks to that major via
# the `overrides:` block below; this block just suppresses the cosmetic peer-range
# warning that overrides do not silence on their own.
# ng-mocks itself normally catches up quickly, so this is usually redundant for it;
# it is kept as a safety net for any transitive package whose range still trails the
# Angular release train. Update the versions below whenever Angular's major changes.
peerDependencyRules:
  allowedVersions:
    '@angular/animations': '22'
    '@angular/cdk': '22'
    '@angular/common': '22'
    '@angular/compiler': '22'
    '@angular/core': '22'
    '@angular/forms': '22'
    '@angular/platform-browser': '22'
    '@angular/platform-browser-dynamic': '22'
    '@angular/router': '22'

# Dependency overrides. pnpm reads overrides from this file in preference to
# the legacy `pnpm.overrides` block in package.json. We pin a handful of
# transitive packages to CVE-patched versions and force the current Angular major
# across the ng-mocks subtree (its peer range trails the Angular release train).
#
# Do NOT add a `vite` override here, and do not reintroduce one when
# `supporting_scripts/check_client_override_version_updates.sh` reports a newer release.
# `@angular/build` depends on one exact vite version and configures the dev server's
# dependency pre-bundling in a format only that version understands (22.1 moved the plugin
# that runs the Angular linker to `optimizeDeps.rolldownOptions`, which Vite 7 silently
# ignores). An override that resolves to anything else leaves pre-bundled Angular libraries
# unlinked, and `pnpm start` serves a blank page with "The injectable '_PlatformLocation'
# needs to be compiled using the JIT compiler" — while the production build stays green,
# because it never uses Vite. Without an override, @angular/build's own exact pin governs
# and the mismatch cannot happen. `pnpm run check:vite-override` fails the build if it does.
overrides:
  # Rolldown 1.2.0 corrupts KaTeX surrogate escapes during chunk optimization (oxc-project/oxc#25084).
  # Remove when @angular/build pins a fixed Rolldown version; keep chunk optimization enabled.
  '@angular/build>rolldown': '1.2.9'
  'ng-mocks>@angular/common': '^22.0.0'
  'ng-mocks>@angular/core': '^22.0.0'
  'ng-mocks>@angular/forms': '^22.0.0'
  'ng-mocks>@angular/platform-browser': '^22.0.0'
  'ng-mocks>@angular/platform-browser-dynamic': '^22.0.0'
  'ng-mocks>@angular/router': '^22.0.0'
  'ng-mocks>rxjs': '^7.8.2'
  # @angular/localize is only pulled in transitively (e.g. via @ng-bootstrap/ng-bootstrap,
  # whose peer range requires the current Angular major). Without this pin it resolves to a
  # straggler from an older major that violates that peer range; keep it equal to @angular/core.
  '@angular/localize': '22.1.7'
  # @angular/animations is never declared either: it arrives as an optional auto-installed peer of
  # @angular/platform-browser. Both sides of that edge pin an exact patch - platform-browser asks for
  # animations 22.1.7 and animations asks for core 22.1.7 - so without this pin an Angular patch bump
  # leaves animations behind on the old patch against the new core. Keep it equal to @angular/core.
  '@angular/animations': '22.1.7'
  'babel-plugin-istanbul>test-exclude': '8.0.0'
  '@babel/core': '7.29.7'
  '@babel/runtime': '7.29.7'
  '@babel/plugin-transform-modules-systemjs': '7.29.8'
  '@primeuix/styled': '0.7.4'
  '@primeuix/utils': '0.7.2'
  '@sinonjs/fake-timers': '15.4.0'
  ajv: '8.20.0'
  brace-expansion: '5.0.12'
  braces: '3.0.3'
  cookie: '1.1.1'
  debug: '4.4.3'
  diff: '9.0.0'
  dompurify: '3.4.15'
  esbuild: '0.28.2'
  express: '5.2.1'
  # Kept on the 3.x line (ajv/fast-json-stringify require ^3); 4.x is an API break.
  # Must stay >= 3.1.6, which fixed CVE-2026-76172, CVE-2026-75899, CVE-2026-75975
  # and CVE-2026-75931 (host confusion / SSRF via URI normalization).
  fast-uri: '3.1.7'
  globals: '17.12.0'
  http-proxy-middleware: '3.0.7'
  immutable: '5.1.9'
  ip-address: '10.7.2'
  # Kept on the 4.x line (consumers require ^4; 5.x is an API break).
  js-yaml: '4.3.2'
  # Held at 30.0.1: in 30.1.0 a detached element's style object no longer passes jsdom's own
  # brand check, so reading a property off it throws "called on an object that is not a valid
  # instance of CSSStyleProperties". PrimeNG's MotionDirective does exactly that while tearing
  # down, which failed 65 tests across two specs on teardown alone. Revisit once PrimeNG or
  # jsdom fixes it; keep this equal to the catalog entry.
  jsdom: '30.0.1'
  katex: '0.18.7'
  # less dropped the optional `image-size` dependency in 4.9.0. Every image-size release published so
  # far carries unfixed infinite-loop DoS advisories (GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr), so
  # there is no version to upgrade to.
  # @angular/build pulls less in transitively and accepts ^4.2.0, so pinning the latest 4.x
  # drops the package from the tree entirely instead.
  less: '4.9.1'
  minimatch: '10.2.6'
  # Reached dev-side via postcss, whose range allows the patched release pinned here
  # (GHSA: custom generators can loop indefinitely when size is zero).
  nanoid: '3.3.19'
  piscina: '5.3.2'
  postcss: '8.5.28'
  punycode: '2.3.1'
  # React and react-dom must resolve to one version each, and to the same one: react-dom asserts this at import time
  # and throws "Incompatible React versions" otherwise. Only Storybook renders React here, but that is enough - the
  # mismatch takes down all 76 tum-ui story tests and the documentation Playwright suite with them.
  # This is easy to split by accident, because react is a catalog entry while react-dom is never declared at all:
  # it arrives as an auto-installed peer, and packages asking for `^19` will happily pull a newer react than the
  # catalog pins. Pinning both here makes the pairing enforced rather than a coincidence of resolution order.
  # Keep these two and the `react` catalog entry on the same version.
  # Left at 19.2.8 rather than moved to 19.3.0. Nothing here needs the newer react - it only exists
  # to satisfy Storybook's peer requirement - and the gate that would qualify the bump cannot: the
  # forced-colors check in .storybook/tests/accessibility-preferences.spec.ts is flaky, failing
  # roughly a third of runs on 19.2.8 and on 19.3.0 alike (1 of 6 and 2 of 4 locally). Do not read
  # a single red AutoDocs run as a verdict on a react bump; re-run it several times first.
  react: '19.2.8'
  react-dom: '19.2.8'
  # Reached through express / body-parser, which both already sit on their newest release and
  # still resolve qs to 6.15.x. 6.16.0 fixed GHSA-4mjr-xmp4-gh2g (uncaught TypeError when a
  # parsed object with a non-callable constructor.isBuffer is stringified again) and
  # GHSA-x5fp-wj9c-mxmx (bracket keys bypassing arrayLimit when comma parsing is on).
  qs: '6.16.0'
  semver: '7.8.5'
  serialize-javascript: '7.1.1'
  shell-quote: '1.10.0'
  tar: '7.5.22'
  tmp: '0.2.7'
  tough-cookie: '6.0.2'
  undici: '7.29.1'
  uuid: '14.0.2'
  # Vite 8 leaves decorators in external spec helpers untransformed. Keep the Vitest toolchain on
  # Vite 7 until @analogjs/vite-plugin-angular handles those helpers; Angular and Storybook use Vite 8.
  'vitest>vite': '7.3.6'
  '@vitest/mocker>vite': '7.3.6'
  '@analogjs/vite-plugin-angular>vite': '7.3.6'
  word-wrap: '1.2.5'
  ws: '8.21.3'
  yargs-parser: '22.0.0'

# Patch files applied by pnpm to specific transitive dependencies during install
# (the pnpm-native replacement for the old patch-package/postinstall flow).
patchedDependencies:
  'eslint@10.10.0': 'patches/eslint+10.10.0.patch'
  y-monaco@0.1.6: patches/y-monaco@0.1.6.patch

# Allowlist of dependencies permitted to run install-time build / lifecycle scripts.
# pnpm blocks build scripts by default; these are needed for native bindings
# (@swc/core, esbuild, @parcel/watcher, lmdb, msgpackr-extract, unrs-resolver),
# polyfill setup (core-js), or our own dev-time hooks (husky).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  esbuild: true
  husky: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true

# Acknowledged audit advisories that `pnpm audit` should not flag.
# GHSA-8988-4f7v-96qf (@opentelemetry/core < 2.8.0, moderate: unbounded memory
# allocation in W3C Baggage propagation) reaches us only through the dev-only
# chain lighthouse > @sentry/node@9 > @opentelemetry/core@1.30.1. It is never
# bundled into the production WAR and processes no untrusted baggage in our usage.
# The fix exists only in @opentelemetry/core >= 2.8.0 (the OTel 2.x train), which
# requires @sentry/node >= 10, while lighthouse still pins @sentry/node@^9, so there is
# no in-range upgrade. Revisit when lighthouse moves to @sentry/node 10 — at that point
# this entry should be removed rather than bumped.
# (The server-side Java equivalent, GHSA-rcgg-9c38-7xpx, is already handled by the
# opentelemetry_version pin in gradle.properties.)
auditConfig:
  ignoreGhsas:
    - 'GHSA-8988-4f7v-96qf'
