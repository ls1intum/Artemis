<div class="tumaet-ui-message-content">
    @if (icon(); as messageIcon) {
        <fa-icon [icon]="messageIcon" class="tumaet-ui-message-icon" />
    }
    @if (text(); as messageText) {
        <span class="tumaet-ui-message-text">{{ messageText }}</span>
    } @else {
        <span class="tumaet-ui-message-text"><ng-content /></span>
    }
</div>
