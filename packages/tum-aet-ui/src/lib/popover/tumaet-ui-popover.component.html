<ng-template #panel>
    <div
        class="tumaet-ui-popover-panel tumaet:rounded-md tumaet:border tumaet:border-border tumaet:bg-overlay-background tumaet:text-text tumaet:shadow-lg"
        [class.tumaet:p-3]="padding() === 'default'"
        role="dialog"
        [attr.aria-modal]="isModal() ? 'true' : null"
        [attr.aria-label]="ariaLabel()"
        [attr.data-placement]="appliedPlacement()"
        [attr.tabindex]="isModal() ? 0 : null"
        [cdkTrapFocus]="isModal()"
        [cdkTrapFocusAutoCapture]="isModal()"
        (pointerenter)="onPanelPointerEnter()"
        (pointerleave)="onPanelPointerLeave()"
        (focusin)="onPanelFocusIn()"
        (focusout)="onPanelFocusOut()"
        (keydown)="onPanelKeydown($event)"
    >
        <ng-content />
    </div>
</ng-template>
