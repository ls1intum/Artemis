<div class="tumaet-ui-splitter-panel" data-testid="splitter-panel" [style.flex]="collapsedSecondSize() ? '1 1 0' : size() + ' 1 0'">
    <ng-container [ngTemplateOutlet]="panels()[0] ?? null" />
</div>
<div
    class="tumaet-ui-splitter-separator"
    role="separator"
    tabindex="0"
    data-testid="splitter-gutter"
    [hidden]="!!collapsedSecondSize()"
    [attr.aria-label]="separatorLabel()"
    [attr.aria-orientation]="layout() === 'horizontal' ? 'vertical' : 'horizontal'"
    [attr.aria-valuenow]="size()"
    [attr.aria-valuemin]="minimum()"
    [attr.aria-valuemax]="maximum()"
    [style.flex-basis.px]="safeGutterSize()"
    (pointerdown)="startResize($event)"
    (keydown)="resizeWithKeyboard($event)"
></div>
<div class="tumaet-ui-splitter-panel" data-testid="splitter-panel" [style.flex]="collapsedSecondSize() ? '0 0 ' + collapsedSecondSize() : 100 - size() + ' 1 0'">
    <ng-container [ngTemplateOutlet]="panels()[1] ?? null" />
</div>
