<div class="tumaet-ui-table-layout-toolbar" data-testid="table-toolbar">
    <ng-content select="[tumAetUiTableToolbar]" />
</div>
<div class="tumaet-ui-table-layout-body" data-testid="table-scroll-body">
    <ng-content />
    @if (loading()) {
        <div class="tumaet-ui-table-layout-loading" aria-hidden="true">
            <tumaet-ui-progress-spinner />
        </div>
    }
</div>
<ng-content select="[tumAetUiTableFooter]" />
