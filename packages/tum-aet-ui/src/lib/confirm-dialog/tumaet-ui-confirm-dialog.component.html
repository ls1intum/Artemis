@if (request(); as req) {
    <tumaet-ui-dialog [visible]="visible()" [closable]="true" [header]="req.header" [role]="'alertdialog'" [ariaDescribedBy]="messageId" (hidden)="onDialogHide()">
        <div class="tumaet:flex tumaet:items-center tumaet:gap-4">
            @if (req.icon) {
                <fa-icon [icon]="req.icon" class="tumaet:size-8 tumaet:shrink-0 tumaet:text-2xl tumaet:text-muted" />
            }
            <span [id]="messageId" class="tumaet-ui-confirm-dialog-message">{{ req.message }}</span>
        </div>
        <ng-template #footer>
            <tumaet-ui-button [severity]="req.rejectSeverity ?? 'secondary'" (clicked)="reject()">{{ req.rejectLabel }}</tumaet-ui-button>
            <tumaet-ui-button [severity]="req.acceptSeverity ?? 'primary'" (clicked)="accept()">{{ req.acceptLabel }}</tumaet-ui-button>
        </ng-template>
    </tumaet-ui-dialog>
}
