@if (showButtons() && horizontalButtons()) {
    <ng-container [ngTemplateOutlet]="decrementButton" />
}
<input
    #inputEl
    tumAetUiInput
    type="text"
    [attr.inputmode]="maxFractionDigits() > 0 ? 'decimal' : 'numeric'"
    class="tumaet-ui-input-number-input"
    role="spinbutton"
    [value]="displayText()"
    [tumAetUiInputId]="inputId()"
    [attr.name]="name()"
    [attr.placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledBy()"
    [tumAetUiInputDescribedBy]="ariaDescribedBy()"
    [attr.aria-valuenow]="ariaValueNow()"
    [attr.aria-valuemin]="min() ?? null"
    [attr.aria-valuemax]="max() ?? null"
    [attr.aria-valuetext]="ariaValueText()"
    [disabled]="isDisabled()"
    [tumAetUiInputInvalid]="invalid()"
    (input)="onInput($event)"
    (blur)="onBlurHandler()"
    (keydown)="onKeydown($event)"
/>
@if (showButtons()) {
    <span class="tumaet-ui-input-number-button-group">
        <button
            type="button"
            [attr.tabindex]="horizontalButtons() ? null : -1"
            [attr.aria-hidden]="horizontalButtons() ? null : true"
            class="tumaet-ui-input-number-button tumaet-ui-input-number-increment tumaet:text-muted tumaet:hover:bg-hover-background tumaet:hover:text-text-hover"
            [disabled]="isDisabled()"
            (mousedown)="$event.preventDefault()"
            [attr.aria-label]="incrementLabel() ?? ('tumAetUi.inputNumber.increment' | tumAetUiTranslate)"
            data-testid="input-number-increment"
            (click)="onStep(step())"
        >
            <fa-icon [icon]="horizontalButtons() ? faPlus : faChevronUp" />
        </button>
        @if (!horizontalButtons()) {
            <ng-container [ngTemplateOutlet]="decrementButton" />
        }
    </span>
}

<ng-template #decrementButton>
    <button
        type="button"
        [attr.tabindex]="horizontalButtons() ? null : -1"
        [attr.aria-hidden]="horizontalButtons() ? null : true"
        class="tumaet-ui-input-number-button tumaet-ui-input-number-decrement tumaet:text-muted tumaet:hover:bg-hover-background tumaet:hover:text-text-hover"
        [disabled]="isDisabled()"
        (mousedown)="$event.preventDefault()"
        [attr.aria-label]="decrementLabel() ?? ('tumAetUi.inputNumber.decrement' | tumAetUiTranslate)"
        data-testid="input-number-decrement"
        (click)="onStep(-step())"
    >
        <fa-icon [icon]="horizontalButtons() ? faMinus : faChevronDown" />
    </button>
</ng-template>
