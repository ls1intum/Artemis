<div class="tumaet-ui-panel-header" [class.tumaet-ui-panel-header-toggleable]="toggleable()">
    <span [id]="headerId" class="tumaet-ui-panel-title">{{ header() }}<ng-content select="[tumAetUiPanelHeader]" /></span>
    @if (toggleable()) {
        <button
            type="button"
            class="tumaet-ui-panel-toggler"
            [attr.aria-expanded]="!collapsed()"
            [attr.aria-controls]="contentId"
            [attr.aria-label]="toggleLabel()"
            [attr.aria-labelledby]="toggleLabelledBy()"
            (click)="toggle()"
        >
            <fa-icon [icon]="collapsed() ? faChevronDown : faChevronUp" />
        </button>
    }
</div>
<div
    [id]="contentId"
    class="tumaet-ui-panel-content-container"
    [attr.role]="toggleable() && header().trim() ? 'region' : null"
    [attr.aria-labelledby]="toggleable() && header().trim() ? headerId : null"
    [attr.aria-hidden]="isCollapsed() ? 'true' : null"
    [attr.inert]="isCollapsed() ? '' : null"
>
    <div class="tumaet-ui-panel-content-wrapper">
        <div class="tumaet-ui-panel-content">
            <ng-content />
        </div>
        <ng-content select="[tumAetUiPanelFooter]" />
    </div>
</div>
