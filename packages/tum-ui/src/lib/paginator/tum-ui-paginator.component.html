<div class="tum:flex tum:flex-wrap tum:items-center tum:justify-center tum:gap-1 tum:border-t tum:border-tum-ui-border tum:pt-2 tum:text-sm tum:text-tum-ui-muted">
    @if (showCurrentPageReport()) {
        <span class="tum:px-2">
            {{ 'tumUi.paginator.currentPageReport' | tumUiTranslate: { first: rangeBegin(), second: rangeEnd(), total: totalRecords() } }}
        </span>
    }

    <button type="button" [class]="navButtonClasses" [disabled]="disabled() || isFirst()" (click)="goToFirst()" [attr.aria-label]="'tumUi.paginator.first' | tumUiTranslate">
        <fa-icon [icon]="faAnglesLeft" />
    </button>
    <button type="button" [class]="navButtonClasses" [disabled]="disabled() || isFirst()" (click)="goToPrevious()" [attr.aria-label]="'tumUi.paginator.previous' | tumUiTranslate">
        <fa-icon [icon]="faAngleLeft" />
    </button>

    @for (p of visiblePages(); track p) {
        <button
            type="button"
            [class]="p === clampedPage() ? selectedPageClasses : navButtonClasses"
            [disabled]="disabled()"
            (click)="goToPage(p)"
            [attr.aria-current]="p === clampedPage() ? 'page' : null"
        >
            {{ p + 1 }}
        </button>
    }

    <button type="button" [class]="navButtonClasses" [disabled]="disabled() || isLast()" (click)="goToNext()" [attr.aria-label]="'tumUi.paginator.next' | tumUiTranslate">
        <fa-icon [icon]="faAngleRight" />
    </button>
    <button type="button" [class]="navButtonClasses" [disabled]="disabled() || isLast()" (click)="goToLast()" [attr.aria-label]="'tumUi.paginator.last' | tumUiTranslate">
        <fa-icon [icon]="faAnglesRight" />
    </button>

    @if (showRowsPerPage()) {
        <select
            class="tum:ml-1 tum:cursor-pointer tum:rounded-md tum:border tum:border-tum-ui-control-border tum:bg-tum-ui-control-background tum:px-2.5 tum:py-1.5 tum:text-sm tum:text-tum-ui-text"
            [ngModel]="pageSize()"
            [disabled]="disabled()"
            (ngModelChange)="onPageSizeChange($event)"
            [attr.aria-label]="'tumUi.paginator.rowsPerPage' | tumUiTranslate"
        >
            @for (option of pageSizeOptions(); track option) {
                <option [ngValue]="option">{{ option }}</option>
            }
        </select>
    }
</div>
