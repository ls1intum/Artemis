<ng-template #panel>
    <div
        class="tum-ui-popover-panel rounded-md border border-tum-ui-border bg-tum-ui-surface-0 p-3 text-tum-ui-surface-900 shadow-lg dark:bg-tum-ui-surface-800 dark:text-tum-ui-surface-0"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="ariaLabel()"
        tabindex="0"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
    >
        <ng-content />
    </div>
</ng-template>
