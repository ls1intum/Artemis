<ng-template #panel>
    <div
        class="tum-ui-popover-panel tum:rounded-md tum:border tum:border-tum-ui-border tum:bg-tum-ui-surface-0 tum:p-3 tum:text-tum-ui-surface-900 tum:shadow-lg tum:dark:bg-tum-ui-surface-800 tum:dark:text-tum-ui-surface-0"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="ariaLabel()"
        tabindex="0"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
    >
        <ng-content />
    </div>
</ng-template>
