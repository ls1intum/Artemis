<ng-template #panel>
    <div
        class="tum-ui-popover-panel tum:rounded-md tum:border tum:border-tum-ui-border tum:bg-tum-ui-overlay-background tum:p-3 tum:text-tum-ui-text tum:shadow-lg"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="ariaLabel()"
        tabindex="0"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
    >
        <ng-content />
    </div>
</ng-template>
