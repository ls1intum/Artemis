<span [class]="chipClasses()" data-testid="tum-ui-chip">
    @if (label(); as chipLabel) {
        <span class="tum-ui-chip-label truncate">{{ chipLabel }}</span>
    } @else {
        <span class="tum-ui-chip-label truncate"><ng-content /></span>
    }
    @if (removable()) {
        <button
            type="button"
            class="tum-ui-chip-remove inline-flex shrink-0 cursor-pointer appearance-none items-center justify-center border-0 bg-transparent p-0 leading-none text-inherit"
            [attr.aria-label]="removeAriaLabel()"
            (click)="remove($event)"
            (keydown)="onRemoveKeydown($event)"
            data-testid="tum-ui-chip-remove"
        >
            <fa-icon [icon]="faXmark" />
        </button>
    }
</span>
