<div class="tum:w-72 tum:select-none">
    <div class="tum:mb-2 tum:flex tum:items-center tum:justify-between">
        <button
            type="button"
            class="tum:appearance-none tum:rounded tum:border-0 tum:bg-transparent tum:p-1 tum:text-tum-ui-surface-700 tum:hover:bg-tum-ui-surface-100 tum:dark:text-tum-ui-surface-0 tum:dark:hover:bg-tum-ui-surface-700"
            (click)="previousMonth()"
            [attr.aria-label]="previousMonthLabel()"
            data-testid="calendar-previous"
        >
            <fa-icon [icon]="faChevronLeft" />
        </button>
        <span class="tum:font-semibold tum:text-tum-ui-surface-900 tum:dark:text-tum-ui-surface-0" aria-live="polite" data-testid="calendar-month-label">{{ monthLabel() }}</span>
        <button
            type="button"
            class="tum:appearance-none tum:rounded tum:border-0 tum:bg-transparent tum:p-1 tum:text-tum-ui-surface-700 tum:hover:bg-tum-ui-surface-100 tum:dark:text-tum-ui-surface-0 tum:dark:hover:bg-tum-ui-surface-700"
            (click)="nextMonth()"
            [attr.aria-label]="nextMonthLabel()"
            data-testid="calendar-next"
        >
            <fa-icon [icon]="faChevronRight" />
        </button>
    </div>
    <table role="grid" class="tum:w-full tum:border-collapse tum:text-center tum:text-sm">
        <thead>
            <tr>
                @for (label of weekdayLabels(); track $index) {
                    <th scope="col" class="tum:p-1 tum:font-medium tum:text-tum-ui-muted">{{ label }}</th>
                }
            </tr>
        </thead>
        <tbody>
            @for (week of weeks(); track $index; let w = $index) {
                <tr>
                    @for (day of week; track day.valueOf(); let d = $index) {
                        <td class="tum:p-0.5" role="gridcell" [attr.aria-selected]="isSelected(day) ? 'true' : null">
                            <button
                                #dayButton
                                type="button"
                                [class]="dayButtonClasses(day)"
                                [attr.tabindex]="focusedIndex() === w * 7 + d ? 0 : -1"
                                [attr.aria-label]="dayLabel(day)"
                                (click)="selectDay(day)"
                                (keydown)="onKeydown($event, w * 7 + d)"
                            >
                                {{ day.date() }}
                            </button>
                        </td>
                    }
                </tr>
            }
        </tbody>
    </table>
</div>
