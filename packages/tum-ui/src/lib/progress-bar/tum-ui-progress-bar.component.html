<div class="tum-ui-progress-bar-value" [style.width.%]="normalizedValue()" [style.--tum-ui-progress-bar-color]="color()">
    <span class="tum-ui-progress-bar-label tum:text-primary-contrast">
        <ng-content>
            @if (showValue() && normalizedValue() !== 0) {
                {{ normalizedValue() }}{{ unit() }}
            }
        </ng-content>
    </span>
</div>
