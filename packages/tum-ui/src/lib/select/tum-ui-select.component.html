<div class="relative inline-flex w-full">
    <button
        #trigger
        type="button"
        [id]="inputId()"
        [class]="triggerClasses()"
        [disabled]="isDisabled()"
        [attr.name]="name()"
        aria-haspopup="listbox"
        [attr.aria-expanded]="isOpen() ? 'true' : 'false'"
        [attr.aria-controls]="isOpen() ? listboxId : null"
        [attr.aria-label]="ariaLabel()"
        (click)="toggle()"
        (keydown)="onTriggerKeydown($event)"
        data-testid="tum-ui-select-trigger"
    >
        <span class="flex-1 truncate" [class.text-tum-ui-muted]="!hasSelection()" data-testid="tum-ui-select-label">{{ displayLabel() }}</span>
    </button>

    <!-- Dropdown chevron: fills the reserved 2.5rem (pr-10) zone, non-interactive so clicks fall through to the trigger. -->
    <span class="pointer-events-none absolute inset-y-0 right-0 flex w-10 items-center justify-center text-tum-ui-muted">
        <fa-icon [icon]="faChevronDown" />
    </span>

    @if (showClearButton()) {
        <button
            type="button"
            class="absolute inset-y-0 right-10 flex appearance-none items-center border-0 bg-transparent p-0 text-tum-ui-muted hover:text-tum-ui-surface-900 dark:hover:text-tum-ui-surface-0"
            (click)="clear($event)"
            [attr.aria-label]="clearAriaLabel()"
            data-testid="tum-ui-select-clear"
        >
            <fa-icon [icon]="faXmark" />
        </button>
    }
</div>

<ng-template #panel>
    <div
        class="tum-ui-select-panel rounded-md border border-tum-ui-border bg-tum-ui-surface-0 text-tum-ui-surface-700 shadow-md dark:bg-tum-ui-surface-900 dark:text-tum-ui-surface-0"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
    >
        <ul
            [id]="listboxId"
            role="listbox"
            tabindex="0"
            [attr.aria-label]="ariaLabel()"
            [attr.aria-activedescendant]="activeOptionId()"
            (keydown)="onListKeydown($event)"
            class="m-0 flex max-h-60 list-none flex-col gap-0.5 overflow-y-auto p-1 outline-none"
            data-testid="tum-ui-select-listbox"
        >
            @for (option of options(); track $index; let i = $index) {
                <li
                    [id]="optionId(i)"
                    role="option"
                    [attr.aria-selected]="isSelected(option) ? 'true' : 'false'"
                    [class]="optionClasses(option, i)"
                    (click)="selectOption(option)"
                    (mouseenter)="setActive(i)"
                    data-testid="tum-ui-select-option"
                >
                    <span class="flex-1 truncate">{{ label(option) }}</span>
                    @if (isSelected(option)) {
                        <fa-icon [icon]="faCheck" class="ml-2 shrink-0" />
                    }
                </li>
            } @empty {
                <li role="presentation" class="px-3 py-2 text-tum-ui-muted" data-testid="tum-ui-select-empty">{{ emptyMessage() }}</li>
            }
        </ul>
    </div>
</ng-template>
