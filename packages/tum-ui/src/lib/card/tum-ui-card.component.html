<ng-content select="[tumUiCardHeader]" />
<div class="tum-ui-card-body">
    <ng-content select="tum-ui-card-header" />
    @if (showLegacyCaption()) {
        <div class="tum-ui-card-caption">
            @if (header(); as cardHeader) {
                <div class="tum-ui-card-title">{{ cardHeader }}</div>
            }
            @if (subheader(); as cardSubheader) {
                <div class="tum-ui-card-subtitle">{{ cardSubheader }}</div>
            }
        </div>
    }
    <ng-content select="tum-ui-card-content" />
    <div class="tum-ui-card-content">
        <ng-content />
    </div>
    <ng-content select="tum-ui-card-footer" />
    <ng-content select="[tumUiCardFooter]" />
</div>
