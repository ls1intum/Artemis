<ng-template #panel>
    <div
        class="tum-ui-popover-panel tum:rounded-md tum:border tum:border-border tum:bg-overlay-background tum:p-3 tum:text-text tum:shadow-lg"
        role="dialog"
        aria-modal="true"
        [attr.aria-label]="ariaLabel()"
        [attr.data-placement]="appliedPlacement()"
        tabindex="0"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
    >
        <ng-content />
    </div>
</ng-template>
