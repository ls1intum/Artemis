      - name: tutorialGroupId
        in: path
        required: true
        schema: {type: integer, format: int64}
      - name: studentLogin
        in: path
        required: true
        schema: {type: string}
      responses:
        '200': {description: OK}
components:
  schemas:
    CourseCompetency:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        description: {type: string}
        taxonomy:
          type: string
          enum: [REMEMBER, UNDERSTAND, APPLY, ANALYZE, EVALUATE, CREATE]
        softDueDate: {type: string, format: date-time}
        masteryThreshold: {type: integer, format: int32}
        optional: {type: boolean}
        type: {type: string}
    QuizBatchWithPassword:
      type: object
      properties:
        id: {type: integer, format: int64}
        startTime: {type: string, format: date-time}
        started: {type: boolean}
        ended: {type: boolean}
        password: {type: string}
    ExerciseVariantGroupReference:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        maxPoints: {type: number, format: double}
        releaseDate: {type: string, format: date-time}
        startDate: {type: string, format: date-time}
        dueDate: {type: string, format: date-time}
        assessmentDueDate: {type: string, format: date-time}
        exampleSolutionPublicationDate: {type: string, format: date-time}
    QuizQuestionRefinementSuccess:
      description: Successful refinement result containing the refined question and
        an explanation of the changes
      required: [question, reasoning]
      type: object
      properties:
        reasoning: {type: string, description: Brief explanation of what was changed
            during refinement, minLength: 1}
        type:
          type: string
          enum: [success]
          example: success
    ChecklistAnalysisRequest:
      type: object
      description: Request to analyze a problem statement for quality, competencies,
        and difficulty
      properties:
        problemStatementMarkdown: {type: string, description: Problem statement in
            Markdown format, maxLength: 50000, minLength: 1}
        declaredDifficulty: {type: string, description: Declared difficulty of the
            exercise, maxLength: 20, minLength: 0, pattern: EASY|MEDIUM|HARD}
        language: {type: string, description: 'Programming language, e.g. JAVA, PYTHON',
          maxLength: 50, minLength: 0}
        exerciseId: {type: integer, format: int64, description: ID of the exercise,
          minimum: 0}
      required: [problemStatementMarkdown]
    QuizBatchJoin:
      type: object
      properties:
        password: {type: string}
    QuizSubmissionFromStudent:
      type: object
      properties:
        submittedAnswers:
          type: array
          items: {$ref: '#/components/schemas/SubmittedAnswerFromStudent'}
          uniqueItems: true
      required: [submittedAnswers]
    QuizSubmissionBeforeEvaluation:
      type: object
      properties:
        id: {type: integer, format: int64}
        submissionExerciseType: {type: string}
        submitted: {type: boolean}
        type:
          type: string
          enum: [MANUAL, TIMEOUT, TEST, OTHER, INSTRUCTOR, EXTERNAL]
        submissionDate: {type: string, format: date-time}
        submittedAnswers:
          type: array
          items: {$ref: '#/components/schemas/SubmittedAnswerBeforeEvaluation'}
          uniqueItems: true
    ChecklistAnalysisResponse:
      type: object
      description: Response containing the checklist analysis results
      properties:
        inferredCompetencies:
          type: array
          description: Top inferred competencies from the standardized catalog
          items: {$ref: '#/components/schemas/InferredCompetency'}
        bloomRadar: {$ref: '#/components/schemas/BloomRadar', description: Bloom's
            taxonomy radar distribution}
        difficultyAssessment: {$ref: '#/components/schemas/DifficultyAssessment',
          description: Difficulty assessment with delta indicator}
        qualityIssues:
          type: array
          description: List of quality issues found in the problem statement
          items: {$ref: '#/components/schemas/QualityIssue'}
    ResultAfterEvaluationWithSubmission:
      type: object
      properties:
        id: {type: integer, format: int64}
        completionDate: {type: string, format: date-time}
        successful: {type: boolean}
        score: {type: number, format: double}
        rated: {type: boolean}
        assessmentType:
          type: string
          enum: [AUTOMATIC, SEMI_AUTOMATIC, MANUAL, AUTOMATIC_ATHENA]
        submission: {$ref: '#/components/schemas/QuizSubmissionForResult'}
    ChecklistActionResponse:
      type: object
      description: Response from applying a checklist action to the problem statement
      properties:
        updatedProblemStatement: {type: string, description: The updated problem statement
            markdown}
        applied: {type: boolean, description: Whether the action was successfully
            applied}
        summary: {type: string, description: Short summary of what was changed}
    ShortAnswerSubmittedAnswerFromStudent:
      required: [questionId, submittedTexts, type]
      type: object
      properties:
        questionId: {type: integer, format: int64}
        submittedTexts:
          type: array
          items: {$ref: '#/components/schemas/ShortAnswerSubmittedTextFromStudent'}
        type:
          type: string
          default: short-answer
          enum: [short-answer]
    DropLocationCounter:
      type: object
      properties:
        dropLocationId: {type: integer, format: int64}
        id: {type: integer, format: int64}
        ratedCounter: {type: integer, format: int32}
        unRatedCounter: {type: integer, format: int32}
    GradingInstruction:
      type: object
      properties:
        id: {type: integer, format: int64}
        credits: {type: number, format: double}
        gradingScale: {type: string}
        instructionDescription: {type: string}
        feedback: {type: string}
        usageCount: {type: integer, format: int32}
    DragAndDropQuestionReEvaluate:
      required: [correctMappings, dragItems, dropLocations, id, invalid, randomizeOrder,
        scoringType, title, type]
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string, minLength: 1}
        text: {type: string}
        hint: {type: string}
        explanation: {type: string}
        scoringType:
          type: string
          enum: [ALL_OR_NOTHING, PROPORTIONAL_WITH_PENALTY, PROPORTIONAL_WITHOUT_PENALTY]
        randomizeOrder: {type: boolean}
        invalid: {type: boolean}
        dropLocations:
          type: array
          items: {$ref: '#/components/schemas/DropLocationReEvaluate'}
          minItems: 1
        dragItems:
          type: array
          items: {$ref: '#/components/schemas/DragItemReEvaluate'}
          minItems: 1
        correctMappings:
          type: array
          items: {$ref: '#/components/schemas/DragAndDropMappingReEvaluate'}
          minItems: 1
        type:
          type: string
          default: drag-and-drop
          enum: [drag-and-drop]
    SubmittedAnswerFromLiveClient:
      discriminator:
        propertyName: type
        mapping: {multiple-choice: '#/components/schemas/MultipleChoiceSubmittedAnswerFromLiveClient',
          drag-and-drop: '#/components/schemas/DragAndDropSubmittedAnswerFromLiveClient',
          short-answer: '#/components/schemas/ShortAnswerSubmittedAnswerFromLiveClient'}
      oneOf:
      - {$ref: '#/components/schemas/MultipleChoiceSubmittedAnswerFromLiveClient'}
      - {$ref: '#/components/schemas/DragAndDropSubmittedAnswerFromLiveClient'}
      - {$ref: '#/components/schemas/ShortAnswerSubmittedAnswerFromLiveClient'}
      properties:
        type: {type: string}
      required: [type]
    ResultAfterEvaluation:
      type: object
      properties:
        id: {type: integer, format: int64}
        completionDate: {type: string, format: date-time}
        successful: {type: boolean}
        score: {type: number, format: double}
        rated: {type: boolean}
        assessmentType:
          type: string
          enum: [AUTOMATIC, SEMI_AUTOMATIC, MANUAL, AUTOMATIC_ATHENA]
    QuizQuestionWithSolution:
      type: object
      discriminator:
        propertyName: type
        mapping: {multiple-choice: '#/components/schemas/MultipleChoiceQuizQuestionWithSolution',
          drag-and-drop: '#/components/schemas/DragAndDropQuizQuestionWithSolution',
          short-answer: '#/components/schemas/ShortAnswerQuizQuestionWithSolution'}
      oneOf:
      - {$ref: '#/components/schemas/MultipleChoiceQuizQuestionWithSolution'}
      - {$ref: '#/components/schemas/DragAndDropQuizQuestionWithSolution'}
      - {$ref: '#/components/schemas/ShortAnswerQuizQuestionWithSolution'}
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        text: {type: string}
        hint: {type: string}
        points: {type: number, format: double}
        scoringType:
          type: string
          enum: [ALL_OR_NOTHING, PROPORTIONAL_WITH_PENALTY, PROPORTIONAL_WITHOUT_PENALTY]
        randomizeOrder: {type: boolean}
        invalid: {type: boolean}
        type: {type: string}
        explanation: {type: string}
        answerOptions:
          type: array
          items: {$ref: '#/components/schemas/AnswerOptionWithSolution'}
        singleChoice: {type: boolean}
        backgroundFilePath: {type: string}
        dropLocations:
          type: array
          items: {$ref: '#/components/schemas/DropLocation'}
        dragItems:
          type: array
          items: {$ref: '#/components/schemas/DragItem'}
        correctMappings:
          type: array
          items: {$ref: '#/components/schemas/ShortAnswerMapping'}
        spots:
          type: array
          items: {$ref: '#/components/schemas/ShortAnswerSpot'}
        solutions:
          type: array
          items: {$ref: '#/components/schemas/ShortAnswerSolution'}
        similarityValue: {type: integer, format: int32}
        matchLetterCase: {type: boolean}
    ShortAnswerSpotCreate:
      type: object
      properties:
        tempID: {type: integer, format: int64}
        spotNr: {type: integer, format: int32}
        width: {type: integer, format: int32, minimum: 0}
      required: [spotNr, tempID, width]
    BloomRadar:
      type: object
      description: Bloom's taxonomy radar distribution with normalized proportions
        (0.0–1.0, summing to 1.0)
      properties:
        REMEMBER: {type: number, format: double, description: Proportion of REMEMBER
            level (0.0–1.0)}
        UNDERSTAND: {type: number, format: double, description: Proportion of UNDERSTAND
            level (0.0–1.0)}
        APPLY: {type: number, format: double, description: Proportion of APPLY level
            (0.0–1.0)}
        ANALYZE: {type: number, format: double, description: Proportion of ANALYZE
            level (0.0–1.0)}
        EVALUATE: {type: number, format: double, description: Proportion of EVALUATE
            level (0.0–1.0)}
        CREATE: {type: number, format: double, description: Proportion of CREATE level
            (0.0–1.0)}
    ShortAnswerQuestionCreate:
      required: [correctMappings, matchLetterCase, points, scoringType, similarityValue,
        solutions, spots, title, type]
      type: object
      properties:
        title: {type: string, minLength: 1}
        text: {type: string}
        hint: {type: string}
        explanation: {type: string}
        points: {type: number, format: double, minimum: 0}
        scoringType:
          type: string
          enum: [ALL_OR_NOTHING, PROPORTIONAL_WITH_PENALTY, PROPORTIONAL_WITHOUT_PENALTY]
        randomizeOrder: {type: boolean}
        spots:
          type: array
          items: {$ref: '#/components/schemas/ShortAnswerSpotCreate'}
          minItems: 1
        solutions:
          type: array
          items: {$ref: '#/components/schemas/ShortAnswerSolutionCreate'}
          minItems: 1
        correctMappings:
          type: array
          items: {$ref: '#/components/schemas/ShortAnswerMappingCreate'}
          minItems: 1
        similarityValue: {type: integer, format: int32}
        matchLetterCase: {type: boolean}
        type:
          type: string
          default: short-answer
          enum: [short-answer]
    QuizQuestionRefinementRequest:
      type: object
      description: Request to refine an existing quiz question using a user prompt
      properties:
        refinementPrompt: {type: string, description: User instructions describing
            how the question should be changed, maxLength: 2000, minLength: 1}
      required: [question, refinementPrompt]
    ConsistencyIssue:
      type: object
      description: Individual consistency issue details
      properties:
        severity:
          type: string
          description: Severity of the issue
          enum: [LOW, MEDIUM, HIGH]
          example: HIGH
        category:
          type: string
          description: Category of the issue
          enum: [METHOD_RETURN_TYPE_MISMATCH, METHOD_PARAMETER_MISMATCH, CONSTRUCTOR_PARAMETER_MISMATCH,
            ATTRIBUTE_TYPE_MISMATCH, VISIBILITY_MISMATCH, IDENTIFIER_NAMING_INCONSISTENCY]
          example: METHOD_RETURN_TYPE_MISMATCH
        description: {type: string, description: Detailed description of the issue,
          example: Problem statement does not match test cases}
        suggestedFix: {type: string, description: Suggested fix for the issue, example: Update
            problem statement to clarify expected behavior}
        relatedLocations:
          type: array
          description: Related locations across artifacts
          items: {$ref: '#/components/schemas/ArtifactLocation'}
      required: [category, description, relatedLocations, severity, suggestedFix]
    MultipleChoiceQuestionFromEditor:
      required: [answerOptions, points, scoringType, singleChoice, title, type]
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        text: {type: string}
        hint: {type: string}
        explanation: {type: string}
        points: {type: number, format: double, minimum: 0}
        scoringType:
          type: string
          enum: [ALL_OR_NOTHING, PROPORTIONAL_WITH_PENALTY, PROPORTIONAL_WITHOUT_PENALTY]
        randomizeOrder: {type: boolean}
        answerOptions:
          type: array
          items: {$ref: '#/components/schemas/AnswerOptionFromEditor'}
          minItems: 1
        singleChoice: {type: boolean}
        type:
          type: string
          default: multiple-choice
          enum: [multiple-choice]
    DropLocation:
      type: object
      properties:
        id: {type: integer, format: int64}
        posX: {type: number, format: double}
        posY: {type: number, format: double}
        width: {type: number, format: double}
        height: {type: number, format: double}
        invalid: {type: boolean}
    LeaderboardSetting:
      type: object
      properties:
        showInLeaderboard: {type: boolean}
    Tokens:
      type: object
      description: Response containing consistency check tokens
      properties:
        prompt: {type: integer, format: int64, description: Prompt token length, example: 10204}
        completion: {type: integer, format: int64, description: Completion token length,
          example: 3753}
        total: {type: integer, format: int64, description: Total token length, example: 13957}
    DragAndDropQuizQuestionWithSolution:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        text: {type: string}
        hint: {type: string}
        points: {type: number, format: double}
        scoringType:
          type: string
          enum: [ALL_OR_NOTHING, PROPORTIONAL_WITH_PENALTY, PROPORTIONAL_WITHOUT_PENALTY]
        randomizeOrder: {type: boolean}
        invalid: {type: boolean}
        type:
          type: string
          default: drag-and-drop
          enum: [drag-and-drop]
        explanation: {type: string}
        backgroundFilePath: {type: string}
        dropLocations:
          type: array
          items: {$ref: '#/components/schemas/DropLocation'}
        dragItems:
          type: array
          items: {$ref: '#/components/schemas/DragItem'}
        correctMappings:
          type: array
          items: {$ref: '#/components/schemas/DragAndDropMapping'}
      required: [type]
    AssessmentCriteriaGenerationRequest:
      type: object
      description: Context used to generate structured assessment criteria
      properties:
        problemStatement: {type: string, description: Current problem statement, maxLength: 50000,
          minLength: 0}
        maxPoints: {type: number, format: double, description: Maximum regular score,
          minimum: 0}
        bonusPoints: {type: number, format: double, description: Maximum bonus score,
          minimum: 0}
        gradingInstructions: {type: string, description: General assessment instructions,
          maxLength: 50000, minLength: 0}
        exampleSolution: {type: string, description: 'Current example solution, if
            available', maxLength: 200000, minLength: 0}
        additionalContext: {type: string, description: Optional exercise-specific
            context appended to the default prompt, maxLength: 200000, minLength: 0}
      required: [bonusPoints, maxPoints, problemStatement]
    QuizExerciseWithStatistics:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        shortName: {type: string}
        releaseDate: {type: string, format: date-time}
        startDate: {type: string, format: date-time}
        dueDate: {type: string, format: date-time}
        assessmentDueDate: {type: string, format: date-time}
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        visibleToStudents: {type: boolean}
        course: {$ref: '#/components/schemas/CourseForQuizExercise'}
        type: {type: string}
        randomizeQuestionOrder: {type: boolean}
        allowedNumberOfAttempts: {type: integer, format: int32}
        remainingNumberOfAttempts: {type: integer, format: int32}
        quizMode:
          type: string
          enum: [SYNCHRONIZED, BATCHED, INDIVIDUAL]
        duration: {type: integer, format: int32}
        quizBatches:
          type: array
          items: {$ref: '#/components/schemas/QuizBatch'}
          uniqueItems: true
        quizStarted: {type: boolean}
        quizEnded: {type: boolean}
        includedInOverallScore:
          type: string
          enum: [INCLUDED_COMPLETELY, INCLUDED_AS_BONUS, NOT_INCLUDED]
        mode:
          type: string
          enum: [INDIVIDUAL, TEAM]
        maxPoints: {type: number, format: double}
        bonusPoints: {type: number, format: double}
        exerciseVariantGroup: {$ref: '#/components/schemas/ExerciseVariantGroupReference'}
        quizQuestions:
          type: array
          items: {$ref: '#/components/schemas/QuizQuestionWithStatistics'}
        categories:
          type: array
          items: {type: string}
          uniqueItems: true
        quizPointStatistic: {$ref: '#/components/schemas/QuizPointStatistic'}
        competencyLinks:
          type: array
          items: {$ref: '#/components/schemas/CompetencyExerciseLink'}
          uniqueItems: true
        gradingCriteria:
          type: array
          items: {$ref: '#/components/schemas/GradingCriterion'}
          uniqueItems: true
        channelName: {type: string}
        testRunParticipationsExist: {type: boolean}
        isEditable: {type: boolean}
    DragAndDropSubmittedAnswerBeforeEvaluation:
      type: object
      properties:
        id: {type: integer, format: int64}
        quizQuestion: {$ref: '#/components/schemas/QuizQuestionWithoutSolution'}
        mappings:
          type: array
          items: {$ref: '#/components/schemas/DragAndDropMapping'}
          uniqueItems: true
        type:
          type: string
          default: drag-and-drop
          enum: [drag-and-drop]
      required: [type]
    ProblemStatementRewriteResponse:
      type: object
      description: Response containing rewritten problem statement
      properties:
        rewrittenText: {type: string, description: Improved problem statement text}
        improved: {type: boolean, description: Whether the text was actually improved,
          example: true}
      required: [improved, rewrittenText]
    UpdateQuizExercise:
      type: object
      properties:
        title: {type: string}
        channelName: {type: string}
        categories:
          type: array
          items: {type: string}
          uniqueItems: true
        competencyLinks:
          type: array
          items: {$ref: '#/components/schemas/CompetencyLink'}
          uniqueItems: true
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        duration: {type: integer, format: int32}
        randomizeQuestionOrder: {type: boolean}
        quizMode:
          type: string
          enum: [SYNCHRONIZED, BATCHED, INDIVIDUAL]
        quizBatches:
          type: array
          items: {$ref: '#/components/schemas/QuizBatchFromEditor'}
          uniqueItems: true
        releaseDate: {type: string, format: date-time}
        startDate: {type: string, format: date-time}
        dueDate: {type: string, format: date-time}
        includedInOverallScore:
          type: string
          enum: [INCLUDED_COMPLETELY, INCLUDED_AS_BONUS, NOT_INCLUDED]
        quizQuestions:
          type: array
          items: {$ref: '#/components/schemas/QuizQuestionFromEditor'}
    QuizSubmissionAfterEvaluation:
      type: object
      properties:
        id: {type: integer, format: int64}
        submissionExerciseType: {type: string}
        submitted: {type: boolean}
        type:
          type: string
          enum: [MANUAL, TIMEOUT, TEST, OTHER, INSTRUCTOR, EXTERNAL]
        submissionDate: {type: string, format: date-time}
        scoreInPoints: {type: number, format: double}
        submittedAnswers:
          type: array
          items: {$ref: '#/components/schemas/SubmittedAnswerAfterEvaluation'}
          uniqueItems: true
        results:
          type: array
          items: {$ref: '#/components/schemas/ResultAfterEvaluation'}
    ChannelSubTypeReferenceDates:
      type: object
      properties:
        channelId: {type: integer, format: int64}
        startDate: {type: string, format: date-time}
        endDate: {type: string, format: date-time}
    GradingCriterion:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        structuredGradingInstructions:
          type: array
          items: {$ref: '#/components/schemas/GradingInstruction'}
          uniqueItems: true
    DragAndDropQuizQuestionWithoutSolution:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        text: {type: string}
        hint: {type: string}
        points: {type: number, format: double}
        scoringType:
          type: string
          enum: [ALL_OR_NOTHING, PROPORTIONAL_WITH_PENALTY, PROPORTIONAL_WITHOUT_PENALTY]
        randomizeOrder: {type: boolean}
        invalid: {type: boolean}
        type:
          type: string
          default: drag-and-drop
          enum: [drag-and-drop]
        backgroundFilePath: {type: string}
        dropLocations:
          type: array
          items: {$ref: '#/components/schemas/DropLocation'}
        dragItems:
          type: array
          items: {$ref: '#/components/schemas/DragItem'}
      required: [type]
    MultipleChoiceQuestionReEvaluate:
      required: [answerOptions, id, invalid, randomizeOrder, scoringType, title, type]
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string, minLength: 1}
        scoringType:
          type: string
          enum: [ALL_OR_NOTHING, PROPORTIONAL_WITH_PENALTY, PROPORTIONAL_WITHOUT_PENALTY]
        randomizeOrder: {type: boolean}
        invalid: {type: boolean}
        text: {type: string}
        hint: {type: string}
        explanation: {type: string}
        answerOptions:
          type: array
          items: {$ref: '#/components/schemas/AnswerOptionReEvaluate'}
          minItems: 1
        type:
          type: string
          default: multiple-choice
          enum: [multiple-choice]
    Student:
      type: object
      properties:
        login: {type: string, maxLength: 50, minLength: 0}
        firstName: {type: string, maxLength: 50, minLength: 0}
        lastName: {type: string, maxLength: 50, minLength: 0}
        registrationNumber: {type: string, maxLength: 10, minLength: 0}
        email: {type: string, format: email, maxLength: 100, minLength: 0}
        isTestUser: {type: boolean}
    DragItem:
      type: object
      properties:
        id: {type: integer, format: int64}
        pictureFilePath: {type: string}
        text: {type: string}
        invalid: {type: boolean}
    DragAndDropMappingFromLiveClient:
      type: object
      properties:
        dragItem: {$ref: '#/components/schemas/EntityIdRef'}
        dropLocation: {$ref: '#/components/schemas/EntityIdRef'}
    DragItemFromEditor:
      type: object
      properties:
        id: {type: integer, format: int64}
        tempID: {type: integer, format: int64}
        text: {type: string}
        pictureFilePath: {type: string}
    DragAndDropMappingFromEditor:
      type: object
      properties:
        id: {type: integer, format: int64}
        dragItemTempId: {type: integer, format: int64}
        dropLocationTempId: {type: integer, format: int64}
    AnswerCounter:
      type: object
      properties:
        answerId: {type: integer, format: int64}
        id: {type: integer, format: int64}
        ratedCounter: {type: integer, format: int32}
        unRatedCounter: {type: integer, format: int32}
    TutorialGroupDetailData:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        language: {type: string}
        isOnline: {type: boolean}
        tutorName: {type: string}
        tutorLogin: {type: string}
        tutorId: {type: integer, format: int64}
        tutorImageUrl: {type: string}
        capacity: {type: integer, format: int32}
        campus: {type: string}
        additionalInformation: {type: string}
        groupChannelId: {type: integer, format: int64}
        tutorChatId: {type: integer, format: int64}
        sessions:
          type: array
          items: {$ref: '#/components/schemas/TutorialGroupSession'}
      required: [id, isOnline, language, sessions, title, tutorId, tutorLogin, tutorName]
    DragAndDropSubmittedAnswerFromLiveClient:
      required: [type]
      type: object
      properties:
        quizQuestion: {$ref: '#/components/schemas/EntityIdRef'}
        mappings:
          type: array
          items: {$ref: '#/components/schemas/DragAndDropMappingFromLiveClient'}
          uniqueItems: true
        type:
