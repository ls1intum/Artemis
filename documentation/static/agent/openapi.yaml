components:
  schemas:
    CompetencyDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
    CompetencyLinkDTO:
      type: object
      properties:
        competency: {$ref: '#/components/schemas/CompetencyDTO'}
        weight: {type: number, format: double}
        generatedByAi: {type: boolean, readOnly: true}
    GradingCriterionDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        structuredGradingInstructions:
          type: array
          items: {$ref: '#/components/schemas/GradingInstructionDTO'}
    GradingInstructionDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        credits: {type: number, format: double}
        gradingScale: {type: string}
        instructionDescription: {type: string}
        feedback: {type: string}
        usageCount: {type: integer, format: int32}
    PlagiarismDetectionConfigDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        continuousPlagiarismControlEnabled: {type: boolean}
        continuousPlagiarismControlPostDueDateChecksEnabled: {type: boolean}
        continuousPlagiarismControlPlagiarismCaseStudentResponsePeriod: {type: integer,
          format: int32}
        similarityThreshold: {type: integer, format: int32}
        minimumScore: {type: integer, format: int32}
        minimumSize: {type: integer, format: int32}
    TeamAssignmentConfigDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        minTeamSize: {type: integer, format: int32}
        maxTeamSize: {type: integer, format: int32}
    UpdateTextExerciseDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        channelName: {type: string}
        shortName: {type: string}
        problemStatement: {type: string}
        categories:
          type: array
          items: {type: string}
          uniqueItems: true
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        maxPoints: {type: number, format: double}
        bonusPoints: {type: number, format: double}
        includedInOverallScore:
          type: string
          enum: [INCLUDED_COMPLETELY, INCLUDED_AS_BONUS, NOT_INCLUDED]
        allowComplaintsForAutomaticAssessments: {type: boolean}
        presentationScoreEnabled: {type: boolean}
        secondCorrectionEnabled: {type: boolean}
        gradingInstructions: {type: string}
        releaseDate: {type: string, format: date-time}
        startDate: {type: string, format: date-time}
        dueDate: {type: string, format: date-time}
        assessmentDueDate: {type: string, format: date-time}
        exampleSolutionPublicationDate: {type: string, format: date-time}
        exampleSolution: {type: string}
        courseId: {type: integer, format: int64}
        exerciseGroupId: {type: integer, format: int64}
        mode:
          type: string
          enum: [INDIVIDUAL, TEAM]
        teamAssignmentConfig: {$ref: '#/components/schemas/TeamAssignmentConfigDTO'}
        gradingCriteria:
          type: array
          items: {$ref: '#/components/schemas/GradingCriterionDTO'}
        competencyLinks:
          type: array
          items: {$ref: '#/components/schemas/CompetencyLinkDTO'}
          uniqueItems: true
        plagiarismDetectionConfig: {$ref: '#/components/schemas/PlagiarismDetectionConfigDTO'}
    AssessmentNoteDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        note: {type: string}
    CourseDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        accuracyOfScores: {type: integer, format: int32}
    CourseForQuizExerciseDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        description: {type: string}
        shortName: {type: string}
        startDate: {type: string, format: date-time}
        endDate: {type: string, format: date-time}
        enrollmentStartDate: {type: string, format: date-time}
        enrollmentEndDate: {type: string, format: date-time}
        unenrollmentEndDate: {type: string, format: date-time}
        semester: {type: string}
        testCourse: {type: boolean}
        language:
          type: string
          enum: [ENGLISH, GERMAN]
        defaultProgrammingLanguage:
          type: string
          enum: [EMPTY, JAVA, PYTHON, C, HASKELL, KOTLIN, VHDL, ASSEMBLER, SWIFT,
            OCAML, JAVASCRIPT, C_SHARP, C_PLUS_PLUS, SQL, R, TYPESCRIPT, RUST, GO,
            MATLAB, BASH, RUBY, POWERSHELL, ADA, DART, PHP]
        onlineCourse: {type: boolean}
        courseInformationSharingConfiguration:
          type: string
          enum: [DISABLED, COMMUNICATION_AND_MESSAGING, COMMUNICATION_ONLY]
        maxComplaints: {type: integer, format: int32}
        maxTeamComplaints: {type: integer, format: int32}
        maxComplaintTimeDays: {type: integer, format: int32}
        maxRequestMoreFeedbackTimeDays: {type: integer, format: int32}
        maxComplaintTextLimit: {type: integer, format: int32}
        maxComplaintResponseTextLimit: {type: integer, format: int32}
        complaintsEnabled: {type: boolean}
        requestMoreFeedbackEnabled: {type: boolean}
        accuracyOfScores: {type: integer, format: int32}
        athenaGradingFeedbackEnabled: {type: boolean}
        athenaFormativeFeedbackEnabled: {type: boolean}
    ExamReferenceDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        testExam: {type: boolean}
        publishResultsDate: {type: string, format: date-time}
        exampleSolutionPublicationDate: {type: string, format: date-time}
        numberOfCorrectionRoundsInExam: {type: integer, format: int32}
        course: {$ref: '#/components/schemas/CourseForQuizExerciseDTO'}
    ExampleSubmissionDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        usedForTutorial: {type: boolean}
        submission: {$ref: '#/components/schemas/TextSubmissionResponseDTO'}
    ExerciseVariantGroupReferenceDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        maxPoints: {type: number, format: double}
        releaseDate: {type: string, format: date-time}
        startDate: {type: string, format: date-time}
        dueDate: {type: string, format: date-time}
        assessmentDueDate: {type: string, format: date-time}
        exampleSolutionPublicationDate: {type: string, format: date-time}
    FeedbackDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        text: {type: string}
        detailText: {type: string}
        hasLongFeedbackText: {type: boolean}
        reference: {type: string}
        credits: {type: number, format: double}
        positive: {type: boolean}
        type:
          type: string
          enum: [MANUAL, MANUAL_UNREFERENCED, AUTOMATIC_ADAPTED, AUTOMATIC]
        visibility:
          type: string
          enum: [ALWAYS, AFTER_DUE_DATE, NEVER]
        gradingInstruction: {$ref: '#/components/schemas/GradingInstructionDTO'}
        testCase: {$ref: '#/components/schemas/TestCaseDTO'}
    ParticipationDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        testRun: {type: boolean}
        type: {type: string}
        initializationState:
          type: string
          enum: [UNINITIALIZED, REPO_COPIED, REPO_CONFIGURED, INACTIVE, BUILD_PLAN_COPIED,
            BUILD_PLAN_CONFIGURED, INITIALIZED, FINISHED]
        submissionCount: {type: integer, format: int32}
        exercise: {$ref: '#/components/schemas/ParticipationExerciseDTO'}
    ParticipationExerciseDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        exerciseType:
          type: string
          enum: [text, programming, modeling, file-upload, quiz]
        type: {type: string}
        assessmentType:
          type: string
          enum: [AUTOMATIC, SEMI_AUTOMATIC, MANUAL, AUTOMATIC_ATHENA]
        dueDate: {type: string, format: date-time}
        assessmentDueDate: {type: string, format: date-time}
        maxPoints: {type: number, format: double}
        course: {$ref: '#/components/schemas/CourseDTO'}
    ParticipationSubmissionDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        submitted: {type: boolean}
        submissionDate: {type: string, format: date-time}
        submissionExerciseType: {type: string}
        commitHash: {type: string}
        text: {type: string}
        language:
          type: string
          enum: [ENGLISH, GERMAN]
        model: {type: string}
        explanationText: {type: string}
        filePath: {type: string}
        results:
          type: array
          items: {$ref: '#/components/schemas/ParticipationSubmissionResultDTO'}
    ParticipationSubmissionResultDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        completionDate: {type: string, format: date-time}
        successful: {type: boolean}
        score: {type: number, format: double}
        rated: {type: boolean}
        assessmentType:
          type: string
          enum: [AUTOMATIC, SEMI_AUTOMATIC, MANUAL, AUTOMATIC_ATHENA]
        testCaseCount: {type: integer, format: int32}
        passedTestCaseCount: {type: integer, format: int32}
        codeIssueCount: {type: integer, format: int32}
    ResultDTO:
      type: object
      properties:
        id: {type: integer, format: int64}
        completionDate: {type: string, format: date-time}
        successful: {type: boolean}
        score: {type: number, format: double}
        rated: {type: boolean}
        submission: {$ref: '#/components/schemas/SubmissionDTO'}
        participation: {$ref: '#/components/schemas/ParticipationDTO'}
        feedbacks:
          type: array
          items: {$ref: '#/components/schemas/FeedbackDTO'}
        assessmentType:
          type: string
          enum: [AUTOMATIC, SEMI_AUTOMATIC, MANUAL, AUTOMATIC_ATHENA]
        correctionRound: {type: integer, format: int32}
