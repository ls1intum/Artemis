openapi: 3.1.0
info: {title: Artemis API for coding agents, description: 'The part of the Artemis
    REST API that a personal access token can call. Create a token in User Settings
    under Agent Access and send it as `Authorization: Bearer art_pat_...`. A token
    acts as its owner, with at most the owner''s role in each course, and only on
    operations whose scopes it holds. Exercises and lecture units created through
    this API get a release date in the future, which publishes them on its own, so
    a person must review them before it. Announcements, lectures and competencies
    are visible to students at once.', version: '1'}
servers:
- {url: 'https://artemis.example.org', description: Replace with the address of your
    Artemis instance.}
security:
- personalAccessToken: []
paths:
  /api/text/text-exercises:
    put:
      tags: [text-exercise-creation-update-resource]
      summary: Update a text exercise
      description: Replaces the editable fields of an existing text exercise, so send
        the whole exercise. A request with a personal access token can change only
        an exercise that students cannot see yet (its releaseDate is in the future),
        and the change must keep releaseDate in the future. Published exercises can
        be changed only in the Artemis web interface.
      operationId: updateTextExercise
      parameters:
      - name: notificationText
        in: query
        required: false
        schema: {type: string}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTextExerciseDTO'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TextExerciseResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
    post:
      tags: [text-exercise-creation-update-resource]
      summary: Create a text exercise
      description: Creates a text exercise in a course (set courseId; exercise groups
        of exams are not available to tokens). A request with a personal access token
        must set releaseDate to a time in the future, so the exercise stays a draft
        until a person publishes it in the Artemis web interface. title, maxPoints,
        includedInOverallScore and courseId are required.
      operationId: createTextExercise
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTextExerciseDTO'}
        required: true
      responses:
        '201':
          description: The exercise was created as a draft.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TextExerciseResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/programming/programming-exercises:
    put:
      tags: [programming-exercise-update-resource]
      summary: Update a programming exercise
      description: 'Replaces the editable settings of an existing programming exercise,
        so send the whole exercise: omitted flags reset to false. shortName, staticCodeAnalysisEnabled,
        the checkout paths and the course cannot be changed. A request with a personal
        access token can change only an exercise that students cannot see yet (its
        releaseDate is in the future) and that has no student participations, and
        the change must keep releaseDate in the future. Anything else can be changed
        only in the Artemis web interface.'
      operationId: updateProgrammingExercise
      parameters:
      - name: notificationText
        in: query
        required: false
        schema: {type: string}
      - name: hyperionCompetencyId
        in: query
        required: false
        schema: {type: array, maxItems: 100}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateProgrammingExerciseDTO'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgrammingExerciseResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/programming/programming-exercises/timeline:
    put:
      tags: [programming-exercise-partial-update-resource]
      summary: Change the dates of a programming exercise
      description: 'Changes the release, start and due dates of a programming exercise.
        A request with a personal access token can change only an exercise that students
        cannot see yet and that has no student participations, and releaseDate must
        stay in the future: publishing happens only in the Artemis web interface.'
      operationId: updateProgrammingExerciseTimeline
      parameters:
      - name: notificationText
        in: query
        required: false
        schema: {type: string}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProgrammingExerciseTimelineUpdateDTO'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgrammingExerciseResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/modeling/modeling-exercises:
    put:
      tags: [modeling-exercise-resource]
      summary: Update a modeling exercise
      description: Replaces the editable fields of an existing modeling exercise,
        so send the whole exercise. A request with a personal access token can change
        only an exercise that students cannot see yet (its releaseDate is in the future),
        and the change must keep releaseDate in the future. Published exercises can
        be changed only in the Artemis web interface.
      operationId: updateModelingExercise
      parameters:
      - name: notificationText
        in: query
        required: false
        schema: {type: string}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateModelingExerciseDTO'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelingExerciseResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
    post:
      tags: [modeling-exercise-resource]
      summary: Create a modeling exercise
      description: Creates a modeling exercise in a course (set courseId; exercise
        groups of exams are not available to tokens). A request with a personal access
        token must set releaseDate to a time in the future, so the exercise stays
        a draft until a person publishes it in the Artemis web interface. title, diagramType,
        maxPoints, includedInOverallScore and courseId are required, and the diagram
        type cannot be changed later.
      operationId: createModelingExercise
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateModelingExerciseDTO'}
        required: true
      responses:
        '201':
          description: The exercise was created as a draft.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelingExerciseResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/atlas/courses/{courseId}/competencies:
    get:
      tags: [competency-resource]
      summary: List the competencies of a course
      description: Returns the competencies of the course. Each one carries the caller's
        own learning progress. Links to exercises and lecture units are not included;
        get a single competency for those.
      operationId: getCompetenciesWithProgress
      parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CourseCompetencyResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
    put:
      tags: [competency-resource]
      summary: Update a competency
      description: Replaces the editable fields of an existing competency. The id
        in the body identifies it, so send the full competency, not only the changed
        fields. Nothing is deleted.
      operationId: updateCompetency
      parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseCompetencyRequestDTO'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseCompetencyResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
    post:
      tags: [competency-resource]
      summary: Create a competency
      description: Creates a competency in the course. The title (at most 255 characters)
        and the mastery threshold are required. To link the competency to lecture
        units or exercises, set competencyLinks on those objects; this endpoint does
        not link anything.
      operationId: createCompetency
      parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CourseCompetencyRequestDTO'}
        required: true
      responses:
        '201':
          description: The competency was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseCompetencyResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/programming/programming-exercises/setup:
    post:
      tags: [programming-exercise-creation-resource]
      summary: Create a programming exercise
      description: 'Creates a programming exercise with its template, solution and
        test repositories and its build plan. This takes a while. A request with a
        personal access token must set releaseDate to a time in the future, so the
        exercise stays a draft until a person publishes it in the Artemis web interface.
        Required: title, shortName (unique in the course), course (with its id), programmingLanguage,
        buildConfig, staticCodeAnalysisEnabled, maxPoints and at least one of allowOnlineEditor,
        allowOfflineIde and allowOnlineIde. A language with project types also needs
        projectType, and Java and Kotlin need packageName. To edit the code, clone
        the repositories with git, using your VCS access token from the user settings.'
      operationId: createProgrammingExercise
      parameters:
      - name: emptyRepositories
        in: query
        required: false
        schema: {type: boolean, default: false}
      - name: hyperionCompetencyId
        in: query
        required: false
        schema:
          type: array
          items: {type: integer, format: int64}
          uniqueItems: true
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProgrammingExerciseDTO'}
        required: true
      responses:
        '201':
          description: The exercise and its repositories were created as a draft.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgrammingExerciseResponseDTO'}
        '500':
          description: The repositories or the build plan could not be set up. The
            exercise may be partly created, so check the course before retrying.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgrammingExerciseResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/lecture/lectures:
    post:
      tags: [lecture-resource]
      summary: Create a lecture
      description: 'Creates an empty lecture in a course (set course with its id).
        title is required; startDate, if set, must not be after endDate. A lecture
        has no release date of its own: what students see are its units, so add units
        with a releaseDate in the future to keep the content a draft. channelName
        names the lecture''s communication channel and is derived from the title if
        omitted.'
      operationId: createLecture
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimpleLectureDTO'}
        required: true
      responses:
        '201':
          description: The lecture was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimpleLectureDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/lecture/lectures/{lectureId}/attachment-video-units:
    post:
      tags: [attachment-video-unit-resource]
      summary: Add a unit with slides or a video to a lecture
      description: 'Adds an attachment video unit to a lecture. Send multipart/form-data
        with the part attachmentVideoUnit (JSON: name, releaseDate, description, videoSource),
        and for slides the part attachment (JSON: name, attachmentType FILE, releaseDate)
        together with the part file (the PDF). A request with a personal access token
        must set releaseDate to a time in the future, on the unit and on the attachment,
        so the unit stays a draft until a person publishes it in the Artemis web interface.
        The unit is returned at once; splitting the PDF into slides and indexing it
        for Iris continue in the background, and their progress is reported by the
        lecture unit status endpoint.'
      operationId: createAttachmentVideoUnit
      parameters:
      - name: lectureId
        in: path
        required: true
        schema: {type: integer, format: int64}
      - name: keepFilename
        in: query
        required: false
        schema: {type: boolean, default: false}
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                attachmentVideoUnit: {$ref: '#/components/schemas/AttachmentVideoUnitDTO'}
                attachment: {$ref: '#/components/schemas/AttachmentDTO'}
                file: {type: string, format: binary}
              required: [attachmentVideoUnit]
      responses:
        '201':
          description: The unit was created as a draft.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AttachmentVideoUnitDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/communication/courses/{courseId}/announcements:
    post:
      tags: [conversation-message-resource]
      summary: Post an announcement to a course
      description: Posts a message to the course's announcement channel (the default
        one unless channelId is given). Students are notified immediately and the
        post is visible at once, so confirm the text with the instructor before calling
        this. Requires at least the instructor role in the course.
      operationId: createAnnouncement
      parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAnnouncementDTO'}
        required: true
      responses:
        '201':
          description: The announcement was posted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostResponseDTO'}
        '400':
          description: The channel is not an announcement channel of the course, or
            the course has no default announcement channel.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PostResponseDTO'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/atlas/courses/{courseId}/course-competencies/relations:
    get:
      tags: [course-competency-resource]
      summary: List the relations between competencies
      description: 'Returns the edges of the competency graph of the course: tail,
        head and relation type, by competency id.'
      operationId: getCompetencyRelations
      parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CompetencyRelationDTO'}
                uniqueItems: true
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
    post:
      tags: [course-competency-resource]
      summary: Create a relation between two competencies
      description: Adds an edge to the competency graph. Tail and head must be competencies
        of this course. The request is rejected with 400 if the relation type is missing
        or the relation would create a circular dependency.
      operationId: createCompetencyRelation
      parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CompetencyRelationDTO'}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompetencyRelationDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/atlas/courses/{courseId}/competencies/import-standardized:
    post:
      tags: [competency-resource]
      summary: Import standardized competencies
      description: Adds competencies from the catalogue of standardized competencies
        to the course. The body is a list of catalogue ids.
      operationId: importStandardizedCompetencies
      parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items: {type: integer, format: int64}
        required: true
      responses:
        '201':
          description: The competencies were imported.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CompetencyImportResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/atlas/courses/{courseId}/competencies/bulk:
    post:
      tags: [competency-resource]
      summary: Create several competencies
      description: Creates all given competencies in one request. The request is rejected
        as a whole if one of them is invalid.
      operationId: createCompetencies
      parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items: {$ref: '#/components/schemas/CourseCompetencyRequestDTO'}
        required: true
      responses:
        '201':
          description: The competencies were created.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CourseCompetencyResponseDTO'}
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/programming/programming-exercises/{exerciseId}/update-test-cases:
    patch:
      tags: [programming-exercise-test-case-resource]
      summary: Set the weights and visibility of test cases
      description: Changes weight, bonusMultiplier, bonusPoints and visibility of
        existing test cases, identified by id. Test cases themselves come from the
        tests in the test repository when the build runs; they cannot be created here.
        A request with a personal access token can change only an exercise that students
        cannot see yet and that has no student participations.
      operationId: updateTestCases
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items: {$ref: '#/components/schemas/ProgrammingExerciseTestCaseDTO'}
              uniqueItems: true
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProgrammingExerciseTestCaseResponseDTO'}
                uniqueItems: true
        '400': {description: 'The request is invalid. The body is an RFC 7807 problem
            document with a message and, for validation errors, a list of fieldErrors.'}
        '401': {description: 'The token is missing, unknown, expired or revoked, or
            its owner is an administrator.'}
        '403': {description: 'The token lacks a scope this operation needs, or its
            owner lacks the required role in the course.'}
        '404': {description: 'The course or object does not exist, or is not visible
            to the token''s owner.'}
  /api/programming/programming-exercises/{exerciseId}/problem-statement:
    patch:
      tags: [programming-exercise-partial-update-resource]
      summary: Replace the problem statement of a programming exercise
      description: The request body is the new problem statement as plain Markdown
        text, not JSON. Test cases are referenced in tasks as [task][Task name](testName1,testName2).
        A request with a personal access token can change only an exercise that students
        cannot see yet and that has no student participations.
      operationId: updateProblemStatement
      parameters:
      - name: exerciseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      - name: notificationText
        in: query
        required: false
        schema: {type: string}
      requestBody:
        content:
          text/plain:
            schema: {type: string}
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgrammingExerciseResponseDTO'}
