# pnpm 11+ install/resolution settings for the documentation/ subproject.
# Default isolated layout: no hoist shim. Source patches are applied via
# `patchedDependencies` below (works on the .pnpm symlink store directly).

# image-size 2.0.2 is the last release its authors ever published: the upstream repository
# was archived read-only on 2026-06-03 with the fix PR unmerged, so GHSA-5p2g-fcmc-qvqq and
# GHSA-w3rx-r6r6-pgpr have no patched version to upgrade to. The package is not optional
# here - @docusaurus/mdx-loader calls it through remark/transformImage to size every local
# image in the docs - so we ship the upstream fix ourselves. The patch adds the missing
# forward-progress guards to the ICNS, HEIF and JXL parsers, whose cursors advance by a
# length field read straight out of the file and therefore never move when a crafted image
# sets that field to zero. Regenerate with `pnpm patch image-size@2.0.2` if it ever moves.
patchedDependencies:
  image-size@2.0.2: patches/image-size@2.0.2.patch

preferFrozenLockfile: true
enablePrePostScripts: true
autoInstallPeers: true

# Dependency overrides. pnpm 11 reads overrides from this file in preference to
# `pnpm.overrides` in package.json. Pinned versions address CVE advisories on
# transitive deps (serialize-javascript GHSA-qj8w-gfj5-8c6v, uuid
# GHSA-w5hq-g745-h8pq) and align other shared transitives across the docs and
# root pnpm projects.
overrides:
  '@babel/core': '7.29.7'
  '@babel/plugin-transform-modules-systemjs': '7.29.8'
  # Kept on the 1.x line (docs' express 4 stack requires ^1).
  body-parser: '1.20.6'
  brace-expansion: '5.0.9'
  # Must stay >= 4.28.7, which fixed CVE-2026-73088 and CVE-2026-73089. Reached through @babel/core's
  # helper-compilation-targets, whose range allows this. Build-time tooling only, never served.
  browserslist: '4.28.8'
  # Kept on the 3.x line (consumers require ^3); 4.x is an API break.
  # Must stay >= 3.1.6, which fixed CVE-2026-76172, CVE-2026-75899, CVE-2026-75975
  # and CVE-2026-75931 (host confusion / SSRF via URI normalization).
  fast-uri: '3.1.7'
  follow-redirects: '1.16.0'
  http-proxy-middleware: '3.0.7'
  joi: '17.13.7'
  # Kept on the 4.x line (consumers require ^4; 5.x is an API break).
  js-yaml: '4.3.2'
  launch-editor: '2.14.1'
  minimatch: '10.2.6'
  # Reached via postcss, whose range allows the patched release pinned here
  # (GHSA: custom generators can loop indefinitely when size is zero).
  nanoid: '3.3.18'
  postcss: '8.5.27'
  # CVE-2026-9358 (DoS through uncontrolled AST recursion). Two majors are reachable
  # in the docs tree, so both lines are pinned to their patched release.
  'postcss-selector-parser@6': '6.1.4'
  'postcss-selector-parser@7': '7.1.5'
  # Must stay >= 6.16.0, which fixed CVE-2026-82417 (DoS via attacker-controlled isBuffer)
  # and CVE-2026-82562 (array-limit bypass via bracket-key comma parsing).
  qs: '6.16.0'
  serialize-javascript: '7.1.1'
  shell-quote: '1.10.0'
  # Kept on the 3.x line (docs' SVG toolchain requires ^3).
  svgo: '3.3.5'
  undici: '7.29.0'
  uuid: '14.0.2'
  webpack: '5.110.3'
  # Kept on the 5.x line (docs' webpack tooling requires ^5; 6.x is an API break).
  webpack-dev-server: '5.2.6'
  websocket-driver: '0.7.5'
  'ws@>=7.0.0 <7.5.11': '7.5.11'
  'ws@>=8.0.0 <8.21.1': '8.21.1'

allowBuilds:
  '@swc/core': true
  core-js: true
  core-js-pure: true
  esbuild: true

