# pnpm 11+ install/resolution settings for the documentation/ subproject.
# Default isolated layout: no hoist shim. The gray-matter patch is applied
# via `patchedDependencies` below (works on the .pnpm symlink store directly).

preferFrozenLockfile: true
enablePrePostScripts: true
autoInstallPeers: true

# Dependency overrides. pnpm 11 reads overrides from this file in preference to
# `pnpm.overrides` in package.json. Pinned versions address CVE advisories on
# transitive deps (serialize-javascript GHSA-qj8w-gfj5-8c6v, uuid
# GHSA-w5hq-g745-h8pq) and align other shared transitives across the docs and
# root pnpm projects.
overrides:
    '@babel/core': '7.29.7'
    '@babel/plugin-transform-modules-systemjs': '7.29.4'
    # CVE-2026-12590 (GHSA-v422-hmwv-36x6): DoS when an invalid limit disables size enforcement.
    # Kept on the 1.x line (docs' express 4 stack requires ^1).
    body-parser: '1.20.6'
    # CVE-2026-13676 / CVE-2026-16221: fast-uri host confusion (kept on the 3.x line).
    fast-uri: '3.1.4'
    follow-redirects: '1.16.0'
    http-proxy-middleware: '3.0.7'
    joi: '17.13.4'
    # CVE-2026-59869 (GHSA-52cp-r559-cp3m): quadratic CPU via YAML merge-key chains (kept on 4.x).
    js-yaml: '4.3.0'
    launch-editor: '2.14.1'
    minimatch: '10.2.5'
    qs: '6.15.2'
    serialize-javascript: '7.0.5'
    # CVE-2026-13311 (GHSA-395f-4hp3-45gv): quadratic-complexity DoS in shell-quote parse().
    shell-quote: '1.10.0'
    # GHSA-2p49-hgcm-8545: SVGO removeScripts plugin leaves some executable scripts intact (kept on 3.x).
    svgo: '3.3.4'
    undici: '7.28.0'
    uuid: '14.0.0'
    webpack: '5.106.2'
    # CVE-2026-14620/14631: webpack-dev-server CSRF + DoS (kept on the 5.x line).
    webpack-dev-server: '5.2.6'
    # CVE-2026-54466/54490 (GHSA-xv26-6w52-cph6 / GHSA-mp7j-qc5w-4988): message corruption /
    # resource-limit bypass via protocol length headers and compression.
    websocket-driver: '0.7.5'
    'ws@>=7.0.0 <7.5.11': '7.5.11'
    'ws@>=8.0.0 <8.21.0': '8.21.0'

patchedDependencies:
    'gray-matter@4.0.3': 'patches/gray-matter+4.0.3.patch'

allowBuilds:
    '@swc/core': true
    core-js: true
    core-js-pure: true
    esbuild: true
