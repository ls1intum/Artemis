<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1141 714" width="1141" height="714" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Query report of the end-to-end tests (UML deployment diagram)</title><desc id="d">On the CI runner, the Playwright tests send requests to the Artemis server, which accesses PostgreSQL. In the server, the query listener passes every statement to the query collector. The report formatter takes the query report that the tests fetch from the server, the results of the static query scanner and the develop baseline from GitHub. It writes an HTML report and the comments of the pull request.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="1141" height="714" fill="#ffffff"/><rect x="10" y="10" width="1121" height="694" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 140.72,10 140.72,24 128.72,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Query Report</text><polygon points="30,50 42,38 1117,38 1105,50" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="1105,50 1117,38 1117,468 1105,480" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="30" y="50" width="1075" height="430" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="40" y="70" font-size="13" font-weight="700" text-anchor="start" fill="#000000">CI Runner</text><rect x="50" y="134" width="185" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="142.5" y="162" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«container»</text><text x="142.5" y="179" font-size="13" font-weight="700" text-anchor="middle" fill="#000000">Playwright Tests</text><rect x="345" y="90" width="217" height="230" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="453.5" y="107" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«container»</text><text x="453.5" y="124" font-size="13" font-weight="700" text-anchor="middle" fill="#000000">Artemis Server</text><rect x="365" y="134" width="177" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="510" y="143" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="504" y="145.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="504" y="151.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="377" y="160" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Query Listener</text><text x="377" y="179" font-size="11" font-weight="400" text-anchor="start" fill="#000000">every SQL statement</text><rect x="365" y="234" width="177" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="510" y="243" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="504" y="245.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="504" y="251.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="377" y="260" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Query Collector</text><text x="377" y="279" font-size="11" font-weight="400" text-anchor="start" fill="#000000">repeats per request</text><polyline points="453,200 453,234" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#open)"/><rect x="662" y="134" width="137" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="730.5" y="162" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«container»</text><text x="730.5" y="179" font-size="13" font-weight="700" text-anchor="middle" fill="#000000">PostgreSQL</text><polyline points="235,167 345,167" fill="none" stroke="#000000" stroke-width="1.4"/><text x="290.0" y="159" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«HTTP»</text><polyline points="562,167 662,167" fill="none" stroke="#000000" stroke-width="1.4"/><text x="612.0" y="159" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«JDBC»</text><rect x="50" y="390" width="698" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="399.0" y="418" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«script»</text><text x="399.0" y="435" font-size="13" font-weight="700" text-anchor="middle" fill="#000000">Report Formatter</text><rect x="868" y="390" width="217" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="976.5" y="418" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«script»</text><text x="976.5" y="435" font-size="13" font-weight="700" text-anchor="middle" fill="#000000">Static Query Scanner</text><polyline points="868,423 748,423" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="808.0" y="415" font-size="11" font-weight="400" text-anchor="middle" fill="#000000">findings</text><polyline points="142,200 142,390" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="152" y="299.0" font-size="11" font-weight="400" text-anchor="start" fill="#000000">query report</text><polygon points="30,560 42,548 1117,548 1105,560" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="1105,560 1117,548 1117,678 1105,690" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="30" y="560" width="1075" height="130" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="40" y="580" font-size="13" font-weight="700" text-anchor="start" fill="#000000">GitHub</text><rect x="50" y="604" width="206" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="153.0" y="624" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«artifact»</text><text x="153.0" y="641" font-size="13" font-weight="700" text-anchor="middle" fill="#000000">Query Baseline</text><text x="153.0" y="657" font-size="11" font-weight="400" text-anchor="middle" fill="#000000">keys of the latest develop run</text><polyline points="153,604 153,456" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="163" y="518" font-size="11" font-weight="400" text-anchor="start" fill="#000000">baseline</text><rect x="296" y="604" width="206" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="399.0" y="624" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«artifact»</text><text x="399.0" y="641" font-size="13" font-weight="700" text-anchor="middle" fill="#000000">HTML Report</text><text x="399.0" y="657" font-size="11" font-weight="400" text-anchor="middle" fill="#000000">all findings of the run</text><polyline points="399,456 399,604" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="409" y="518" font-size="11" font-weight="400" text-anchor="start" fill="#000000">full report</text><rect x="542" y="604" width="206" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="645.0" y="624" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«comments»</text><text x="645.0" y="641" font-size="13" font-weight="700" text-anchor="middle" fill="#000000">Pull Request</text><text x="645.0" y="657" font-size="11" font-weight="400" text-anchor="middle" fill="#000000">summary and inline comments</text><polyline points="645,456 645,604" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#open)"/><text x="655" y="518" font-size="11" font-weight="400" text-anchor="start" fill="#000000">new findings</text></svg>
