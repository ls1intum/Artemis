<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artemis server architecture</title><desc id="d">Layered server architecture. REST resources and websocket handlers in the web layer, services in the application layer, Spring Data repositories in the data layer, grouped in feature modules. LocalVC and LocalCI implement version control and continuous integration; the Jenkins module is deprecated.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs><rect width="1100" height="760" fill="#ffffff"/><text x="550" y="30" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Artemis server architecture</text><rect x="325" y="55" width="450" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="550.0" y="77" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Artemis Client</text><text x="550.0" y="97" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Angular: REST, WebSocket (STOMP), OpenAPI models</text><line x1="550" y1="111" x2="550" y2="150" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="30" y="150" width="1040" height="520" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="550" y="174" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Artemis Application Server</text><rect x="50" y="190" width="1000" height="100" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="70" y="212" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">Web layer</text><rect x="50" y="305" width="1000" height="175" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="70" y="327" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">Application layer (feature modules)</text><rect x="50" y="495" width="1000" height="90" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="70" y="517" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">Data layer</text><rect x="75" y="226" width="200" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="175.0" y="248" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">REST resources</text><text x="175.0" y="268" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">@RestController, role checks</text><rect x="295" y="226" width="200" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="395.0" y="248" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Websocket topics</text><text x="395.0" y="268" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">declared topic constants</text><rect x="515" y="226" width="200" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="615.0" y="248" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Git server</text><text x="615.0" y="268" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">LocalVC servlet + SSH</text><rect x="735" y="226" width="290" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="880.0" y="248" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Public / webhook endpoints</text><text x="880.0" y="268" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">LTI, results of external CI (Jenkins only)</text><rect x="75" y="334" width="195" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="172.5" y="356" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">account / core / admin</text><rect x="280" y="334" width="195" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="377.5" y="356" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">course / exercise / exam</text><rect x="485" y="334" width="175" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="572.5" y="356" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">programming exercises</text><rect x="670" y="334" width="190" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="765.0" y="356" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">assessment / plagiarism</text><rect x="870" y="334" width="165" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="952.5" y="356" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">quiz / text / modeling</text><rect x="75" y="376" width="215" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="182.5" y="398" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">communication / notification</text><rect x="300" y="376" width="185" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="392.5" y="398" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">lecture / tutorial groups</text><rect x="495" y="376" width="235" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="612.5" y="398" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">atlas / iris / athena / hyperion</text><rect x="740" y="376" width="215" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="847.5" y="398" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">LTI / SAML2 / OIDC / LDAP</text><rect x="75" y="418" width="400" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="275" y="439" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">localvc: LocalVCService (VersionControlService)</text><rect x="485" y="418" width="360" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="665" y="439" font-size="12" font-weight="400" fill="#1f2937" text-anchor="middle">localci: LocalCIService, trigger, result processing</text><rect x="855" y="418" width="170" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="940" y="439" font-size="12" font-weight="400" fill="#dc2626" text-anchor="middle">jenkins (removed in 11)</text><rect x="75" y="522" width="300" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="225.0" y="544" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Spring Data repositories</text><text x="225.0" y="564" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">transactions live here</text><rect x="395" y="522" width="300" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="545.0" y="544" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Distributed data access</text><text x="545.0" y="564" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">DistributedDataProvider</text><rect x="715" y="522" width="310" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="870.0" y="544" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Liquibase migrations</text><text x="870.0" y="564" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">baseline plus changelogs</text><line x1="550" y1="290" x2="550" y2="305" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><line x1="550" y1="480" x2="550" y2="495" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="60" y="690" width="190" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="712" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">PostgreSQL</text><text x="155.0" y="732" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">primary database</text><rect x="265" y="690" width="190" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="360.0" y="712" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">MySQL</text><text x="360.0" y="732" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">removed in Artemis 11</text><rect x="480" y="690" width="230" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="595.0" y="712" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Hazelcast / Redis</text><text x="595.0" y="732" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">shared cluster state</text><rect x="735" y="690" width="150" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="810.0" y="712" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Build agents</text><text x="810.0" y="732" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Docker, LocalCI</text><rect x="900" y="690" width="170" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="985.0" y="712" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Jenkins</text><text x="985.0" y="732" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">removed in Artemis 11</text><line x1="155" y1="690" x2="200" y2="574" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><line x1="360" y1="690" x2="280" y2="574" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)" marker-start="url(#a)"/><line x1="595" y1="690" x2="545" y2="574" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><line x1="810" y1="690" x2="700" y2="450" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><line x1="985" y1="690" x2="940" y2="450" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)" marker-start="url(#a)"/></svg>
