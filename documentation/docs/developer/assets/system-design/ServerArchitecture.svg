<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" width="1000" height="780" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artemis server architecture (UML component diagram)</title><desc id="d">The server has a web layer, an application layer and a data layer. The application layer consists of the feature modules and the integrated code lifecycle with LocalVC and LocalCI. The data layer accesses the database. LocalCI shares state with build agents through the distributed data provider.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="1000" height="780" fill="#ffffff"/><rect x="10" y="10" width="980" height="760" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 180.6,10 180.6,24 168.6,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Server Architecture</text><rect x="350" y="55" width="300" height="70" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="622" y="63" width="16" height="11" fill="#ffffff" stroke="#000000" stroke-width="1.1"/><rect x="618" y="65" width="8" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.1"/><rect x="618" y="70" width="8" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.1"/><text x="494.0" y="77" font-size="11" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«component»</text><text x="494.0" y="95" font-size="13" font-weight="700" font-style="normal" text-anchor="middle" fill="#000000">Artemis Client</text><rect x="60" y="175" width="880" height="440" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="912" y="183" width="16" height="11" fill="#ffffff" stroke="#000000" stroke-width="1.1"/><rect x="908" y="185