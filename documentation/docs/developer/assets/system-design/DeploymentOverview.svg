<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Typical Artemis deployment (UML deployment diagram)</title><desc id="d">User devices reach the reverse proxy, which forwards to the core nodes. Core nodes run the Artemis server with LocalVC and LocalCI. Build agent nodes run the build jobs in Docker containers. A database server hosts PostgreSQL, a distributed data server hosts Redis or Valkey, and a broker node relays websocket messages.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="1200" height="580" fill="#ffffff"/><rect x="10" y="10" width="1180" height="560" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 254.60000000000002,10 254.60000000000002,24 242.60000000000002,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">deployment</text><text x="106.0" y="29" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">Typical Deployment</text><polygon points="40,100 54,86 294,86 280,100" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="280,100 294,86 294,236 280,250" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="40" y="100" width="240" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="50" y="118" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="50" y="135" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">User Device</text><text x="272" y="118" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[0..*]</text><rect x="55" y="150" width="210" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="63" y="166" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="63" y="181" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Web Browser</text><rect x="55" y="200" width="210" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="63" y="216" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="63" y="231" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Git Client</text><polygon points="345,125 359,111 509,111 495,125" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="495,125 509,111 509,191 495,205" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="345" y="125" width="150" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="355" y="143" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="355" y="160" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Reverse Proxy</text><polyline points="294,165 345,165" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="297.4" y="144" width="45.2" height="14" fill="#ffffff"/><text x="320" y="154" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«HTTPS»</text><polygon points="600,80 614,66 904,66 890,80" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="890,80 904,66 904,328 890,342" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="600" y="80" width="290" height="262" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="610" y="98" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="610" y="115" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Core Node</text><text x="882" y="98" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[1..*]</text><rect x="615" y="128" width="260" height="112" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="623" y="144" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="623" y="159" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Artemis Server</text><text x="623" y="173" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">serves the client, REST API and websockets</text><text x="623" y="186" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">includes LocalVC and LocalCI</text><text x="623" y="199" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">one node also runs the scheduled tasks</text><rect x="615" y="254" width="260" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="623" y="270" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="623" y="285" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Hazelcast Member</text><text x="623" y="299" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">embedded in the node, if Hazelcast is the</text><text x="623" y="312" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">distributed data provider</text><polyline points="509,165 600,165" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="503.4" y="144" width="101.2" height="14" fill="#ffffff"/><text x="554" y="154" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«HTTP, WebSocket»</text><polygon points="965,80 979,66 1164,66 1150,80" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="1150,80 1164,66 1164,166 1150,180" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="965" y="80" width="185" height="100" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="975" y="98" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="975" y="115" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Database Server</text><rect x="980" y="128" width="155" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="988" y="144" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="988" y="159" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">PostgreSQL</text><polyline points="904,140 965,140" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="915.2" y="118" width="39.6" height="14" fill="#ffffff"/><text x="935" y="128" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«JDBC»</text><polygon points="965,205 979,191 1164,191 1150,205" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="1150,205 1164,191 1164,277 1150,291" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="965" y="205" width="185" height="86" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="975" y="223" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="975" y="240" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Distributed Data Server</text><text x="1142" y="223" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[0..1]</text><rect x="980" y="246" width="155" height="38" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="988" y="262" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="988" y="277" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Redis or Valkey</text><polyline points="904,262 965,262" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="912.4" y="240" width="45.2" height="14" fill="#ffffff"/><text x="935" y="250" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«Redis»</text><polygon points="965,316 979,302 1164,302 1150,316" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="1150,316 1164,302 1164,388 1150,402" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="965" y="316" width="185" height="86" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="975" y="334" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="975" y="351" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Broker Node</text><text x="1142" y="334" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[0..1]</text><rect x="980" y="357" width="155" height="38" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="988" y="373" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="988" y="388" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">ActiveMQ Artemis</text><polyline points="904,330 935,330 935,376 980,376" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="912.4" y="313" width="45.2" height="14" fill="#ffffff"/><text x="935" y="323" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«STOMP»</text><polygon points="600,392 614,378 904,378 890,392" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="890,392 904,378 904,518 890,532" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="600" y="392" width="290" height="140" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="610" y="410" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="610" y="427" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Build Agent Node</text><text x="882" y="410" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[0..*]</text><rect x="615" y="440" width="260" height="82" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="623" y="456" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="623" y="471" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Artemis Build Agent</text><text x="623" y="485" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">clones repositories from LocalVC</text><text x="623" y="498" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">runs build jobs in Docker containers</text><polyline points="745,342 745,392" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="691.6" y="362" width="106.80000000000001" height="14" fill="#ffffff"/><text x="745" y="372" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«Git (HTTPS, SSH)»</text><polygon points="40,330 298,330 310,342 310,442 40,442" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><polyline points="298,330 298,342 310,342" fill="none" stroke="#000000" stroke-width="1"/><text x="48" y="348" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">Build jobs and results are exchanged through</text><text x="48" y="362" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">the distributed data provider: Hazelcast</text><text x="48" y="376" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">(embedded in the core and build agent nodes)</text><text x="48" y="390" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">or Redis (external server). Without a</text><text x="48" y="404" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">broker, a single node uses an in-memory</text><text x="48" y="418" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">websocket broker.</text></svg>
