<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Typical Artemis deployment (UML deployment diagram)</title><desc id="d">User devices reach the reverse proxy, which forwards to the core nodes. Core nodes run LocalVC and LocalCI, exactly one of them with the scheduling profile. Build agent nodes run the build jobs in Docker containers. A database server hosts PostgreSQL, a distributed data server hosts Redis or Valkey, and a broker node relays websocket messages. Jenkins and MySQL are deprecated.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="1200" height="660" fill="#ffffff"/><rect x="10" y="10" width="1180" height="640" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 254.60000000000002,10 254.60000000000002,24 242.60000000000002,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">deployment</text><text x="106.0" y="29" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">Typical Deployment</text><polygon points="40,100 54,86 294,86 280,100" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="280,100 294,86 294,236 280,250" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="40" y="100" width="240" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="50" y="118" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="50" y="135" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">User Device</text><text x="272" y="118" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[0..*]</text><rect x="55" y="150" width="210" height="42" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="63" y="166" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="63" y="181" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Web Browser</text><rect x="55" y="200" width="210" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="63" y="216" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="63" y="231" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Git Client</text><polygon points="345,125 359,111 509,111 495,125" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="495,125 509,111 509,191 495,205" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="345" y="125" width="150" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="355" y="143" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="355" y="160" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Reverse Proxy</text><polyline points="294,165 345,165" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="297.4" y="144" width="45.2" height="14" fill="#ffffff"/><text x="320" y="154" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«HTTPS»</text><polygon points="600,80 614,66 904,66 890,80" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="890,80 904,66 904,386 890,400" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="600" y="80" width="290" height="320" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="610" y="98" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="610" y="115" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Core Node</text><text x="882" y="98" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[1..*]</text><rect x="615" y="128" width="260" height="262" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="623" y="144" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="623" y="159" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">JVM, Java 25</text><polygon points="627,170 851,170 863,182 863,272 627,272" fill="#ffffff" stroke="#000000" stroke-width="1.3"/><polyline points="851,170 851,182 863,182" fill="none" stroke="#000000" stroke-width="1.1"/><text x="635" y="185" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«artifact»</text><text x="635" y="199" font-size="11" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Artemis.war</text><text x="635" y="213" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">profiles: core, localvc, localci</text><text x="635" y="225" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">plus scheduling on exactly one node</text><text x="635" y="237" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">serves the client, REST API, websockets,</text><text x="635" y="249" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">LocalVC and LocalCI</text><text x="627" y="296" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">Embedded in the JVM, if selected:</text><text x="637" y="312" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">Hazelcast member (distributed data)</text><text x="637" y="327" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">in-memory websocket broker (single node)</text><polyline points="509,165 600,165" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="503.4" y="144" width="101.2" height="14" fill="#ffffff"/><text x="554" y="154" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«HTTP, WebSocket»</text><polygon points="965,80 979,66 1164,66 1150,80" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="1150,80 1164,66 1164,236 1150,250" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="965" y="80" width="185" height="170" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="975" y="98" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="975" y="115" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Database Server</text><rect x="980" y="128" width="155" height="48" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="988" y="144" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="988" y="159" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">PostgreSQL</text><rect x="980" y="186" width="155" height="56" fill="#eeeeee" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4"/><text x="988" y="202" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="988" y="217" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">MySQL</text><text x="988" y="231" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«deprecated»</text><polyline points="904,170 965,170" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="915.2" y="148" width="39.6" height="14" fill="#ffffff"/><text x="935" y="158" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«JDBC»</text><polygon points="965,275 979,261 1164,261 1150,275" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="1150,275 1164,261 1164,347 1150,361" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="965" y="275" width="185" height="86" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="975" y="293" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="975" y="310" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Distributed Data Server</text><text x="1142" y="293" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[0..1]</text><rect x="980" y="316" width="155" height="38" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="988" y="332" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="988" y="347" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Redis or Valkey</text><polyline points="904,315 965,315" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="912.4" y="293" width="45.2" height="14" fill="#ffffff"/><text x="935" y="303" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«Redis»</text><polygon points="965,385 979,371 1164,371 1150,385" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="1150,385 1164,371 1164,457 1150,471" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="965" y="385" width="185" height="86" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="975" y="403" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="975" y="420" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Broker Node</text><text x="1142" y="403" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[0..1]</text><rect x="980" y="426" width="155" height="38" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="988" y="442" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="988" y="457" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">ActiveMQ Artemis</text><polyline points="904,385 935,385 935,443 980,443" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="912.4" y="368" width="45.2" height="14" fill="#ffffff"/><text x="935" y="378" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«STOMP»</text><polygon points="600,460 614,446 904,446 890,460" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="890,460 904,446 904,616 890,630" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="600" y="460" width="290" height="170" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="610" y="478" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="610" y="495" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Build Agent Node</text><text x="882" y="478" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[0..*]</text><rect x="615" y="508" width="260" height="112" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="623" y="524" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="623" y="539" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">JVM, Java 25</text><polygon points="627,546 851,546 863,558 863,612 627,612" fill="#ffffff" stroke="#000000" stroke-width="1.3"/><polyline points="851,546 851,558 863,558" fill="none" stroke="#000000" stroke-width="1.1"/><text x="635" y="561" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«artifact»</text><text x="635" y="575" font-size="11" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Artemis.war</text><text x="635" y="589" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">profiles: buildagent, localci</text><text x="635" y="601" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">build jobs run in Docker containers</text><polyline points="745,400 745,460" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="691.6" y="424" width="106.80000000000001" height="14" fill="#ffffff"/><text x="745" y="434" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«Git (HTTPS, SSH)»</text><polygon points="345,300 359,286 549,286 535,300" fill="#eeeeee" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4"/><polygon points="535,300 549,286 549,404 535,418" fill="#eeeeee" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4"/><rect x="345" y="300" width="190" height="118" fill="#eeeeee" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4"/><text x="355" y="318" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device» «deprecated»</text><text x="355" y="335" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Jenkins Server</text><text x="527" y="318" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[0..1]</text><rect x="360" y="345" width="160" height="60" fill="#eeeeee" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4"/><text x="368" y="361" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«execution environment»</text><text x="368" y="376" font-size="12" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Jenkins</text><text x="368" y="390" font-size="10" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«deprecated»</text><polyline points="549,345 600,345" fill="none" stroke="#000000" stroke-width="1.4"/><rect x="554.2" y="324" width="39.6" height="14" fill="#ffffff"/><text x="574" y="334" font-size="10" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«HTTP»</text><polygon points="40,330 298,330 310,342 310,442 40,442" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><polyline points="298,330 298,342 310,342" fill="none" stroke="#000000" stroke-width="1"/><text x="48" y="348" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">Build jobs and results are exchanged through</text><text x="48" y="362" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">the distributed data provider: Hazelcast</text><text x="48" y="376" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">(embedded in the core and build agent nodes)</text><text x="48" y="390" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">or Redis (external server). Without a</text><text x="48" y="404" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">broker, a single node uses an in-memory</text><text x="48" y="418" font-size="10.5" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">websocket broker.</text><rect x="800" y="18" width="22" height="12" fill="#eeeeee" stroke="#000000" stroke-width="1.2" stroke-dasharray="7 4"/><text x="830" y="28" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«deprecated»: removed in Artemis 11 (planned March 2027)</text></svg>
