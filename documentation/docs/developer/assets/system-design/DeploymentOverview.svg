<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1009 426" width="1009" height="426" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artemis deployment overview (UML deployment diagram)</title><desc id="d">User devices with a web browser, a Git client or a mobile app reach the reverse proxy, which forwards to the core nodes running the Artemis server with LocalVC and LocalCI. A broker node relays websocket messages, a distributed data server hosts Redis or Valkey, and a database server hosts PostgreSQL. Build agent nodes run the build jobs. They clone repositories from the Artemis server and share job state through the distributed data server.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="1009" height="426" fill="#ffffff"/><rect x="10" y="10" width="989" height="406" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 197.14,10 197.14,24 185.14,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Deployment Overview</text><polygon points="30,106 42,94 168,94 156,106" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="156,106 168,94 168,256 156,268" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="30" y="106" width="126" height="162" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="40" y="126" font-size="13" font-weight="700" text-anchor="start" fill="#000000">User Device</text><rect x="40" y="138" width="106" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="50" y="160" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Web Browser</text><rect x="40" y="180" width="106" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="50" y="202" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Mobile App</text><rect x="40" y="222" width="106" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="50" y="244" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Git Client</text><polygon points="234,190 246,178 371,178 359,190" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="359,190 371,178 371,256 359,268" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="234" y="190" width="125" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="244" y="210" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Reverse Proxy</text><rect x="244" y="222" width="105" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="254" y="244" font-size="12" font-weight="700" text-anchor="start" fill="#000000">nginx</text><polyline points="168,224 234,224" fill="none" stroke="#000000" stroke-width="1.4"/><text x="201.0" y="216" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«HTTPS»</text><polyline points="371,224 531,224" fill="none" stroke="#000000" stroke-width="1.4"/><text x="451.0" y="216" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«HTTP, WebSocket»</text><polygon points="531,190 543,178 748,178 736,190" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="736,190 748,178 748,256 736,268" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="531" y="190" width="205" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="541" y="210" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Core Node</text><rect x="541" y="222" width="185" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="551" y="244" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Artemis Server</text><polygon points="531,56 543,44 748,44 736,56" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="736,56 748,44 748,122 736,134" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="531" y="56" width="205" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="541" y="76" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Broker Node</text><rect x="541" y="88" width="185" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="551" y="110" font-size="12" font-weight="700" text-anchor="start" fill="#000000">ActiveMQ</text><polygon points="531,324 543,312 748,312 736,324" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="736,324 748,312 748,390 736,402" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="531" y="324" width="205" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="541" y="344" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Distributed Data Server</text><rect x="541" y="356" width="185" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="551" y="378" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Redis or Valkey</text><polyline points="639,134 639,178" fill="none" stroke="#000000" stroke-width="1.4"/><text x="649" y="160.0" font-size="10" font-weight="400" text-anchor="start" fill="#000000">«STOMP»</text><polyline points="639,268 639,312" fill="none" stroke="#000000" stroke-width="1.4"/><text x="649" y="294.0" font-size="10" font-weight="400" text-anchor="start" fill="#000000">«Redis»</text><polygon points="271,324 283,312 468,312 456,324" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="456,324 468,312 468,390 456,402" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="271" y="324" width="185" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="281" y="344" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Build Agent Node</text><rect x="281" y="356" width="165" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="291" y="378" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Artemis Build Agent</text><polyline points="468,358 531,358" fill="none" stroke="#000000" stroke-width="1.4"/><text x="499.5" y="350" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«Redis»</text><polyline points="531,254 431,254 431,312" fill="none" stroke="#000000" stroke-width="1.4"/><text x="439" y="294.0" font-size="10" font-weight="400" text-anchor="start" fill="#000000">«Git (HTTPS, SSH)»</text><polygon points="832,190 844,178 985,178 973,190" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="973,190 985,178 985,256 973,268" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="832" y="190" width="141" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="842" y="210" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Database Server</text><rect x="842" y="222" width="121" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="852" y="244" font-size="12" font-weight="700" text-anchor="start" fill="#000000">PostgreSQL</text><polyline points="748,224 832,224" fill="none" stroke="#000000" stroke-width="1.4"/><text x="790.0" y="216" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«Hibernate»</text></svg>
