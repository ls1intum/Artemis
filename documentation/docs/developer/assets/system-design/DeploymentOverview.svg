<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artemis deployment overview</title><desc id="d">Users connect through a reverse proxy to one scheduling core node and optional further core nodes. Build agents run in separate nodes. PostgreSQL and the distributed data provider are shared. Jenkins and MySQL are deprecated.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs><rect width="1100" height="640" fill="#ffffff"/><text x="550" y="30" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Typical Artemis deployment</text><rect x="30" y="70" width="220" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="140.0" y="92" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">User devices</text><text x="140.0" y="112" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Student, instructor, tutor</text><text x="140.0" y="129" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">browsers (Artemis client)</text><text x="140.0" y="146" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">and Git clients</text><rect x="280" y="90" width="160" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="112" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Reverse proxy</text><text x="360.0" y="132" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">TLS, load balancing</text><line x1="250" y1="125" x2="280" y2="125" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="490" y="60" width="570" height="300" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="775" y="84" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Core nodes (Artemis server with LocalVC and LocalCI)</text><rect x="515" y="105" width="250" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="640.0" y="127" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Core node, profiles</text><text x="640.0" y="147" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">core, scheduling, localvc, localci</text><text x="640.0" y="164" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">exactly one per installation:</text><text x="640.0" y="181" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">scheduled jobs, startup telemetry</text><rect x="790" y="105" width="250" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="915.0" y="127" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Further core nodes</text><text x="915.0" y="147" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">core, localvc, localci</text><text x="915.0" y="164" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">added for load, no downtime</text><text x="915.0" y="181" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">(optional)</text><rect x="515" y="230" width="525" height="100" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="777.5" y="252" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Distributed data provider</text><text x="777.5" y="272" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">build queue, caches, websocket relay, node registry</text><text x="777.5" y="289" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Hazelcast cluster, Redis, or local for a single node</text><line x1="440" y1="125" x2="515" y2="125" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="515" y="400" width="250" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="640.0" y="422" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Build agent nodes</text><text x="640.0" y="442" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">profile buildagent, clone from LocalVC</text><text x="640.0" y="459" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">run jobs in Docker containers</text><text x="640.0" y="476" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">on own servers or in a cloud</text><line x1="640" y1="330" x2="640" y2="400" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="700" y="372" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">jobs / results</text><rect x="790" y="400" width="250" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="915.0" y="422" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Database server</text><text x="915.0" y="442" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">PostgreSQL (primary)</text><text x="915.0" y="459" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">MySQL: deprecated,</text><text x="915.0" y="476" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">removed in Artemis 11</text><line x1="915" y1="360" x2="915" y2="400" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="30" y="400" width="365" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="212.5" y="422" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Optional services</text><text x="212.5" y="442" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Weaviate (global search), Iris/Pyris, Athena,</text><text x="212.5" y="459" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Hyperion and AI Worker nodes, Theia,</text><text x="212.5" y="476" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Apollon, mail server, user management</text><line x1="395" y1="430" x2="490" y2="300" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)" marker-start="url(#a)"/><rect x="515" y="540" width="525" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="777.5" y="562" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Jenkins (external CI, deprecated, removed in Artemis 11)</text><text x="777.5" y="582" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">optional alternative to LocalCI; builds fetch from LocalVC and report results back</text><rect x="30" y="620" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="52" y="632" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Artemis client / server</text><rect x="205" y="620" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="227" y="632" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Default: LocalVC + LocalCI</text><rect x="402" y="620" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="424" y="632" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Supporting / optional</text><rect x="575" y="620" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="597" y="632" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Deprecated, removed in Artemis 11</text></svg>
