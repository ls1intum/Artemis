<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 622" width="1020" height="622" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artemis deployment overview (UML deployment diagram)</title><desc id="d">User devices reach the reverse proxy, which forwards to the core nodes running the Artemis server with LocalVC and LocalCI. A broker node relays websocket messages, a distributed data server hosts Redis or Valkey, and a database server hosts PostgreSQL. Build agent nodes run the build jobs. They clone repositories from the Artemis server and share job state through the distributed data server.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="1020" height="622" fill="#ffffff"/><rect x="10" y="10" width="1000" height="602" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 197.14,10 197.14,24 185.14,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Deployment Overview</text><polygon points="30,158 42,146 168,146 156,158" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="156,158 168,146 168,266 156,278" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="30" y="158" width="126" height="120" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="40" y="178" font-size="13" font-weight="700" text-anchor="start" fill="#000000">User Device</text><rect x="40" y="190" width="106" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="50" y="212" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Web Browser</text><rect x="40" y="232" width="106" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="50" y="254" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Git Client</text><polygon points="248,214 260,202 385,202 373,214" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="373,214 385,202 385,280 373,292" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="248" y="214" width="125" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="258" y="234" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Reverse Proxy</text><rect x="258" y="246" width="105" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="268" y="268" font-size="12" font-weight="700" text-anchor="start" fill="#000000">nginx</text><polyline points="168,248 248,248" fill="none" stroke="#000000" stroke-width="1.4"/><text x="208.0" y="240" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«HTTPS»</text><polyline points="385,248 520,248" fill="none" stroke="#000000" stroke-width="1.4"/><text x="452.5" y="240" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«HTTP, WebSocket»</text><polygon points="520,214 532,202 737,202 725,214" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="725,214 737,202 737,280 725,292" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="520" y="214" width="205" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="530" y="234" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Core Node</text><rect x="530" y="246" width="185" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="540" y="268" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Artemis Server</text><polygon points="520,64 532,52 737,52 725,64" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="725,64 737,52 737,130 725,142" fill="#dedede" stroke="#0