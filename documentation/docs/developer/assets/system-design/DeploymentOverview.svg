<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Typical Artemis deployment (UML deployment diagram)</title><desc id="d">User devices reach the reverse proxy, which forwards to the core nodes running the Artemis server with LocalVC and LocalCI. Build agent nodes run the build jobs. A database server hosts PostgreSQL, a distributed data server hosts Redis or Valkey, and a broker node relays websocket messages.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="1200" height="480" fill="#ffffff"/><rect x="10" y="10" width="1180" height="460" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 254.60000000000002,10 254.60000000000002,24 242.60000000000002,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">deployment</text><text x="106.0" y="29" font-size="13" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">Typical Deployment</text><polygon points="40,130 54,116 294,116 280,130" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><polygon points="280,130 294,116 294,266 280,280" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="40" y="130" width="240" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="50" y="148" font-size="11" font-weight="400" font-style="normal" text-anchor="start" fill="#000000">«device»</text><text x="50" y="165" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">User Device</text><text x="272" y="148" font-size="11" font-weight="400" font-style="normal" text-anchor="end" fill="#000000">[0..*]</text><rect x="55" y="180" widt