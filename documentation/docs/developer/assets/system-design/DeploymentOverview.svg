<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 945 560" width="945" height="560" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artemis deployment overview (UML deployment diagram)</title><desc id="d">User devices reach the reverse proxy, which forwards to the core nodes running the Artemis server with LocalVC and LocalCI. A broker node relays websocket messages, a distributed data server hosts Redis or Valkey, and a database server hosts PostgreSQL. Build agent nodes run the build jobs. They clone repositories from the Artemis server and share job state through the distributed data server.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="945" height="560" fill="#ffffff"/><rect x="10" y="10" width="925" height="540" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 197.14,10 197.14,24 185.14,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Deployment Overview</text><polygon points="30,134 42,122 168,122 156,134" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="156,134 168,122 168,242 156,254" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="30" y="134" width="126" height="120" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="40" y="154" font-size="13" font-weight="700" text-anchor="start" fill="#000000">User Device</text><rect x="40" y="166" width="106" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="50" y="188" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Web Browser</text><rect x="40" y="208" width="106" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="50" y="230" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Git Client</text><polygon points="234,190 246,178 371,178 359,190" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="359,190 371,178 371,256 359,268" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="234" y="190" width="125" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="244" y="210" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Reverse Proxy</text><rect x="244" y="222" width="105" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="254" y="244" font-size="12" font-weight="700" text-anchor="start" fill="#000000">nginx</text><polyline points="168,224 234,224" fill="none" stroke="#000000" stroke-width="1.4"/><text x="201.0" y="216" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«HTTPS»</text><polyline points="371,224 467,224" fill="none" stroke="#000000" stroke-width="1.4"/><text x="419.0" y="216" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«HTTP, WebSocket»</text><polygon points="467,190 479,178 684,178 672,190" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="672,190 684,178 684,256 672,268" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="467" y="190" width="205" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="477" y="210" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Core Node</text><rect x="477" y="222" width="185" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="487" y="244" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Artemis Server</text><polygon points="467,56 479,44 684,44 672,56" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="672,56 684,44 684,122 672,134" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="467" y="56" width="205" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="477" y="76" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Broker Node</text><rect x="477" y="88" width="185" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="487" y="110" font-size="12" font-weight="700" text-anchor="start" fill="#000000">ActiveMQ</text><polygon points="467,324 479,312 684,312 672,324" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="672,324 684,312 684,390 672,402" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="467" y="324" width="205" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="477" y="344" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Distributed Data Server</text><rect x="477" y="356" width="185" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="487" y="378" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Redis or Valkey</text><polygon points="467,458 479,446 684,446 672,458" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="672,458 684,446 684,524 672,536" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="467" y="458" width="205" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="477" y="478" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Build Agent Node</text><rect x="477" y="490" width="185" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="487" y="512" font-size="12" font-weight="700" text-anchor="start" fill="#000000">Artemis Build Agent</text><polyline points="575,134 575,178" fill="none" stroke="#000000" stroke-width="1.4"/><text x="585" y="160.0" font-size="10" font-weight="400" text-anchor="start" fill="#000000">«STOMP»</text><polyline points="575,268 575,312" fill="none" stroke="#000000" stroke-width="1.4"/><text x="585" y="294.0" font-size="10" font-weight="400" text-anchor="start" fill="#000000">«Redis»</text><polyline points="575,402 575,446" fill="none" stroke="#000000" stroke-width="1.4"/><text x="585" y="428.0" font-size="10" font-weight="400" text-anchor="start" fill="#000000">«Redis»</text><polygon points="768,190 780,178 921,178 909,190" fill="#f4f4f4" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><polygon points="909,190 921,178 921,256 909,268" fill="#dedede" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"/><rect x="768" y="190" width="141" height="78" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="778" y="210" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Database Server</text><rect x="778" y="222" width="121" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="788" y="244" font-size="12" font-weight="700" text-anchor="start" fill="#000000">PostgreSQL</text><polyline points="684,224 768,224" fill="none" stroke="#000000" stroke-width="1.4"/><text x="726.0" y="216" font-size="10" font-weight="400" text-anchor="middle" fill="#000000">«Hibernate»</text><polyline points="684,252 726,252 726,520 684,520" fill="none" stroke="#000000" stroke-width="1.4"/><text x="734" y="404.0" font-size="10" font-weight="400" text-anchor="start" fill="#000000">«Git (HTTPS, SSH)»</text></svg>
