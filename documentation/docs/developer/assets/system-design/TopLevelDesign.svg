<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 538" width="1060" height="538" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artemis top-level design (UML component diagram)</title><desc id="d">The Artemis client and the Android and iOS apps use the REST and WebSocket interface of the core modules in the Artemis server. Git clients and build agents use the Git interface of LocalVC. The server requires a database, user management and optional AI services. LocalCI requires the distributed data provider, which the build agents require as well.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="1060" height="538" fill="#ffffff"/><rect x="10" y="10" width="1040" height="518" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 172.96,10 172.96,24 160.96,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Top-Level Design</text><rect x="359" y="126" width="334" height="248" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="661" y="135" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="655" y="137.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="655" y="143.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="371" y="152" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Artemis Server</text><text x="493.84000000000003" y="152" font-size="11" font-weight="400" text-anchor="start" fill="#000000">Spring Boot, Java 25</text><rect x="399" y="178" width="254" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="621" y="187" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="615" y="189.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="615" y="195.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="411" y="204" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Core Modules</text><text x="411" y="223" font-size="11" font-weight="400" text-anchor="start" fill="#000000">exercise, exam, assessment, ...</text><rect x="399" y="282" width="112" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="479" y="291" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="473" y="293.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="473" y="299.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="411" y="308" font-size="13" font-weight="700" text-anchor="start" fill="#000000">LocalVC</text><text x="411" y="327" font-size="11" font-weight="400" text-anchor="start" fill="#000000">Git server</text><rect x="541" y="282" width="112" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="621" y="291" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="615" y="293.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="615" y="299.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="553" y="308" font-size="13" font-weight="700" text-anchor="start" fill="#000000">LocalCI</text><text x="553" y="327" font-size="11" font-weight="400" text-anchor="start" fill="#000000">build queue</text><polyline points="455,244 455,282" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#open)"/><polyline points="597,244 597,282" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#open)"/><rect x="30" y="178" width="169" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"