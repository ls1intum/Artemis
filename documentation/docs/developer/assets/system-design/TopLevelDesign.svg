<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artemis top-level design (UML component diagram)</title><desc id="d">The Artemis client uses the REST and WebSocket interface of the Artemis server. The server contains the core modules, LocalVC and LocalCI. It requires a database, user management and optional services, and a distributed data provider. Build agents require the Git interface of LocalVC and the distributed data.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="1160" height="560" fill="#ffffff"/><rect x="10" y="10" width="1140" height="540" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 158.4,10 158.4,24 146.4,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" font-style="normal" text-anchor="start" fill="#000000">Top-Level Design</text><rect x="30" y="125" width="200" height="80" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="202" y="133" width="16" height="11" fill="#ffffff" stroke="#000000" stroke-width="1.1"/><rect x="198" y="135" width="8" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.1"/><rect x="198" y="140" width="8" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.1"/><text x="124.0" y="147" font-size="11" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">«component»</text><text x="124.0" y="165" font-size="13" font-weight="700" font-style="normal" text-anchor="middle" fill="#000000">Artemis Client</text><text x="124.0" y="182" font-size="11" font-weight="400" font-style="normal" text-anchor="middle" fill="#000000">Angular single-page app</text><rect x="30" y="255" width="200" height="80" fill="#ffffff