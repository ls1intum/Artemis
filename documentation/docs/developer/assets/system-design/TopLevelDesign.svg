<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1231 568" width="1231" height="568" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artemis top-level design (UML component diagram)</title><desc id="d">The Artemis client and the Android and iOS apps use the REST and WebSocket interface of the core modules in the Artemis server. Git clients and build agents use the Git interface of LocalVC. The server requires a database, user management and optional AI services. LocalCI requires the distributed data provider, which the build agents require as well.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="1231" height="568" fill="#ffffff"/><rect x="10" y="10" width="1211" height="548" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 172.96,10 172.96,24 160.96,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Top-Level Design</text><rect x="389" y="126" width="444" height="260" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="801" y="135" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="795" y="137.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="795" y="143.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="401" y="152" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Artemis Server</text><text x="523.84" y="152" font-size="11" font-weight="400" text-anchor="start" fill="#000000">Spring Boot, Java 25</text><rect x="433" y="178" width="356" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="757" y="187" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="751" y="189.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="751" y="195.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="445" y="204" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Core Modules</text><text x="445" y="223" font-size="11" font-weight="400" text-anchor="start" fill="#000000">exercise, exam, assessment, ...</text><rect x="433" y="290" width="163" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="564" y="299" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="558" y="301.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="558" y="307.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="445" y="316" font-size="13" font-weight="700" text-anchor="start" fill="#000000">LocalVC</text><text x="445" y="335" font-size="11" font-weight="400" text-anchor="start" fill="#000000">Git server (HTTPS, SSH)</text><rect x="626" y="290" width="163" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="757" y="299" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="751" y="301.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="751" y="307.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="638" y="316" font-size="13" font-weight="700" text-anchor="start" fill="#000000">LocalCI</text><text x="638" y="335" font-size="11" font-weight="400" text-anchor="start" fill="#000000">build queue and results</text><polyline points="514,244 514,290" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#open)"/><polyline points="707,244 707,290" fill="none" stroke="#000000" stroke-width="1.4" stroke-dasharray="7 4" marker-end="url(#open)"/><rect x="30" y="178" width="169" height="66" fill="#ffffff" stroke="#000000" strok