<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1191 490" width="1191" height="490" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artemis top-level design (UML component diagram)</title><desc id="d">The Artemis client uses the REST and WebSocket interface of the core modules in the Artemis server. Git clients and build agents use the Git interface of LocalVC. The server requires a database, user management and optional services. LocalCI requires the distributed data provider, which the build agents require as well.</desc><defs><marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#000000" stroke-width="1.4"/></marker></defs><rect width="1191" height="490" fill="#ffffff"/><rect x="10" y="10" width="1171" height="470" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><polygon points="10,10 172.96,10 172.96,24 160.96,38 10,38" fill="#ffffff" stroke="#000000" stroke-width="1.6"/><text x="22" y="29" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Top-Level Design</text><rect x="349" y="64" width="444" height="260" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="761" y="73" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="755" y="75.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="755" y="81.5" width="12" height="3" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><text x="361" y="90" font-size="13" font-weight="700" text-anchor="start" fill="#000000">Artemis Server</text><text x="483.84000000000003" y="90" font-size="11" font-weight="400" text-anchor="start" fill="#000000">Spring Boot, Java 25</text><rect x="393" y="116" width="356" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><rect x="717" y="125" width="22" height="14" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><rect x="711" y="127.5" width="1