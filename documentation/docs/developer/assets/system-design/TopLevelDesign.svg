<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Artemis top-level design</title><desc id="d">The Angular client talks to the Spring Boot server. The server contains the integrated LocalVC Git server and the LocalCI build coordination. Build agents execute jobs in Docker containers. PostgreSQL stores data. Jenkins and MySQL are deprecated and removed in Artemis 11.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/></marker></defs><rect width="1100" height="640" fill="#ffffff"/><text x="550" y="30" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Artemis top-level design</text><rect x="30" y="200" width="190" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="125.0" y="222" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Artemis Client</text><text x="125.0" y="242" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Angular web app</text><text x="125.0" y="259" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">runs in the browser</text><text x="125" y="335" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Students, instructors,</text><text x="125" y="351" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">tutors, administrators</text><rect x="30" y="400" width="190" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="125.0" y="422" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Git clients, IDEs</text><text x="125.0" y="442" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">clone and push over</text><text x="125.0" y="459" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">HTTPS or SSH</text><rect x="300" y="90" width="480" height="400" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="540" y="116" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Artemis Server (Spring Boot, Java 25)</text><rect x="325" y="135" width="430" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="157" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Core application modules</text><text x="540.0" y="177" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">courses, exercises, exams, assessment, plagiarism,</text><text x="540.0" y="194" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">communication, learning analytics, notifications</text><rect x="325" y="235" width="205" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="427.5" y="257" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">LocalVC</text><text x="427.5" y="277" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">integrated Git server</text><text x="427.5" y="294" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">HTTPS and SSH</text><text x="427.5" y="311" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">repositories on disk</text><rect x="550" y="235" width="205" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="652.5" y="257" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">LocalCI</text><text x="652.5" y="277" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">build queue, scheduling</text><text x="652.5" y="294" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">result processing</text><text x="652.5" y="311" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">grading, feedback</text><rect x="325" y="355" width="430" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="540.0" y="377" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Distributed data provider</text><text x="540.0" y="397" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">shared state of a multi-node installation: build queue,</text><text x="540.0" y="414" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">caches, websocket relay, node registry</text><text x="540.0" y="431" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Hazelcast, Redis or local (single node)</text><line x1="220" y1="255" x2="300" y2="255" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="260" y="244" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">REST + WebSocket</text><line x1="220" y1="435" x2="325" y2="300" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="250" y="372" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">Git</text><rect x="850" y="235" width="220" height="100" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="960.0" y="257" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Build Agents</text><text x="960.0" y="277" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">clone from LocalVC, run</text><text x="960.0" y="294" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">build and test jobs in Docker</text><text x="960.0" y="311" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">scale out horizontally</text><line x1="755" y1="285" x2="850" y2="285" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="802" y="274" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">jobs / results</text><rect x="325" y="530" width="205" height="70" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="427.5" y="552" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">PostgreSQL</text><text x="427.5" y="572" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">primary database</text><rect x="560" y="530" width="195" height="70" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="657.5" y="552" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">MySQL</text><text x="657.5" y="572" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">deprecated, removed in 11</text><line x1="430" y1="530" x2="430" y2="490" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><line x1="657" y1="530" x2="657" y2="490" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)" marker-start="url(#a)"/><rect x="850" y="80" width="220" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="960.0" y="102" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">User management</text><text x="960.0" y="122" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">internal users, LDAP,</text><text x="960.0" y="139" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">SAML2, OIDC, passkeys,</text><text x="960.0" y="156" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">LTI platforms</text><line x1="780" y1="140" x2="850" y2="135" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="850" y="360" width="220" height="120" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="960.0" y="382" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Optional services</text><text x="960.0" y="402" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Iris/Pyris, Athena, Hyperion,</text><text x="960.0" y="419" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">AI Worker, Weaviate,</text><text x="960.0" y="436" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">Apollon, Theia, Atlas</text><line x1="780" y1="420" x2="850" y2="420" stroke="#6b7280" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><rect x="850" y="515" width="220" height="85" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="960.0" y="537" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">Jenkins</text><text x="960.0" y="557" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">external CI, deprecated,</text><text x="960.0" y="574" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">removed in Artemis 11</text><line x1="850" y1="560" x2="760" y2="480" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)" marker-start="url(#a)"/><rect x="30" y="615" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="52" y="627" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Artemis client / server</text><rect x="205" y="615" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="227" y="627" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Default: LocalVC + LocalCI</text><rect x="402" y="615" width="14" height="14" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="424" y="627" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Supporting / optional</text><rect x="575" y="615" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/><text x="597" y="627" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start">Deprecated, removed in Artemis 11</text></svg>
