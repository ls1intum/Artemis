apiVersion: v2
name: artemis
description: >-
  Multi-node Artemis deployment for Kubernetes using PostgreSQL and the external
  Hades build system, exposed via the Kubernetes Gateway API (HTTP + git-over-SSH).
type: application

# Chart version. Bump on every change to the chart or its templates (SemVer).
version: 0.1.0

# The Artemis application version this chart defaults to. Overridable via `image.tag`.
# Must be an image that contains the Hades integration (see README, "Prerequisites").
appVersion: "9.7.1"

home: https://docs.artemis.cit.tum.de
sources:
  - https://github.com/ls1intum/Artemis

maintainers:
  - name: Artemis Team
    url: https://github.com/ls1intum/Artemis

icon: https://raw.githubusercontent.com/ls1intum/Artemis/develop/src/main/resources/public/images/logo.png

keywords:
  - artemis
  - e-learning
  - postgres
  - hades
  - gateway-api
