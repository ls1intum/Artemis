apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "artemis.configName" . }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
data:
  # ---- Public URLs (must resolve externally; Hades + browsers use them) ----
  SERVER_URL: {{ include "artemis.serverUrl" . | quote }}
  ARTEMIS_VERSIONCONTROL_URL: {{ include "artemis.serverUrl" . | quote }}
  ARTEMIS_VERSIONCONTROL_SSHTEMPLATECLONEURL: "ssh://git@{{ required "gateway.hostname is required" .Values.gateway.hostname }}:{{ .Values.gateway.ssh.port }}/"
  ARTEMIS_VERSIONCONTROL_SSHHOSTKEYPATH: "/opt/artemis/config/ssh-hostkey"

  INFO_OPERATORNAME: {{ .Values.artemis.config.operator.name | quote }}
  INFO_OPERATORADMINNAME: {{ .Values.artemis.config.operator.adminName | quote }}

  # ---- Datasource (PostgreSQL) ----
  SPRING_DATASOURCE_URL: {{ include "artemis.jdbcUrl" . | quote }}
  SPRING_DATASOURCE_USERNAME: {{ .Values.postgresql.auth.username | quote }}

  # ---- Node-local (non-shared) paths -> emptyDir at /opt/artemis/local ----
  ARTEMIS_REPODOWNLOADCLONEPATH: "/opt/artemis/local/repos-download"
  ARTEMIS_TEMPPATH: "/opt/artemis/local/tmp"
  ARTEMIS_BUILDLOGSPATH: "/opt/artemis/local/build-logs"

  # ---- Service discovery (Eureka) + Hazelcast ----
  EUREKA_CLIENT_ENABLED: "true"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: {{ include "artemis.eurekaUrl" . | quote }}
  EUREKA_INSTANCE_PREFERIPADDRESS: "true"
  EUREKA_INSTANCE_APPNAME: "Artemis"
  # Evict dead pod IPs quickly so Hazelcast stops dialing gone pods on churn.
  EUREKA_INSTANCE_LEASERENEWALINTERVALINSECONDS: "5"
  EUREKA_INSTANCE_LEASEEXPIRATIONDURATIONINSECONDS: "10"

  # ---- WebSocket STOMP relay (ActiveMQ) ----
  SPRING_WEBSOCKET_BROKER_ADDRESSES: {{ include "artemis.brokerAddresses" . | quote }}

  # ---- External Hades build system ----
  ARTEMIS_CONTINUOUSINTEGRATION_URL: {{ required "artemis.config.hades.url is required" .Values.artemis.config.hades.url | quote }}
  ARTEMIS_CONTINUOUSINTEGRATION_HADES_ADAPTER_ENDPOINT: {{ include "artemis.hadesAdapterEndpoint" . | quote }}
  ARTEMIS_CONTINUOUSINTEGRATION_HADES_ADAPTER_LOGSENDPOINT: {{ include "artemis.hadesAdapterLogsEndpoint" . | quote }}
  ARTEMIS_CONTINUOUSINTEGRATION_HADES_IMAGES_CLONEIMAGE: {{ .Values.artemis.config.hades.cloneImage | quote }}
  ARTEMIS_CONTINUOUSINTEGRATION_HADES_IMAGES_RESULTPARSERIMAGE: {{ .Values.artemis.config.hades.resultParserImage | quote }}

  # ---- LocalVC build-agent git identity (Hades clones repos with these) ----
  ARTEMIS_VERSIONCONTROL_BUILDAGENTGITUSERNAME: {{ .Values.artemis.config.versionControl.buildAgentGitUsername | quote }}

  # ---- User management ----
  ARTEMIS_USERMANAGEMENT_USEEXTERNAL: "false"
