{{- /*
Shared LocalVC SSH host key. Git-over-SSH is load-balanced across all core
pods, so every pod must present the SAME host key (otherwise clients hit a
host-key-mismatch). We generate one PEM RSA key and mount this Secret as a
directory on every pod (artemis.version-control.ssh-host-key-path points at it;
MultipleHostKeyProvider reads standard PEM keys from a directory).

The key is generated once and preserved across `helm upgrade` via `lookup`, so
existing clients keep trusting the host. A fresh key per fresh install is fine
for ephemeral per-PR instances.
*/ -}}
{{- $secretName := include "artemis.hostkeySecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $key := "" -}}
{{- if and $existing $existing.data -}}
{{- $key = index $existing.data "ssh-host-rsa-key" | b64dec -}}
{{- else -}}
{{- $key = genPrivateKey "rsa" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
type: Opaque
stringData:
  ssh-host-rsa-key: |
{{ $key | indent 4 }}
