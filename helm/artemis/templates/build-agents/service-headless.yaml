{{- /*
Headless service governing the build-agent StatefulSet. StatefulSets require a governing service to
give each pod a stable DNS name. Build agents talk to the cluster as Hazelcast clients and are never
addressed by other pods, so this service only exists to satisfy that contract and to make the agents
discoverable for debugging.
*/ -}}
{{- if .Values.buildAgents.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artemis.buildAgentName" . }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
    app.kubernetes.io/component: build-agent
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "artemis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: build-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
