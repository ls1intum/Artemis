{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "artemis.httpName" . }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- if .Values.gateway.create }}
    - name: {{ include "artemis.fullname" . }}
      sectionName: https
    {{- else }}
    - name: {{ required "gateway.parentRef.name is required when gateway.create=false" .Values.gateway.parentRef.name }}
      {{- with .Values.gateway.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gateway.parentRef.httpsSectionName }}
      sectionName: {{ . }}
      {{- end }}
    {{- end }}
  hostnames:
    - {{ required "gateway.hostname is required" .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "artemis.httpName" . }}
          port: 8080
{{- end }}
