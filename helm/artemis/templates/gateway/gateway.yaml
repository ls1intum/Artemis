{{- /*
Gateway API Gateway with up to three listeners:
  - HTTP/80   (ACME HTTP-01 challenges via cert-manager) - when httpListener=true
  - HTTPS/443 (terminated here, routed to Artemis HTTP by the HTTPRoute)
  - TCP/7921  (git-over-SSH, routed by the TCPRoute) - only when ssh.mode=tcproute
Set gateway.create=false to attach the routes to an existing Gateway instead.
*/ -}}
{{- if .Values.gateway.create }}
{{- $issuer := include "artemis.certIssuerName" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "artemis.fullname" . }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
  {{- if $issuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $issuer | quote }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.create=true" .Values.gateway.className }}
  listeners:
    {{- if .Values.gateway.httpListener }}
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ required "gateway.hostname is required" .Values.gateway.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ required "gateway.hostname is required" .Values.gateway.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "artemis.tlsSecretName" . }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if eq .Values.gateway.ssh.mode "tcproute" }}
    - name: ssh
      protocol: TCP
      port: {{ .Values.gateway.ssh.port }}
      allowedRoutes:
        kinds:
          - kind: TCPRoute
        namespaces:
          from: Same
    {{- end }}
{{- end }}
