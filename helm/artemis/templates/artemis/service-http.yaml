{{- /* Load-balanced HTTP service across all ready core pods; HTTPRoute backend. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artemis.httpName" . }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "artemis.coreSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
