            schema:
              type: array
              items: {$ref: '#/components/schemas/TutorialGroupImportData'}
              uniqueItems: true
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TutorialGroupImportData'}
  /api/tutorialgroup/courses/{courseId}/tutorial-groups-configurations/{tutorialGroupsConfigurationId}/tutorial-free-periods:
    post:
      tags: [tutorial-group-free-period]
      operationId: create
