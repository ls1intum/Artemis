  /api/quiz/courses/{courseId}/training-questions:
    post:
      tags: [quiz-training]
      operationId: getQuizQuestionsForPractice
      parameters:
      - name: courseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema: {type: integer, default: 0, minimum: 0}
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema: {type: integer, default: 20, minimum: 1}
      - name: sort
        in: query
        description: 'Sorting criteria in the format: property,(asc|desc). Default
          sort order is ascending. Multiple sort criteria are supported.'
        required: false
        schema:
          type: array
          items: {type: string}
      - name: isNewSession
        in: query
        required: true
        schema: {type: boolean}
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items: {type: integer, format: int64}
              uniqueItems: true
        required: true
      responses:
        '200':
          description: OK
          headers:
            X-Has-Next:
              style: simple
              schema: {type: boolean}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/QuizQuestionTraining'}
