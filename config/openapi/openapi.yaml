        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuizSubmissionBeforeEvaluation'}
  /api/hyperion/courses/{courseId}/quiz-question-pool/settings:
