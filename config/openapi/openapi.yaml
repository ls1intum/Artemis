  /api/search:
    get:
      tags: [Global Search]
      summary: Perform a unified semantic search across entity types
      description: |-
        Searches across multiple entity types (exercises, lectures, lecture units, exams, FAQs, channels, courses)
        with a consistent response format. Messages and replies are not searchable; the types post and answer_post are
        accepted for compatibility but match nothing. When courseIds is not specified, the search is performed
        globally across all courses the authenticated user has access to. Per-type access rules are
        enforced server-side via compound Weaviate filters.
      operationId: globalSearch
      parameters:
      - name: q
        in: query
        description: Search query; can be empty to retrieve recent items
        required: true
        schema: {type: string}
      - name: types
        in: query
        description: Comma-separated entity type filter (exercise, lecture, lecture_unit,
          exam, faq, channel, course) or 'all'; default 'all'. post and answer_post
          are accepted but match nothing
        required: false
        schema: {type: string}
      - name: excludeTypes
        in: query
        description: Comma-separated entity types to hide from the results; applied
          after 'types'
        required: false
        schema: {type: string}
      - name: courseIds
        in: query
        description: Course IDs to restrict the search to one or more courses (OR);
          inaccessible IDs are ignored
        required: false
        schema:
          type: array
          items: {type: integer, format: int64}
      - name: excludeCourseIds
        in: query
        description: Course IDs to exclude from the search; results in these courses
          are hidden
        required: false
        schema:
          type: array
          items: {type: integer, format: int64}
      - name: limit
        in: query
        description: Maximum number of results (1–25, default 10)
        required: false
        schema: {type: integer, format: int32, default: 10}
      - name: courseId
        in: query
        description: Deprecated, use courseIds. A single course ID, still honored
          for clients that predate courseIds
        required: false
        deprecated: true
        schema: {type: integer, format: int64}
      responses:
        '200':
          description: Search results matching the query
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/GlobalSearchResult'}
        '400':
          description: Unsupported entity type requested, or more course IDs than
            the endpoint accepts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/GlobalSearchResult'}
  /api/search/course-options:
    get:
      tags: [Global Search]
      summary: List the courses a global search can be scoped to
      description: Returns every course the user has access to, active and past, with
        an active flag.
      operationId: getCourseFilterOptions
      responses:
        '200':
          description: The courses the user can filter the global search by
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CourseForSearchFilter'}
