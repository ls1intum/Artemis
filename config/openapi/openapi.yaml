components:
  schemas:
    CourseCompetency:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        description: {type: string}
        taxonomy:
          type: string
          enum: [REMEMBER, UNDERSTAND, APPLY, ANALYZE, EVALUATE, CREATE]
        softDueDate: {type: string, format: date-time}
        masteryThreshold: {type: integer, format: int32}
        optional: {type: boolean}
        generatedByAi: {type: boolean}
        type: {type: string}
    VariantJob:
      type: object
      properties:
        jobId: {type: string}
        sourceExerciseId: {type: integer, format: int64}
        courseId: {type: integer, format: int64}
        sourceExerciseTitle: {type: string}
        exerciseType:
          type: string
          enum: [text, programming, modeling, file-upload, quiz]
        phase:
          type: string
          enum: [ANALYZING, PLANNING, PROVISIONING, TRANSFORMING, VERIFYING, REPAIRING,
            FINALIZING, COMPLETED, DRAFT_WITH_WARNINGS, FAILED, CANCELLED]
        failedInPhase:
          type: string
          enum: [ANALYZING, PLANNING, PROVISIONING, TRANSFORMING, VERIFYING, REPAIRING,
            FINALIZING, COMPLETED, DRAFT_WITH_WARNINGS, FAILED, CANCELLED]
        failureDetail: {type: string}
        instructorSummary: {type: string}
        attempt: {type: integer, format: int32}
        maxAttempts: {type: integer, format: int32}
        variantExerciseId: {type: integer, format: int64}
        variantExerciseTitle: {type: string}
        request: {$ref: '#/components/schemas/VariantGenerationRequest'}
        warnings:
          type: array
          items: {type: string}
        totalTokensUsed: {type: integer, format: int64}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    QuizBatchWithPassword:
      type: object
      properties:
        id: {type: integer, format: int64}
        startTime: {type: string, format: date-time}
        started: {type: boolean}
        ended: {type: boolean}
        password: {type: string}
    ExerciseVariantGroupReference:
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        maxPoints: {type: number, format: double}
        releaseDate: {type: string, format: date-time}
        startDate: {type: string, format: date-time}
        dueDate: {type: string, format: date-time}
        assessmentDueDate: {type: string, format: date-time}
        exampleSolutionPublicationDate: {type: string, format: date-time}
    ChecklistAnalysisRequest:
      type: object
      description: Request to analyze a problem statement for quality, competencies,
        and difficulty
      properties:
        problemStatementMarkdown: {type: string, description: Problem statement in
            Markdown format, maxLength: 50000, minLength: 1}
        declaredDifficulty: {type: string, description: Declared difficulty of the
            exercise, maxLength: 20, minLength: 0, pattern: EASY|MEDIUM|HARD}
        language: {type: string, description: 'Programming language, e.g. JAVA, PYTHON',
          maxLength: 50, minLength: 0}
        exerciseId: {type: integer, format: int64, description: ID of the exercise,
          exclusiveMinimum: 0}
      required: [problemStatementMarkdown]
    ExerciseGenerationFileChange:
      type: object
      description: A file changed by the generation agent
      properties:
        type:
          type: string
          description: Constant discriminator identifying a file change on the shared
            topic
          enum: [FILE_CHANGE]
        path: {type: string, description: Workspace-relative file path}
        repo:
          type: string
          description: Owning repository bucket
          enum: [solution, template, tests, other]
        action:
          type: string
          description: The successful file tool operation
          enum: [write, edit, delete]
        turn: {type: integer, format: int32, description: The agent turn the change
            happened on}
        timestamp: {type: string, format: date-time, description: The moment the change
            was produced}
      required: [action, path, repo, timestamp, turn, type]
    QuizSubmissionBeforeEvaluation:
      type: object
      properties:
        id: {type: integer, format: int64}
        submissionExerciseType: {type: string}
        submitted: {type: boolean}
        type:
          type: string
          enum: [MANUAL, TIMEOUT, TEST, OTHER, INSTRUCTOR, EXTERNAL]
        submissionDate: {type: string, format: date-time}
        submittedAnswers:
          type: array
          items: {$ref: '#/components/schemas/SubmittedAnswerBeforeEvaluation'}
          uniqueItems: true
    ChecklistAnalysisResponse:
      type: object
      description: Response containing the checklist analysis results
      properties:
        inferredCompetencies:
          type: array
          description: Top inferred competencies from the standardized catalog
          items: {$ref: '#/components/schemas/InferredCompetency'}
        bloomRadar: {$ref: '#/components/schemas/BloomRadar', description: Bloom's
            taxonomy radar distribution}
        difficultyAssessment: {$ref: '#/components/schemas/DifficultyAssessment',
          description: Difficulty assessment with delta indicator}
        qualityIssues:
          type: array
          description: List of quality issues found in the problem statement
          items: {$ref: '#/components/schemas/QualityIssue'}
    ChecklistActionResponse:
      type: object
      description: Response from applying a checklist action to the problem statement
      properties:
        updatedProblemStatement: {type: string, description: The updated problem statement
            markdown}
        applied: {type: boolean, description: Whether the action was successfully
            applied}
        summary: {type: string, description: Short summary of what was changed}
    DragAndDropQuestionStatistic:
      required: [type]
      type: object
      properties:
        participantsRated: {type: integer, format: int32}
        participantsUnrated: {type: integer, format: int32}
        ratedCorrectCounter: {type: integer, format: int32}
        unRatedCorrectCounter: {type: integer, format: int32}
        dropLocationCounters:
          type: array
          items: {$ref: '#/components/schemas/DropLocationCounter'}
          uniqueItems: true
        type:
          type: string
          default: drag-and-drop
          enum: [drag-and-drop]
    MultipleChoiceQuestionStatistic:
      required: [type]
      type: object
      properties:
        participantsRated: {type: integer, format: int32}
        participantsUnrated: {type: integer, format: int32}
        ratedCorrectCounter: {type: integer, format: int32}
        unRatedCorrectCounter: {type: integer, format: int32}
        answerCounters:
          type: array
          items: {$ref: '#/components/schemas/AnswerCounter'}
          uniqueItems: true
        type:
          type: string
          default: multiple-choice
          enum: [multiple-choice]
    ExerciseGenerationRetainedFile:
      type: object
      description: A file of a generated candidate that was not saved to the exercise
      properties:
        repo:
          type: string
          description: Owning repository bucket
          enum: [solution, template, tests]
        path: {type: string, description: Repository-relative file path}
        content: {type: string, description: The file's text content as the agent
            left it}
      required: [content, path, repo]
    DropLocationCounter:
      type: object
      properties:
        dropLocationId: {type: integer, format: int64}
        ratedCounter: {type: integer, format: int32}
        unRatedCounter: {type: integer, format: int32}
    SubmittedAnswerFromLiveClient:
      discriminator:
        propertyName: type
        mapping: {multiple-choice: '#/components/schemas/MultipleChoiceSubmittedAnswerFromLiveClient',
          drag-and-drop: '#/components/schemas/DragAndDropSubmittedAnswerFromLiveClient',
          short-answer: '#/components/schemas/ShortAnswerSubmittedAnswerFromLiveClient'}
      oneOf:
      - {$ref: '#/components/schemas/MultipleChoiceSubmittedAnswerFromLiveClient'}
      - {$ref: '#/components/schemas/DragAndDropSubmittedAnswerFromLiveClient'}
      - {$ref: '#/components/schemas/ShortAnswerSubmittedAnswerFromLiveClient'}
      properties:
        type: {type: string}
      required: [type]
    ExerciseGenerationUsage:
      type: object
      properties:
        modelCalls: {type: integer, format: int64}
        toolCalls: {type: integer, format: int64}
        agentTurns: {type: integer, format: int64}
        attempts: {type: integer, format: int64}
        inputTokens: {type: integer, format: int64}
        outputTokens: {type: integer, format: int64}
        cachedInputTokens: {type: integer, format: int64}
        cachedInputTokensComplete: {type: boolean}
        estimatedCostEur: {type: number, format: double}
        estimatedCostEurComplete: {type: boolean}
        models:
          type: array
          items: {type: string}
        providerRequestIds:
          type: array
          items: {type: string}
        providerRequestIdsComplete: {type: boolean}
      required: [agentTurns, attempts, cachedInputTokens, cachedInputTokensComplete,
        estimatedCostEur, estimatedCostEurComplete, inputTokens, modelCalls, models,
        outputTokens, providerRequestIds, providerRequestIdsComplete, toolCalls]
    ExerciseGenerationJobStart:
      type: object
      properties:
        jobId: {type: string}
        exerciseId: {type: integer, format: int64}
        sourceExerciseId: {type: integer, format: int64}
      required: [jobId]
    QuizQuestionWithSolution:
      discriminator:
        propertyName: type
        mapping: {multiple-choice: '#/components/schemas/MultipleChoiceQuizQuestionWithSolution',
          drag-and-drop: '#/components/schemas/DragAndDropQuizQuestionWithSolution',
          short-answer: '#/components/schemas/ShortAnswerQuizQuestionWithSolution'}
      oneOf:
      - {$ref: '#/components/schemas/MultipleChoiceQuizQuestionWithSolution'}
      - {$ref: '#/components/schemas/DragAndDropQuizQuestionWithSolution'}
      - {$ref: '#/components/schemas/ShortAnswerQuizQuestionWithSolution'}
      properties:
        type: {type: string}
      required: [type]
    BloomRadar:
      type: object
      description: Bloom's taxonomy radar distribution with normalized proportions
        (0.0–1.0, summing to 1.0)
      properties:
        REMEMBER: {type: number, format: double, description: Proportion of REMEMBER
            level (0.0–1.0)}
        UNDERSTAND: {type: number, format: double, description: Proportion of UNDERSTAND
            level (0.0–1.0)}
        APPLY: {type: number, format: double, description: Proportion of APPLY level
            (0.0–1.0)}
        ANALYZE: {type: number, format: double, description: Proportion of ANALYZE
            level (0.0–1.0)}
        EVALUATE: {type: number, format: double, description: Proportion of EVALUATE
            level (0.0–1.0)}
        CREATE: {type: number, format: double, description: Proportion of CREATE level
            (0.0–1.0)}
    IngestionTypeCount:
      type: object
      properties:
        type: {type: string}
        expected: {type: integer, format: int64}
        indexed: {type: integer, format: int64}
        missing: {type: integer, format: int64}
        orphaned: {type: integer, format: int64}
    MultipleChoiceQuestionFromEditor:
      required: [answerOptions, points, scoringType, singleChoice, title, type]
      type: object
      properties:
        id: {type: integer, format: int64}
        title: {type: string}
        text: {type: string}
        hint: {type: string}
        explanation: {type: string}
        points: {type: number, format: double, exclusiveMinimum: 0}
        scoringType:
          type: string
          enum: [ALL_OR_NOTHING, PROPORTIONAL_WITH_PENALTY, PROPORTIONAL_WITHOUT_PENALTY]
        randomizeOrder: {type: boolean}
        answerOptions:
          type: array
