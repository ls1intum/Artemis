              type: object
              properties:
                exercise: {$ref: '#/components/schemas/QuizExerciseReEvaluate'}
                files:
                  type: array
                  items: {type: string, format: binary}
              required: [exercise]
      responses:
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema: {type: object}
        '200': {description: OK}
  /api/quiz/quiz-exercises/{quizExerciseId}/add-batch:
    put:
      tags: [quiz-exercise-batch]
