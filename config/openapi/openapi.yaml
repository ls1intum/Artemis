  /api/quiz/quiz-exercises/{quizExerciseId}/{action}:
    put:
      tags: [quiz-exercise]
      operationId: performActionForQuizExercise
      parameters:
      - name: quizExerciseId
        in: path
        required: true
        schema: {type: integer, format: int64}
      - name: action
        in: path
        required: true
