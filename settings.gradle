import org.apache.tools.ant.DirectoryScanner

pluginManagement {
    repositories {
        mavenLocal()
        // Preferred Maven Central mirror hosted in TUM AET infrastructure (avoids upstream 429 rate-limit errors during plugin resolution)
        maven {
            name = "reposiliteRepository"
            url = "https://reposilite.aet.cit.tum.de/releases"
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id "org.liquibase.gradle" version "${liquibase_plugin_version}"
        id "net.ltgt.apt-eclipse" version "${apt_plugin_version}"
        id "net.ltgt.apt-idea" version "${apt_plugin_version}"
        id "net.ltgt.apt" version "${apt_plugin_version}"
    }
}

rootProject.name = "Artemis"

// needed for programming exercise templates
DirectoryScanner.removeDefaultExclude "**/.gitattributes"
DirectoryScanner.removeDefaultExclude "**/.gitignore"

include 'hyperion', 'aiworker', 'aiworker:api', 'junit-report'
project(':hyperion').projectDir = file('modules/hyperion')
project(':junit-report').projectDir = file('modules/junit-report')
project(':aiworker').projectDir = file('modules/aiworker')
project(':aiworker:api').projectDir = file('modules/aiworker/api')

include 'hyperion:worker'
project(':hyperion:worker').projectDir = file('modules/hyperion/worker')
