def profiles = "prod"
if (project.hasProperty("no-liquibase")) {
    profiles += ",no-liquibase"
}

springBoot {
    buildInfo()
}

bootRun {
    args = []
    // Required by the Weaviate Java client v6, which uses Gson's reflection-based serialization on internal java.lang classes.
    // See: https://github.com/weaviate/java-client?tab=readme-ov-file#gson-and-reflective-access-to-internal-jdk-classes
    // This is harmless: it only opens java.lang to classpath code within the same JVM process and does not expand the attack surface for remote exploits.
    jvmArgs = ["--add-opens=java.base/java.lang=ALL-UNNAMED"]
}

tasks.register("webapp_test", PnpmTask) {
    dependsOn pnpmInstall
    args = ["run", "webapp:test"]
}

tasks.register("webapp", PnpmTask) {
    dependsOn pnpmInstall
    outputs.dir("build/resources/main/static/").withPropertyName("webapp-build-dir")

    if (project.hasProperty("skipWebapp")) {
        inputs.dir("build/webapp-temp").withPropertyName("webapp-temp-source")
        args = ["-v"]
        doLast {
            def source = file("build/webapp-temp")
            def destination = file("build/resources/main/static")

            // Restore the already-built webapp from its temporary safe location back to its expected directory.
            // This works around an issue where `-x webapp` would otherwise delete the build output: the previous
            // client build is stashed in a safe location and moved back here as if it had just been built.
            delete(destination)
            if (!source.renameTo(destination)) {
                copy {
                    from source
                    into destination
                }
                delete(source)
            }
        }
    } else {
        args = ["run", "webapp:prod"]
    }
    environment = [APP_VERSION: project.version]
}

processResources {
    inputs.property("version", version)
    inputs.property("springProfiles", profiles)
    filesMatching("**/application.yml") {
        filter {
            it.replace("#project.version#", version)
        }
        filter {
            it.replace("#spring.profiles.active#", profiles)
        }
    }
}

test.dependsOn webapp_test
processResources.dependsOn webapp
bootJar.dependsOn processResources
