// SonarQube Cloud analysis of the deployed Artemis application (server + client in one project).
//
// WHY THIS EXISTS: the README's code-quality badge is served by Codacy, whose grade is computed from
// a narrow SAST-only pattern set — 9 issues over ~925k LOC, which reads "A" without saying much about
// the quality system Artemis actually enforces (Spotless, Checkstyle, Modernizer, ArchUnit, ~14
// custom ESLint rules, Stylelint, the over-fetch detector, per-module coverage floors). Sonar is set
// up alongside it, not instead of it, so the two grades can be compared on the same code before any
// badge decision is made. Sonar also serves the README project badges and the required PR gate;
// see `.github/workflows/README.md`.
//
// SCOPE IS A CONTRACT WITH `.codacy.yaml`. The exclusion list below mirrors that file's repository-wide
// `exclude_paths` floor, so neither tool grades exercise starter code, test code or internal tooling.
// Change one, change the other, or the two grades quietly diverge.
//
// The two scopes are not identical, and the difference is deliberate. `.codacy.yaml` sets no
// `include_paths`, so Codacy analyses whatever it supports across the whole repository minus that floor —
// CI workflows, shell scripts, the ESLint rule sources. Sonar analyses the four application source roots
// named below. The overlap is the deployed application, which is what the two grades are compared on;
// Codacy simply also reports on the surrounding tooling.
//
// Analysis is CI-only (`.github/workflows/ci-sonar.yml`) and needs `SONAR_TOKEN`. Running `./gradlew
// sonar` locally without that token fails at the upload step, which is why nothing wires `sonar` into
// `check` or `build`.

// Paths excluded from analysis, mirroring the `exclude_paths` floor in `.codacy.yaml`.
//
// Sonar's Ant-style globs are not Codacy's, so the two lists are spelled differently for the same
// intent: Codacy needs both `dir/**` and `dir/**/*` to cover a tree, Sonar covers it with `dir/**`.
def sharedExclusions = [
    // Programming-exercise templates: sample/starter code shipped for exercises, not application code.
    "src/main/resources/templates/**",
    // Test code and test resources: hardcoded test credentials, non-literal fs/regexp in helpers and
    // sample payloads are intentional fixtures, not defects.
    "src/test/**",
    "**/*.spec.ts",
    // Storybook stories and the Angular wrapper decorators: static examples that trip the
    // html-in-template-string rule through Storybook's rendering API.
    "**/*.stories.ts",
    "packages/tum-aet-ui/.storybook/story-decorators.ts",
    // Internal developer/CI tooling (coverage reporting, course setup, transcription, benchmarks).
    // Not part of the deployed application and not exposed to untrusted end-user input.
    "supporting_scripts/**",
    // Throwaway OIDC test identity provider used only by the local E2E stack.
    "deployment/docker/oidc-test/**",
]

// Findings that are suppressed on purpose, one entry per file because Sonar matches an exclusion by rule and
// file, not by line. Each of them is a case the rule cannot see through. They are listed here, in review, rather
// than marked as false positives in the Sonar UI, where nobody would notice a change.
//
// Web:MouseEventWithoutKeyboardEquivalentCheck asks for a keydown/keyup attribute on every element that listens
// for a click. These templates deliberately keep a pointer-only wrapper and give keyboard users a native control
// that runs the same action: a button inside the post preview and the notification stack, the input of the
// autocomplete (the options are reached with aria-activedescendant, never by focus), the Escape handler of the
// fullscreen PDF dialog behind its backdrop. A key handler on the wrapper would trigger the action twice.
def pointerOnlyWrapperTemplates = [
    "packages/tum-aet-ui/src/lib/autocomplete/tumaet-ui-autocomplete.component.html",
    "src/main/webapp/app/communication/course-conversations-components/posting-summary/posting-summary.component.html",
    "src/main/webapp/app/communication/post/post.component.html",
    "src/main/webapp/app/notification/course-notification/course-notification-popup-overlay/course-notification-popup-overlay.component.html",
    "src/main/webapp/app/lecture/shared/pdf-viewer/pdf-viewer.component.html",
]
// Web:S5256 wants a th element in the same template as the table. The two build queue tables render their header
// row through the jhi-build-jobs-header component, whose template holds the th cells.
def headerComponentTemplates = [
    "src/main/webapp/app/localci/build-queue/tables/running-jobs-table/running-jobs-table.component.html",
    "src/main/webapp/app/localci/build-queue/tables/queued-jobs-table/queued-jobs-table.component.html",
]
def issueIgnores = []
pointerOnlyWrapperTemplates.each { issueIgnores << ["Web:MouseEventWithoutKeyboardEquivalentCheck", it] }
headerComponentTemplates.each { issueIgnores << ["Web:S5256", it] }

sonar {
    properties {
        property "sonar.projectKey", "ls1intum_Artemis"
        property "sonar.organization", "ls1intum"
        // Explicit rather than relying on the plugin's default. The default host is a local
        // SonarQube Server, so omitting this turns a misconfigured CI run into a confusing
        // connection error against localhost instead of an auth error against the real service.
        // SonarQube Cloud's EU instance is the default region, so `sonar.region` is deliberately unset.
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.projectName", "Artemis"
        property "sonar.projectVersion", project.version
        property "sonar.sourceEncoding", "UTF-8"

        // The plugin derives `sonar.sources` from the Java source sets alone, which would leave the
        // entire Angular client unanalyzed. Naming the roots explicitly brings the client and the
        // TUM AET UI package in. `sonar.java.binaries` / `sonar.java.libraries` are set by the plugin
        // independently of this property, so overriding it does not disturb the Java analysis.
        property "sonar.sources", [
            "src/main/java",
            "src/main/resources",
            "src/core", "src/buildagent", "src/aiworker", "src/worker",
            "src/main/webapp",
            "packages/tum-aet-ui/src",
        ].join(",")

        if (project.hasProperty("war")) {
            property "sonar.java.binaries", ["main", "core", "buildagent", "aiworker"].collect { layout.buildDirectory.dir("classes/java/${it}").get().asFile }
        }
        property "sonar.exclusions", sharedExclusions.join(",")

        property "sonar.issue.ignore.multicriteria", issueIgnores.indices.collect { "e${it}" }.join(",")
        issueIgnores.eachWithIndex { ignore, index ->
            property "sonar.issue.ignore.multicriteria.e${index}.ruleKey", ignore[0]
            property "sonar.issue.ignore.multicriteria.e${index}.resourceKey", ignore[1]
        }

        // Clear the test root the plugin derives from the `test` source set. Test code is out of scope
        // by the agreement above, and leaving the root declared while `sonar.exclusions` removes the
        // same tree makes the scanner warn about every file it is told to index and then cannot.
        //
        // Coverage is unaffected: JaCoCo and LCOV report against the main files, not the test files.
        // Sonar would also keep test findings out of the project's ratings on its own — test files get
        // test-specific rules and never move the maintainability/reliability/security grades — so this
        // is about scan scope and comparability with Codacy, not about protecting the grade. It is not
        // free either way: `src/test` holds ~285k lines of Java and ~304k of specs.
        properties["sonar.tests"] = []

        // Coverage comes from the reports the `test` job already uploads as artifacts, so Sonar never
        // re-runs a suite. `ci-sonar.yml` downloads them to exactly these paths.
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/aggregated/jacocoTestReport.xml"
        property "sonar.javascript.lcov.reportPaths", "build/test-results/vitest/coverage/lcov.info"

        // Generated code is analyzed (it is shipped) but excluded from the coverage ratio: the OpenAPI
        // client is regenerated from the server contract and is deliberately left untested, exactly as
        // `vitest.config.ts` already excludes it from the client coverage floor.
        //
        // The list mirrors that file's `coverage.exclude`, and it has to: Sonar computes the ratio over
        // whatever it indexed, so a file the LCOV report never mentions counts as fully uncovered
        // rather than as absent. The same reasoning excludes `packages/tum-aet-ui/src` — it is in
        // `sonar.sources` because the package ships, but the only LCOV report imported here covers
        // `src/main/webapp/app/**/*.ts` (`vitest.config.ts`, `coverage.include`). TUM AET UI is tested by
        // its own run (`pnpm run tum-aet-ui:test:coverage`, `ng test tum-aet-ui --coverage`), which neither
        // emits LCOV nor uploads an artifact for `ci-sonar.yml` to download. Leaving it in the
        // denominator would report a tested package as 0% covered. Drop this entry as soon as that run
        // publishes a report the Sonar job imports.
        property "sonar.coverage.exclusions", [
            "src/main/webapp/app/openapi/**",
            "src/main/webapp/app/**/*.route.ts",
            "src/main/webapp/app/**/*.routes.ts",
            "src/main/webapp/app/**/*.model.ts",
            "src/main/webapp/app/core/config/dayjs.ts",
            "src/main/webapp/app/core/config/monaco.config.ts",
            "src/main/webapp/app/core/config/prod.config.ts",
            "packages/tum-aet-ui/src/**",
        ].join(",")
    }
}
