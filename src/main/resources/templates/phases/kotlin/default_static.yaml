- name: compile
  script: 'mvn -B clean compile'
- name: test
  script: 'mvn -B test'
  resultPaths:
    - '**/target/surefire-reports/*.xml'
- name: static_code_analysis
  script: 'detekt --input "${studentParentWorkingDirectoryName}" --config staticCodeAnalysisConfig/detekt-student.yml --build-upon-default-config --report sarif:detekt.sarif'
  forceRun: true
  resultPaths:
    - detekt.sarif
