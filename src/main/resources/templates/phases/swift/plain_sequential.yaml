- name: setup
  script: |-
    cp -R Tests ${studentParentWorkingDirectoryName}
    cp Package.swift ${studentParentWorkingDirectoryName}
- name: compile
  script: |-
    cd ${studentParentWorkingDirectoryName}
    swift build
- name: structural_tests
  script: |-
    cd ${studentParentWorkingDirectoryName}
    status=0
    # Swift Testing appends -swift-testing to the name of the xUnit file
    swift test --filter 'AttributeTest|ClassTest|MethodTest' --xunit-output tests.xml || status=$?
    mv tests-swift-testing.xml structural-tests.xml
    exit $status
  resultPaths:
    - '${studentParentWorkingDirectoryName}/structural-tests.xml'
- name: behavior_tests
  script: |-
    cd ${studentParentWorkingDirectoryName}
    status=0
    swift test --filter 'SortingExampleBehaviorTest' --xunit-output tests.xml || status=$?
    mv tests-swift-testing.xml behavior-tests.xml
    exit $status
  resultPaths:
    - '${studentParentWorkingDirectoryName}/behavior-tests.xml'
- name: finalize
  script: |-
    # The used docker container is calling 'swift build' which creates files as root (e.g. tests.xml),
    # so we need to allow everyone to access these files
    chmod -R 777 .
  forceRun: true
