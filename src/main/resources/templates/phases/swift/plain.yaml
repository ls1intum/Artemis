- name: setup
  script: |-
    cp -R Tests ${studentParentWorkingDirectoryName}
    cp Package.swift ${studentParentWorkingDirectoryName}
- name: compile
  script: |-
    cd ${studentParentWorkingDirectoryName}
    swift build
- name: test
  script: |-
    cd ${studentParentWorkingDirectoryName}
    # Swift Testing appends -swift-testing to the name of the xUnit file, so the results are in tests-swift-testing.xml
    swift test --xunit-output tests.xml
  resultPaths:
    - '${studentParentWorkingDirectoryName}/tests-swift-testing.xml'
- name: finalize
  script: |-
    # The used docker container is calling 'swift build' which creates files as root (e.g. tests.xml),
    # so we need to allow everyone to access these files
    chmod -R 777 .
  forceRun: true
