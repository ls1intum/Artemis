- name: install_dependencies
  script: 'npm ci --prefer-offline --no-audit'
- name: syntax_check
  script: 'find ${studentParentWorkingDirectoryName}/src -type f -name "*.js" -print0 | xargs -0 -n1 node --check'
- name: structural_tests
  script: |-
    status=0
    npm run test:ci -- src/structural.test.js || status=$?
    mv junit.xml structural-junit.xml
    exit $status
  resultPaths:
    - structural-junit.xml
- name: behavior_tests
  script: |-
    status=0
    npm run test:ci -- src/behavior.test.js || status=$?
    mv junit.xml behavior-junit.xml
    exit $status
  resultPaths:
    - behavior-junit.xml
