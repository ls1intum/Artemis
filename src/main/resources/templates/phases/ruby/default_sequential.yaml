- name: install_dependencies
  script: |-
    cd "${testWorkingDirectory}"
    bundler install
- name: syntax_check
  script: |-
    find . -type f -name "*.rb" -print0 | xargs -0 -n1 ruby -wc
- name: structural_tests
  script: |-
    cd "${testWorkingDirectory}"
    status=0
    # The rake task ignores TEST and always runs every test file, so the file is run directly with the options of the ci:test task
    bundler exec ruby -Itest test/test_structural.rb --verbose --junit --junit-jenkins --junit-filename=report.xml || status=$?
    mv report.xml structural-report.xml
    exit $status
  resultPaths:
    - '${testWorkingDirectory}/structural-report.xml'
- name: behavior_tests
  script: |-
    cd "${testWorkingDirectory}"
    status=0
    bundler exec ruby -Itest test/test_behavior.rb --verbose --junit --junit-jenkins --junit-filename=report.xml || status=$?
    mv report.xml behavior-report.xml
    exit $status
  resultPaths:
    - '${testWorkingDirectory}/behavior-report.xml'
