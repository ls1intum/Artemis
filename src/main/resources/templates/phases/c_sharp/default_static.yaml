- name: build
  script: 'dotnet build "${testWorkingDirectory}"'
- name: test
  script: 'dotnet test --logger=junit "${testWorkingDirectory}"'
  resultPaths:
    - '${testWorkingDirectory}/TestResults/TestResults.xml'
- name: static_code_analysis
  script: |-
    root="$(pwd)"
    # The analyzers of the .NET SDK run as part of the compiler and write their findings to the error log. The compiler has to run again.
    dotnet build "${studentParentWorkingDirectoryName}/assignment.csproj" --no-incremental -p:AnalysisLevel=latest-recommended "-p:ErrorLog=${root}/roslyn.sarif%2Cversion=2.1"
  forceRun: true
  resultPaths:
    - roslyn.sarif
