- name: build
  script: |-
    cd "${testWorkingDirectory}"
    go test -c -o /dev/null ./...
- name: test
  script: |-
    cd "${testWorkingDirectory}"
    go test ./... -json 2>&1 | go-junit-report -parser gojson -out test-results.xml
  resultPaths:
    - '${testWorkingDirectory}/test-results.xml'
- name: static_code_analysis
  script: |-
    root="$(pwd)"
    cd "${studentParentWorkingDirectoryName}"
    # --path-mode abs makes the paths of the report independent of the working directory, as they are for the other tools
    golangci-lint run --config "${root}/.golangci.yml" --path-mode abs --issues-exit-code 0 --output.sarif.path "${root}/golangci-lint.sarif"
  forceRun: true
  resultPaths:
    - golangci-lint.sarif
