- name: build
  script: 'cargo build --tests --profile test'
- name: structural_tests
  script: |-
    status=0
    cargo nextest run --profile ci --test structural || status=$?
    cp target/nextest/ci/junit.xml target/nextest/ci/structural-junit.xml
    exit $status
  resultPaths:
    - target/nextest/ci/structural-junit.xml
- name: behavior_tests
  script: |-
    status=0
    cargo nextest run --profile ci --test behavior || status=$?
    cp target/nextest/ci/junit.xml target/nextest/ci/behavior-junit.xml
    exit $status
  resultPaths:
    - target/nextest/ci/behavior-junit.xml
