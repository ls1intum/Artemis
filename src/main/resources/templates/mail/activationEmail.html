<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{email.activation.title}">Artemis activation</title>
    <th:block th:replace="~{mail/notification/fragments :: headMetaDataAndIconLink}"/>
    <th:block th:replace="~{mail/notification/fragments :: css}"/>
</head>

<body>
<th:block th:replace="~{mail/notification/fragments :: header}" />

<div id="message-body">
    <p th:text="#{email.activation.greeting(${user.login})}">
        Dear
    </p>
    <p th:text="#{email.activation.text1}">
        Your Artemis account has been created, please click on the URL below to activate it:
    </p>
    <p>
        <a th:with="url=(@{|${baseUrl}/account/activate?key=${user.activationKey}|})" th:href="${url}" th:text="${url}">Activation link</a>
    </p>

    <th:block th:replace="~{mail/notification/fragments :: farewell}" />
</div>

<!-- No footer fragment: it links to the notification settings, and an activation mail is not a notification that can be switched off there. -->

</body>
</html>
