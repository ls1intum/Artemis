<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{email.notification.passwordResetCompleted.title}">Notification Title</title>
    <th:block th:replace="~{mail/notification/fragments :: headMetaDataAndIconLink}"/>
    <th:block th:replace="~{mail/notification/fragments :: css}"/>
</head>

<body>
<th:block th:replace="~{mail/notification/fragments :: header}" />

<div id="message-body">
    <th:block th:replace="~{mail/notification/fragments :: greetingsFullName}" />

    <p th:text="#{email.notification.passwordResetCompleted.text}">
        The password for your Artemis account was just reset.
    </p>

    <p>
        <span th:text="#{email.notification.passwordResetCompleted.actionRequired}">If you did not do this, someone else may have access to your account. Please reset your password again immediately and contact support</span>:

        <a th:with="url=(@{|${baseUrl}/account/reset/request|})" th:href="${url}" th:text="${url}">Reset password</a>
    </p>

    <th:block th:replace="~{mail/notification/fragments :: farewell}" />
</div>

<th:block th:replace="~{mail/notification/fragments :: footer}" />

</body>
</html>
