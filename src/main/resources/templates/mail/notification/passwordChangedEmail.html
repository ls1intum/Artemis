<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{email.notification.passwordChanged.title}">Notification Title</title>
    <th:block th:replace="~{mail/notification/fragments :: headMetaDataAndIconLink}"/>
    <th:block th:replace="~{mail/notification/fragments :: css}"/>
</head>

<body>
<th:block th:replace="~{mail/notification/fragments :: header}" />

<div id="message-body">
    <th:block th:replace="~{mail/notification/fragments :: greetingsFullName}" />

    <p th:if="${changedByAdministrator}" th:text="#{email.notification.passwordChanged.byAdministrator}">An administrator changed the password of your Artemis account.</p>
    <p th:if="${changedViaReset}" th:text="#{email.notification.passwordChanged.byReset}">The password of your Artemis account was reset.</p>
    <p th:if="${!changedByAdministrator and !changedViaReset}" th:text="#{email.notification.passwordChanged.byOwner}">The password of your Artemis account was changed.</p>

    <th:block th:replace="~{mail/notification/credentialsRevokedEmail :: revokedCredentials}" />

    <p>
        <span th:text="#{email.notification.credentials.notYou}">If you did not expect this change, contact your administrator immediately</span>:
        <a th:with="url=(@{|${baseUrl}/user-settings/account|})" th:href="${url}" th:text="${url}">User Account</a>
    </p>

    <th:block th:replace="~{mail/notification/fragments :: farewell}" />
</div>

<th:block th:replace="~{mail/notification/fragments :: footer}" />

</body>
</html>
