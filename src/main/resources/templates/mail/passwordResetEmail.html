<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{email.reset.title}">Artemis password reset</title>
    <th:block th:replace="~{mail/notification/fragments :: headMetaDataAndIconLink}"/>
    <th:block th:replace="~{mail/notification/fragments :: css}"/>
</head>

<body>
<th:block th:replace="~{mail/notification/fragments :: header}" />

<div id="message-body">
    <p th:text="#{email.reset.greeting(${user.login})}">
        Dear
    </p>
    <p th:text="#{email.reset.text1}">
        For your Artemis account a password reset was requested, please click on the URL below to reset it:
    </p>
    <p>
        <a th:with="url=(@{|${baseUrl}/account/reset/finish?email=${user.email}&key=${user.resetKey}|})" th:href="${url}" th:text="${url}">Login link</a>
    </p>

    <th:block th:replace="~{mail/notification/fragments :: farewell}" />
</div>

<!--
    No footer fragment on purpose: it links to the notification settings so a recipient can turn that kind of mail off.
    A password reset is not a notification and cannot be turned off - it only ever arrives because someone asked for it
    on this account - so offering that link would suggest a setting that does not apply here.
-->

</body>
</html>
