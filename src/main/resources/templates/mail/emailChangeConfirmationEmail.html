<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${forCurrentAddress} ? #{email.emailChange.current.title} : #{email.emailChange.new.title}">Confirm the change of your Artemis e-mail address</title>
    <th:block th:replace="~{mail/notification/fragments :: headMetaDataAndIconLink}"/>
    <th:block th:replace="~{mail/notification/fragments :: css}"/>
</head>

<body>
<th:block th:replace="~{mail/notification/fragments :: header}" />

<div id="message-body">
    <th:block th:replace="~{mail/notification/fragments :: greetingsFullName}" />

    <p>
        <!-- th:text rather than th:utext: the address is user-supplied, so it must be escaped, not rendered as markup -->
        <span th:if="${forCurrentAddress}" th:text="#{email.emailChange.current.text(${newEmail})}">
            A change of the e-mail address of your Artemis account was requested.
        </span>
        <span th:unless="${forCurrentAddress}" th:text="#{email.emailChange.new.text(${user.login})}">
            The e-mail address of an Artemis account is to be changed to this address.
        </span>
    </p>

    <p>
        <span th:text="#{email.emailChange.confirmHint(${validityInHours})}">The address only changes once both addresses have confirmed.</span>
    </p>
    <p>
        <a th:with="url=(@{|${baseUrl}/account/confirm-email-change?keyId=${keyId}&keySecret=${keySecret}|})" th:href="${url}" th:text="${url}">Confirmation link</a>
    </p>

    <p>
        <span th:text="#{email.emailChange.notYou}">If you did not request this change, do not follow the link.</span>
    </p>

    <th:block th:replace="~{mail/notification/fragments :: farewell}" />
</div>

<!--
    No footer fragment on purpose: it links to the notification settings so a recipient can turn that kind of mail off.
    This message is a confirmation that only arrives because a change was asked for on this account, and cannot be turned off.
-->

</body>
</html>
