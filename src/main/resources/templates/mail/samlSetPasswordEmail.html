<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="#{email.saml.title}">Artemis account created</title>
    <th:block th:replace="~{mail/notification/fragments :: headMetaDataAndIconLink}"/>
    <th:block th:replace="~{mail/notification/fragments :: css}"/>
</head>

<body>
<th:block th:replace="~{mail/notification/fragments :: header}" />

<div id="message-body">
    <p th:text="#{email.saml.greeting(${user.login})}">
        Dear
    </p>
    <p th:text="#{email.saml.text1}">
        Your Artemis account has been created. A local Artemis password is only needed to access Git and build services.
        To create your local Artemis password click the link below:
    </p>
    <p>
        <a th:with="url=(@{|${baseUrl}/account/reset/finish?keyId=${user.resetKeyId}&keySecret=${user.resetKeySecret}|})" th:href="${url}" th:text="${url}">Login link</a>
    </p>
    <p th:text="#{email.saml.text2}">
        After expiration of this link you can use the "password-reset" button.
    </p>
    <br>
    <br>
    <p th:text="#{email.saml.username(${user.login})}">
        Username
    </p>
    <p th:text="#{email.saml.email(${user.email})}">
        Email
    </p>

    <th:block th:replace="~{mail/notification/fragments :: farewell}" />
</div>

<!-- No footer fragment: it links to the notification settings, and an account-created mail is not a notification that can be switched off there. -->

</body>
</html>
