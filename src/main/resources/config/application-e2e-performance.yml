# ===================================================================
# Spring profile: e2e-performance
#
# Activates runtime repeated-query detection during E2E test runs.
# This profile is NOT for production. It is added to SPRING_PROFILES_INCLUDE
# in deployment/docker/artemis/config/playwright.env (CI E2E runs only).
#
# What it does:
#   - Wraps the HikariCP DataSource with a datasource-proxy interceptor.
#   - Records every SQL statement of an HTTP request.
#   - Detects queries repeated within one request: N+1 (same template, different values) and
#     duplicates (same statement, same values). No threshold: any repetition is reported.
#   - Exposes results via GET /api/admin/performance/slow-queries
# ===================================================================

artemis:
    performance:
        # Circuit-breaker: stop recording after this many entries to prevent memory growth
        # on pathological runs.
        max-recorded-queries: 10000
