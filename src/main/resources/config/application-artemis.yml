# ===================================================================
# Artemis specific properties
# ===================================================================

artemis:
  course-archives-path: ./exports/courses         # a folder in which archived courses and exams are stored.
  legal-path: ./legal                             # a folder in which legal documents (imprint and privacy statements) are stored.
  repo-clone-path: ./repos                        # a folder in which git repos for the online code editor are stored. In a multi node setup, this folder should be in a shared file system area (e.g. based on NFS), so that user can access the same files over multiple nodes
  repo-download-clone-path: ./repos-download      # a temporary folder, in which git repos are downloaded that are immediately deleted afterwards (e.g. exports, plagiarism checks), should NOT be in a shared file system area
  data-export-path: ./data-exports                # a folder in which data exports are stored
  build-logs-path: ./build-logs                   # a folder in which build logs are stored
  bcrypt-salt-rounds: 11  # The number of salt rounds for the bcrypt password hashing. Lower numbers make it faster but more unsecure and vice versa.
  # Please use the bcrypt benchmark tool to determine the best number of rounds for your system. https://github.com/ls1intum/bcrypt-Benchmark
  user-management:
    use-external: true # enables ldap authentication
    # A "remember me" session is silently extended while it stays in use, so an active user is not signed out every time
    # the token expires. This is the one bound on how long that can go on: the session may never live longer than this
    # after the original login, whatever the request pattern. An inactive session still ends when its current token
    # expires, after token-validity-in-seconds-for-remember-me.
    #
    # Measured from the login rather than counted per extension on purpose. A rotation fires on the first request after
    # less than half the validity remains, so counting extensions would make the maximum depend on when requests arrive,
    # and would give the most active sessions the shortest lives.
    #
    # A passkey session has its own, longer bound: artemis.user-management.passkey.token-validity-in-seconds-for-passkey.
    max-session-lifetime-in-seconds: 2592000 # 30 days, the lifetime a single non-rotating remember-me token used to have
    password-reset:
      links: # The password reset links for different languages
        en: '<link>'
        de: '<link>'
    ldap: # the whole section is optional: whether user details (such as the registration number) can be obtained from a LDAP service
      url: <url>
      user-dn: <user-dn>
      password: <password>
      base: <base>
      allowed-username-pattern: '^([a-z]{2}\d{2}[a-z]{3})$'    # example for a TUM identifier, e.g. ab12cde
    internal-admin:
      username: artemis_admin
      password: artemis_admin
      email: admin@localhost
    registration: # the whole section is optional: whether user can register in Artemis
      enabled: false
      allowed-email-pattern: '[a-zA-Z0-9_\-\.\+]+@(tum\.de|in\.tum\.de|mytum\.de)'
      allowed-email-pattern-readable: '@tum.de, @in.tum.de, @mytum.de'
      cleanup-time-minutes: 60 # The amount of time until non-activated accounts are deleted automatically
    accept-terms: false     # whether users have to accept terms before they can log in, from a privacy point of view this is not needed during education, therefore the default value is false
    course-registration: # Deprecated: replaced by 'course-enrollment'
      # If both 'course-registration' and 'course-enrollment' are configured, the system will favorize the values specified under 'course-enrollment'
      # the whole section is optional: whether there is a restriction for the self-registration of students in courses
      allowed-username-pattern: '^([a-z]{2}\d{2}[a-z]{3})$'    # example for a TUM identifier, e.g. ab12cde
    course-enrollment: # the whole section is optional: whether there is a restriction for the self-registration of students in courses
      allowed-username-pattern: '^([a-z]{2}\d{2}[a-z]{3})$'    # example for a TUM identifier, e.g. ab12cde
    login:
      account-name: TUM                   # optional: customization for the welcome page "please sign in with your <account-name> account"
  programming:
    # Optional Maven Central mirror for the test repositories of Java and Kotlin exercises. Maven Central rate-limits
    # requests (HTTP 429), which makes exercise builds fail. When this is set, Artemis declares the mirror as the first
    # repository (dependencies and plugins) in every newly created Java/Kotlin test repository, so builds resolve through
    # the mirror instead of Maven Central. Leave it unset to keep resolving from Maven Central directly.
    # TUM-operated instances can use the mirror the Artemis team provides:
    # maven-central-mirror-url: https://reposilite.aet.cit.tum.de/releases
  version-control:
    url: https://artemis.tum.de
    user: <username>                # e.g. ga12abc
    password: <password>
    # token: <token>                # VCS API token giving Artemis full Admin access.
    ssh-template-clone-url: ssh://git@artemis.tum.de:7921/    # Url Stem for cloning via ssh
    ssh-port: 7921
    #        ssh-private-key-folder-path: <ssh-private-key-folder-path>       # the path to the folder in which the private ssh key file (e.g. id_rsa) is stored that can be used to clone git repos on the version control server
    #        ssh-private-key-password: <ssh-private-key-password>        # the password for the private ssh key
    # Build agent authentication, in the order you should prefer it. Neither of the first two needs a secret from you:
    #   1. ssh keys (recommended): set build-agent-use-ssh: true on the build agents AND on every core node, plus the two ssh properties above on the agents.
    #      Each agent generates its own key pair at startup and publishes only the public key - nothing to distribute or rotate.
    #   2. build job clone tokens: the automatic fallback over https when build-agent-use-ssh is false, and it needs no configuration at all.
    #   3. build-agent-git-username / build-agent-git-password: Jenkins with LocalVC only. A node running local CI refuses to start with either set.
    # See documentation/docs/admin/production-setup/security.mdx#build-agent-authentication.
    # build-agent-use-ssh: true
    default-branch: main            # The branch that should be used as default branch for all newly created repositories. This does NOT have to be equal to the default branch of the VCS
    repository-authentication-mechanisms: token,ssh,password # the order of authentication mechanisms in the code button pop up. Removing parts removes them from the drop-down
  continuous-integration:
    user: <username>                # e.g. ga12abc
    password: <password>
    token: <token>                  # Enter a valid token generated in the CI system giving Artemis full Admin access
    url: <url>
    # Key of the saved credentials for the VCS service
    # Jenkins: You have to specify the key from the credentials page in Jenkins under which the user and
    #          password for the VCS are stored
    vcs-credentials: myCredentialsKey #must be changed to a secure value
    # Key of the credentials for the Artemis notification token
    # Jenkins: You have to specify the key from the credentials page in Jenkins under which the authentication-token is stored
    artemis-authentication-token-key: myCredentialsKey #must be changed to a secure value
    # The actual value of the notification token to check against in Artemis. This is the token that gets send with
    # every request the CI system makes to Artemis containing a new result after a build.
    # Jenkins: The token value you use for the Server Notification Plugin and is stored under the notification-token credential above
    artemis-authentication-token-value: myToken #must be changed to a secure value
    build-timeout: 30 # Does cancel jenkins builds after 30 minutes to remove build that get stuck
    build-log:
      file-expiry-days: 30 # The amount of days until build log files can be deleted
      cleanup-schedule: 0 0 3 * * ? # Cron expression for schedule to delete old build log files
    build-job:
      retention-period: 365 # Number of days before build job entries are deleted
  git:
    name: Artemis
    email: artemis@xcit.tum.de
  rate-limiting:
    enabled: false
    account-management-requests-per-minute: 5
    authentication-requests-per-minute: 30
    login-options-requests-per-minute: 30
    # Addresses exempt from every rate limit, as literal IPv4/IPv6 addresses or CIDR blocks. The limits
    # are per client address, which protects against one abusive client but throttles a load generator
    # almost immediately, since a benchmark drives thousands of logins from a single address. Leave
    # empty unless you operate the address in question.
    # exempt-addresses:
    #   - 203.0.113.10
    #   - 2001:db8::/64
  athena:
    url: http://localhost:5100
    secret: abcdef12345
    restricted-modules: module_text_llm,module_programming_llm
  apollon:
    conversion-service-url: http://localhost:8080
  hyperion:
    enabled: false  # Set this to true to enable the hyperion service on startup, requires Spring AI to be configured below.
  llm:  # Shared LLM configuration for Spring AI-based services (Hyperion, Atlas)
    # Token costs (EUR per million tokens). Baselines (gpt-5-mini, gpt-5.4, gpt-5.4-mini) are seeded in
    # LLMModelCostConfiguration. Add entries here only to override or register a model. Keep this commented:
    # an active entry here uses a literal key (e.g. gpt-5-mini) that would collide with the same model
    # configured via environment variables (where it arrives stripped, e.g. gpt5mini). Dotted keys must be
    # bracket-quoted, e.g. "[gpt-5.4]".
    # model-costs:
    #   "[gpt-5.4]":
    #     input-cost-per-million-eur: 2.30
    #     output-cost-per-million-eur: 13.80
  atlas:
    # *-model values are Azure deployment aliases — replace with your own deployment names.
    chat-model: gpt-5.4-mini
    temperature: 0.8
    flavor-strip-model: gpt-5.4-mini # Azure deployment name of a small/fast model used to strip narrative scaffolding from exercise text before downstream LLM processing. Set to an empty string to disable stripping (raw passthrough).
    flavor-strip-reasoning-effort: medium # Reasoning effort passed via AzureOpenAiChatOptions.reasoningEffort (e.g. low|medium|high). Leave blank to omit the parameter. "medium" is the v3 default — the multi-step constraint checks (keep_verbatim list + heading rule + metacognitive gate) require multi-step reasoning that "low" effort skips.
    flavor-strip-temperature: 1.0 # Temperature for the flavor-strip LLM call. Some models (e.g. gpt-5 family) only accept the default value of 1.
    orchestrator:
      model: gpt-5.4
      temperature: 1.0
      reasoning-effort: medium
      # Automatic competency orchestration (Feature.AtlasAgent). Disabled by default;
      # admins flip the toggle to opt the instance in. The scheduler ticks at scheduler-rate-ms and only
      # claims a course's bucket once debounce-window-seconds have elapsed since the last content edit.
      debounce-window-seconds: 1800
      max-daily-orchestrations: 10
      scheduler-rate-ms: 30000
      # Per-run cap on AtlasML similarity-shortlist calls (one per changed exercise). Bounds the AtlasML
      # fan-out feeding the execute prompt; exercises beyond the budget contribute no candidates.
      max-atlasml-calls-per-run: 10
    atlasml:
      enabled: false # If disabled, no artifacts of the AtlasML service are accessible. This might impact the experience for instructors, i.e. some of the AI recommendations are not available.
      base-url: <your-atlasml-url> # Required address to you own AtlasML instance
      auth-token: <your-secret> # The secret used to authenticate Artemis against AtlasML
  scheduling: # these values are cron expressions. To generate one, you can use e.g. https://www.freeformatter.com/cron-expression-generator-quartz.html
    programming-exercises-cleanup-time: 0 0 3 * * * # every day at 3am
    data-export-creation-time: 0 0 4 * * * # every day at 4am
    programming-exercises-retrigger-submission-without-result-time: 0 0 2 * * * # every day at 2am
    continuous-plagiarism-control-trigger-time: 0 0 5 * * * # every day at 5am
    vulnerability-scan-time: 0 0 8 * * MON # every Monday at 8am
    feature-usage-digest-time: 0 0 9 * * MON # every Monday at 9am, an hour after the vulnerability report so both do not arrive at once
    # Data-privacy cleanup jobs (only run when the matching artemis.cleanup.*-schedule-enabled flag is true).
    old-courses-warning-time: 0 0 2 * * SUN # every Sunday at 2am: archive + warn instructors of old courses due for reset
    old-courses-reset-time: 0 0 3 * * SUN # every Sunday at 3am: reset student data of old courses past the grace period
    old-feedback-cleanup-time: 0 30 4 * * SUN # every Sunday at 4:30am: delete feedback of non-latest results of old courses
    old-submission-versions-cleanup-time: 0 45 4 * * SUN # every Sunday at 4:45am: delete submission versions of old courses
    not-enrolled-users-warning-time: 0 0 5 1 * * # 1st of every month at 5am: warn inactive users enrolled in no course
    not-enrolled-users-cleanup-time: 0 0 6 1 * * # 1st of every month at 6am: soft-delete warned users enrolled in no course
    plagiarism-cases-cleanup-time: 0 30 3 * * SUN # every Sunday at 3:30am: delete plagiarism cases of courses ended > 5 years ago

  data-export:
    days-between-data-exports: 14

  cleanup: # Data-privacy (GDPR) retention cutoffs and schedule kill switches for the admin data cleanup jobs.
    # Legal basis (defaults chosen for TUM / Bavaria; adjust per your institution's regulations):
    #  - GDPR Art. 5(1)(e) storage limitation + Art. 17 (erasure): personal data must be deleted once no longer needed.
    #  - Grade-relevant courses hold examination data (Prüfungsunterlagen). For Bavarian universities these must be kept
    #    5 years (Bavarian State Ministry circular; the 2-year RaPO period applies to Fachhochschulen, not universities),
    #    then destroyed. The authoritative long-term grade/degree record (reduced exam file, 50 years) is kept in the
    #    campus-management system (e.g. TUMonline), not in Artemis. See the privacy statement (BayHSchG Art. 61, TUM APSO).
    #  - Non-grade-relevant courses carry no exam-retention obligation, so their student data is minimized after 1 year.
    #  NOTE: a pending objection/legal proceeding legally extends retention. Enable the affected course's data-retention
    #  hold (course settings -> data privacy) until the proceeding concludes: held courses are skipped by the warning and
    #  reset jobs for as long as the hold lasts, regardless of the cutoffs below.
    grade-relevant-retention-years: 5 # reset student data of grade-relevant courses 5 years after they end
    non-grade-relevant-retention-years: 1 # reset student data of non-grade-relevant courses 1 year after they end
    reset-warning-grace-period-days: 30 # days between warning instructors and actually resetting the student data
    old-feedback-cutoff-weeks: 8 # weeks after course end before feedback of non-latest results is purged (final result's feedback is kept)
    old-submission-versions-cutoff-weeks: 8 # weeks after course end before submission versions (editor history) are purged
    not-enrolled-users-inactivity-months: 6 # months of inactivity (by last login) before a not-enrolled user is warned and later deleted
    not-enrolled-users-warning-grace-period-days: 30 # days between warning a not-enrolled user and deleting the account (logging in cancels it)
    # Schedule kill switches (all off by default: nothing runs automatically until an admin opts in).
    old-courses-warning-schedule-enabled: false
    old-courses-reset-schedule-enabled: false
    old-feedback-schedule-enabled: false
    old-submission-versions-schedule-enabled: false
    not-enrolled-users-warning-schedule-enabled: false
    not-enrolled-users-schedule-enabled: false
    plagiarism-cases-schedule-enabled: false

  plagiarism-checks:
    plagiarism-results-limit: 100

  feature-usage: # Built-in feature usage analysis. Counts how often each REST endpoint, git operation and instrumented
    # background feature is used, so admins and developers can see which features matter and which are dead weight.
    # Aggregate only: a call increments a counter keyed by feature, UTC day and the caller's role bucket. No login,
    # user id or address is read or stored, so this is not personal data and needs no opt-in.
    enabled: true
    retention-period: 400 # days before a daily bucket is deleted (covers the 180 day window plus a year-over-year comparison)
    flush-interval: 5m # how often each node writes its accumulated counters to the database
    digest: # weekly summary email to the administrators, modelled on the weekly vulnerability report
      enabled: true
      recipients: [] # empty falls back to info.contact, where the other administrative mails go

  science: # The science module is used for research purposes such as the collection of data.
    event-logging: # event logging is used to collect data for research purposes. It is disabled by default.
      enable: false # Set this to true to enable the feature toggle for the science module on startup.

  iris: # The iris module is used for AI-powered features via Pyris
    enabled: false
    url: <your-pyris-url>
    secret-token: <your-secret>
    response-streaming-enabled: true
    dashboard:
      max-query-window-days: 90
      stale-threshold-minutes: 5
      digest:
        enabled: false
        cron: "0 0 7 * * *"
        recipients: []
      alert:
        enabled: false
        no-response-rate-threshold: 10
        check-interval-minutes: 30
        cooldown-minutes: 360
        lookback-minutes: 60
        minimum-eligible-sessions: 10
        minimum-user-messages: 20
        recipients: []

  # Deimos uses its own LLM config (not spring.ai.openai.*) to isolate student code from the shared Atlas/Hyperion endpoint
  deimos:
    enabled: true
    executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 25
    llm:
      base-url: https://gpu.aet.cit.tum.de
      api-key: dummy-key
      model: openai/gpt-oss-120b
      # The SDK appends /chat/completions itself; this path is stripped down to the prefix (e.g. /api)
      completions-path: /api/chat/completions
      temperature: 0

  weaviate:
    enabled: false

# Configure Spring AI, if you want to use Hyperion or Atlas
spring:
  ai:
    model:
      chat: openai # use none to disable chat models
    chat:
      client:
        enabled: #{${artemis.hyperion.enabled} or ${artemis.atlas.enabled}}
      memory:
        max-messages: 20 # Maximum number of messages to retain in conversation history per session
    # Single OpenAI module (official OpenAI Java SDK) since Spring AI 2.0.0-M6: one config tree serves
    # Azure OpenAI / Microsoft Foundry (prod), OpenAI itself, and OpenAI-compatible local servers (dev).
    # https://docs.spring.io/spring-ai/reference/api/chat/openai-chat.html
    openai:
      ## Variant 1 (active here): Azure OpenAI / Microsoft Foundry
      base-url: https://endpoint.openai.azure.com
      api-key: my-api-key-for-azure-openai
      microsoft-foundry: true # auto-detected for *.openai.azure.com base URLs; set explicitly for custom domains
      # HTTP client request timeout (default 60s) — LLM tool-calling loops can need several minutes.
      # Must be set at this level (spring.ai.openai.timeout); the chat-level timeout key does not feed the HTTP client.
      timeout: 5m
      chat:
        # The Azure deployment name; used as the request model by the default ChatClient
        model: gpt-5-mini
        # Some Azure/OpenAI deployments (e.g., gpt-5-mini) only support the default temperature (1.0)
        temperature: 1.0
      ## Variant 2: local OpenAI-compatible server (LM Studio, Ollama, vLLM, ...) — same tree.
      ## The SDK appends /chat/completions itself, so include the /v1 prefix in the base URL
      ## (the former spring.ai.openai.chat.completions-path property no longer exists).
      # base-url: http://localhost:1234/v1
      # api-key: dummy-key      # most local servers ignore it
      # timeout: 5m
      # chat:
      #   model: openai/gpt-oss-20b    # or whatever name your local server expects
      #   temperature: 0.7
    # Retry/response handling tuning for AI providers
    retry:
      # Treat HTTP 429 as transient to allow auto-retry by Spring AI
      on-http-codes: [429]
      # Conservative defaults; adjust if needed
      max-attempts: 5
      backoff:
        initial-interval: 1000ms
        multiplier: 2.0
        max-interval: 30000ms
  # data:
    # Redis configuration, in case `artemis.continuous-integration.data-store` is set to `Redis`
    # redis:
      # host: # hostname or IP
      # port: 6379
      # username: # username
      # password: # password
      # client-name *must* be unique for each Artemis instance and *must* start with `artemis`
      # client-name: # artemis-...

management:
  # Set true to display contextual name in @Observed on Langfuse
  observations:
    annotations:
      enabled: true

  # Configuration for exporting LLM traces to Langfuse (set to true to enable Artemis' custom exporter)
#  langfuse:
#    enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # LangFuse accepts OTLP over HTTP at the traces path only
      # (example: https://langfuse.aet.cit.tum.de/api/public/otel/v1/traces)
#     endpoint: https://example.com
#     transport: http
#     headers:
        # Provide "Basic <base64(public_key:secret_key)>" via env var to avoid committing secrets
#        Authorization: "Basic <base64(public_key:secret_key)>"

     # Important: Set export.enabled: false to disable the *default* OTLP exporter.
     # Hyperion uses its own custom exporter to send LLM traces to Langfuse,
     # so disabling the default exporter will NOT stop LLM trace export.
     export:
       enabled: false
