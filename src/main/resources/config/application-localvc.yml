# ===================================================================
# Local VC specific properties: this file will only be loaded during startup if the profile localvc is active
#
# This configuration overrides the application.yml file.
# ===================================================================
artemis:
    version-control:
        # A folder in which the local git repos are stored as bare repositories.
        # Only required when using the profile 'localvc' to save repositories locally.
        # In a multi node setup, this folder should be in a shared file system area (e.g. based on NFS), so that user can access the same files over multiple nodes.
        local-vcs-repo-path: ./local-vcs-repos
        url: http://localhost:8000
        build-agent-git-username: buildjob_user # Replace with more secure credentials for production. Required for https access to localvc, and ignored when build-agent-use-ssh is true. This config must be set for build agents and localvc.
        build-agent-git-password: buildjob_password # Replace with more secure credentials for production. Required for https access to localvc, and ignored when build-agent-use-ssh is true. This config must be set for build agents and localvc. You can also use an ssh key
        # If true, build agents generate a key pair at startup and use ssh to clone repositories from core nodes. Also set ssh-template-clone-url and ssh-private-key-folder-path for the build agents if true.
        # On a core node this instead governs the build-agent shortcut over https: with true, the core node stops honouring the build-agent git username and password rather
        # than leaving a repository-wide read shortcut open that no build agent uses. A core node accepts a registered build agent's public key either way, so set this on the build agents first (builds keep
        # working) and on the core nodes afterwards. Setting it on the core nodes while an agent still clones over https breaks that agent.
        build-agent-use-ssh: false
