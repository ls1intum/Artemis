# ===================================================================
# Build Agent specific properties: this file will only be loaded during startup if the profile buildagent is active
# NOTE: to keep the build agent as lightweight as possible, we disable all unnecessary features here, in particular Hibernate and DataSource
# This means that the build agent will not be able to access the database, and will not be able to run any tests that require a database connection
# For a single node environment, you must define the profile "buildagent" before the profile "core" when starting the Artemis service
#
# This configuration overrides the application.yml file.
# ===================================================================
# TODO: we should make sure this is not required here, because build agent could never enable those modules / features
artemis:
    atlas:
        enabled: false
        atlasml:
            enabled: false
    hyperion:
        enabled: false
    deimos:
        enabled: false
    exam:
        enabled: false
    plagiarism:
        enabled: false
    text:
        enabled: false
    modeling:
        enabled: false
    fileupload:
        enabled: false
    lecture:
        enabled: false
    tutorialgroup:
        enabled: false
    athena:
        enabled: false
    apollon:
        enabled: false
    user-management:
        passkey:
            enabled: false
        ldap:
            enabled: false
        saml2:
            enabled: false
    weaviate:
        enabled: false
    sharing:
        enabled: false
    lti:
        enabled: false
    iris:
        enabled: false
    theia:
        enabled: false # the online IDE is served by core nodes only, never by build agents

    checked-out-repos-path: ./checked-out-repos # The directory to which repositories temporarily get cloned for the build job execution
    repo-clone-path: ./repos
    repo-download-clone-path: ./repos-download
    version-control:
        url: http://localhost:8000 # Required for ssh access to localvc.
        # ------------------------------------------------------------------------------------------------------------------------------------------------------------
        # How this build agent authenticates when it clones from a core node. Nothing here needs a secret from you.
        #
        #   1. SSH KEYS - recommended, configures itself.
        #      Set artemis.version-control.build-agent-use-ssh: true here and on every core node, plus
        #      ssh-template-clone-url and ssh-private-key-folder-path (see application-artemis.yml). This agent then
        #      generates its own key pair at startup - creating the key folder if needed - keeps the private key local
        #      and publishes only the public key to the cluster. Each SSH clone step has its own timeout, 60s by
        #      default (build-agent-clone-timeout-seconds); raise it if multi-repo (auxiliary-repository) builds time out.
        #
        #   2. BUILD JOB CLONE TOKENS - the automatic fallback over https, also configures itself.
        #      Used whenever build-agent-use-ssh is false. REQUIRES NO CONFIGURATION AT ALL: each build job arrives
        #      carrying the credential for its own repositories, and this agent presents it with its own short name.
        #
        #   3. A SHARED USERNAME AND PASSWORD - not for Artemis build agents.
        #      A core node that runs local CI refuses to start with one configured, so setting the two properties below
        #      would only produce a credential no such node accepts. They exist for Jenkins with LocalVC, which is not
        #      an Artemis build agent. Leave them unset here.
        #
        # See documentation/docs/admin/production-setup/security.mdx#build-agent-authentication.
        # ------------------------------------------------------------------------------------------------------------------------------------------------------------
        # build-agent-git-username:
        # build-agent-git-password:
    continuous-integration:
        build-runner: docker # Supported values: docker, kubernetes
        docker-connection-uri: unix:///var/run/docker.sock
        specify-concurrent-builds: false # If true, you can specify the number of build that can run concurrently on this node (concurrent-build-size). If false, the number will be determined based on system resources.
        concurrent-build-size: 1 # The number of builds that can run concurrently on this node.
        asynchronous: true # If true, the CI jobs will be executed asynchronously. If false, the CI jobs will be executed synchronously (e.g. for debugging and tests).
        build-container-prefix: local-ci- # The prefix that is used for the Docker containers that are created by the local CI system.
        proxies:
            use-system-proxy: false
            default:
                http-proxy: http://proxyserver:port
                https-proxy: http://proxyserver:port
                no-proxy: localhost,127.0.0.1
        # The maximum number of seconds a single Docker image pull may take before it is aborted. This is independent of the build timeout below: how long a pull takes
        # depends on the image size and on the registry and network, not on the exercise. Without it, a pull that stops making progress blocks the build thread forever.
        image-pull-timeout-seconds: 300
        # Abort much earlier when the pull is not moving at all, which is what an unreachable registry looks like.
        image-pull-stall-timeout-seconds: 60
        # Configuration for the cleanup of Docker images
        image-cleanup:
            enabled: false
            expiry-days: 2 # The number of days after which a Docker image is considered outdated and can be removed.
            cleanup-schedule-time: 0 0 3 * * * # Time of cleanup (cron expression)
        container-cleanup:
            expiry-minutes: 5 # The amount of time after which a container is considered stale and can be removed.
            cleanup-schedule-minutes: 60 # How often the cleanup job is executed
        # After pausing the build agent, the build agent will wait for this amount of seconds before cancelling all running builds on the build agent. Builds will be added back to the queue.
        pause-grace-period-seconds: 60
        pause-after-consecutive-failed-jobs: 100 # The number of consecutive failed jobs after which the build agent will be paused. This is used to prevent the build agent to keep polling jobs from the queue if it is not able to process them.
        # This specifies the options that are shown to the instructor when creating a new programming exercise. Max value also defines the max timeout for the build.
        # This values should be the same specified in application-localci.yml
        build-timeout-seconds:
            # Max value also defines the max timeout for the build. Meaning that builds that exceed this time will be automatically interrupted.
            max: 240 # The maximum number of seconds that the instructor can set for the build timeout. This is the maximum value that will be shown in the slider when creating or editing a programming exercise.
        build-logs:
            max-lines-per-job: 10000
            max-chars-per-line: 1024
        container-flags-limit:
            allowed-custom-networks: none
            max-cpu-count: 4 # The maximum number of CPU cores that can be used by the build agent. If a higher value is specified, the build agent will be limited to this value. Value must be a positive integer. 0 means unlimited.
            max-memory: 8096 # The maximum amount of memory that can be used by the build agent. If a higher value is specified, the build agent will be limited to this value. Value must be a positive integer. 0 means unlimited.
            max-memory-swap: 8096 # The maximum amount of memory swap that can be used by the build agent. If a higher value is specified, the build agent will be limited to this value. Value must be a positive integer. 0 means unlimited.
        # Superseded by `artemis.distributed-data.provider`, which selects the backend for all distributed state and not
        # just for Local CI. This key is still honoured as a fallback for one release. Deliberately left set here rather
        # than migrated: defaulting the new key in this file would silently override a deployment that still selects
        # Redis through this legacy key.
        data-store: Hazelcast # set Hazelcast, Redis, Local as data store for Local CI data
    git:
        name: Artemis
        email: artemis@xcit.tum.de

spring:
    liquibase:
        enabled: false #not needed for build agents
    # Override datasource and JPA from application-prod.yml to prevent Hibernate from trying to connect
    datasource:
        url: ""
        driver-class-name: ""
    jpa:
        database: default
        properties:
            hibernate.cache.use_second_level_cache: false
            hibernate.cache.use_query_cache: false
    data:
        jpa:
            repositories:
                enabled: false
    autoconfigure:
        exclude:
            # Hibernate and DataSource are not needed in the build agent
            - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
            - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
            - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
            - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
            - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
            - org.springframework.boot.jdbc.autoconfigure.JdbcClientAutoConfiguration
            # These exclusions are repeated from application-core.yml because overriding the `exclude` array is not possible
            # Important: Keep in sync with application-core.yml, except for build agent specific exclusions
            - org.springframework.boot.data.autoconfigure.metrics.DataRepositoryMetricsAutoConfiguration
            # DataSourcePoolMetricsAutoConfiguration: excluded here (no datasource) but NOT in core (needed for admin metrics page)
            - org.springframework.boot.jdbc.autoconfigure.metrics.DataSourcePoolMetricsAutoConfiguration
            - org.springframework.boot.micrometer.metrics.autoconfigure.startup.StartupTimeMetricsListenerAutoConfiguration
            - org.springframework.boot.micrometer.metrics.autoconfigure.task.TaskExecutorMetricsAutoConfiguration
            - org.springframework.boot.tomcat.autoconfigure.metrics.TomcatMetricsAutoConfiguration
    cloud:
        loadbalancer:
            cache:
                enabled: false #not needed for build agents

server:
    port: 8080
    url: http://localhost # NOTE you need to override this

# at the moment metrics are disabled for build agents
management:
    endpoint:
        health:
            show-details: never
            probes:
                enabled: true
        artemismetrics:
            access: none
    metrics:
        enable:
            all: false

eureka:
   client:
        enabled: true

helios:
    status:
        enabled: false
