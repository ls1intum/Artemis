<div
    [ngClass]="{ 'is-expanded': isExpanded(), hidden: notifications().length === 0 }"
    [style.height]="isExpanded() ? 5 + notifications().length * 7 + 'rem' : null"
    class="course-notification-popup-overlay"
    (click)="overlayClicked()"
    #keyboardAction1
    [attr.role]="!isExpanded() && notifications().length > 1 ? 'button' : null"
    [attr.tabindex]="!isExpanded() && notifications().length > 1 ? 0 : -1"
    [attr.aria-label]="'artemisApp.notification.expandPopup' | artemisTranslate"
    (keydown.enter)="$event.target === $event.currentTarget && keyboardAction1.click()"
    (keydown.space)="$event.target === $event.currentTarget && $event.preventDefault(); $event.target === $event.currentTarget && keyboardAction1.click()"
>
    @for (notification of notifications(); track notification.notificationId) {
        <div
            class="notification-animation-wrapper"
            animate.enter="notification-entering"
            animate.leave="notification-leaving"
            [style.bottom]="isExpanded() ? (notifications().length - $index - 1) * 7 + 5 + 'rem' : null"
        >
            <div class="course-notification-popup-overlay-notification">
                <jhi-course-notification
                    [courseNotification]="notification"
                    [isShowClose]="true"
                    [isHideTime]="true"
                    [isRedirectToUrl]="isExpanded() || notifications().length === 1"
                    [displayTimeInMilliseconds]="popupTimeInMilliseconds - 500"
                    (onCloseClicked)="closeClicked(notification)"
                />
            </div>
        </div>
    }

    <div class="course-notification-popup-overlay-collapse">
        <button type="button" pButton [outlined]="true" size="small" [rounded]="true" class="me-2" (click)="collapseOverlayClicked()">
            <fa-icon [icon]="faTimes" />
        </button>

        <button type="button" pButton [outlined]="true" size="small" [rounded]="true" (click)="clearAllNotifications()">
            <fa-icon [icon]="faTrash" />
        </button>
    </div>
</div>
