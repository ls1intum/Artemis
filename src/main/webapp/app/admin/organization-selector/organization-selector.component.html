<div class="p-1">
    <tum-ui-table
        [columns]="columns()"
        [rows]="organizations()"
        [totalRecords]="totalCount()"
        (dataRequest)="loadOrganizations($event)"
        [rowActions]="selectorActions"
        [loading]="isLoading()"
        [striped]="true"
        [pageSize]="10"
        [pageSizeOptions]="[10]"
        [emptyMessage]="'artemisApp.organizationManagement.modalSelector.noOrganizations'"
    />

    <div class="flex justify-end mt-3">
        <button type="button" tumUiButton size="small" severity="secondary" (click)="cancel()" jhiTranslate="entity.action.cancel" data-testid="cancel-btn"></button>
    </div>
</div>

<ng-template #logoCell let-params>
    @if (params.value) {
        <img [height]="36" [src]="params.value" (error)="$event.target.style.display = 'none'" alt="" />
    }
</ng-template>

<ng-template #selectorActions let-org>
    <button
        type="button"
        tumUiButton
        size="small"
        [disabled]="isAlreadyAssigned()(org)"
        (click)="selectOrganization(org); $event.stopPropagation()"
        jhiTranslate="artemisApp.organizationManagement.modalSelector.select"
        data-testid="select-organization-btn"
    ></button>
</ng-template>
