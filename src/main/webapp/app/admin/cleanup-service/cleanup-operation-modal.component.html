<tum-ui-dialog
    [(visible)]="visible"
    [closable]="true"
    [closeOnEscape]="false"
    [dismissableMask]="false"
    size="medium"
    [header]="'cleanupService.operation.' + operation().name | artemisTranslate"
>
    @if (dialogError(); as error) {
        <tum-ui-message severity="error" [text]="error" class="mb-3 w-full" aria-live="assertive" data-testid="cleanup-error-message" />
    }
    @if (operation().ageBased) {
        <p
            [jhiTranslate]="'cleanupService.execute.questionWithoutDates.' + operation().action"
            [translateValues]="{
                operationName: 'cleanupService.operation.' + operation().name | artemisTranslate,
            }"
            data-testid="cleanup-confirmation-question"
        ></p>
    } @else {
        <p
            [jhiTranslate]="'cleanupService.execute.question'"
            [translateValues]="{
                operationName: 'cleanupService.operation.' + operation().name | artemisTranslate,
                deleteFrom: operation().deleteFrom | artemisDate,
                deleteTo: operation().deleteTo | artemisDate,
            }"
            data-testid="cleanup-confirmation-question"
        ></p>
    }
    <div>
        <p [jhiTranslate]="'cleanupService.modal.affectedEntities.' + operation().action"></p>
        <ul data-testid="cleanup-affected-entities">
            @for (key of cleanupKeys(); track key) {
                <li [attr.data-testid]="'cleanup-count-' + key">
                    <!-- prettier-ignore -->
                    <span [jhiTranslate]="'cleanupService.entities.' + key"></span>: {{ counts()[key] }}
                    @if (operationExecuted()) {
                        @if (counts()[key] > 0) {
                            <fa-icon [icon]="faTimes" class="text-state-danger" />
                        } @else {
                            <fa-icon [icon]="faCheckCircle" class="text-state-success" />
                        }
                    }
                </li>
            }
        </ul>
        @if (!hasAffectedEntities()) {
            <p class="text-muted-color" jhiTranslate="cleanupService.modal.noAffectedEntities"></p>
        }
    </div>
    <ng-template #footer>
        <div class="flex justify-end gap-2">
            <button tumUiButton type="button" severity="secondary" variant="outlined" size="small" (click)="close()" data-testid="close-button">
                <span jhiTranslate="cleanupService.button.close"></span>
            </button>
            <button
                tumUiButton
                type="button"
                [severity]="actionPresentation[operation().action].severity"
                size="small"
                [disabled]="operationExecuting() || !hasAffectedEntities()"
                (click)="executeCleanupOperation()"
                data-testid="execute-button"
            >
                <fa-icon [icon]="actionPresentation[operation().action].icon" />
                <span [jhiTranslate]="actionPresentation[operation().action].labelKey"></span>
            </button>
        </div>
    </ng-template>
</tum-ui-dialog>
