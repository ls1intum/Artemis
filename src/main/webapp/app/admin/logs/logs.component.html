@if (loggers()) {
    <h5 *adminTitleBarTitle id="logs-page-heading" class="mb-0" jhiTranslate="logs.title" data-cy="logsPageHeading"></h5>
    <!--
        Full-height flex column so the table's scroll viewport is bounded by the real available space
        (the .admin-body scroll region), not a magic `calc(100vh - …)` that does not match it.
        The table wrapper is flex: 1 with min-height: 0, and the virtual-scroll table uses scrollHeight="flex"
        so the CDK virtual-scroll viewport fills exactly that bounded area. This keeps the last
        logger reachable and prevents the scroll from jumping.
    -->
    <div class="flex h-full min-h-0 flex-col gap-2">
        <div class="flex h-10 min-w-0 items-center gap-2">
            <input
                id="logs-filter"
                data-testid="logs-filter-input"
                type="search"
                tumAetUiInput
                tumAetUiInputSize="small"
                class="max-w-72 min-w-24 flex-1"
                [placeholder]="'logs.filter' | artemisTranslate"
                [attr.aria-label]="'logs.filter' | artemisTranslate"
                [ngModel]="filterInput()"
                (ngModelChange)="updateFilter($event)"
            />
            <span class="flex-1"></span>
            <span class="truncate text-sm text-muted-color" jhiTranslate="logs.nbloggers" [translateValues]="{ total: loggers().length }"
                >There are {{ loggers().length }} loggers.</span
            >
        </div>
        <tumaet-ui-table-virtual-scroll
            class="min-h-0 flex-1"
            [items]="filteredAndOrderedLoggers()"
            [itemSize]="logsTableRowHeight"
            [rowTemplate]="logRow"
            minWidth="30rem"
            scrollHeight="flex"
            ariaDescribedBy="logs-page-heading"
            data-testid="logs-table"
        >
            <div class="flex flex-1 items-center">
                <div role="columnheader" class="min-w-0 flex-1 truncate" [attr.aria-sort]="ariaSort('name')">
                    <button type="button" class="cursor-pointer border-0 bg-transparent p-0 font-semibold text-inherit" (click)="toggleSort('name')">
                        <span jhiTranslate="logs.table.name"></span> <fa-icon [icon]="sortIcon('name')" />
                    </button>
                </div>
                <div role="columnheader" class="shrink-0 text-end whitespace-nowrap" [attr.aria-sort]="ariaSort('level')">
                    <button type="button" class="cursor-pointer border-0 bg-transparent p-0 font-semibold text-inherit" (click)="toggleSort('level')">
                        <span jhiTranslate="logs.table.level"></span> <fa-icon [icon]="sortIcon('level')" />
                    </button>
                </div>
            </div>
        </tumaet-ui-table-virtual-scroll>
        <ng-template #logRow let-logger>
            <div class="min-w-0 flex-1 truncate">
                <small>{{ logger.name | slice: 0 : 140 }}</small>
            </div>
            <div class="shrink-0 text-end whitespace-nowrap">
                <tumaet-ui-button-group>
                    <tumaet-ui-button
                        size="small"
                        data-testid="log-level-trace"
                        [severity]="logger.level === 'TRACE' ? 'primary' : 'secondary'"
                        (clicked)="changeLevel(logger.name, 'TRACE')"
                    >
                        TRACE
                    </tumaet-ui-button>
                    <tumaet-ui-button
                        size="small"
                        data-testid="log-level-debug"
                        [severity]="logger.level === 'DEBUG' ? 'success' : 'secondary'"
                        (clicked)="changeLevel(logger.name, 'DEBUG')"
                    >
                        DEBUG
                    </tumaet-ui-button>
                    <tumaet-ui-button
                        size="small"
                        data-testid="log-level-info"
                        [severity]="logger.level === 'INFO' ? 'info' : 'secondary'"
                        (clicked)="changeLevel(logger.name, 'INFO')"
                    >
                        INFO
                    </tumaet-ui-button>
                    <tumaet-ui-button
                        size="small"
                        data-testid="log-level-warn"
                        [severity]="logger.level === 'WARN' ? 'warn' : 'secondary'"
                        (clicked)="changeLevel(logger.name, 'WARN')"
                    >
                        WARN
                    </tumaet-ui-button>
                    <tumaet-ui-button
                        size="small"
                        data-testid="log-level-error"
                        [severity]="logger.level === 'ERROR' ? 'danger' : 'secondary'"
                        (clicked)="changeLevel(logger.name, 'ERROR')"
                    >
                        ERROR
                    </tumaet-ui-button>
                    <tumaet-ui-button
                        size="small"
                        data-testid="log-level-off"
                        [severity]="logger.level === 'OFF' ? 'contrast' : 'secondary'"
                        (clicked)="changeLevel(logger.name, 'OFF')"
                    >
                        OFF
                    </tumaet-ui-button>
                </tumaet-ui-button-group>
            </div>
        </ng-template>
    </div>
}
