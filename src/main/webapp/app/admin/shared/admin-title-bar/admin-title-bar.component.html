<!-- Shared frame sizing and legacy controls live in the stylesheet; tumUiDensity owns TUM UI control sizing. -->
<div id="admin-title-bar" class="module-bg rounded-lg px-3">
    <div class="self-center" tumUiDensity="compact">
        @if (customTitleTemplate()) {
            <ng-container *ngTemplateOutlet="customTitleTemplate()!" />
        } @else {
            <h5 class="mb-0" jhiTranslate="global.menu.admin.main"></h5>
        }
    </div>

    <div class="flex min-w-0 items-center gap-2" data-testid="admin-title-bar-actions" tumUiDensity="compact">
        @if (customActionsTemplate()) {
            <ng-container *ngTemplateOutlet="customActionsTemplate()!" />
        }
    </div>
</div>
