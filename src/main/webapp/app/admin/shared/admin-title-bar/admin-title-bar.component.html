<!-- Height, vertical padding and action-control sizing come from `title-bar-frame` /
     `title-bar-compact-controls` in the component stylesheet, so this bar stays identical to the course title
     bar. Only the surface, the horizontal padding and the divider below it are set here. -->
<div id="admin-title-bar" class="module-bg rounded-lg px-3">
    <div class="self-center">
        @if (customTitleTemplate()) {
            <ng-container *ngTemplateOutlet="customTitleTemplate()!" />
        } @else {
            <h5 class="mb-0" jhiTranslate="global.menu.admin.main"></h5>
        }
    </div>

    <div class="flex min-w-0 items-center gap-2" data-testid="admin-title-bar-actions">
        @if (customActionsTemplate()) {
            <ng-container *ngTemplateOutlet="customActionsTemplate()!" />
        }
    </div>
</div>
