<button
    id="quiz-set-visible-{{ quizExercise().id }}"
    tumAetUiButton
    type="submit"
    severity="warn"
    size="small"
    (click)="showQuiz()"
    [disabled]="isInVariantGroup()"
    [style.pointer-events]="isInVariantGroup() ? 'auto' : undefined"
    [tumAetUiTooltip]="isInVariantGroup() ? ('artemisApp.quizExercise.actionDisabledInGroup' | artemisTranslate) : ''"
    tumAetUiTooltipPlacement="top"
    [hidden]="!showSetVisibleButton()"
>
    <fa-icon [icon]="faEye" /><span class="ms-1" jhiTranslate="artemisApp.quizExercise.showNow"></span>
</button>
<button
    id="instructor-quiz-start-{{ quizExercise().id }}"
    tumAetUiButton
    type="submit"
    severity="success"
    size="small"
    (click)="startQuiz()"
    [disabled]="isInVariantGroup()"
    [style.pointer-events]="isInVariantGroup() ? 'auto' : undefined"
    [tumAetUiTooltip]="isInVariantGroup() ? ('artemisApp.quizExercise.actionDisabledInGroup' | artemisTranslate) : ''"
    tumAetUiTooltipPlacement="top"
    [hidden]="!showStartButton()"
>
    <fa-icon [icon]="faPlayCircle" /><span class="ms-1" jhiTranslate="artemisApp.quizExercise.startQuiz"></span>
</button>
<button
    id="instructor-quiz-batches-{{ quizExercise().id }}"
    tumAetUiButton
    type="button"
    severity="primary"
    size="small"
    [tumAetUiPopoverTrigger]="batchMenu"
    [hidden]="!showBatchMenu()"
>
    <fa-icon [icon]="faBoxesStacked" /><span
        class="ms-1"
        jhiTranslate="artemisApp.quizExercise.batches"
        [translateValues]="{ count: quizExercise().quizBatches?.length ?? 0 }"
    ></span>
</button>
<tumaet-ui-popover #batchMenu placement="bottom" [ariaLabel]="'artemisApp.quizExercise.batches' | artemisTranslate: { count: quizExercise().quizBatches?.length ?? 0 }">
    <div class="flex min-w-60 max-w-[calc(100vw-2rem)] flex-col gap-2 text-sm">
        <div class="flex max-h-64 flex-col gap-2 overflow-y-auto">
            @for (batch of quizExercise().quizBatches ?? []; track batch.id) {
                <div class="flex flex-wrap items-center gap-2">
                    <span class="font-semibold" jhiTranslate="artemisApp.exerciseManagement.batch.label" [translateValues]="{ id: batch.id }"></span>
                    @if (!batch.ended && batch.password) {
                        <tumaet-ui-tag
                            class="min-w-0 font-mono wrap-anywhere"
                            severity="secondary"
                            [value]="'artemisApp.exerciseManagement.batch.password' | artemisTranslate: { password: batch.password }"
                        />
                    }
                    @if (batch.ended) {
                        <tumaet-ui-tag class="ms-auto" severity="secondary" [value]="'artemisApp.exerciseManagement.batch.done' | artemisTranslate" />
                    } @else if (batch.started) {
                        <tumaet-ui-tag class="ms-auto" severity="success" [value]="'artemisApp.exerciseManagement.batch.running' | artemisTranslate" />
                    } @else {
                        <button
                            id="instructor-quiz-start-{{ quizExercise().id }}-{{ batch.id }}"
                            tumAetUiButton
                            type="button"
                            severity="success"
                            size="small"
                            class="ms-auto"
                            (click)="startBatch(batch.id!)"
                        >
                            <fa-icon [icon]="faPlayCircle" /><span class="ms-1" jhiTranslate="artemisApp.quizExercise.startBatch"></span>
                        </button>
                    }
                </div>
            } @empty {
                <span class="text-text-secondary italic" jhiTranslate="artemisApp.exerciseManagement.batch.empty"></span>
            }
        </div>
        <button id="instructor-quiz-add-{{ quizExercise().id }}" tumAetUiButton type="button" severity="primary" size="small" (click)="addBatch()">
            <fa-icon [icon]="faPlus" /><span class="ms-1" jhiTranslate="artemisApp.quizExercise.addBatch"></span>
        </button>
    </div>
</tumaet-ui-popover>
<button
    type="button"
    id="quiz-set-end-{{ quizExercise().id }}"
    tumAetUiButton
    severity="danger"
    size="small"
    jhiDeleteButton
    [renderButtonStyle]="false"
    [renderButtonText]="false"
    [disabled]="isInVariantGroup()"
    [style.pointer-events]="isInVariantGroup() ? 'auto' : undefined"
    [tumAetUiTooltip]="isInVariantGroup() ? ('artemisApp.quizExercise.actionDisabledInGroup' | artemisTranslate) : ''"
    tumAetUiTooltipPlacement="top"
    [actionType]="ActionType.EndNow"
    [entityTitle]="quizExercise().title || ''"
    deleteQuestion="artemisApp.quizExercise.endNow.question"
    deleteConfirmationText="artemisApp.exercise.delete.typeNameToConfirm"
    (delete)="endQuiz()"
    [dialogError]="dialogError$"
    [hidden]="!showEndButton()"
>
    <fa-icon [icon]="faStopCircle" /><span class="ms-1" jhiTranslate="artemisApp.quizExercise.endQuiz"></span>
</button>
