<tum-ui-dialog
    [(visible)]="visible"
    [header]="'artemisApp.exercise.exportAction' | artemisTranslate"
    [modal]="true"
    [closable]="true"
    [closeOnEscape]="true"
    [draggable]="false"
    [style]="{ width: '60rem', height: '40rem' }"
    [contentStyle]="{ overflow: 'hidden', display: 'flex', 'flex-direction': 'column', 'padding-bottom': '0' }"
>
    <div class="d-flex flex-column flex-grow-1 overflow-hidden">
        <h2>
            @if (course(); as course) {
                <span jhiTranslate="artemisApp.quizExercise.export.title" [translateValues]="{ param: course.title }"></span>
            }
        </h2>
        <div class="row"></div>
        <br />
        @if (isLoading()) {
            <div class="d-flex align-items-center gap-2 py-4 text-muted">
                <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                <span jhiTranslate="artemisApp.quizExercise.export.loading"></span>
            </div>
        }
        <div class="table-responsive flex-grow-1 overflow-auto" [hidden]="isLoading()">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th width="50%">
                            <span jhiTranslate="artemisApp.quizExercise.export.questionTitle"></span>
                        </th>
                        <th width="25%">
                            <span jhiTranslate="artemisApp.quizExercise.export.quizExerciseTitle"></span>
                        </th>
                        <th width="20%">
                            <span jhiTranslate="artemisApp.exercise.type"></span>
                        </th>
                        <th width="5%">
                            <span jhiTranslate="entity.action.export"></span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    @for (question of questions(); track question) {
                        <tr>
                            <td width="50%">{{ question.title }}</td>
                            <td width="25%">{{ question.exercise?.title || '' }}</td>
                            <td width="20%">{{ question.type }}</td>
                            <td width="5%" class="checkbox">
                                <input class="form-check-input" type="checkbox" [(ngModel)]="question.exportQuiz" />
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>

    <ng-template #footer>
        <p-button severity="secondary" [outlined]="true" size="small" (onClick)="onBack()">
            <fa-icon [icon]="faArrowLeft" class="me-1" /><span jhiTranslate="entity.action.back"></span>
        </p-button>
        <button class="btn btn-success" (click)="exportQuiz()" jhiTranslate="artemisApp.quizExercise.export.export"></button>
    </ng-template>
</tum-ui-dialog>
