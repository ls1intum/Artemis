<div class="mx-auto w-full max-w-7xl -mt-2 px-0!">
    <div class="min-w-0">
        @if (quizExercise()) {
            <div>
                <jhi-exercise-detail-header [exercise]="quizExercise()" [documentationType]="documentationType" />
                <jhi-quiz-exercise-manage-buttons [quizExercise]="quizExercise()" [isDetailPage]="true" (loadQuizExercises)="load()">
                    <div lifecycleActions class="contents">
                        @if (!isExamMode()) {
                            <jhi-quiz-exercise-lifecycle-buttons [quizExercise]="quizExercise()" (loadOne)="load()" (handleNewQuizExercise)="load()" />
                        }
                    </div>
                </jhi-quiz-exercise-manage-buttons>
                @if (showStatistics()) {
                    <div class="mt-6!">
                        <jhi-exercise-detail-statistics
                            [exercise]="quizExercise()"
                            [doughnutStats]="statistics()"
                            [exerciseType]="quizExercise().type!"
                            class="flex justify-around"
                        />
                    </div>
                }
                @if (detailOverviewSections()) {
                    <ng-template #competencyActions>
                        @if (quizExercise().isAtLeastInstructor && !isExamMode()) {
                            <jhi-atlas-orchestration-trigger [exercise]="quizExercise()" [showLabel]="true" />
                        }
                    </ng-template>
                    <jhi-detail-overview-list
                        [footerSection]="quizExercise().isAtLeastInstructor ? { headline: 'artemisApp.exerciseDetail.administration', content: administrationActions } : undefined"
                        [sections]="detailOverviewSections()"
                        [sectionActions]="{ 'artemisApp.exercise.sections.mode': competencyActions }"
                    />
                }

                <ng-template #administrationActions>
                    <jhi-quiz-exercise-manage-buttons [quizExercise]="quizExercise()" [isDetailPage]="true" detailPageSection="administration" (loadQuizExercises)="load()" />
                </ng-template>
            </div>
        }
    </div>
</div>
