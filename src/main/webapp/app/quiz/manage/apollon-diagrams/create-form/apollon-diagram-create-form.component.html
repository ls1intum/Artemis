<form name="editForm" role="form" novalidate class="apollon-diagram-create-form flex flex-col" (ngSubmit)="save()" #editForm="ngForm">
    <div class="flex shrink-0 items-center gap-3 px-4 pt-4 pb-3">
        <h4 class="apollon-diagram-create-form__title mb-0 grow" id="myApollonDiagramLabel" jhiTranslate="artemisApp.apollonDiagram.home.createLabel"></h4>
    </div>

    <div class="flex flex-col gap-4 px-4">
        <div class="flex flex-col gap-1">
            <label class="apollon-diagram-create-form__label" jhiTranslate="artemisApp.apollonDiagram.title" for="field_diagram_title"></label>
            <input #titleInput required type="text" tumUiInput class="w-full" name="title" id="field_diagram_title" [(ngModel)]="apollonDiagram.title" />
        </div>
        <div class="flex flex-col gap-1">
            <label class="apollon-diagram-create-form__label" jhiTranslate="artemisApp.modelingExercise.diagramType" for="field_diagramType"></label>
            <tum-ui-select
                inputId="field_diagramType"
                optionLabel="label"
                optionValue="value"
                name="diagramType"
                [options]="diagramTypeOptions()"
                [(ngModel)]="apollonDiagram.diagramType"
            />
        </div>
    </div>

    <div class="flex shrink-0 items-center justify-end gap-2 px-4 pt-4 pb-4">
        <button type="button" tumUiButton severity="secondary" variant="outlined" size="small" (click)="dismiss()">
            <span jhiTranslate="entity.action.cancel"></span>
        </button>
        <button data-testid="save-dnd-quiz" type="submit" tumUiButton severity="primary" size="small" [disabled]="editForm.form.invalid || isSaving()">
            <fa-icon [icon]="faSave" />
            <span jhiTranslate="global.generic.create"></span>
        </button>
    </div>
</form>
