<form class="flex flex-col gap-6!" #confirmForm="ngForm" name="confirmForm" (ngSubmit)="importQuestions()">
    <h4 class="m-0 pt-4! text-xl! font-medium!" jhiTranslate="artemisApp.quizExercise.importWarningShort"></h4>
    <div class="flex items-start gap-2">
        <fa-icon class="mt-1 text-state-warning" [icon]="faExclamationTriangle" />
        <div class="flex flex-col gap-2">
            <div jhiTranslate="artemisApp.quizExercise.importWarningLong"></div>
            @for (reason of invalidFlaggedQuestions(); track reason) {
                <div>
                    @if ((reason.translateValues | json) !== '{}') {
                        <p class="m-0" jhiTranslate="{{ reason.translateKey }}" [translateValues]="{ index: reason.translateValues.index }"></p>
                    }
                    @if ((reason.translateValues | json) === '{}') {
                        <p class="m-0" jhiTranslate="{{ reason.translateKey }}"></p>
                    }
                </div>
            }
        </div>
    </div>
    <div class="flex justify-end gap-2">
        <button tumAetUiButton severity="secondary" type="button" (click)="closeModal()"><fa-icon [icon]="faBan" /><span jhiTranslate="entity.action.cancel"></span></button>
        <button tumAetUiButton severity="danger" type="submit" [disabled]="!confirmForm.valid">
            <fa-icon [icon]="faTimes" /><span jhiTranslate="artemisApp.quizExercise.confirmImport"></span>
        </button>
    </div>
</form>
