<div class="drag-item" ngClass="{'no-click': clickDisabled}" [style.min-width]="minWidth()">
    @if (dragItem() && dragItem().pictureFilePath) {
        <div class="drag-item-picture" data-testid="drag-item-draggable" [cdkDragDisabled]="clickDisabled()" [cdkDragData]="dragItem()" cdkDrag>
            @if (dragItem().pictureFilePath) {
                <jhi-image [src]="imageSrc()!" [mobileDragAndDrop]="isMobile()" />
            }
            <div *cdkDragPlaceholder></div>
        </div>
    }
    @if (dragItem() && !dragItem().pictureFilePath) {
        <div class="drag-item-text">
            <div [fitText]="true" [activateOnResize]="true" [maxFontSize]="17" [minFontSize]="15" [delay]="150">
                <div class="drag-box" data-testid="drag-item-draggable" [cdkDragDisabled]="clickDisabled()" [cdkDragData]="dragItem()" cdkDrag>
                    <span>{{ dragItem().text }}</span>
                    <div *cdkDragPlaceholder></div>
                    <div *cdkDragPreview matchSize>
                        <div class="overflow-hidden text-ellipsis border border-(--tumaet-ui-border-color) bg-(--tumaet-ui-content-background) p-1 text-color">
                            {{ dragItem().text }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    }
    @if (invalid()) {
        <div class="invalid">
            <span jhiTranslate="artemisApp.showStatistic.invalid"></span>
        </div>
    }
</div>
