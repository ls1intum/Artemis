<div class="markdown-preview visual-mode">
    <h4 jhiTranslate="artemisApp.multipleChoiceQuestion.visualEditor.questionTitle"></h4>
    <textarea
        id="mc-question"
        class="form-control form-group-narrow"
        [(ngModel)]="question().text"
        rows="5"
        (input)="this.questionChanged.emit()"
        placeholder="{{ 'artemisApp.multipleChoiceQuestion.visualEditor.textPlaceholder' | artemisTranslate }}"
    ></textarea>
    <div class="form-group-narrow visual-question-hint">
        <fa-icon [icon]="faQuestionCircle" class="text-secondary me-1" ngbTooltip="{{ 'artemisApp.multipleChoiceQuestion.visualEditor.hintTooltip' | artemisTranslate }}" />
        <input
            class="form-control"
            [(ngModel)]="question().hint"
            (input)="this.questionChanged.emit()"
            placeholder="{{ 'artemisApp.multipleChoiceQuestion.visualEditor.hintPlaceholder' | artemisTranslate }}"
        />
    </div>
    <div class="form-group visual-question-hint">
        <fa-icon
            [icon]="faExclamationCircle"
            class="text-secondary me-1"
            ngbTooltip="{{ 'artemisApp.multipleChoiceQuestion.visualEditor.explanationTooltip' | artemisTranslate }}"
        />
        <input
            class="form-control"
            [(ngModel)]="question().explanation"
            (input)="this.questionChanged.emit()"
            placeholder="{{ 'artemisApp.multipleChoiceQuestion.visualEditor.explanationPlaceholder' | artemisTranslate }}"
        />
    </div>
    <h4 jhiTranslate="artemisApp.multipleChoiceQuestion.visualEditor.answersTitle"></h4>
    @for (answerOption of question().answerOptions; track answerOption; let i = $index) {
        <div id="answer-option-{{ i }}" class="visual-answer-option form-group-narrow">
            <div class="form-group-narrow visual-answer-question-container">
                <div
                    class="visual-answer"
                    [ngClass]="answerOption.isCorrect ? 'visual-answer-correct-container' : 'visual-answer-wrong-container'"
                    (click)="toggleIsCorrect(answerOption)"
                    #keyboardAction37
                    [attr.role]="!(correctToggleDisabled() && !answerOption.isCorrect) ? 'button' : null"
                    [attr.tabindex]="!(correctToggleDisabled() && !answerOption.isCorrect) ? 0 : null"
                    [attr.aria-label]="'artemisApp.multipleChoiceQuestion.visualEditor.correctnessOfAnswer' | artemisTranslate: { number: i + 1 }"
                    [attr.aria-pressed]="!(correctToggleDisabled() && !answerOption.isCorrect) ? answerOption.isCorrect : null"
                    (keydown.enter)="!(correctToggleDisabled() && !answerOption.isCorrect) && $event.target === $event.currentTarget ? keyboardAction37.click() : undefined"
                    (keydown.space)="!(correctToggleDisabled() && !answerOption.isCorrect) && $event.target === $event.currentTarget ? $event.preventDefault() : undefined"
                    (keyup.space)="!(correctToggleDisabled() && !answerOption.isCorrect) && $event.target === $event.currentTarget ? keyboardAction37.click() : undefined"
                >
                    <fa-icon [icon]="answerOption.isCorrect ? faCheck : faXmark" />
                </div>
                <input
                    id="answer-option-{{ i }}-text"
                    class="form-control"
                    [(ngModel)]="answerOption.text"
                    (input)="this.questionChanged.emit()"
                    placeholder="{{ 'artemisApp.multipleChoiceQuestion.visualEditor.textPlaceholder' | artemisTranslate }}"
                />
                <div
                    id="answer-option-{{ i }}-delete"
                    class="visual-answer-delete-container"
                    (click)="deleteAnswer(i)"
                    #keyboardAction51
                    role="button"
                    tabindex="0"
                    [attr.aria-label]="'artemisApp.multipleChoiceQuestion.visualEditor.deleteAnswer' | artemisTranslate: { number: i + 1 }"
                    (keydown.enter)="$event.target === $event.currentTarget ? keyboardAction51.click() : undefined"
                    (keydown.space)="$event.target === $event.currentTarget ? $event.preventDefault() : undefined"
                    (keyup.space)="$event.target === $event.currentTarget ? keyboardAction51.click() : undefined"
                >
                    <fa-icon [icon]="faTrash" />
                </div>
                @if (reEvaluationInProgress() && !answerOption.invalid) {
                    <button type="button" id="answer-option-{{ i }}-invalid" class="btn btn-outline-secondary visual-answer-reset-container" (click)="setInvalid(i)">
                        <span class="visually-hidden">{{ 'artemisApp.multipleChoiceQuestion.visualEditor.invalidateAnswer' | artemisTranslate: { number: i + 1 } }}</span>
                        <fa-icon [icon]="faBan" />
                    </button>
                }
                @if (reEvaluationInProgress()) {
                    <button type="button" id="answer-option-{{ i }}-reset" class="btn btn-outline-secondary visual-answer-reset-container" (click)="resetAnswer(i)">
                        <span class="visually-hidden">{{ 'artemisApp.multipleChoiceQuestion.visualEditor.resetAnswer' | artemisTranslate: { number: i + 1 } }}</span>
                        <fa-icon [icon]="faUndo" />
                    </button>
                }
            </div>
            <div class="form-group-narrow visual-question-hint">
                <fa-icon [icon]="faQuestionCircle" class="text-secondary me-1" ngbTooltip="{{ 'artemisApp.multipleChoiceQuestion.visualEditor.hintTooltip' | artemisTranslate }}" />
                <input
                    class="form-control"
                    [(ngModel)]="answerOption.hint"
                    (input)="this.questionChanged.emit()"
                    placeholder="{{ 'artemisApp.multipleChoiceQuestion.visualEditor.hintPlaceholder' | artemisTranslate }}"
                />
            </div>
            <div class="visual-question-hint">
                <fa-icon
                    [icon]="faExclamationCircle"
                    class="text-secondary me-1"
                    ngbTooltip="{{ 'artemisApp.multipleChoiceQuestion.visualEditor.explanationTooltip' | artemisTranslate }}"
                />
                <input
                    class="form-control"
                    [(ngModel)]="answerOption.explanation"
                    (input)="this.questionChanged.emit()"
                    placeholder="{{ 'artemisApp.multipleChoiceQuestion.visualEditor.explanationPlaceholder' | artemisTranslate }}"
                />
            </div>
        </div>
    }
    @if (!reEvaluationInProgress()) {
        <button type="button" data-testid="add-mc-answer-option" class="btn btn-block btn-success mt-2" (click)="addNewAnswer()">
            <fa-icon [icon]="faPlus" />
            <span jhiTranslate="artemisApp.multipleChoiceQuestion.visualEditor.newAnswerTitle"></span>
        </button>
    }
</div>
