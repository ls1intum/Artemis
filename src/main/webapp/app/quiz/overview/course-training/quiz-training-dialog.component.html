<tumaet-ui-dialog [(visible)]="visible" [closable]="closable()" [closeOnEscape]="closable()" size="small" [header]="'artemisApp.quizTraining.theQuizTraining' | artemisTranslate">
    <div data-testid="quiz-training-dialog">
        <h6 jhiTranslate="artemisApp.quizTraining.howItWorks.title"></h6>
        <p jhiTranslate="artemisApp.quizTraining.howItWorks.content"></p>
        <h6 jhiTranslate="artemisApp.quizTraining.leagues.title"></h6>
        <p jhiTranslate="artemisApp.quizTraining.leagues.content"></p>
        <table class="w-40">
            @for (l of leagues; track l.league) {
                <tr>
                    <td class="pb-2 align-middle">
                        <jhi-league-icon [class]="'small-icon'" [league]="l.league" />
                    </td>
                    <th scope="row" class="pb-2 ps-2 align-middle font-normal" [jhiTranslate]="l.translationKey"></th>
                    <td class="pb-2 text-left align-middle">{{ l.range }}</td>
                </tr>
            }
        </table>
        <p class="mt-4" jhiTranslate="artemisApp.quizTraining.scoring.content"></p>

        @if (showLeaderboardSettings()) {
            <h6 class="mb-4" jhiTranslate="artemisApp.quizTraining.leaderboardSetting">Leaderboard Settings</h6>
            <div class="leaderboard-toggle flex items-center">
                <tumaet-ui-toggle-switch inputId="quiz-training-show-in-leaderboard" [(ngModel)]="showInLeaderboard" />
                <label class="m-0 ms-2" for="quiz-training-show-in-leaderboard" jhiTranslate="artemisApp.quizTraining.showInLeaderboard"></label>
                <span
                    class="ms-2!"
                    [tumAetUiTooltip]="'artemisApp.userSettings.quizTrainingSettings.leaderboardVisibilityInfo' | artemisTranslate"
                    tumAetUiTooltipPlacement="right"
                >
                    <fa-icon [icon]="faQuestionCircle" />
                </span>
            </div>
        }
    </div>
    @if (showLeaderboardSettings()) {
        <ng-template #footer>
            <jhi-button data-testid="quiz-training-confirm-button" [title]="'artemisApp.quizTraining.confirm'" [disabled]="saveDisabled()" (onClick)="save.emit()" />
        </ng-template>
    }
</tumaet-ui-dialog>
