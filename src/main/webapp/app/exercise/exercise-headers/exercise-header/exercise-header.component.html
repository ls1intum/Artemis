<!--
    Header card: the title with its actions on one row, the information boxes below. The two rows are separated by the
    same gap as on the lecture page rather than by a rule, so both detail headers read alike.
-->
<div id="exercise-header" class="detail-header-card flex-fill">
    <div class="detail-header-title-row flex-wrap justify-content-between gap-2">
        <div class="d-flex align-items-center gap-3 overflow-parent">
            @if (showSidebarToggle() && isSidebarCollapsed()) {
                <jhi-course-sidebar-toggle-button [isCollapsed]="isSidebarCollapsed()" (toggleSidebar)="toggleSidebar.emit()" />
            }
            @if (exerciseIcon()) {
                <h5 class="mb-0 text-truncate">
                    <fa-icon [icon]="exerciseIcon()!" />
                    {{ exercise().title }}
                </h5>
            }
        </div>
        <jhi-exercise-header-actions
            class="w-auto"
            [courseId]="courseId()"
            [exercise]="exercise()"
            [onSubmitExercise]="effectiveOnSubmitExercise()"
            [onContinueExercise]="onContinueExercise()"
            [onRestartPractice]="onRestartPractice()"
            [submitDisabled]="submitDisabled()"
            [submitLabel]="submitLabel()"
            [plagiarismCaseInfo]="plagiarismCaseInfo()"
            [participationMode]="participationMode()"
            (newParticipation)="onNewParticipation($event)"
            (participationModeChange)="participationMode.set($event)"
        />
    </div>

    <div class="d-flex align-items-center gap-2">
        <jhi-exercise-headers-information
            class="flex-grow-1 overflow-parent"
            [exercise]="exercise()"
            [studentParticipation]="activeParticipation()"
            [submissionPolicy]="submissionPolicy()"
            [course]="exercise().course"
            [isPractice]="participationMode() === 'practice'"
            [athenaEnabled]="athenaEnabled()"
            [feedbackRequestLimit]="feedbackRequestLimit()"
            [quizLiveStatus]="quizLiveStatus()"
            [quizLiveHeaderInfo]="quizLiveHeaderInfo()"
            (viewingSubmissionChange)="isViewingSubmission.set($event)"
        />
        <jhi-participation-mode-toggle
            class="ms-auto flex-shrink-0"
            [mode]="participationMode()"
            (modeChange)="participationMode.set($event)"
            [hasPractice]="showPracticeMode()"
            [hasGraded]="showGradedMode()"
        />
        @if (exercise().type === ExerciseType.PROGRAMMING && !exercise().exerciseGroup && irisPromptingModeEnabled()) {
            <jhi-start-prompting-button [exercise]="exercise()" [smallButtons]="false" [participation]="studentParticipation()" />
            <jhi-start-in-class-quiz-button [exercise]="exercise()" [smallButtons]="false" [participation]="studentParticipation()" />
        }
    </div>
</div>
