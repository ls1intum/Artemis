@if (hasPractice() || hasGraded()) {
    <div
        class="participation-mode"
        [class.participation-mode--practice]="canToggle() ? mode() === 'practice' : hasPractice()"
        [class.participation-mode--graded]="canToggle() ? mode() === 'graded' : hasGraded()"
    >
        @if (canToggle()) {
            <div id="participation-mode-toggle" class="inline-flex gap-1" role="group">
                @for (option of modeOptions; track option.value) {
                    <button
                        tumAetUiButton
                        type="button"
                        size="small"
                        [severity]="mode() === option.value ? 'primary' : 'secondary'"
                        [attr.aria-pressed]="mode() === option.value"
                        (click)="selectMode(option.value)"
                    >
                        <span class="participation-mode__item" [attr.data-testid]="option.value + '-mode-button'" [attr.data-selected]="mode() === option.value">
                            <fa-icon [icon]="option.icon" /><span [jhiTranslate]="option.label"></span>
                        </span>
                    </button>
                }
            </div>
        } @else {
            <tumaet-ui-tag id="participation-mode-badge" severity="secondary" [rounded]="true">
                <span class="participation-mode__item">
                    <fa-icon [icon]="hasPractice() ? faBook : faGraduationCap" />
                    @if (hasPractice()) {
                        <span jhiTranslate="artemisApp.exerciseActions.mode.practice"></span>
                    } @else {
                        <span jhiTranslate="artemisApp.exerciseActions.mode.graded"></span>
                    }
                </span>
            </tumaet-ui-tag>
        }
    </div>
}
