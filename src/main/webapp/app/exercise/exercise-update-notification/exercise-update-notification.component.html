<input
    tumAetUiInput
    [attr.aria-label]="'artemisApp.exercise.notificationText' | artemisTranslate"
    placeholder="{{ 'artemisApp.exercise.notificationText' | artemisTranslate }}"
    title="{{ 'artemisApp.exercise.notificationText' | artemisTranslate }}"
    minlength="3"
    type="text"
    class="text-sm"
    name="notificationText"
    id="field_notification_text"
    (change)="onInputChanged()"
    [ngModel]="currentNotificationText()"
    (ngModelChange)="currentNotificationText.set($event)"
/>
