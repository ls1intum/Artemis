@if (exercise(); as exercise) {
    <div>
        <h2 class="row mb-5 col-md-2" id="statistics-page-heading" jhiTranslate="exercise-statistics.title"></h2>
        <div class="mb-3 d-flex justify-content-around">
            <jhi-exercise-detail-statistics [exercise]="exercise" [doughnutStats]="exerciseStatistics()" [exerciseType]="exercise.type!" />
        </div>
        @if (exerciseStatistics(); as exerciseStatistics) {
            <jhi-statistics-score-distribution-graph
                [averageScoreOfExercise]="exerciseStatistics.averageScoreOfExercise"
                [scoreDistribution]="exerciseStatistics.scoreDistribution"
                [numberOfExerciseScores]="exerciseStatistics.numberOfExerciseScores"
                [exerciseType]="exercise.type!"
                [courseId]="course()?.id!"
                [exerciseId]="exercise.id!"
                [exerciseGroup]="exercise.exerciseGroup"
            />
        }
        <div class="separator w-100 mb-4"></div>
        <div class="row mb-5">
            <div
                jhi-statistics-span-selector
                [currentSpan]="currentSpan()"
                (spanChange)="onTabChanged($event)"
                class="offset-md-2 col-md-9 btn-group btn-group-toggle"
                data-toggle="buttons"
            ></div>
        </div>
        @for (graph of graphTypes; track graph; let i = $index) {
            <div id="exercise-statistics-graph-{{ i }}" class="graph">
                @if (i !== 0) {
                    <hr />
                }
                <jhi-statistics-graph [graphType]="graph" [currentSpan]="currentSpan()" [statisticsView]="statisticsView" [entityId]="exercise.id!" />
            </div>
        }
    </div>
}
