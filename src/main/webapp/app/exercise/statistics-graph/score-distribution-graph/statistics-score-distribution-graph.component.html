<div class="grid grid-cols-12 gap-4 mb-3">
    <div class="col-span-12 xl:col-span-2">
        <h3 jhiTranslate="statistics.score_distribution"></h3>
    </div>
    <div class="col-span-12 xl:col-span-9" style="height: 250px">
        <tumaet-ui-bar-chart
            [labels]="chartData().labels"
            [series]="chartData().series"
            [config]="chartConfig()"
            interactive
            (dataSelect)="selectChartBar($event)"
            [ariaLabel]="'statistics.score_distribution' | artemisTranslate"
        />
    </div>
</div>
