<div class="relative" [tumAetUiTooltip]="tooltip()">
    <tumaet-ui-progress-bar
        [value]="normalizedPercentage()"
        [showValue]="false"
        [severity]="normalizedPercentage() < 50 ? 'danger' : normalizedPercentage() < 100 ? 'warn' : 'success'"
    />
    <span class="absolute inset-0 flex items-center justify-center text-sm font-medium">{{ numerator() }} / {{ denominator() }} ({{ normalizedPercentage() + '%' }})</span>
</div>
