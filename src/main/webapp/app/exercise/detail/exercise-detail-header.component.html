<header class="@container mb-4! flex min-w-0 flex-wrap items-baseline justify-between gap-2">
    <div class="flex min-w-0 flex-1 basis-full items-baseline gap-2 @2xl:basis-0">
        <h1 class="m-0! min-w-0 text-2xl font-semibold wrap-anywhere">
            <span class="me-2 inline-flex items-center text-base font-medium text-text-secondary" [attr.title]="typeLabel() | artemisTranslate"
                ><fa-icon [icon]="icon()" /><span class="sr-only" [jhiTranslate]="typeLabel()"></span
            ></span>
            {{ exercise().title }}
        </h1>
        <jhi-documentation-button [type]="documentationType()" />
    </div>
    <div class="flex shrink-0 items-center gap-2 text-sm"><ng-content select="[detailHeaderSecondary]" /></div>
</header>
