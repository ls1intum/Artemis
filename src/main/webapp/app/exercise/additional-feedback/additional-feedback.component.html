<div id="additional-feedback">
    <b>
        <fa-icon [icon]="faCommentDots" />&nbsp;
        @if (additional()) {
            <span jhiTranslate="artemisApp.assessment.additionalFeedback"></span>
        }
        @if (!additional()) {
            <span jhiTranslate="artemisApp.assessment.feedback"></span>
        }
        :</b
    >
    <br />
    <br />
    @for (singleFeedback of feedback(); track singleFeedback) {
        <jhi-unified-feedback
            [feedback]="singleFeedback"
            [feedbackContent]="buildFeedbackTextForReview(singleFeedback, false)"
            [points]="singleFeedback.credits || 0"
            [scoreAccuracy]="course()?.accuracyOfScores"
            [showReference]="false"
        />
    }
</div>
