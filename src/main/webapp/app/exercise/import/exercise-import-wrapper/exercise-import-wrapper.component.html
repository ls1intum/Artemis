<form>
    <div class="flex items-center justify-between gap-3! border-b border-border p-4!">
        <h4 class="text-xl font-semibold" jhiTranslate="{{ titleKey }}"></h4>
        <button severity="secondary" tumAetUiButton type="button" id="cancel-btn" class="inline-flex items-center justify-center rounded-md p-2" variant="text" (click)="clear()">
            <span jhiTranslate="entity.action.cancel"></span>
        </button>
    </div>
    <!-- imports from file are currently only supported for programming exercises, for the other exercise types we need to show the import dialog as it was before -->
    @if (exerciseType === ExerciseType.PROGRAMMING && !programmingLanguage) {
        <jhi-exercise-import-tabs id="exercise-import-tabs" [exerciseType]="exerciseType" />
    }
    @if (exerciseType !== ExerciseType.PROGRAMMING || programmingLanguage) {
        <jhi-exercise-import id="exercise-import" [exerciseType]="exerciseType" [programmingLanguage]="programmingLanguage" />
    }
</form>
