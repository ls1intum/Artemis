<div>
    <label class="label-narrow inline-block mb-[0.1rem]" for="importFileInput" jhiTranslate="artemisApp.team.sourceFile.label"></label>
    <jhi-help-icon text="artemisApp.team.sourceFile.tooltip" class="me-1" />
    @if (loading()) {
        <fa-icon class="loading-spinner" [icon]="faSpinner" animation="spin" />
    }
</div>
<div class="block">
    <input id="importFileInput" type="file" accept=".json,.csv" class="block w-full" (change)="setImportFile($event)" placeholder="Upload file..." />
</div>
