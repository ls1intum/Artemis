<tumaet-ui-autocomplete
    [ariaLabel]="'artemisApp.team.addStudentToTeam' | artemisTranslate"
    #autocomplete
    data-testid="student-search-input"
    inputId="teamStudentsInput"
    name="student-search"
    class="block w-full"
    [ngModel]="inputDisplayValue"
    [ngModelOptions]="{ standalone: true }"
    [suggestions]="suggestions()"
    optionLabel="label"
    optionDisabled="disabled"
    [minLength]="0"
    [debounceMs]="0"
    [completeOnFocus]="true"
    [placeholder]="'artemisApp.team.addStudentToTeam' | artemisTranslate"
    (searchRequested)="requestSearch($event.query)"
    (optionSelected)="selectOption($event)"
/>
