<tumaet-ui-autocomplete
    [ariaLabel]="'artemisApp.team.selectOwnerForTeam' | artemisTranslate"
    #autocomplete
    data-testid="owner-search-input"
    inputId="teamOwnerInput"
    name="owner-search"
    class="block w-full"
    [ngModel]="inputDisplayValue"
    [ngModelOptions]="{ standalone: true }"
    [suggestions]="suggestions()"
    optionLabel="label"
    optionDisabled="disabled"
    [minLength]="0"
    [debounceMs]="0"
    [completeOnFocus]="true"
    [placeholder]="'artemisApp.team.selectOwnerForTeam' | artemisTranslate"
    [disabled]="inputDisabled()"
    (searchRequested)="requestSearch($event.query)"
    (optionSelected)="selectOption($event)"
/>
