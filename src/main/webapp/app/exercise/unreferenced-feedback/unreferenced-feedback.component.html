<section class="unreferenced-feedback" (drop)="createAssessmentOnDrop($event)" (dragover)="$event.preventDefault()">
    <div class="unreferenced-feedback__header">
        <h3 jhiTranslate="artemisApp.assessment.detail.feedback"></h3>
        <button type="button" tumUiButton size="small" severity="success" class="add-unreferenced-feedback" (click)="addUnreferencedFeedback()" [disabled]="readOnly()">
            <span jhiTranslate="artemisApp.fileUploadAssessment.addFeedback"></span>
        </button>
    </div>

    @if (unreferencedFeedback.length + feedbackSuggestions().length === 0) {
        <p class="unreferenced-feedback__empty" role="status" jhiTranslate="artemisApp.fileUploadAssessment.assessInstructionWithDropOption"></p>
    } @else {
        <div class="unreferenced-feedback__grid">
            @for (feedback of unreferencedFeedback; track feedback) {
                <div class="unreferenced-feedback__item">
                    <jhi-unreferenced-feedback-detail
                        [feedback]="feedback"
                        (onFeedbackChange)="updateFeedback($event)"
                        (onFeedbackDelete)="deleteFeedback(feedback)"
                        [readOnly]="readOnly()"
                        [highlightDifferences]="highlightDifferences()"
                        [useDefaultFeedbackSuggestionBadgeText]="useDefaultFeedbackSuggestionBadgeText()"
                    />
                </div>
            }
            @for (suggestion of feedbackSuggestions(); track suggestion) {
                <div class="unreferenced-feedback__item">
                    <jhi-unreferenced-feedback-detail
                        [feedback]="suggestion"
                        [isSuggestion]="true"
                        [readOnly]="true"
                        (onAcceptSuggestion)="acceptSuggestion($event)"
                        (onDiscardSuggestion)="discardSuggestion($event)"
                        [useDefaultFeedbackSuggestionBadgeText]="useDefaultFeedbackSuggestionBadgeText()"
                    />
                </div>
            }
        </div>
    }
</section>
