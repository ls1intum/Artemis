<div (drop)="createAssessmentOnDrop($event)" (dragover)="$event.preventDefault()">
    <div class="col-md-6">
        <tum-ui-button severity="success" class="mt-4 add-unreferenced-feedback" [disabled]="readOnly()" (clicked)="addUnreferencedFeedback()">
            {{ 'artemisApp.fileUploadAssessment.addFeedback' | artemisTranslate }}
        </tum-ui-button>
        <div class="row mt-4">
            <h4 class="col-12" jhiTranslate="artemisApp.assessment.detail.feedback"></h4>
            @if (unreferencedFeedback.length === 0) {
                <div class="col-12 col-lg-8 col-xl-6">
                    <div class="alert alert-secondary text-center" role="alert">
                        <p jhiTranslate="artemisApp.fileUploadAssessment.assessInstructionWithDropOption"></p>
                    </div>
                </div>
            }
            @for (feedback of unreferencedFeedback; track feedback) {
                <div class="col-12 col-lg-6 col-xl-6">
                    <jhi-unreferenced-feedback-detail
                        [feedback]="feedback"
                        [resultId]="resultId()"
                        (onFeedbackChange)="updateFeedback($event)"
                        (onFeedbackDelete)="deleteFeedback(feedback)"
                        [readOnly]="readOnly()"
                        [highlightDifferences]="highlightDifferences()"
                    />
                </div>
            }
        </div>
    </div>
</div>
