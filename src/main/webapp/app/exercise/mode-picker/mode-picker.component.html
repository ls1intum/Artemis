<div class="inline-flex flex-wrap gap-1" role="group">
    @for (option of options(); track option.value) {
        <button
            tumAetUiButton
            type="button"
            [severity]="value() === option.value ? (option.severity ?? 'primary') : 'secondary'"
            [variant]="value() === option.value ? 'solid' : 'outlined'"
            [disabled]="disabled()"
            [attr.aria-pressed]="value() === option.value"
            (click)="setMode(option.value)"
        >
            {{ option.label ?? (option.labelKey | artemisTranslate) }}
        </button>
    }
</div>
