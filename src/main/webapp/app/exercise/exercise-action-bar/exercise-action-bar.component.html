<div #actionsRow class="flex gap-1 items-center justify-end flex-nowrap w-full">
    <!-- Reserved prefix content (e.g. quiz lifecycle buttons, an exam test-run warning) always stays visible; grouped
         so its reserved width can be measured. -->
    <span #reservedGroup class="flex gap-1 items-center flex-nowrap">
        <ng-content select="[actionBarReserved]" />
        @if (hasReservedContent() && items().length > 0) {
            <div class="action-separator mx-1"></div>
        }
    </span>

    <!-- Inline icon buttons: all rendered once (stable DOM). Overflowing ones get `hidden` and appear in the menu instead;
         resizing only toggles that class, it never recreates buttons. -->
    @for (item of inlineActions(); track item.action.id) {
        <span #inlineItem class="inline-item" [attr.data-signature]="item.signature" [class.hidden]="item.hidden">
            <ng-container [ngTemplateOutlet]="actionTpl" [ngTemplateOutletContext]="item.context" />
        </span>
    }
    <button
        tumAetUiButton
        type="button"
        severity="secondary"
        variant="outlined"
        size="small"
        class="action-more"
        [class.hidden]="!hasOverflow()"
        [tumAetUiPopoverTrigger]="menu"
        [tumAetUiTooltip]="'artemisApp.exerciseManagement.moreActions' | artemisTranslate"
        tumAetUiTooltipPlacement="top"
        [attr.aria-label]="'artemisApp.exerciseManagement.moreActions' | artemisTranslate"
    >
        <fa-icon [icon]="faEllipsis" />
    </button>
    <tumaet-ui-popover #menu placement="bottom" [ariaLabel]="'artemisApp.exerciseManagement.moreActions' | artemisTranslate">
        <div class="action-menu flex flex-col">
            @for (action of hiddenActions(); track action.id) {
                <ng-container [ngTemplateOutlet]="actionTpl" [ngTemplateOutletContext]="{ $implicit: action, inMenu: true }" />
            }
        </div>
    </tumaet-ui-popover>
</div>

<!-- Inline, an action is an outlined icon button whose label is its tooltip and accessible name; in the menu it is a
     plain row with icon and label, coloured only when destructive. -->
<ng-template #actionTpl let-action let-inMenu="inMenu">
    @switch (action.kind) {
        @case ('delete') {
            <!-- No tooltip on the disabled state here: a disabled native button swallows pointer events. The link
                 branch below can show one because it keeps pointer-events enabled. -->
            <button
                type="button"
                tumAetUiButton
                jhiDeleteButton
                [attr.data-testid]="'exercise-action-' + action.id"
                [renderButtonText]="false"
                [renderButtonStyle]="false"
                [severity]="action.severity"
                [variant]="inMenu ? 'text' : 'outlined'"
                size="small"
                [disabled]="!!action.disabled"
                [entityTitle]="action.delete!.entityTitle"
                [entitySummaryTitle]="action.delete!.entitySummaryTitle"
                [fetchCategorizedEntitySummary]="action.delete!.fetchCategorizedEntitySummary"
                [deleteQuestion]="action.delete!.deleteQuestion"
                [deleteConfirmationText]="action.delete!.deleteConfirmationText"
                [translateValues]="action.delete!.translateValues"
                [additionalChecks]="action.delete!.additionalChecks"
                (delete)="onDelete(action, $event)"
                [dialogError]="action.delete!.dialogError"
                [class.action-icon]="!inMenu"
                [class.action-menu-item]="inMenu"
                [attr.aria-label]="inMenu ? undefined : (action.labelKey | artemisTranslate)"
                [tumAetUiTooltip]="tooltipOf(action, inMenu)"
                tumAetUiTooltipPlacement="top"
            >
                <ng-container [ngTemplateOutlet]="contentTpl" [ngTemplateOutletContext]="{ $implicit: action, inMenu }" />
            </button>
        }
        @case ('button') {
            <button
                tumAetUiButton
                type="button"
                [attr.data-testid]="'exercise-action-' + action.id"
                [severity]="inMenu ? 'secondary' : action.severity"
                [variant]="inMenu ? 'text' : 'outlined'"
                [disabled]="!!action.disabled"
                size="small"
                [class.action-icon]="!inMenu"
                [class.action-menu-item]="inMenu"
                [attr.aria-label]="inMenu ? undefined : (action.labelKey | artemisTranslate)"
                [tumAetUiTooltip]="tooltipOf(action, inMenu)"
                tumAetUiTooltipPlacement="top"
                (click)="runAction(action)"
            >
                <ng-container [ngTemplateOutlet]="contentTpl" [ngTemplateOutletContext]="{ $implicit: action, inMenu }" />
            </button>
        }
        @default {
            <a
                tumAetUiButton
                [attr.data-testid]="'exercise-action-' + action.id"
                [routerLink]="action.disabled ? undefined : action.link"
                [severity]="inMenu ? 'secondary' : action.severity"
                [variant]="inMenu ? 'text' : 'outlined'"
                size="small"
                [class.opacity-60]="action.disabled"
                [class.action-icon]="!inMenu"
                [class.action-menu-item]="inMenu"
                [attr.aria-label]="inMenu ? undefined : (action.labelKey | artemisTranslate)"
                [attr.aria-disabled]="action.disabled || undefined"
                [attr.tabindex]="action.disabled ? -1 : undefined"
                [style.pointer-events]="action.disabled ? 'auto' : undefined"
                [tumAetUiTooltip]="tooltipOf(action, inMenu)"
                tumAetUiTooltipPlacement="top"
                (click)="closeMenuIfOpen(inMenu)"
            >
                <ng-container [ngTemplateOutlet]="contentTpl" [ngTemplateOutletContext]="{ $implicit: action, inMenu }" />
            </a>
        }
    }
</ng-template>

<ng-template #contentTpl let-action let-inMenu="inMenu">
    <fa-icon [icon]="action.icon" [fixedWidth]="true" />
    @if (inMenu) {
        <span [jhiTranslate]="action.labelKey"></span>
    }
</ng-template>
