<h4 class="font-medium">
    <div class="inline-flex items-center rounded px-2 py-0.5 text-xs font-semibold me-1" [style.background-color]="category().color" [ngClass]="'category-' + fontSize()">
        {{ category().category }}
        @if (displayRemoveButton()) {
            <button type="button" class="remove-button" (click)="onClick()()">
                <fa-icon [icon]="faTimes" class="category-chip-remove" />
            </button>
        }
    </div>
</h4>
