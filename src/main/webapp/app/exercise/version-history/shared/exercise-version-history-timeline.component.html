<div class="flex h-full min-h-0 flex-col">
    <header class="border-b border-border p-3!">
        <h3 class="m-0 text-lg font-semibold">
            <span jhiTranslate="artemisApp.exercise.versionHistory.timeline.title"></span>
            <span class="text-sm text-text-secondary">({{ totalItems() }})</span>
        </h3>
    </header>
    <div class="min-h-0 overflow-auto p-3!">
        @if (loading()) {
            <tumaet-ui-progress-spinner />
        } @else if (timelineEntries().length === 0) {
            <tumaet-ui-message severity="info"><span jhiTranslate="artemisApp.exercise.versionHistory.timeline.empty"></span></tumaet-ui-message>
        } @else {
            <ol class="m-0 flex list-none flex-col gap-3! p-0">
                @for (entry of timelineEntries(); track entry.id) {
                    <li class="flex items-start gap-2">
                        <jhi-profile-picture
                            [authorName]="entry.displayName"
                            [authorId]="entry.authorId"
                            [imageUrl]="entry.authorImageUrl"
                            imageSizeInRem="1.5rem"
                            fontSizeInRem="0.6rem"
                            [imageId]="'timeline-profile-' + entry.id"
                            [defaultPictureId]="'timeline-default-profile-' + entry.id"
                        />
                        <button
                            data-testid="version-history-entry"
                            tumAetUiButton
                            type="button"
                            variant="outlined"
                            class="min-w-0 grow text-left"
                            [attr.data-selected]="selectedVersionId() === entry.id"
                            [attr.aria-pressed]="selectedVersionId() === entry.id"
                            [attr.aria-label]="'Version ' + entry.id"
                            (click)="onSelect(entry.id)"
                        >
                            <span class="flex min-w-0 flex-col items-start gap-1">
                                <span class="font-semibold">#{{ entry.id }}</span>
                                <span class="break-words">{{ entry.displayName }}</span>
                                <span class="text-sm text-text-secondary">{{ entry.secondaryName }}</span>
                                @if (entry.createdDate) {
                                    <span class="text-xs text-text-secondary" [title]="entry.createdDate | artemisDate: 'long' : true">{{
                                        entry.createdDate | artemisDate: 'short' : true
                                    }}</span>
                                } @else {
                                    <span class="text-xs text-text-secondary">-</span>
                                }
                            </span>
                        </button>
                    </li>
                }
            </ol>
        }
        @if (hasMore()) {
            <tumaet-ui-button
                data-testid="version-history-load-more"
                class="mt-4! w-full"
                severity="secondary"
                variant="outlined"
                [loading]="loadingMore()"
                (clicked)="onLoadMore()"
            >
                <span jhiTranslate="artemisApp.exercise.versionHistory.timeline.loadMore"></span>
            </tumaet-ui-button>
        }
    </div>
</div>
