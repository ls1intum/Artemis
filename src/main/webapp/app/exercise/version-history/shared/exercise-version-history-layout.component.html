<div class="version-history-layout">
    <tumaet-ui-splitter [panelSizes]="[30, 70]" class="h-full min-h-0 w-full" [layout]="isNarrow() ? 'vertical' : 'horizontal'">
        <ng-template #panel>
            <section class="left-pane">
                <ng-content select="[version-history-left]" />
            </section>
        </ng-template>
        <ng-template #panel>
            <section class="right-pane">
                <ng-content select="[version-history-right]" />
            </section>
        </ng-template>
    </tumaet-ui-splitter>
</div>
