<div class="rating" data-testid="exercise-rating" [class.rating--inline]="layout() === 'inline'" [class.non-clickable]="disableRating()" [id]="'rating'">
    <span class="rating__label" jhiTranslate="artemisApp.rating.label"></span>
    <star-rating
        checkedColor="var(--rating-star-selected)"
        uncheckedColor="var(--rating-star-muted)"
        [value]="rating() || 0"
        [size]="starSize()"
        [readOnly]="false"
        [totalStars]="5"
        (rate)="onRate($event)"
    />
</div>
