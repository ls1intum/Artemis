@for (link of assessmentLinks(); track link.result?.id ?? link.correctionRound) {
    <div class="flex items-center gap-1">
        <a
            tumAetUiButton
            size="small"
            data-testid="manage-assessment-link"
            class="whitespace-nowrap"
            [attr.data-assessment-action]="link.action"
            [attr.data-correction-round]="link.correctionRound"
            [severity]="link.severity"
            [attr.aria-label]="link.labelKey | artemisTranslate: { correctionRound: link.correctionRound + 1 }"
            [routerLink]="disabled() ? null : link.link"
            [tumAetUiTooltip]="disabledTooltip()"
            [attr.aria-disabled]="disabled() || null"
            [class.opacity-60]="disabled()"
            [class.cursor-not-allowed]="disabled()"
            [attr.tabindex]="disabled() ? -1 : null"
            [queryParams]="{ 'correction-round': link.targetRound, testRun: isTestRun() || undefined }"
        >
            <fa-icon [icon]="faClipboardList" [fixedWidth]="true" />
            <span class="hidden xl:inline">
                {{ link.labelKey | artemisTranslate: { correctionRound: link.correctionRound + 1 } }}
            </span>
        </a>
        @if (link.canCancel) {
            <button
                type="button"
                tumAetUiButton
                size="small"
                severity="danger"
                data-testid="manage-assessment-cancel"
                class="whitespace-nowrap"
                (click)="cancelAssessment(link.result!, participation(), link.submissionId)"
                [disabled]="isLoading() || disabled()"
                [attr.aria-label]="
                    'artemisApp.assessment.dashboard.actions.' + (examMode() ? 'examCorrectionRound.' : '') + 'cancel'
                        | artemisTranslate: { correctionRound: link.correctionRound + 1 }
                "
            >
                <fa-icon [fixedWidth]="true" [icon]="faBan" />
                <span class="hidden xl:inline">
                    {{
                        'artemisApp.assessment.dashboard.actions.' + (examMode() ? 'examCorrectionRound.' : '') + 'cancel'
                            | artemisTranslate: { correctionRound: link.correctionRound + 1 }
                    }}
                </span>
            </button>
        }
    </div>
}
