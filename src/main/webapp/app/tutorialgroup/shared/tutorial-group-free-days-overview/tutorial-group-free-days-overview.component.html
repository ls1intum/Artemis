<jhi-side-panel [panelHeader]="'artemisApp.pages.courseTutorialGroupOverview.freeDaySidePanel.header' | artemisTranslate">
    <tum-ui-list [ariaLabel]="'artemisApp.pages.courseTutorialGroupOverview.freeDaySidePanel.header' | artemisTranslate">
        @for (freeDay of tutorialGroupFreeDays(); track freeDay) {
            <li tumUiListItem inline>
                <span class="date-text" [class.opacity-50]="isInThePast(freeDay)">
                    {{ freeDay.start | artemisDate: 'long-date' : false : timeZone() : true }}
                </span>
                @if (freeDay.reason && freeDay.reason.trim().length > 0) {
                    <button
                        type="button"
                        tumUiButton
                        severity="secondary"
                        variant="outlined"
                        size="small"
                        class="whitespace-nowrap"
                        [class.opacity-50]="isInThePast(freeDay)"
                        [tumUiPopoverTrigger]="reasonPopover"
                        jhiTranslate="artemisApp.entities.tutorialFreePeriod.reason"
                    ></button>
                    <tum-ui-popover #reasonPopover placement="top" [ariaLabel]="'artemisApp.entities.tutorialFreePeriod.reason' | artemisTranslate">
                        <h3 class="mb-1 text-sm font-semibold" jhiTranslate="artemisApp.entities.tutorialFreePeriod.reason"></h3>
                        <p class="text-sm">{{ freeDay.reason!.trim() }}</p>
                    </tum-ui-popover>
                }
            </li>
        }
    </tum-ui-list>
</jhi-side-panel>
