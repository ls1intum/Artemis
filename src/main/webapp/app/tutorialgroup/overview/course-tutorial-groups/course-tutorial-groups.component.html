<div class="flex justify-between">
    @let currentCourseId = courseId();
    @let currentSidebarData = sidebarData();
    @if (currentCourseId && currentSidebarData) {
        <div [class.sidebar-collapsed]="isCollapsed()">
            <jhi-sidebar
                [itemSelected]="itemSelected()"
                [courseId]="currentCourseId"
                [sidebarData]="currentSidebarData"
                [collapseState]="DEFAULT_COLLAPSE_STATE"
                [sidebarItemAlwaysShow]="DEFAULT_SHOW_ALWAYS"
                [pageTitle]="pageTitle()"
                [showSidebarToggle]="true"
                [isSidebarCollapsed]="isCollapsed()"
                (toggleSidebar)="toggleSidebar()"
            />
        </div>

        @if (itemSelected()) {
            <div class="module-bg w-screen rounded-lg">
                <router-outlet (activate)="onSubRouteActivate($event)" />
            </div>
        } @else {
            <div class="module-bg w-screen rounded-lg p-3 flex flex-col">
                @if (isCollapsed()) {
                    <div>
                        <jhi-course-sidebar-toggle-button [isCollapsed]="isCollapsed()" (toggleSidebar)="toggleSidebar()" />
                    </div>
                }
                <div class="my-auto w-full text-center" jhiTranslate="artemisApp.courseOverview.tutorialGroups.selectTutorialGroup"></div>
            </div>
        }
    }
</div>
