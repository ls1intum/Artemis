<tumaet-ui-table-layout class="[--table-layout-offset:26rem] max-md:[--table-layout-offset:34rem]" [empty]="rows().length === 0">
    <table tumAetUiTable size="small">
        <thead>
            <tr>
                <th scope="col" jhiTranslate="artemisApp.pages.tutorialGroupRegistrations.importModal.tableHeader.login"></th>
                <th scope="col" jhiTranslate="artemisApp.pages.tutorialGroupRegistrations.importModal.tableHeader.registrationNumber"></th>
            </tr>
        </thead>

        <tbody>
            @for (row of rows(); track row.login ?? row.registrationNumber) {
                <tr>
                    <td [class.danger]="row.login && row.markFilledCells" [class.bg-state-danger]="row.login && row.markFilledCells">{{ row.login }}</td>
                    <td [class.danger]="row.registrationNumber && row.markFilledCells" [class.bg-state-danger]="row.registrationNumber && row.markFilledCells">
                        {{ row.registrationNumber }}
                    </td>
                </tr>
            }
        </tbody>
    </table>
</tumaet-ui-table-layout>
