<div class="frame">
    <div class="scroll-container">
        <table class="import-table">
            <thead>
                <tr>
                    <th scope="col" jhiTranslate="artemisApp.pages.tutorialGroupRegistrations.importModal.tableHeader.login"></th>
                    <th scope="col" jhiTranslate="artemisApp.pages.tutorialGroupRegistrations.importModal.tableHeader.registrationNumber"></th>
                </tr>
            </thead>

            <tbody>
                @for (row of rows(); track row.login ?? row.registrationNumber) {
                    <tr>
                        <td [class.danger]="row.login && row.markFilledCells">{{ row.login }}</td>
                        <td [class.danger]="row.registrationNumber && row.markFilledCells">{{ row.registrationNumber }}</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
