<button tumUiButton size="small" severity="secondary" variant="outlined" type="button" id="exportDialogButton" (click)="openExportDialog($event)">
    <fa-icon [icon]="faFileExport" />
    <!-- sr-only below md keeps the label in the accessibility tree so the icon-only button stays named -->
    <span class="sr-only md:not-sr-only" jhiTranslate="artemisApp.tutorialGroupExportDialog.buttonHeader"></span>
</button>

<p-dialog
    [header]="'artemisApp.tutorialGroupExportDialog.header' | artemisTranslate"
    [modal]="true"
    [visible]="dialogVisible()"
    [closable]="true"
    (visibleChange)="dialogVisible.set($event)"
    [style]="{ width: '30rem' }"
    appendTo="body"
>
    <form>
        <p [jhiTranslate]="'artemisApp.tutorialGroupExportDialog.description'"></p>
        <div>
            <div class="form-check mb-3">
                <input id="selectAllId" class="form-check-input" type="checkbox" (change)="toggleSelectAll()" [checked]="selectAll()" />
                <label class="form-check-label" for="selectAllId" [jhiTranslate]="'artemisApp.tutorialGroupExportDialog.selectAll'"></label>
            </div>
        </div>
        @for (field of availableFields; track field; let i = $index) {
            <div>
                <div class="form-check mb-2">
                    <input
                        id="fieldId-{{ i }}"
                        class="form-check-input"
                        type="checkbox"
                        [value]="field.value"
                        [checked]="field.selected"
                        (change)="onFieldSelectionChange(field)"
                    />
                    <label class="form-check-label" for="fieldId-{{ i }}">{{ field.value }}</label>
                </div>
            </div>
        }
    </form>
    <!-- `tumUiButton` projects its content, so the label goes on a child element: jhiTranslate writes the host's
         innerHTML and would otherwise overwrite the projection Angular manages. -->
    <ng-template #footer>
        <button tumUiButton size="small" severity="secondary" type="button" (click)="closeDialog()">
            <span jhiTranslate="artemisApp.tutorialGroupExportDialog.cancel"></span>
        </button>
        <button tumUiButton size="small" type="button" (click)="exportJSON()" [disabled]="selectedFields().length === 0">
            <span jhiTranslate="artemisApp.tutorialGroupExportDialog.exportJSON"></span>
        </button>
        <button tumUiButton size="small" type="button" (click)="exportCSV()" [disabled]="selectedFields().length === 0">
            <span jhiTranslate="artemisApp.tutorialGroupExportDialog.exportCSV"></span>
        </button>
    </ng-template>
</p-dialog>
