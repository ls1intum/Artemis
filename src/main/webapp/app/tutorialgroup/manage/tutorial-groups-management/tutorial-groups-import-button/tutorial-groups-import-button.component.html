<button tumUiButton size="small" severity="secondary" variant="outlined" type="button" id="importDialogButton" (click)="openTutorialGroupImportDialog($event)">
    <fa-icon [icon]="faFileImport" />
    <!-- sr-only below md keeps the label in the accessibility tree so the icon-only button stays named -->
    <span class="sr-only md:not-sr-only" jhiTranslate="artemisApp.tutorialGroupImportDialog.importButton"></span>
</button>

<jhi-tutorial-groups-import-dialog #importDialog [courseId]="courseId()" (importCompleted)="onImportCompleted()" />

<p-dialog
    [header]="'artemisApp.tutorialGroupImportDialog.warning' | artemisTranslate"
    [modal]="true"
    [visible]="warningDialogVisible()"
    [closable]="true"
    (visibleChange)="warningDialogVisible.set($event)"
    [style]="{ width: '30rem' }"
    appendTo="body"
>
    <p jhiTranslate="artemisApp.tutorialGroupImportDialog.finishedWarning"></p>
    <ng-template #footer>
        <button tumUiButton size="small" severity="secondary" type="button" (click)="closeWarningDialog()">Ok</button>
    </ng-template>
</p-dialog>
