@if (course() && tutorialGroup()) {
    <div class="flex flex-row items-center gap-1">
        <!-- Registered Students -->
        @if (isAtLeastInstructor() || tutorialGroup().isUserTutor) {
            <a
                [id]="'registrations-' + tutorialGroup().id"
                [routerLink]="['/course-management', course().id!, 'tutorial-groups', tutorialGroup().id, 'registrations']"
                tumUiButton
                size="small"
            >
                <fa-icon [icon]="faUsers" />
                <span class="hidden md:inline" jhiTranslate="artemisApp.pages.tutorialGroupDetail.registrationsLinkLabel"></span>
            </a>
        }
        <!-- Edit -->
        @if (isAtLeastInstructor()) {
            <a
                [id]="'edit-' + tutorialGroup().id"
                [routerLink]="['/course-management', course().id!, 'tutorial-groups', tutorialGroup().id, 'edit']"
                tumUiButton
                severity="warn"
                size="small"
            >
                <fa-icon [icon]="faWrench" />
                <span class="hidden md:inline" jhiTranslate="entity.action.edit"></span>
            </a>
        }
        <!-- Delete -->
        @if (isAtLeastInstructor()) {
            <!-- renderButtonStyle is off because the directive would otherwise inject Bootstrap button classes
                 at runtime, which no template lint can see. -->
            <button
                type="button"
                [id]="'delete-' + tutorialGroup().id"
                tumUiButton
                severity="danger"
                size="small"
                jhiDeleteButton
                [renderButtonStyle]="false"
                [entityTitle]="tutorialGroup().title || ''"
                deleteQuestion="artemisApp.pages.tutorialGroupsManagement.deleteDialog.question"
                deleteConfirmationText="artemisApp.pages.tutorialGroupsManagement.deleteDialog.confirm"
                (delete)="deleteTutorialGroup()"
                [dialogError]="dialogError$"
            >
                <fa-icon [icon]="faTrash" />
            </button>
        }
    </div>
}
