@if (course(); as currentCourse) {
    <div *titleBarActions class="flex items-center gap-2">
        <button tumUiButton size="small" severity="secondary" variant="outlined" type="button" data-testid="import-public-holidays-btn" (click)="importDialogVisible.set(true)">
            <fa-icon [icon]="faFileImport" />
            <span jhiTranslate="artemisApp.pages.tutorialFreePeriodsManagement.import.button"></span>
        </button>
        <button tumUiButton size="small" type="button" data-testid="add-holiday-btn" (click)="openCreateDialog()">
            <fa-icon [icon]="faPlus" />
            <span jhiTranslate="artemisApp.pages.tutorialFreePeriodsManagement.addHoliday"></span>
        </button>
    </div>

    <!-- Calendar and list sit side by side where there is room, and stack below xl so neither is squeezed. -->
    <div class="grid grid-cols-1 items-start gap-3 xl:grid-cols-[minmax(0,3fr)_minmax(22rem,1fr)]">
        <section class="rounded-lg border border-solid" style="border-color: var(--tumaet-ui-border-color)" data-testid="holiday-calendar">
            <jhi-holiday-month-grid
                [displayedMonth]="displayedMonth()"
                [holidaysByDay]="holidaysByDay()"
                [sessionCountsByDay]="sessionCountsByDay()"
                [today]="today()"
                (monthChange)="onMonthChange($event)"
                (holidaySelected)="openEditDialog($event)"
                (daySelected)="openCreateDialog($event)"
            />
        </section>

        <section class="rounded-lg border border-solid" style="border-color: var(--tumaet-ui-border-color)" data-testid="holiday-panel">
            <jhi-holiday-list
                [holidays]="occurrences()"
                [sessionCountsByDay]="sessionCountsByDay()"
                [today]="today()"
                [filter]="filter()"
                (filterChange)="filter.set($event)"
                (editRequested)="openEditDialog($event)"
                (deleteRequested)="onDelete($event)"
            />
        </section>
    </div>

    <jhi-holiday-dialog
        [(visible)]="dialogVisible"
        [holiday]="editedHoliday()"
        [initialDay]="dialogInitialDay()"
        [sessionCountForSelectedDay]="sessionCountForDialogDay()"
        [saving]="isSaving()"
        (save)="onSave($event)"
        (selectedDayChange)="dialogSelectedDay.set($event)"
    />

    @if (currentCourse.id !== undefined) {
        <jhi-holiday-import-dialog
            [(visible)]="importDialogVisible"
            [courseId]="currentCourse.id"
            [from]="importSpanStart()"
            [to]="importSpanEnd()"
            (importRequested)="onImport($event)"
        />
    }

    <tum-ui-confirm-dialog />
}
