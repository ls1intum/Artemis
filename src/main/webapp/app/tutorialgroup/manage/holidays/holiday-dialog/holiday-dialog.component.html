<tum-ui-dialog
    size="medium"
    data-testid="holiday-dialog"
    [(visible)]="visible"
    [header]="(isEditMode() ? 'artemisApp.pages.tutorialFreePeriodsManagement.editHoliday' : 'artemisApp.pages.tutorialFreePeriodsManagement.addHoliday') | artemisTranslate"
>
    <form class="flex flex-col gap-4" (ngSubmit)="onSubmit()">
        <label class="flex items-start gap-3 rounded-md border border-solid p-3" style="border-color: var(--tumaet-ui-border-color)">
            <tum-ui-toggle-switch data-testid="holiday-whole-day" [ngModel]="wholeDay()" [ngModelOptions]="{ standalone: true }" (changed)="onWholeDayChange($event)" />
            <span class="flex flex-col">
                <span class="font-semibold" jhiTranslate="artemisApp.pages.tutorialFreePeriodsManagement.wholeDay"></span>
                <span class="text-sm opacity-70" jhiTranslate="artemisApp.pages.tutorialFreePeriodsManagement.form.wholeDayHint"></span>
            </span>
        </label>

        <div class="flex flex-col gap-3 sm:flex-row">
            <tum-ui-form-field class="flex-1" [label]="'artemisApp.pages.tutorialFreePeriodsManagement.form.from' | artemisTranslate">
                <!-- The picker carries the date and the time together, so a holiday within a day needs no extra field. -->
                <tum-ui-date-picker
                    data-testid="holiday-start"
                    [hideLabelName]="true"
                    [shouldDisplayTimeZoneWarning]="false"
                    [value]="start()"
                    (valueChange)="onStartChange($event)"
                    [ariaLabel]="'artemisApp.pages.tutorialFreePeriodsManagement.form.from' | artemisTranslate"
                />
                <span class="mt-1 block text-sm opacity-70" data-testid="holiday-start-weekday">{{ startWeekday() }}</span>
            </tum-ui-form-field>

            <tum-ui-form-field class="flex-1" [label]="'artemisApp.pages.tutorialFreePeriodsManagement.form.to' | artemisTranslate">
                <tum-ui-date-picker
                    data-testid="holiday-end"
                    [hideLabelName]="true"
                    [shouldDisplayTimeZoneWarning]="false"
                    [value]="end()"
                    (valueChange)="onEndChange($event)"
                    [ariaLabel]="'artemisApp.pages.tutorialFreePeriodsManagement.form.to' | artemisTranslate"
                />
                <span class="mt-1 block text-sm opacity-70" data-testid="holiday-end-weekday">{{ endWeekday() }}</span>
            </tum-ui-form-field>
        </div>

        @if (endIsBeforeStart()) {
            <tum-ui-message severity="error" data-testid="holiday-range-error" [text]="'artemisApp.pages.tutorialFreePeriodsManagement.form.invalidRange' | artemisTranslate" />
        } @else if (spansMultipleDays()) {
            <!-- A run of days is easy to get wrong by a day, so the dialog says how many it currently covers. -->
            <tum-ui-message
                severity="info"
                data-testid="holiday-span-summary"
                [text]="'artemisApp.pages.tutorialFreePeriodsManagement.form.spansDays' | artemisTranslate: { count: dayCount() }"
            />
        }

        <tum-ui-form-field [label]="'artemisApp.pages.tutorialFreePeriodsManagement.form.reason' | artemisTranslate">
            <input
                tumUiInput
                type="text"
                maxlength="256"
                data-testid="holiday-reason"
                [ngModel]="reason()"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="reason.set($event)"
                [attr.placeholder]="'artemisApp.pages.tutorialFreePeriodsManagement.form.reasonPlaceholder' | artemisTranslate"
            />
        </tum-ui-form-field>

        @if (sessionCountForSelectedSpan() > 0) {
            <tum-ui-message
                severity="info"
                data-testid="holiday-session-warning"
                [text]="'artemisApp.pages.tutorialFreePeriodsManagement.form.sessionsWillBeCancelled' | artemisTranslate: { count: sessionCountForSelectedSpan() }"
            />
        }

        <div class="flex justify-end gap-2">
            <button tumUiButton severity="secondary" variant="outlined" type="button" data-testid="holiday-cancel" (click)="onCancel()">
                <span jhiTranslate="entity.action.cancel"></span>
            </button>
            <button tumUiButton type="submit" data-testid="holiday-submit" [disabled]="!canSave()">
                <span [jhiTranslate]="isEditMode() ? 'entity.action.save' : 'artemisApp.pages.tutorialFreePeriodsManagement.form.create'"></span>
            </button>
        </div>
    </form>
</tum-ui-dialog>
