<div class="flex flex-row items-center gap-1">
    <!-- Edit -->
    <button type="button" [id]="'edit-' + tutorialFreePeriod().id" tumUiButton severity="warn" size="small" (click)="openEditFreePeriodDialog($event)">
        <fa-icon [icon]="faWrench" />
        <span class="hidden md:inline" jhiTranslate="entity.action.edit"></span>
    </button>
    <!-- Delete -->
    <!-- renderButtonStyle is off because the directive would otherwise inject Bootstrap button classes at
         runtime, which no template lint can see. -->
    <button
        type="button"
        [id]="'delete-' + tutorialFreePeriod().id"
        tumUiButton
        severity="danger"
        size="small"
        jhiDeleteButton
        [renderButtonStyle]="false"
        entityTitle="{{ tutorialFreePeriod().start | artemisDate: 'long-date' : false : course().timeZone }}"
        deleteQuestion="artemisApp.pages.tutorialFreePeriodsManagement.deleteDialog.question"
        (delete)="deleteTutorialFreePeriod()"
        [dialogError]="dialogError$"
    >
        <fa-icon [icon]="faTrash" />
    </button>
</div>

<jhi-edit-tutorial-group-free-period
    #editFreePeriodDialog
    [course]="course()"
    [tutorialGroupsConfiguration]="tutorialGroupConfiguration()"
    [tutorialGroupFreePeriod]="tutorialFreePeriod()"
    (freePeriodUpdated)="onFreePeriodUpdated()"
/>
