<div class="frame">
    <div class="controls">
        <div class="search-field">
            <tum-ui-icon-field [icon]="faMagnifyingGlass">
                <input
                    tumUiInput
                    tumUiInputSize="small"
                    type="text"
                    [placeholder]="searchFieldPlaceholder()"
                    [attr.aria-label]="searchFieldPlaceholder()"
                    [(ngModel)]="searchString"
                />
            </tum-ui-icon-field>
        </div>
        @if (loggedInUserIsAtLeastInstructorInCourse()) {
            <button
                type="button"
                tumUiButton
                severity="secondary"
                size="small"
                jhiTranslate="artemisApp.pages.tutorialGroupRegistrations.importButtonLabel"
                data-testid="import-button"
                (click)="importModal.open()"
            ></button>
            <button
                type="button"
                tumUiButton
                severity="secondary"
                size="small"
                jhiTranslate="artemisApp.pages.tutorialGroupRegistrations.exportButtonLabel"
                data-testid="export-button"
                (click)="exportRegisteredStudents()"
            ></button>
        }
        @if (loggedInUserIsAtLeastTutorOfGroup()) {
            <button
                type="button"
                tumUiButton
                size="small"
                jhiTranslate="artemisApp.pages.tutorialGroupRegistrations.addStudentsButtonLabel"
                data-testid="new-students-button"
                (click)="registerModal.open()"
            ></button>
        }
    </div>
    <jhi-tutorial-registrations-students-table
        [students]="filteredRegisteredStudents()"
        [removeActionColumnInfo]="loggedInUserIsAtLeastTutorOfGroup() ? studentsTableRemoveActionColumnInfo : undefined"
    />
</div>
<tum-ui-confirm-dialog />
<jhi-tutorial-registrations-import-modal [courseId]="courseId()" [tutorialGroupId]="tutorialGroupId()" #importModal />
<jhi-tutorial-registrations-register-modal [courseId]="courseId()" [tutorialGroupId]="tutorialGroupId()" #registerModal />
