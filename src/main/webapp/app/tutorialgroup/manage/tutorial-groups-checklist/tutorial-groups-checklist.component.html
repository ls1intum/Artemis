<jhi-loading-indicator-container [isLoading]="isLoading()">
    @if (course()) {
        <div class="checklist">
            <div class="checklist-hero">
                <div class="checklist-hero-icon" aria-hidden="true">
                    <fa-icon [icon]="faListCheck" />
                </div>
                <div class="checklist-hero-text">
                    <h2 class="checklist-hero-title" jhiTranslate="artemisApp.pages.checklist.heroTitle"></h2>
                    <p class="checklist-hero-desc" jhiTranslate="artemisApp.pages.checklist.explanation"></p>
                </div>
            </div>

            <!-- Time zone -->
            <div class="checklist-step">
                <jhi-checklist-check id="timeZone" [checkAttribute]="isTimeZoneConfigured()" />
                <div class="checklist-step-body">
                    <label for="timeZone" class="checklist-step-title" jhiTranslate="artemisApp.pages.checklist.timeZone"></label>
                    <p class="checklist-step-desc" jhiTranslate="artemisApp.pages.checklist.timeZoneExplanation"></p>
                </div>
                <a [routerLink]="['/course-management', course().id!, 'settings']" tumAetUiButton size="small" severity="secondary" variant="outlined">
                    <fa-icon [icon]="faCog" />
                    <span jhiTranslate="artemisApp.courseOverview.menu.settings"></span>
                </a>
            </div>

            <!-- Course-wide configuration -->
            <div class="checklist-step">
                <jhi-checklist-check id="configuration" [checkAttribute]="isTutorialGroupConfigurationCreated()" />
                <div class="checklist-step-body">
                    <label for="configuration" class="checklist-step-title" jhiTranslate="artemisApp.pages.checklist.configuration"></label>
                    <p class="checklist-step-desc" jhiTranslate="artemisApp.pages.checklist.configurationExplanation"></p>
                </div>
                @if (isTutorialGroupConfigurationCreated()) {
                    <!-- A real disabled button, not a styled anchor: it keeps the control reachable by keyboard. -->
                    <button
                        type="button"
                        data-testid="configuration-action"
                        [routerLink]="['/course-management', course().id!, 'tutorial-groups', 'configuration', course().tutorialGroupsConfiguration!.id!, 'edit']"
                        tumAetUiButton
                        size="small"
                        severity="secondary"
                        variant="outlined"
                        [disabled]="!isTimeZoneConfigured()"
                    >
                        <fa-icon [icon]="faPlus" />
                        <span jhiTranslate="artemisApp.pages.tutorialGroupsManagement.editConfigurationButton"></span>
                    </button>
                } @else {
                    <button
                        type="button"
                        data-testid="configuration-action"
                        [routerLink]="['/course-management', course().id!, 'create-tutorial-groups-configuration']"
                        tumAetUiButton
                        size="small"
                        severity="secondary"
                        variant="outlined"
                        [disabled]="!isTimeZoneConfigured()"
                    >
                        <fa-icon [icon]="faPlus" />
                        <span jhiTranslate="artemisApp.pages.checklist.createConfiguration"></span>
                    </button>
                }
            </div>

            <div class="checklist-actions">
                <button type="button" [routerLink]="['/course-management', course().id!, 'tutorial-groups']" tumAetUiButton [disabled]="!isFullyConfigured">
                    <span jhiTranslate="artemisApp.pages.checklist.continueToManagement"></span>
                </button>
            </div>
        </div>
    }
</jhi-loading-indicator-container>
