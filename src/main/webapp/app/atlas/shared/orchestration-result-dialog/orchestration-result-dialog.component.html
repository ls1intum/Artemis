<tumaet-ui-dialog [(visible)]="visible" [closable]="true" [dismissableMask]="true" size="large" [header]="'artemisApp.atlasOrchestrator.resultDialog.title' | artemisTranslate">
    @if (summaryMessage()) {
        <p class="summary-box mb-4!" data-testid="orchestration-summary">{{ summaryMessage() }}</p>
    }
    @if (hasActions()) {
        <div class="max-h-90 overflow-auto">
            <table tumAetUiTable size="small" [scrollable]="true" data-testid="orchestration-actions">
                <thead>
                    <tr>
                        <th scope="col" jhiTranslate="artemisApp.atlasOrchestrator.resultDialog.columns.action"></th>
                        <th scope="col" jhiTranslate="artemisApp.atlasOrchestrator.resultDialog.columns.competency"></th>
                        <th scope="col" jhiTranslate="artemisApp.atlasOrchestrator.resultDialog.columns.detail"></th>
                        <th scope="col" jhiTranslate="artemisApp.atlasOrchestrator.resultDialog.columns.reason"></th>
                    </tr>
                </thead>
                <tbody>
                    @for (action of appliedActions(); track $index) {
                        <tr>
                            <td><tumaet-ui-tag [severity]="actionSeverity(action.type)" [value]="actionTypeKey(action.type) | artemisTranslate" /></td>
                            <td>
                                {{ action.competencyTitle }}
                                <span class="ms-1 text-muted-color">#{{ action.competencyId }}</span>
                                @if (weightBandTag(action.weight); as tag) {
                                    <tumaet-ui-tag severity="secondary" class="ms-2" [value]="(tag.translationKey | artemisTranslate) + ' · ' + (tag.weight | number: '1.1-1')" />
                                }
                            </td>
                            <td>{{ action.detail }}</td>
                            <td>
                                <span class="text-muted-color">{{ action.justification }}</span>
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    } @else {
        <p class="mb-0 text-muted-color" jhiTranslate="artemisApp.atlasOrchestrator.resultDialog.empty"></p>
    }
    <ng-template #footer>
        <button tumAetUiButton type="button" severity="secondary" (click)="close()" data-testid="orchestration-result-close">
            <span jhiTranslate="entity.action.close"></span>
        </button>
    </ng-template>
</tumaet-ui-dialog>
