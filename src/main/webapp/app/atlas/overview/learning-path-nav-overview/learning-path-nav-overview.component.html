<div>
    <div class="flex w-full flex-wrap items-center justify-between p-4!">
        <span jhiTranslate="artemisApp.learningPath.navigation.overview.title" class="w-full font-bold md:w-auto"></span>
        <div class="w-full md:w-auto">
            <button tumAetUiButton severity="secondary" variant="outlined" (click)="openCompetencyGraph()" id="open-competency-graph-button" type="button">
                <span jhiTranslate="artemisApp.learningPath.navigation.overview.showCompetenciesGraphButton"></span>
            </button>
        </div>
    </div>
    <hr class="m-0!" />
    @if (isLoading()) {
        <div class="m-6! flex justify-center">
            <tumaet-ui-progress-spinner [ariaLabel]="'loading' | artemisTranslate" />
        </div>
    } @else if (competencies()) {
        <div class="max-h-[400px] overflow-y-scroll">
            @for (competency of competencies(); track competency.id) {
                @let expanded = isExpanded(competency.id);
                <div>
                    <div role="heading" aria-level="2">
                        <button
                            type="button"
                            class="flex w-full cursor-pointer flex-wrap items-center border-0 border-b border-solid border-(--border-color) bg-(--module-bg) px-4! py-4! text-start text-base text-(--module-text)"
                            [attr.aria-expanded]="expanded"
                            [attr.aria-controls]="'nav-overview-competency-' + competency.id"
                            (click)="toggleCompetency(competency.id)"
                        >
                            <span class="w-full font-bold md:w-auto">{{ competency.title }}</span>
                            @if (competency.masteryProgress === 1) {
                                <fa-icon [icon]="faCheckCircle" class="w-full px-2 text-state-success md:w-auto" />
                            }
                            <fa-icon [icon]="faChevronDown" class="ms-auto transition-transform" [class.rotate-180]="expanded" />
                        </button>
                    </div>
                    @if (expanded) {
                        <div [id]="'nav-overview-competency-' + competency.id" class="overflow-hidden bg-(--module-bg)">
                            <jhi-learning-path-nav-overview-learning-objects
                                (onLearningObjectSelected)="selectLearningObject()"
                                [learningPathId]="learningPathId()"
                                [competencyId]="competency.id"
                                [currentCompetencyIdOnPath]="currentCompetencyOnPath()?.id"
                            />
                        </div>
                    }
                </div>
            }
        </div>
    }
</div>
