<div class="rounded-lg bg-(--body-bg) p-4!">
    <div class="flex">
        @let baseTranslationKey = 'artemisApp.courseCompetency.importSettings';
        <ng-container
            *ngTemplateOutlet="
                importSettingTemplate;
                context: {
                    value: importRelations(),
                    setting: 'importRelations',
                    label: baseTranslationKey + '.importRelationsLabel',
                    tooltip: baseTranslationKey + '.importRelationsTooltip',
                }
            "
        />
        <ng-container
            *ngTemplateOutlet="
                importSettingTemplate;
                context: {
                    value: importExercises(),
                    setting: 'importExercises',
                    label: baseTranslationKey + '.importExercisesLabel',
                    tooltip: baseTranslationKey + '.importExercisesTooltip',
                }
            "
        />
        <ng-container
            *ngTemplateOutlet="
                importSettingTemplate;
                context: {
                    value: importLectures(),
                    setting: 'importLectures',
                    label: baseTranslationKey + '.importLecturesLabel',
                    tooltip: baseTranslationKey + '.importLecturesTooltip',
                }
            "
        />
    </div>
    <hr class="my-4!" />
    <div class="flex">
        <div class="min-w-0 flex-1 pe-2">
            <div class="flex items-center">
                <label for="reference-date-field" jhiTranslate="artemisApp.courseCompetency.importSettings.referenceDateLabel"></label>
                <fa-icon
                    [icon]="faQuestionCircle"
                    size="sm"
                    class="ms-1 text-muted-color"
                    [tumAetUiTooltip]="'artemisApp.courseCompetency.importSettings.referenceDateTooltip' | artemisTranslate"
                />
            </div>
            <tumaet-ui-date-picker
                inputId="reference-date-field"
                [hideLabelName]="true"
                [shouldDisplayTimeZoneWarning]="false"
                [value]="referenceDate()"
                (valueChange)="setReferenceDate($event)"
                (inputValidityChange)="referenceDateTextValidChange.emit($event)"
            />
        </div>
        <div class="min-w-0 flex-1 ps-2">
            <div class="flex items-center">
                <label for="reference-date-type-select" jhiTranslate="artemisApp.courseCompetency.importSettings.referenceDateTypeLabel"></label>
                <fa-icon
                    [icon]="faQuestionCircle"
                    size="sm"
                    class="ms-1 text-muted-color"
                    [tumAetUiTooltip]="'artemisApp.courseCompetency.importSettings.referenceDateTypeTooltip' | artemisTranslate"
                />
            </div>
            <tumaet-ui-select
                class="flex! w-full!"
                inputId="reference-date-type-select"
                name="dateTypes"
                [required]="!!referenceDate()"
                [disabled]="!referenceDate()"
                [options]="referenceDateTypeOptions()"
                optionLabel="label"
                optionValue="value"
                [placeholder]="'artemisApp.courseCompetency.importSettings.referenceDateType.noSelection' | artemisTranslate"
                [ngModel]="isReleaseDate()"
                (ngModelChange)="setReferenceDateType($event)"
            />
        </div>
    </div>
</div>

<ng-template #importSettingTemplate let-value="value" let-setting="setting" let-label="label" let-tooltip="tooltip">
    <div class="flex min-w-0 flex-1 items-center">
        <tumaet-ui-checkbox [inputId]="setting + '-checkbox'" [checked]="value" (changed)="toggleImportSetting(setting)" />
        <label [for]="setting + '-checkbox'" class="ms-2" [jhiTranslate]="label"></label>
        <fa-icon [icon]="faQuestionCircle" size="sm" class="ms-1 text-muted-color" [tumAetUiTooltip]="tooltip | artemisTranslate" />
    </div>
</ng-template>
