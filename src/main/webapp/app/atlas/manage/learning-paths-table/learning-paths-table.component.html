<div class="col">
    <div class="mb-2 flex flex-wrap items-baseline justify-between gap-x-4">
        <h5 class="m-0" jhiTranslate="artemisApp.learningPathManagement.learningPathsTable.title"></h5>
        <div>
            <strong jhiTranslate="artemisApp.learningPathManagement.averageProgress"></strong>:
            {{ formattedAverageProgress() !== undefined ? formattedAverageProgress() + '%' : 'N/A' }}
        </div>
    </div>
    <tumaet-ui-table-layout
        class="max-h-72!"
        [loading]="isLoading()"
        [empty]="learningPaths().length === 0 && !isLoading()"
        emptyTitle="artemisApp.learningPathManagement.learningPathsTable.noResults"
    >
        <div tumAetUiTableToolbar class="flex min-w-0 flex-1 items-center gap-2">
            <input
                tumAetUiInput
                tumAetUiInputSize="small"
                id="learning-path-search"
                type="search"
                class="max-w-72 min-w-24 flex-1"
                [placeholder]="'artemisApp.learningPathManagement.learningPathsTable.searchPlaceholder' | artemisTranslate"
                [attr.aria-label]="'artemisApp.learningPathManagement.learningPathsTable.searchPlaceholder' | artemisTranslate"
                [ngModel]="searchTerm()"
                (ngModelChange)="search($event)"
            />
        </div>
        <table tumAetUiTable size="small" striped>
            <thead>
                <tr>
                    <th class="w-16">#</th>
                    <th jhiTranslate="artemisApp.learningPathManagement.learningPathsTable.columnLabel.name"></th>
                    <th jhiTranslate="artemisApp.learningPathManagement.learningPathsTable.columnLabel.login"></th>
                    <th jhiTranslate="artemisApp.learningPathManagement.learningPathsTable.columnLabel.progress"></th>
                </tr>
            </thead>
            <tbody>
                @for (learningPath of learningPaths(); track learningPath.id) {
                    <tr>
                        <td>{{ learningPath.id }}</td>
                        <td>
                            <ngb-highlight [result]="learningPath.user.name" [term]="searchTerm()" />
                        </td>
                        <td>
                            <ngb-highlight [result]="learningPath.user.login" [term]="searchTerm()" />
                        </td>
                        <td>
                            <span
                                [id]="'open-competency-graph-button-' + learningPath.id"
                                class="clickable link-primary"
                                (click)="openCompetencyGraph(learningPath.id, learningPath.user.name)"
                                #keyboardAction42
                                role="button"
                                tabindex="0"
                                (keydown.enter)="$event.target === $event.currentTarget ? keyboardAction42.click() : undefined"
                                (keydown.space)="$event.target === $event.currentTarget ? $event.preventDefault() : undefined"
                                (keyup.space)="$event.target === $event.currentTarget ? keyboardAction42.click() : undefined"
                                ><u>{{ learningPath.progress }} %</u></span
                            >
                        </td>
                    </tr>
                }
            </tbody>
        </table>
        <tumaet-ui-paginator
            tumAetUiTableFooter
            [page]="page() - 1"
            [pageSize]="pageSize()"
            [totalRecords]="collectionSize()"
            [showRowsPerPage]="false"
            [showCurrentPageReport]="false"
            (pageChange)="setPage($event + 1)"
        />
    </tumaet-ui-table-layout>
</div>
