<div>
    <div class="flex items-center justify-between">
        <h5 class="m-0!" jhiTranslate="artemisApp.learningPathManagement.learningPathsConfiguration.title"></h5>
        @if (isEditMode()) {
            <button type="button" id="save-learning-paths-configuration-button" tumAetUiButton severity="primary" size="small" (click)="saveLearningPathsConfiguration()">
                @if (isSaving()) {
                    <fa-icon [icon]="faSpinner" animation="spin" />
                }
                <span jhiTranslate="artemisApp.learningPathManagement.learningPathsConfiguration.saveButtonLabel"></span>
            </button>
        } @else {
            <button
                type="button"
                id="edit-learning-paths-configuration-button"
                tumAetUiButton
                severity="warn"
                size="small"
                (click)="enableEditMode()"
                jhiTranslate="artemisApp.learningPathManagement.learningPathsConfiguration.editButtonLabel"
            ></button>
        }
    </div>
    <hr class="my-2!" />
    <div class="flex max-h-[220px] items-center gap-2 overflow-y-auto">
        @if (isConfigLoading()) {
            <div class="flex w-full justify-center p-2">
                <tumaet-ui-progress-spinner data-testid="loading-spinner" [ariaLabel]="'loading' | artemisTranslate" />
            </div>
        } @else {
            <tumaet-ui-checkbox
                inputId="include-all-graded-exercises-checkbox"
                [ariaLabel]="'artemisApp.learningPathManagement.learningPathsConfiguration.configuration.includeAllGradedExercises' | artemisTranslate"
                (changed)="toggleIncludeAllGradedExercises()"
                [checked]="includeAllGradedExercisesEnabled()"
                [disabled]="!isEditMode()"
            />
            <label
                for="include-all-graded-exercises-checkbox"
                jhiTranslate="artemisApp.learningPathManagement.learningPathsConfiguration.configuration.includeAllGradedExercises"
            ></label>
            <jhi-help-icon text="artemisApp.learningPathManagement.learningPathsConfiguration.configuration.includeAllGradedExercisesToolTip" />
        }
    </div>
</div>
