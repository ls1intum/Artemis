<h5 class="m-0 mb-2" [jhiTranslate]="columnBaseTranslationKey() + '.table.title'"></h5>
<tumaet-ui-table-layout [loading]="isLoading()" [empty]="resultsOnPage().length === 0 && !isLoading()" emptyTitle="global.generic.emptyList">
    <div tumAetUiTableToolbar class="flex min-w-0 flex-1 items-center gap-2">
        <input
            tumAetUiInput
            tumAetUiInputSize="small"
            id="import-objects-search"
            type="search"
            class="max-w-lg min-w-24 flex-1"
            [placeholder]="'global.importTable.searchPlaceholder' | artemisTranslate"
            [attr.aria-label]="'global.importTable.searchPlaceholder' | artemisTranslate"
            [(ngModel)]="searchTerm"
            (ngModelChange)="search()"
        />
    </div>
    <table tumAetUiTable size="small" striped [sortField]="sortedColumn()" [sortOrder]="sortingOrder() === SortingOrder.ASCENDING ? 1 : -1" (sortChange)="onSortChange($event)">
        <thead>
            <tr>
                <th scope="col" class="w-16" tumAetUiSortableColumn="ID"><span>#</span></th>
                @for (column of columns(); track column) {
                    <th scope="col" [tumAetUiSortableColumn]="column.name">
                        <span [jhiTranslate]="columnBaseTranslationKey() + '.table.columns.' + column.name"></span>
                    </th>
                }
                <th scope="col"><span class="sr-only" jhiTranslate="entity.actions"></span></th>
            </tr>
        </thead>
        <tbody>
            @for (entity of resultsOnPage(); track entity.id) {
                <tr>
                    <td>{{ entity.id }}</td>
                    @for (column of columns(); track column) {
                        <td class="break-words">
                            <jhi-search-highlight [result]="column.getProperty(entity)" [term]="searchTerm()" />
                        </td>
                    }
                    <td>
                        <button tumAetUiButton size="small" severity="secondary" variant="outlined" type="button" (click)="selectRow(entity)">Select</button>
                    </td>
                </tr>
            }
        </tbody>
    </table>
    <tumaet-ui-paginator
        tumAetUiTableFooter
        [page]="page() - 1"
        [pageSize]="pageSize()"
        [totalRecords]="collectionSize()"
        [showRowsPerPage]="false"
        [showCurrentPageReport]="false"
        (pageChange)="setPage($event + 1)"
    />
</tumaet-ui-table-layout>
