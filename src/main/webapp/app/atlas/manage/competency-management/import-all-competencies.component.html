<form class="d-flex flex-column h-100">
    @if (!isOpenedAsDialog) {
        <div class="modal-header">
            <h4 class="modal-title" [jhiTranslate]="'artemisApp.' + competencyType() + '.importAll.title'"></h4>
            <button (click)="clear()" aria-hidden="true" class="btn-close" data-dismiss="modal" type="button"></button>
        </div>
    }
    <div class="modal-body d-flex flex-column flex-grow-1 overflow-hidden">
        <tumaet-ui-table-layout fill [loading]="loading()" [empty]="content().resultsOnPage.length === 0 && !loading()">
            <div tumAetUiTableToolbar class="flex min-w-0 flex-1 items-center gap-2">
                <input
                    tumAetUiInput
                    tumAetUiInputSize="small"
                    type="search"
                    name="searchCourse"
                    class="max-w-72 min-w-24 flex-1"
                    [placeholder]="'artemisApp.competency.importAll.search' | artemisTranslate"
                    [attr.aria-label]="'artemisApp.competency.importAll.search' | artemisTranslate"
                    [(ngModel)]="searchTerm"
                />
                <span class="flex-1"></span>
                <label class="flex items-center gap-1 text-sm whitespace-nowrap">
                    <input type="checkbox" [(ngModel)]="importRelations" name="importRelations" />
                    <span jhiTranslate="artemisApp.competency.import.importRelations"></span>
                </label>
            </div>
            <table tumAetUiTable size="small" striped [sortField]="sortedColumn" [sortOrder]="listSorting ? 1 : -1" (sortChange)="onTableSort($event)">
                <thead>
                    <!-- ID column, always present -->
                    <tr>
                        <th class="w-16" tumAetUiSortableColumn="ID"><span>#</span></th>
                        @for (column of columns; track column) {
                            <th [tumAetUiSortableColumn]="column.name">
                                <span>{{ 'artemisApp.competency.importAll.table.' + column.name | artemisTranslate }}</span>
                            </th>
                        }
                        <th class="w-24"></th>
                    </tr>
                </thead>
                <tbody>
                    @for (course of content().resultsOnPage; track trackId($index, course)) {
                        <tr>
                            <td>{{ course.id }}</td>
                            @for (column of columns; track column) {
                                <td class="break-words">
                                    <ngb-highlight [result]="column.getProperty(course)" [term]="searchTerm" />
                                </td>
                            }
                            <td>
                                <jhi-button
                                    [btnType]="ButtonType.SECONDARY"
                                    (onClick)="selectImport(course)"
                                    [disabled]="disabledIds.includes(course.id!)"
                                    [title]="'artemisApp.competency.importAll.table.doImport'"
                                />
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
            <tumaet-ui-paginator
                tumAetUiTableFooter
                [page]="state.page - 1"
                [pageSize]="state.pageSize"
                [totalRecords]="total()"
                [showRowsPerPage]="false"
                [showCurrentPageReport]="false"
                (pageChange)="onPageChange($event + 1)"
            />
        </tumaet-ui-table-layout>
    </div>
</form>
