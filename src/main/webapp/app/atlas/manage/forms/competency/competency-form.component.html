<div class="w-full">
    <div>
        @if (form) {
            <form [formGroup]="form" (ngSubmit)="submitForm()">
                <jhi-common-course-competency-form
                    [isInConnectMode]="isInConnectMode()"
                    [isInSingleLectureMode]="isInSingleLectureMode()"
                    [averageStudentScore]="averageStudentScore()"
                    [form]="form"
                    [courseCompetency]="competency()"
                />
                <div>
                    <button id="submitButton" tumAetUiButton severity="primary" class="me-2" type="submit" [disabled]="!isSubmitPossible">
                        <span jhiTranslate="entity.action.submit"></span>
                    </button>
                    @if (hasCancelButton()) {
                        <button type="button" tumAetUiButton severity="secondary" (click)="cancelForm()">
                            <fa-icon [icon]="faTimes" />&nbsp;<span jhiTranslate="entity.action.cancel"></span>
                        </button>
                    }
                </div>
            </form>
        }
    </div>
</div>
