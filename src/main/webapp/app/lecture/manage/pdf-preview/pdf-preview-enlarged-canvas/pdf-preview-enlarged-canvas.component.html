<div
    #enlargedContainer
    class="enlarged-container"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'artemisApp.attachmentVideoUnit.pdfViewer.fullscreenDialog' | artemisTranslate"
    tabindex="-1"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (click)="closeIfOutside($event)"
    (keydown)="handleKeyboardEvents($event)"
>
    @if (isEnlargedCanvasLoading()) {
        <div class="flex justify-center absolute">
            <tumaet-ui-progress-spinner [ariaLabel]="'loading' | artemisTranslate" />
        </div>
    }
    <canvas #enlargedCanvas></canvas>
    <button
        #closeButton
        tumAetUiButton
        severity="secondary"
        variant="solid"
        size="default"
        type="button"
        cdkFocusInitial
        class="close-preview-button"
        [attr.aria-label]="'entity.action.close' | artemisTranslate"
        (click)="closeEnlargedView($event)"
    >
        ×
    </button>
    @if (currentPage() !== 1) {
        <button
            #previousPageButton
            tumAetUiButton
            severity="secondary"
            variant="solid"
            size="default"
            type="button"
            class="nav-button left"
            (click)="handleNavigation('prev', $event)"
            aria-label="Previous page"
        >
            ←
        </button>
    }
    @if (currentPage() !== totalPages()) {
        <button
            #nextPageButton
            tumAetUiButton
            severity="secondary"
            variant="solid"
            size="default"
            type="button"
            class="nav-button right"
            (click)="handleNavigation('next', $event)"
            aria-label="Next page"
        >
            →
        </button>
    }
    <div class="page-number-display">{{ currentPage() }}</div>
</div>
