<jhi-lecture-unit-layout [isLoading]="isLoading()">
    @if (recovery(); as scope) {
        <jhi-tum-live-save-recovery [scope]="scope" />
    }
    <jhi-attachment-video-unit-form
        #attachmentVideoUnitForm
        [isEditMode]="false"
        [recordingAvailable]="recordingAvailable()"
        [recordingSaveLocked]="savingRecording() || !!savedRecording() || !!recovery()"
        (formSubmitted)="createAttachmentVideoUnit($event)"
    />
    @if (savedRecording()) {
        <button tumAetUiButton type="button" (click)="continueRecording()">{{ 'artemisApp.tumLiveUpload.openSaved' | artemisTranslate }}</button>
    }
</jhi-lecture-unit-layout>
<tumaet-ui-confirm-dialog />
