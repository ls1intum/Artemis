<jhi-lecture-unit-layout [isLoading]="isLoading()">
    <jhi-attachment-video-unit-form
        #attachmentVideoUnitForm
        [formData]="formData()"
        (formSubmitted)="updateAttachmentVideoUnit($event)"
        [isEditMode]="true"
        [recordingTransferActive]="!!upload()?.transferring()"
        [recordingPending]="!!upload()?.pendingRef()"
    />
    @if (needsReselection()) {
        <tumaet-ui-message severity="info" [text]="'artemisApp.tumLiveUpload.reselect' | artemisTranslate" />
    }
    @if (attachmentVideoUnit()?.id; as unitId) {
        @for (id of [unitId]; track id) {
            <jhi-tum-live-upload
                [lectureUnitId]="id"
                [initialFile]="initialRecording()"
                (initialFileConsumed)="initialRecording.set(undefined)"
                (attached)="onTumLiveVideoAttached(id)"
            />
        }
    }
</jhi-lecture-unit-layout>
<tumaet-ui-confirm-dialog />
