@if (isLoading()) {
    <div class="flex justify-center py-6" role="status">
        <fa-icon [icon]="faSpinner" animation="spin" size="2x" aria-hidden="true" />
        <span class="sr-only">{{ 'loading' | artemisTranslate }}</span>
    </div>
} @else {
    <div class="mx-auto flex w-full max-w-4xl flex-col gap-6">
        <ng-content />
    </div>
}
