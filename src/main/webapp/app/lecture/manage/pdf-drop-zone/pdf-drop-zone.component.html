<div
    class="pdf-drop-zone"
    [ngClass]="{ 'drag-over': isDragOver(), disabled: disabled() }"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="onClick()"
    (keydown.enter)="onClick()"
    (keydown.space)="onClick()"
    [tabindex]="disabled() ? -1 : 0"
    role="button"
    [attr.aria-label]="titleKey() | artemisTranslate"
    [attr.aria-describedby]="hintId"
    [attr.aria-disabled]="disabled()"
>
    <input #fileInput type="file" accept=".pdf,application/pdf" [multiple]="multiple()" class="file-input" (change)="onFileInputChange($event)" />
    <div class="drop-zone-content">
        <fa-icon [icon]="faCloudUploadAlt" class="upload-icon" />
        <div class="drop-zone-text">
            <span class="drop-zone-title" [jhiTranslate]="titleKey()"></span>
            <span class="drop-zone-hint" [id]="hintId" [jhiTranslate]="hintKey()"></span>
        </div>
        <fa-icon [icon]="faFilePdf" class="pdf-icon" />
    </div>
</div>
