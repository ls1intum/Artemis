<div class="flex flex-wrap justify-center">
    <div class="w-full md:w-2/3">
        @if (lecture()) {
            <div>
                <h2><span jhiTranslate="artemisApp.lecture.detail.title"></span> {{ lecture().id }}</h2>
                <hr />
                @if (detailSections()) {
                    <jhi-detail-overview-list [sections]="detailSections()" />
                }
                @if (lecture().course?.isAtLeastEditor) {
                    <a
                        tumAetUiButton
                        severity="primary"
                        variant="solid"
                        size="default"
                        [routerLink]="['/course-management', lecture().course?.id, 'lectures', lecture().id, 'edit']"
                    >
                        <fa-icon [icon]="faPencilAlt" />
                        <span jhiTranslate="entity.action.edit"></span>
                    </a>
                    <a tumAetUiButton severity="primary" variant="solid" size="default" [routerLink]="['unit-management']">
                        <fa-icon [icon]="faPuzzlePiece" />
                        <span jhiTranslate="entity.action.units"></span>
                    </a>
                }
            </div>
        }
    </div>
</div>
