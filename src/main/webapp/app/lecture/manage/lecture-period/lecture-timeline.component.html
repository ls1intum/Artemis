<div class="flex flex-col gap-6">
    <div class="flex flex-col gap-1">
        <h3 id="artemisApp.lecture.sections.period" tabindex="-1" class="m-0 scroll-mt-4 text-lg font-semibold" jhiTranslate="artemisApp.lecture.sections.period"></h3>
        <p class="lecture-timeline-hint m-0 text-sm" jhiTranslate="artemisApp.lecture.sections.periodDescription"></p>
    </div>
    <div class="grid gap-6 sm:grid-cols-2">
        <tumaet-ui-date-picker
            data-testid="lecture-start-date"
            inputId="lecture-start-date"
            labelName="artemisApp.lecture.startDate"
            [(value)]="startDate"
            [invalid]="isEndBeforeStart()"
            [ariaDescribedBy]="isEndBeforeStart() ? 'lecture-period-order-error' : undefined"
            (inputValidityChange)="isStartTextValid.set($event)"
        />
        <tumaet-ui-date-picker
            data-testid="lecture-end-date"
            inputId="lecture-end-date"
            labelName="artemisApp.lecture.endDate"
            [(value)]="endDate"
            [invalid]="isEndBeforeStart()"
            [ariaDescribedBy]="isEndBeforeStart() ? 'lecture-period-order-error' : undefined"
            (inputValidityChange)="isEndTextValid.set($event)"
        />
    </div>
    @if (isEndBeforeStart()) {
        <tumaet-ui-message
            id="lecture-period-order-error"
            severity="error"
            data-testid="lecture-period-order-error"
            [text]="'artemisApp.lecture.sections.periodOrderInvalid' | artemisTranslate"
        />
    }
</div>
