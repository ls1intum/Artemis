<div
    #contentContainer
    class="content-container"
    [ngClass]="contentContainerClasses()"
    [attr.role]="isFullscreen() ? 'dialog' : null"
    [attr.aria-modal]="isFullscreen() ? 'true' : null"
    [attr.aria-label]="dialogAriaLabel()"
    [attr.tabindex]="isFullscreen() ? '0' : null"
>
    <!--
        The main area optionally splits its content vertically into video (top) | pdf (bottom).
        It is rendered either directly (no sidebar) or as the first panel of the outer (main | sidebar) splitter.
    -->
    <ng-template #mainArea>
        @if (showHorizontalSplitter()) {
            <!-- Horizontal splitter (top | bottom). orientation="vertical" = stacked panels (was split.js direction 'vertical'). -->
            <tumaet-ui-splitter
                class="fullscreen-splitter w-full h-full"
                orientation="vertical"
                [sizes]="horizontalSplit().sizes"
                [minSizes]="horizontalMinSizes()"
                [gutterSize]="6"
                [separatorLabel]="'artemisApp.modelingSubmission.resizePanel' | artemisTranslate: { panel: dialogAriaLabel() ?? '' }"
                (resizeEnd)="onHorizontalResize($event)"
            >
                <ng-template tumAetUiSplitterPanel>
                    <ng-content select="[content-top]" />
                </ng-template>
                <ng-template tumAetUiSplitterPanel>
                    <ng-content select="[content-bottom]" />
                </ng-template>
            </tumaet-ui-splitter>
        } @else {
            <div class="main-content">
                <ng-content select="[content-main]" />
            </div>
        }
    </ng-template>

    @if (showVerticalSplitter()) {
        <!-- Vertical splitter (main area | sidebar). orientation="horizontal" = side-by-side panels (was split.js direction 'horizontal'). -->
        <tumaet-ui-splitter
            class="fullscreen-splitter w-full h-full"
            orientation="horizontal"
            [sizes]="verticalSplit().sizes"
            [minSizes]="verticalMinSizes()"
            [gutterSize]="6"
            [separatorLabel]="'artemisApp.modelingSubmission.resizePanel' | artemisTranslate: { panel: sidebarAriaLabel() ?? '' }"
            (resizeEnd)="onVerticalResize($event)"
        >
            <ng-template tumAetUiSplitterPanel>
                <ng-container [ngTemplateOutlet]="mainArea" />
            </ng-template>
            <ng-template tumAetUiSplitterPanel>
                <div class="iris-sidebar" role="complementary" [attr.aria-label]="sidebarAriaLabel()">
                    <ng-content select="[content-sidebar]" />
                </div>
            </ng-template>
        </tumaet-ui-splitter>
    } @else {
        <ng-container [ngTemplateOutlet]="mainArea" />
    }
</div>
