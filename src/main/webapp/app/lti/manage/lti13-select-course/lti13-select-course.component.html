<div class="grid grid-cols-1 gap-x-4 lg:grid-cols-2 xl:grid-cols-3">
    @for (course of courses(); track course) {
        <jhi-overview-lti-course-card class="mb-4" [course]="course" />
    } @empty {
        <div class="mb-4 col-span-full">
            <span jhiTranslate="artemisApp.lti13.deepLinking.noCoursesError"></span>
            <br />
            <a
                href="https://docs.artemis.tum.de/instructor/integrations/lti-configuration"
                target="_blank"
                rel="external noopener noreferrer"
                jhiTranslate="artemisApp.lti13.deepLinking.learnMore"
            ></a>
        </div>
    }
</div>
