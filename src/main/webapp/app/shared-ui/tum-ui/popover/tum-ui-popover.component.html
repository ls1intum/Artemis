<ng-template #panel>
    <div
        class="tum-ui-popover-panel rounded-md border border-surface bg-surface-0 p-3 text-surface-900 shadow-lg dark:bg-surface-800 dark:text-surface-0"
        role="dialog"
        [attr.aria-label]="ariaLabel()"
        tabindex="0"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
    >
        <ng-content />
    </div>
</ng-template>
