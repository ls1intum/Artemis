<div class="w-72 select-none">
    <div class="mb-2 flex items-center justify-between">
        <button
            type="button"
            class="rounded p-1 text-surface-700 hover:bg-surface-100 dark:text-surface-0 dark:hover:bg-surface-700"
            (click)="previousMonth()"
            [attr.aria-label]="activeMonth().subtract(1, 'month').format('MMMM YYYY')"
            data-testid="calendar-previous"
        >
            <fa-icon [icon]="faChevronLeft" />
        </button>
        <span class="font-semibold text-surface-900 dark:text-surface-0" aria-live="polite" data-testid="calendar-month-label">{{ monthLabel() }}</span>
        <button
            type="button"
            class="rounded p-1 text-surface-700 hover:bg-surface-100 dark:text-surface-0 dark:hover:bg-surface-700"
            (click)="nextMonth()"
            [attr.aria-label]="activeMonth().add(1, 'month').format('MMMM YYYY')"
            data-testid="calendar-next"
        >
            <fa-icon [icon]="faChevronRight" />
        </button>
    </div>
    <table role="grid" class="w-full border-collapse text-center text-sm">
        <thead>
            <tr>
                @for (label of weekdayLabels(); track $index) {
                    <th scope="col" class="p-1 font-medium text-muted-color">{{ label }}</th>
                }
            </tr>
        </thead>
        <tbody>
            @for (week of weeks(); track $index; let w = $index) {
                <tr>
                    @for (day of week; track day.valueOf(); let d = $index) {
                        <td class="p-0.5" role="gridcell" [attr.aria-selected]="isSelected(day) ? 'true' : null">
                            <button
                                #dayButton
                                type="button"
                                class="h-8 w-8 rounded-full text-surface-900 hover:bg-surface-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary dark:text-surface-0 dark:hover:bg-surface-700"
                                [class.bg-primary]="isSelected(day)"
                                [class.text-surface-0]="isSelected(day)"
                                [class.text-surface-400]="isOtherMonth(day) && !isSelected(day)"
                                [class.ring-1]="isToday(day) && !isSelected(day)"
                                [class.ring-primary]="isToday(day) && !isSelected(day)"
                                [attr.tabindex]="focusedIndex() === w * 7 + d ? 0 : -1"
                                [attr.aria-label]="day.format('DD.MM.YYYY')"
                                (click)="selectDay(day)"
                                (keydown)="onKeydown($event, w * 7 + d)"
                            >
                                {{ day.date() }}
                            </button>
                        </td>
                    }
                </tr>
            }
        </tbody>
    </table>
</div>
