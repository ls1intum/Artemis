<input
    #inputEl
    tumUiInput
    type="text"
    inputmode="numeric"
    class="tum-ui-input-number-input {{ inputStyleClass() }}"
    role="spinbutton"
    [id]="inputId()"
    [attr.name]="name()"
    [attr.placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-valuenow]="ariaValueNow()"
    [attr.aria-valuemin]="min() ?? null"
    [attr.aria-valuemax]="max() ?? null"
    [attr.aria-valuetext]="ariaValueText()"
    [disabled]="isDisabled()"
    [tumUiInputInvalid]="invalid()"
    (input)="onInput($event)"
    (blur)="onBlurHandler($event)"
    (focus)="onFocusHandler($event)"
    (keydown)="onKeydown($event)"
/>
@if (showButtons()) {
    <span class="tum-ui-input-number-button-group">
        <button
            type="button"
            tabindex="-1"
            aria-hidden="true"
            class="tum-ui-input-number-button tum-ui-input-number-increment text-surface-400 hover:bg-surface-100 hover:text-surface-500 active:bg-surface-200 active:text-surface-600 dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-surface-300 dark:active:bg-surface-700 dark:active:text-surface-200"
            [disabled]="isDisabled()"
            (click)="onStep(step())"
        >
            <fa-icon [icon]="faChevronUp" />
        </button>
        <button
            type="button"
            tabindex="-1"
            aria-hidden="true"
            class="tum-ui-input-number-button tum-ui-input-number-decrement text-surface-400 hover:bg-surface-100 hover:text-surface-500 active:bg-surface-200 active:text-surface-600 dark:text-surface-400 dark:hover:bg-surface-800 dark:hover:text-surface-300 dark:active:bg-surface-700 dark:active:text-surface-200"
            [disabled]="isDisabled()"
            (click)="onStep(-step())"
        >
            <fa-icon [icon]="faChevronDown" />
        </button>
    </span>
}
