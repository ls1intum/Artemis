<form id="csvExportOptionsForm" name="exportOptionForm" role="form" novalidate>
    <div class="mb-4! flex items-center justify-between pt-4!">
        <h2 class="m-0 text-xl! font-medium!" jhiTranslate="export.dialogTitle">Export Options</h2>
        <button
            tumAetUiButton
            type="button"
            size="small"
            severity="secondary"
            variant="text"
            data-testid="export-options-close"
            [attr.aria-label]="'entity.action.close' | artemisTranslate"
            (click)="cancel()"
        >
            <fa-icon [icon]="faXmark" />
        </button>
    </div>
    <tumaet-ui-tabs [(value)]="activeTab">
        <tumaet-ui-tab-list>
            <tumaet-ui-tab class="text-[0.9rem]!" [value]="1" data-testid="export-tab-excel">Excel</tumaet-ui-tab>
            <tumaet-ui-tab class="text-[0.9rem]!" [value]="2" data-testid="export-tab-csv">CSV</tumaet-ui-tab>
        </tumaet-ui-tab-list>
        <tumaet-ui-tab-panels class="p-0!">
            <tumaet-ui-tab-panel [value]="1" class="block pt-2">
                <div class="mb-4!">
                    <p class="intro-text" jhiTranslate="export.excelFile.introText"></p>
                </div>
            </tumaet-ui-tab-panel>
            <tumaet-ui-tab-panel [value]="2" class="block pt-2">
                <div class="mb-4!">
                    <p class="intro-text" jhiTranslate="export.csvFile.introText"></p>
                </div>
                <div class="mb-4!">
                    <span class="block font-bold" id="csv-field-separator-label" jhiTranslate="export.csvFile.fieldSeparator.label"></span>
                    <div class="inline-flex flex-wrap gap-1" role="group" aria-labelledby="csv-field-separator-label">
                        @for (fieldSeparator of CsvFieldSeparator | keyvalue; track fieldSeparator) {
                            <button
                                type="button"
                                tumAetUiButton
                                size="small"
                                [severity]="options().fieldSeparator === fieldSeparator.value ? 'primary' : 'secondary'"
                                (click)="setCsvFieldSeparator(fieldSeparator.value)"
                                [attr.aria-pressed]="options().fieldSeparator === fieldSeparator.value"
                            >
                                {{ 'export.csvFile.fieldSeparator.' + fieldSeparator.key.toLowerCase() | artemisTranslate }}
                            </button>
                        }
                    </div>
                </div>
                <div class="mb-4!">
                    <span class="block font-bold" id="csv-quote-strings-label" jhiTranslate="export.csvFile.quoteStrings.label"></span>
                    <div class="inline-flex flex-wrap gap-1" role="group" aria-labelledby="csv-quote-strings-label">
                        @for (quoteString of CsvQuoteStrings | keyvalue; track quoteString) {
                            <button
                                type="button"
                                tumAetUiButton
                                size="small"
                                [severity]="options().quoteCharacter === quoteString.value ? 'primary' : 'secondary'"
                                (click)="setCsvQuoteString(quoteString.value)"
                                [attr.aria-pressed]="options().quoteCharacter === quoteString.value"
                            >
                                {{ 'export.csvFile.quoteStrings.' + quoteString.key.toLowerCase() | artemisTranslate }}
                            </button>
                        }
                    </div>
                </div>
                <div class="mb-4!">
                    <span class="block font-bold" id="csv-decimal-separator-label" jhiTranslate="export.csvFile.decimalSeparator.label"></span>
                    <div class="inline-flex flex-wrap gap-1" role="group" aria-labelledby="csv-decimal-separator-label">
                        @for (separator of CsvDecimalSeparator | keyvalue; track separator) {
                            <button
                                type="button"
                                tumAetUiButton
                                size="small"
                                [severity]="options().decimalSeparator === separator.value ? 'primary' : 'secondary'"
                                (click)="setCsvDecimalSeparator(separator.value)"
                                [attr.aria-pressed]="options().decimalSeparator === separator.value"
                            >
                                {{ 'export.csvFile.decimalSeparator.' + separator.key.toLowerCase() | artemisTranslate }}
                            </button>
                        }
                    </div>
                </div>
            </tumaet-ui-tab-panel>
        </tumaet-ui-tab-panels>
    </tumaet-ui-tabs>
    <div class="mt-4! flex justify-end gap-1">
        <button type="button" tumAetUiButton size="small" severity="secondary" data-testid="export-cancel-button" (click)="cancel()">
            <fa-icon [icon]="faBan" />&nbsp;<span jhiTranslate="entity.action.cancel"></span>
        </button>
        <button type="button" tumAetUiButton size="small" severity="secondary" id="finish-button" data-testid="export-finish-button" (click)="onFinish()">
            <fa-icon [icon]="faDownload" />
            @if (activeTab() === 1) {
                <span jhiTranslate="export.excelFile.buttonText"></span>
            } @else {
                <span jhiTranslate="export.csvFile.buttonText"></span>
            }
        </button>
    </div>
</form>
