@if (!showConfirm()) {
    <fa-icon [icon]="linkIcon()" [tumUiTooltip]="setTooltip(instruction()!)" (click)="toggle()" />
}
@if (showConfirm()) {
    <fa-icon
        class="grading-instruction-link-icon-danger"
        [icon]="confirmIcon"
        [tumUiTooltip]="'artemisApp.assessment.messages.removeAssessmentInstructionLink' | artemisTranslate"
        (mouseleave)="toggle()"
        (click)="removeLink()"
    />
}
