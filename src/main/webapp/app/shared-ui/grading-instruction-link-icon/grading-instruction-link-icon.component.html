@if (!showConfirm()) {
    <fa-icon [icon]="linkIcon()" [tumAetUiTooltip]="setTooltip(instruction()!)" (click)="toggle()" />
}
@if (showConfirm()) {
    <fa-icon
        class="grading-instruction-link-icon-danger"
        [icon]="confirmIcon"
        [tumAetUiTooltip]="'artemisApp.assessment.messages.removeAssessmentInstructionLink' | artemisTranslate"
        (mouseleave)="toggle()"
        (click)="removeLink()"
    />
}
