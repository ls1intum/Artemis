@if (formStatusSections()) {
    <div #statusBar class="form-status-bar-container pt-2 pb-1">
        <hr class="form-status-line" />
        <div class="flex justify-between">
            @for (formStatusSection of formStatusSections(); track formStatusSection.title; let index = $index) {
                <div class="flex flex-col items-center" id="status-bar-section-item-{{ index }}">
                    <div
                        class="form-status-circle rounded-full border border-(--border-color)"
                        [attr.aria-label]="formStatusSection.title | artemisTranslate"
                        (click)="scrollToHeadline(formStatusSection.title)"
                        #keyboardAction7
                        role="button"
                        tabindex="0"
                        (keydown.enter)="$event.target === $event.currentTarget ? keyboardAction7.click() : undefined"
                        (keydown.space)="$event.target === $event.currentTarget ? $event.preventDefault() : undefined"
                        (keyup.space)="$event.target === $event.currentTarget ? keyboardAction7.click() : undefined"
                    >
                        <jhi-checklist-check
                            [checkAttribute]="formStatusSection.valid"
                            [iconColor]="formStatusSection.empty && formStatusSection.valid ? 'var(--tumaet-ui-muted-color)' : undefined"
                            class="fa-sm absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
                        />
                    </div>
                    <a
                        (click)="scrollToHeadline(formStatusSection.title)"
                        class="hidden text-primary sm:inline"
                        #keyboardAction14
                        role="button"
                        tabindex="0"
                        (keydown.enter)="$event.target === $event.currentTarget ? keyboardAction14.click() : undefined"
                        (keydown.space)="$event.target === $event.currentTarget ? $event.preventDefault() : undefined"
                        (keyup.space)="$event.target === $event.currentTarget ? keyboardAction14.click() : undefined"
                    >
                        {{ formStatusSection.title | artemisTranslate }}
                    </a>
                </div>
            }
        </div>
    </div>
}
