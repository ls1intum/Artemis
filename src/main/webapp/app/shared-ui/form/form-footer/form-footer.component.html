<div class="update-footer gap-4">
    <div class="text-start">
        @if (isSimpleMode() !== undefined && switchEditMode() !== undefined && !isImport()) {
            <div class="d-flex align-items-center">
                <div
                    ngbTooltip="{{ 'artemisApp.programmingExercise.auxiliaryRepository.invalidConfigurationPreventsSwitchingEditMode' | artemisTranslate }}"
                    [disableTooltip]="areAuxiliaryRepositoriesValid()"
                >
                    <jhi-switch-edit-mode-button
                        class="me-1"
                        [isSimpleMode]="isSimpleMode()!"
                        (switchEditMode)="onSwitchEditMode()"
                        [buttonSize]="ButtonSize.SMALL"
                        [disabled]="!areAuxiliaryRepositoriesValid()"
                    />
                </div>
                <jhi-help-icon [text]="isSimpleMode() ? 'artemisApp.programmingExercise.home.advancedModeTooltip' : 'artemisApp.programmingExercise.home.simpleModeTooltip'" />
            </div>
        }
    </div>
    @if (!isCreation() && !isImport()) {
        <jhi-exercise-update-notification class="flex-grow-1 w-100" [notificationText]="notificationText()" (notificationTextChange)="notificationTextChange.emit($event)" />
    }
    <div class="d-flex gap-2 text-end">
        @if (isSaving()) {
            <span jhiTranslate="entity.action.saving" class="badge bg-secondary align-content-center"></span>
        }
        <button pButton type="button" id="cancel-save" severity="secondary" size="small" (click)="onCancel.emit()">
            <fa-icon [fixedWidth]="true" [icon]="faBan" class="sm" />
            <span class="d-none d-sm-inline" jhiTranslate="entity.action.cancel"></span>
        </button>
        @if (showGenerateWithAi()) {
            <!-- A disabled button emits no mouse events, so the tooltip has to live on this wrapper. -->
            <span
                class="submit-tooltip-host"
                [pTooltip]="invalidReasonsTooltip()"
                [tooltipDisabled]="!invalidReasons().length"
                tooltipPosition="top"
                tooltipStyleClass="invalid-reasons-tooltip"
            >
                <button
                    pButton
                    type="button"
                    id="generate-with-ai"
                    class="footer-action-button d-flex align-items-center"
                    [disabled]="isSubmitDisabled()"
                    [loading]="isGeneratingWithAi()"
                    size="small"
                    (click)="generateWithAi.emit()"
                >
                    @if (!isGeneratingWithAi()) {
                        <fa-icon [fixedWidth]="true" [icon]="facArtemisIntelligence" class="sm" />
                    }
                    <span class="d-none d-sm-inline" jhiTranslate="artemisApp.programmingExercise.codeGeneration.generateWithAi"></span>
                </button>
            </span>
        }
        <span
            class="submit-tooltip-host"
            [pTooltip]="invalidReasonsTooltip()"
            [tooltipDisabled]="!invalidReasons().length"
            tooltipPosition="top"
            tooltipStyleClass="invalid-reasons-tooltip"
        >
            <button
                pButton
                type="button"
                id="save-entity"
                class="footer-action-button d-flex align-items-center"
                [disabled]="isSubmitDisabled()"
                [loading]="isSaving()"
                size="small"
                (click)="save.emit()"
            >
                @if (!isSaving()) {
                    <fa-icon [fixedWidth]="true" [icon]="faSave" class="sm" />
                }
                <span class="d-none d-sm-inline" [jhiTranslate]="saveTitle()"></span>
            </button>
        </span>
    </div>
</div>
