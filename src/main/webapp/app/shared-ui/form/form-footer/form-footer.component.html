<div class="update-footer gap-4">
    <div class="text-start">
        @if (isSimpleMode() !== undefined && switchEditMode() !== undefined && !isImport()) {
            <div class="d-flex align-items-center">
                <div
                    ngbTooltip="{{ 'artemisApp.programmingExercise.auxiliaryRepository.invalidConfigurationPreventsSwitchingEditMode' | artemisTranslate }}"
                    [disableTooltip]="areAuxiliaryRepositoriesValid()"
                >
                    <jhi-switch-edit-mode-button
                        class="me-1"
                        [isSimpleMode]="isSimpleMode()!"
                        (switchEditMode)="onSwitchEditMode()"
                        [buttonSize]="ButtonSize.SMALL"
                        [disabled]="!areAuxiliaryRepositoriesValid()"
                    />
                </div>
                <jhi-help-icon [text]="isSimpleMode() ? 'artemisApp.programmingExercise.home.advancedModeTooltip' : 'artemisApp.programmingExercise.home.simpleModeTooltip'" />
            </div>
        }
    </div>
    @if (!isCreation() && !isImport()) {
        <jhi-exercise-update-notification class="flex-grow-1 w-100" [notificationText]="notificationText()" (notificationTextChange)="notificationTextChange.emit($event)" />
    }
    <!-- The tooltip only describes its host while it is open, so the reasons also live here permanently for aria-describedby. -->
    @if (invalidReasons().length) {
        <ul [id]="invalidReasonsId" class="sr-only">
            @for (reason of invalidReasons(); track $index) {
                <li [jhiTranslate]="reason.translateKey" [translateValues]="reason.translateValues"></li>
            }
        </ul>
    }
    <div class="d-flex gap-2 text-end">
        @if (isSaving()) {
            <span jhiTranslate="entity.action.saving" class="badge bg-secondary align-content-center"></span>
        }
        <button tumUiButton type="button" id="cancel-save" severity="secondary" size="small" (click)="onCancel.emit()">
            <fa-icon [fixedWidth]="true" [icon]="faBan" class="sm" />
            <span class="hidden sm:inline" jhiTranslate="entity.action.cancel"></span>
        </button>
        @if (showGenerateWithAi()) {
            <!-- aria-disabled rather than disabled, so the button stays focusable and can explain itself. Pointer
                 events stay on for the same reason: a blocked button still has to be able to show its tooltip. -->
            <button
                tumUiButton
                type="button"
                id="generate-with-ai"
                class="aria-disabled:opacity-60 aria-disabled:cursor-not-allowed"
                size="small"
                [tumUiTooltip]="invalidReasonTexts()"
                [attr.aria-disabled]="isSubmitDisabled()"
                [attr.aria-describedby]="invalidReasons().length ? invalidReasonsId : null"
                (click)="onGenerateWithAi()"
            >
                @if (isGeneratingWithAi()) {
                    <fa-icon [fixedWidth]="true" [icon]="faSpinner" animation="spin" class="sm" />
                } @else {
                    <fa-icon [fixedWidth]="true" [icon]="facArtemisIntelligence" class="sm" />
                }
                <span class="hidden sm:inline" jhiTranslate="artemisApp.programmingExercise.codeGeneration.generateWithAi"></span>
            </button>
        }
        <button
            tumUiButton
            type="button"
            id="save-entity"
            class="aria-disabled:opacity-60 aria-disabled:cursor-not-allowed"
            size="small"
            [tumUiTooltip]="invalidReasonTexts()"
            [attr.aria-disabled]="isSubmitDisabled()"
            [attr.aria-describedby]="invalidReasons().length ? invalidReasonsId : null"
            (click)="onSave()"
        >
            @if (isSaving()) {
                <fa-icon [fixedWidth]="true" [icon]="faSpinner" animation="spin" class="sm" />
            } @else {
                <fa-icon [fixedWidth]="true" [icon]="faSave" class="sm" />
            }
            <span class="hidden sm:inline" [jhiTranslate]="saveTitle()"></span>
        </button>
    </div>
</div>
