@if (labelName() && !hideLabelName()) {
    <label [attr.for]="inputId()" class="font-bold">
        {{ labelName() }}
    </label>
}
@if (labelTooltip()) {
    <fa-stack class="text-muted-color icon-full-size" [pTooltip]="labelTooltip()">
        <fa-icon [icon]="faQuestionCircle" stackItemSize="1x" />
    </fa-stack>
}
@if (shouldDisplayTimeZoneWarning()) {
    <fa-stack pTooltip="{{ 'entity.timeZoneWarning' | artemisTranslate: { timeZone: currentTimeZone } }}" class="icon-full-size">
        <fa-icon [icon]="faGlobe" stackItemSize="1x" class="text-muted-color" />
        <fa-icon [icon]="faClock" stackItemSize="1x" transform="shrink-6 down-5 right-5" class="text-muted-color" />
    </fa-stack>
}
<div
    class="flex relative"
    data-testid="date-picker-wrapper"
    [attr.data-invalid]="showErrorBorder()"
    [class.invalid-date-input]="showErrorBorder()"
    (keydown)="onPickerKeydown($event)"
    (paste)="onPickerPaste($event)"
>
    @if (lockedToGroup()) {
        <div
            class="date-lock-overlay"
            role="button"
            tabindex="0"
            (click)="lockedClick.emit()"
            (keydown.enter)="lockedClick.emit()"
            (keydown.space)="lockedClick.emit()"
            [tumUiTooltip]="'artemisApp.exerciseVariantGroup.timelineLocked.tooltip' | artemisTranslate"
            [attr.aria-label]="'artemisApp.exerciseVariantGroup.timelineLocked.tooltip' | artemisTranslate"
        >
            <fa-icon [icon]="faLock" class="date-lock-icon text-muted-color" />
        </div>
    }
    <p-datepicker
        #datePicker
        styleClass="w-full"
        panelStyleClass="jhi-date-time-picker-panel"
        [pt]="passThrough"
        [inputId]="inputId()"
        [fluid]="fluid()"
        [inputStyleClass]="warning() ? 'date-time-picker-warning-border' : ''"
        [ngModel]="value() ?? null"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="updateField($event)"
        (onBlur)="onInputBlur($event)"
        name="datePicker"
        [showTime]="showTime()"
        [timeOnly]="timeOnly()"
        hourFormat="24"
        [dateFormat]="dateFormat()"
        timeSeparator=":"
        [placeholder]="placeholder()"
        [firstDayOfWeek]="1"
        keepInvalid="true"
        showClear="true"
        [showIcon]="true"
        iconDisplay="input"
        showOnFocus="false"
        appendTo="body"
        [baseZIndex]="baseZIndex()"
        [minDate]="minDate()"
        [maxDate]="maxDate()"
        [defaultDate]="startDate()"
        [disabled]="effectiveDisabled()"
        [showButtonBar]="showTime() || timeOnly()"
        [invalid]="showErrorBorder()"
    >
        <!-- The picker leaves the panel open after a time selection (unlike the legacy picker). Provide an
             explicit confirm button that also commits the currently shown time, so applying it is one click. -->
        <ng-template #buttonbar>
            <div class="flex justify-end w-full">
                <button pButton type="button" size="small" (click)="applyAndClose(datePicker)" jhiTranslate="entity.action.done"></button>
            </div>
        </ng-template>
    </p-datepicker>
</div>
@if (!hideValidationMessage() && (!isInputValid() || (requiredField() && !dateInputValue()))) {
    @if (labelName()) {
        <div
            class="text-state-danger text-sm mt-1 block"
            data-testid="date-picker-validation-message"
            jhiTranslate="entity.dateMissingOrNotValid"
            [translateValues]="{ labelName: labelName() }"
        ></div>
    } @else {
        <div class="text-state-danger text-sm mt-1 block" data-testid="date-picker-validation-message" jhiTranslate="entity.dateMissingOrNotValidGeneric"></div>
    }
}
@if (warning()) {
    <div class="text-sm mt-1 block">
        <fa-icon class="text-state-warning" [icon]="faTriangleExclamation" />
        <span class="visible-date-warning" jhiTranslate="entity.visibleDateWarningError" pTooltip="{{ 'entity.visibleDateWarningToolTip' | artemisTranslate }}"></span>
    </div>
}
