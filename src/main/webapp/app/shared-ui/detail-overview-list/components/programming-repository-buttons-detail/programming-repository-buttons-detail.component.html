@let data = repositoryDataForCodeButton();
@if (data) {
    <div class="clone-buttons">
        <jhi-code-button
            size="small"
            [allowOnlineIde]="false"
            [repositoryUri]="data.repositoryUri"
            [repositoryViewLink]="['.', 'repository', data.repositoryType]"
            [exerciseId]="data.exerciseId"
            [vcsAccessTokenData]="data.vcsAccessTokenData"
        />
        <jhi-programming-exercise-instructor-repo-download class="ms-2" [exerciseId]="data.exerciseId" [repositoryType]="data.repositoryType" />
    </div>
} @else {
    <jhi-no-data />
}
