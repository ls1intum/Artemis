@if (informationBoxData(); as data) {
    <div
        id="test-information-box"
        class="information-box max-w-fit whitespace-nowrap rounded-lg border border-(--tumaet-ui-border-color)! px-2 text-sm font-semibold"
        [class.information-box-inline]="layout() === 'inline'"
        [class.py-1]="layout() === 'stacked'"
        [class.h-full]="layout() === 'stacked'"
        [tumAetUiTooltip]="data.tooltip | artemisTranslate: data.tooltipParams"
    >
        <div id="test-title" class="text-muted-color" [jhiTranslate]="data.title"></div>
        @if (data.isContentComponent) {
            <ng-content select="[contentComponent]" />
        } @else {
            <div id="test-text" [class]="contentClass()">{{ data.content.value }}</div>
        }
    </div>
}
