<div class="frame">
    @for (internalItem of internalTimelineItems(); track $index; let index = $index) {
        <div class="timeline-item-row">
            @let isInvalid = internalItem.isInvalid;
            <div class="timeline-graphic">
                <div class="timeline-graphic-line"></div>
                <div
                    class="timeline-graphic-circle"
                    [class.required]="internalItem.kind === 'required'"
                    [class.optional]="internalItem.kind === 'optional'"
                    [class.valid]="!isInvalid"
                    [class.invalid]="isInvalid"
                >
                    @if (internalItem.date() !== undefined) {
                        <div class="timeline-graphic-circle-dot" [class.invalid]="isInvalid"></div>
                    }
                </div>
                <div class="timeline-graphic-line"></div>
            </div>
            <div class="label-and-input">
                @if (index > 0) {
                    <div class="spacer"></div>
                }
                <label class="label" [for]="'datepicker-' + index" [jhiTranslate]="internalItem.labelStringKey"></label>
                <div class="datepicker-and-info">
                    <div class="timeline-datepicker" [class.warning]="internalItem.hasWarning && !isInvalid">
                        <tumaet-ui-date-picker
                            [inputId]="'datepicker-' + index"
                            [hideLabelName]="true"
                            [shouldDisplayTimeZoneWarning]="false"
                            [hideValidationMessage]="true"
                            [ariaRequired]="internalItem.kind === 'required'"
                            [ariaDescribedBy]="isInvalid || internalItem.hasWarning ? 'datepicker-' + index + '-info' : undefined"
                            [(value)]="internalItem.date"
                            [invalid]="isInvalid"
                            [disabled]="internalItem.isDisabled"
                            (inputValidityChange)="setInputValidity(internalItem, $event)"
                            (touch)="markTouched(internalItem)"
                        />
                    </div>
                    @if (isInvalid || internalItem.hasWarning) {
                        @let tooltip = internalItem.tooltip ?? '';
                        <span
                            class="timeline-datepicker-info-icon"
                            [class.warning]="internalItem.hasWarning && !isInvalid"
                            [id]="'datepicker-' + index + '-info'"
                            tabindex="0"
                            role="img"
                            [attr.aria-label]="tooltip"
                            [tumAetUiTooltip]="tooltip"
                            tumAetUiTooltipPlacement="right"
                        >
                            <fa-icon [icon]="faCircleInfo" />
                        </span>
                    }
                </div>
            </div>
        </div>
    }
</div>
