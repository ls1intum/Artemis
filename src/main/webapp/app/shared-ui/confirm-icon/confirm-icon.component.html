@if (!showConfirm()) {
    <button type="button" class="confirm-icon-button" [attr.aria-label]="initialTooltip() ?? ''" [tumUiTooltip]="initialTooltip() ?? ''" (click)="toggle()">
        <fa-icon [icon]="initialIcon()" />
    </button>
} @else {
    <button
        type="button"
        class="confirm-icon-button confirm-icon-danger"
        [attr.aria-label]="confirmTooltip() ?? ''"
        [tumUiTooltip]="confirmTooltip() ?? ''"
        (mouseleave)="toggle()"
        (blur)="toggle()"
        (click)="confirmAction()"
    >
        <fa-icon [icon]="confirmIcon()" [size]="iconSize()" />
    </button>
}
