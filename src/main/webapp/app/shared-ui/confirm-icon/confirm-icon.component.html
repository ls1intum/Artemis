@if (!showConfirm()) {
    <fa-icon style="display: inline-flex; justify-content: center" [icon]="initialIcon()" [tumUiTooltip]="initialTooltip() ?? ''" (click)="toggle()" />
} @else {
    <fa-icon class="confirm-icon-danger" [icon]="confirmIcon()" [tumUiTooltip]="confirmTooltip() ?? ''" [size]="iconSize()" (mouseleave)="toggle()" (click)="confirmAction()" />
}
