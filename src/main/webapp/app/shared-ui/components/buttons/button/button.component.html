<button
    tumAetUiButton
    class="jhi-btn"
    [class.w-full]="fullWidth()"
    [severity]="buttonOptions().severity"
    [size]="buttonOptions().size"
    [variant]="buttonOptions().variant"
    [type]="shouldSubmit() ? 'submit' : 'button'"
    [tumAetUiTooltip]="tooltip() | artemisTranslate"
    (click)="onClick.emit($event)"
    [attr.aria-label]="title() || tooltip() ? (title() || tooltip() | artemisTranslate) : null"
    [jhiFeatureToggle]="featureToggle()"
    [forceDisabled]="disabled() || isLoading()"
    [tumAetUiTooltipPlacement]="tooltipPlacement()"
>
    @if (isLoading()) {
        <fa-icon class="jhi-btn__loading sm" [icon]="faCircleNotch" animation="spin" />
    }
    @if (icon() && !isLoading()) {
        <fa-icon class="jhi-btn__icon sm" [icon]="icon()" [fixedWidth]="true" />
    }
    @if (title()) {
        <span
            class="jhi-btn__title"
            [class.hidden]="shouldToggle()"
            [class.md:inline]="shouldToggle() && toggleBreakpoint() === 'md'"
            [class.xl:inline]="shouldToggle() && toggleBreakpoint() === 'xl'"
            [class.ms-1]="icon() || isLoading()"
            [jhiTranslate]="title()"
        ></span>
    }
</button>
