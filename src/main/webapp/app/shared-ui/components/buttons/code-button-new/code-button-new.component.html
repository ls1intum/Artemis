<button
    type="button"
    tumAetUiButton
    [attr.aria-label]="'artemisApp.exerciseActions.code' | artemisTranslate"
    [tumAetUiPopoverTrigger]="popoverContent"
    data-testid="code-button-new"
>
    <fa-icon [icon]="faCode" />
    {{ 'artemisApp.exerciseActions.code' | artemisTranslate }}
</button>

<tumaet-ui-popover #popoverContent [ariaLabel]="'artemisApp.exerciseActions.codePopoverAriaLabel' | artemisTranslate" placement="bottom">
    <div class="w-120">
        @if (dataResource.isLoading()) {
            <div class="flex h-40 w-full items-center justify-center">
                <fa-icon [icon]="faCircleNotch" animation="spin" data-testid="code-button-popover-loading" />
            </div>
        } @else if (dataResource.hasValue()) {
            <jhi-code-button-popover-content [authenticationMethodData]="dataResource.value()" />
        } @else {
            <div class="flex h-40 w-full flex-col items-center justify-center gap-2 text-center">
                <fa-icon class="text-state-danger" [icon]="faCircleExclamation" size="2x" aria-hidden="true" />
                <span class="max-w-70">{{ 'artemisApp.exerciseActions.codePopoverError' | artemisTranslate }}</span>
            </div>
        }
    </div>
</tumaet-ui-popover>
