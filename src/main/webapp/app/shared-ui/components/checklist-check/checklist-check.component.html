@if (checkAttribute()) {
    <fa-icon [icon]="faCheckCircle" [size]="size()" class="text-state-success" [style.color]="iconColor()" data-testid="check-icon-checked" />
} @else {
    <fa-icon [icon]="faTimes" [size]="size()" class="text-state-danger text-xl" [style.color]="iconColor()" data-testid="check-icon-unchecked" />
}
