<div>
    @if (data.textIsMarkdown) {
        <div [innerHTML]="data.text"></div>
    }
    @if (!data.textIsMarkdown) {
        @if (data.translateText) {
            <p class="whitespace-pre-line">{{ data.text | artemisTranslate }}</p>
        }
        @if (!data.translateText) {
            <p class="whitespace-pre-line">{{ data.text }}</p>
        }
    }
    @if (data.contentRef) {
        <ng-container [ngTemplateOutlet]="data.contentRef" />
    }
</div>
<div class="mt-4! flex justify-end gap-2">
    <button
        tumAetUiButton
        type="button"
        severity="secondary"
        variant="outlined"
        data-testid="confirm-modal-cancel-button"
        (click)="cancel()"
        jhiTranslate="global.form.cancel"
    ></button>
    <button
        #confirmButton
        tumAetUiButton
        type="button"
        severity="danger"
        data-testid="confirm-modal-confirm-button"
        (click)="confirm()"
        jhiTranslate="global.form.confirm"
        [disabled]="data.confirmDisabled"
    ></button>
</div>
