@for (item of entries(); track item.id ?? item.labelKey) {
    <button
        type="button"
        class="collapsed-panel-rail__button"
        [attr.data-testid]="buttonTestId(item)"
        [attr.aria-label]="item.labelKey | artemisTranslate"
        [attr.title]="item.labelKey | artemisTranslate"
        aria-expanded="false"
        (click)="select(item, $event)"
    >
        <fa-icon [icon]="item.icon" aria-hidden="true" />
    </button>
}
