<nav class="mt-3">
    <div class="nav-link-container">
        @for (headline of sectionHeadlines(); track headline) {
            <a
                (click)="scrollToView(headline.id)"
                #keyboardAction4
                role="button"
                tabindex="0"
                (keydown.enter)="$event.target === $event.currentTarget && keyboardAction4.click()"
                (keydown.space)="$event.target === $event.currentTarget && $event.preventDefault()"
                (keyup.space)="$event.target === $event.currentTarget && keyboardAction4.click()"
            >
                {{ headline.translationKey | artemisTranslate }}
            </a>
        }
    </div>
</nav>
