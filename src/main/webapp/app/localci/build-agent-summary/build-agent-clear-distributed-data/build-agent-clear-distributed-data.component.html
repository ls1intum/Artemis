<tum-ui-dialog
    [(visible)]="visible"
    [closable]="true"
    [closeOnEscape]="true"
    [dismissableMask]="true"
    size="medium"
    [header]="'artemisApp.buildAgents.clearDistributedData.title' | artemisTranslate"
>
    <div>
        <div jhiTranslate="artemisApp.buildAgents.clearDistributedData.descriptionFirst"></div>
        <div jhiTranslate="artemisApp.buildAgents.clearDistributedData.descriptionSecond"></div>
        <div jhiTranslate="artemisApp.buildAgents.clearDistributedData.descriptionThird"></div>
    </div>
    <input tumUiInput type="text" class="mt-2 w-full" required name="confirm" [(ngModel)]="confirmationText" [pattern]="'CLEAR DATA'" />
    <ng-template #footer>
        <tum-ui-button type="button" severity="secondary" size="small" (clicked)="cancel()">
            <fa-icon [icon]="faTimes" />
            <span class="ms-1" jhiTranslate="artemisApp.buildQueue.filter.close"></span>
        </tum-ui-button>
        <tum-ui-button type="button" severity="danger" size="small" (clicked)="confirm()" [disabled]="!buttonEnabled()">
            <fa-icon [icon]="faTrash" />
            <span class="ms-1" jhiTranslate="artemisApp.buildAgents.clearDistributedData.clearData"></span>
        </tum-ui-button>
    </ng-template>
</tum-ui-dialog>
