<tumaet-ui-dialog
    [(visible)]="visible"
    [closable]="true"
    [closeOnEscape]="true"
    [dismissableMask]="true"
    size="small"
    [header]="'artemisApp.buildAgents.pauseAll' | artemisTranslate"
>
    <div>
        <div>
            <span jhiTranslate="artemisApp.buildAgents.pauseAllWarning"></span>
        </div>
    </div>
    <ng-template #footer>
        <tumaet-ui-button type="button" severity="secondary" size="small" (clicked)="cancel()">
            <fa-icon [icon]="faTimes" />
            <span class="ms-1" jhiTranslate="artemisApp.buildQueue.filter.close"></span>
        </tumaet-ui-button>
        <tumaet-ui-button type="button" severity="danger" size="small" (clicked)="confirm()">
            <fa-icon [icon]="faPause" />
            <span class="ms-1" jhiTranslate="artemisApp.buildAgents.pauseAll"></span>
        </tumaet-ui-button>
    </ng-template>
</tumaet-ui-dialog>
