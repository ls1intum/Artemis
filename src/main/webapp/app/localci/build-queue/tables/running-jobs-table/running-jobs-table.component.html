<div class="build-jobs-section">
    <tumaet-ui-table-layout [empty]="!buildJobs()?.length" emptyTitle="artemisApp.buildQueue.noRunningBuilds" style="--table-layout-offset: 28rem">
        <table tumAetUiTable [size]="'small'" [striped]="true">
            <thead>
                <tr jhi-build-jobs-header [running]="true" [showCourseId]="showCourseId()"></tr>
            </thead>
            <tbody>
                @for (buildJob of buildJobs(); track buildJob.id ?? $index) {
                    <tr
                        jhi-build-job-row
                        [buildJob]="buildJob"
                        [running]="true"
                        [isAdminView]="isAdminView()"
                        [showCourseId]="showCourseId()"
                        [courseId]="courseId()"
                        (cancelJob)="cancelJob.emit($event)"
                        (jobClick)="onJobClick($event)"
                    ></tr>
                }
            </tbody>
        </table>
    </tumaet-ui-table-layout>
</div>
