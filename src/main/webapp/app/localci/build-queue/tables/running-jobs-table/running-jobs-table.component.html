<div class="build-jobs-section">
    @if (buildJobs()?.length) {
        <table tumAetUiTable [size]="'small'" [striped]="true" style="width: max-content">
            <thead>
                <tr jhi-build-jobs-header [running]="true" [showCourseId]="showCourseId()"></tr>
            </thead>
            <tbody>
                @for (buildJob of buildJobs(); track buildJob.id ?? $index) {
                    <tr
                        jhi-build-job-row
                        [buildJob]="buildJob"
                        [running]="true"
                        [isAdminView]="isAdminView()"
                        [showCourseId]="showCourseId()"
                        [courseId]="courseId()"
                        (cancelJob)="cancelJob.emit($event)"
                        (jobClick)="onJobClick($event)"
                    ></tr>
                }
            </tbody>
        </table>
    } @else {
        <p class="text-muted-color" jhiTranslate="artemisApp.buildQueue.noRunningBuilds"></p>
    }
</div>
