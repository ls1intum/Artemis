<ng-container>
    <ng-content />
    @if (showButton()) {
        <button
            type="button"
            tumUiButton
            class="d-none d-sm-block"
            style="position: absolute"
            [class.mb-2]="mode() === 'extended'"
            [severity]="mode() === 'extended' ? 'primary' : 'secondary'"
            [variant]="mode() === 'extended' ? 'solid' : 'text'"
            [size]="mode() === 'compact' ? 'small' : 'default'"
            [class.top-left]="position() === 'top-left'"
            [class.top-right]="position() === 'top-right'"
            [class.bottom-left]="position() === 'bottom-left'"
            [class.bottom-right]="position() === 'bottom-right'"
            (click)="toggleFullscreen()"
            [tumUiTooltip]="'artemisApp.modelingEditor.fullscreen.tooltip' | artemisTranslate"
            [attr.aria-label]="
                (fullscreenActive() ? 'artemisApp.modelingEditor.fullscreen.exitButtonText' : 'artemisApp.modelingEditor.fullscreen.enterButtonText') | artemisTranslate
            "
        >
            @switch (mode()) {
                @case ('compact') {
                    <fa-icon [icon]="faCompress" aria-hidden="true" />
                }
                @case ('extended') {
                    <span>
                        @if (!fullscreenActive()) {
                            {{ 'artemisApp.modelingEditor.fullscreen.enterButtonText' | artemisTranslate }}
                        } @else {
                            {{ 'artemisApp.modelingEditor.fullscreen.exitButtonText' | artemisTranslate }}
                        }
                    </span>
                }
            }
        </button>
    }
</ng-container>
