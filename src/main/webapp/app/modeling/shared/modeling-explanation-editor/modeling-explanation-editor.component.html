<jhi-modeling-explanation-surface [labelId]="labelId" [labelKey]="labelKey()" [notchWidth]="notchWidth()">
    <textarea
        #resizableContent
        [id]="textareaId"
        class="text-editor-textarea nokey nowheel"
        rows="1"
        cdkTextareaAutosize
        cdkAutosizeMinRows="1"
        cdkAutosizeMaxRows="3"
        [attr.aria-labelledby]="labelId"
        [maxLength]="maxCharacterCount()"
        [(ngModel)]="explanation"
        [attr.placeholder]="placeholderKey() ? (placeholderKey() | artemisTranslate) : undefined"
        [readOnly]="readOnly()"
    ></textarea>
</jhi-modeling-explanation-surface>
