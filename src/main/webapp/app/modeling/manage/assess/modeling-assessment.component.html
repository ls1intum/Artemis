<div class="modeling-assessment artemis-apollon-theme">
    <div #topLeftRegion class="modeling-assessment__region modeling-assessment__region--top-left nopan nodrag nowheel">
        <ng-content select="[modelingAssessmentTopLeft]" />
    </div>
    <div #topRightRegion class="modeling-assessment__region modeling-assessment__region--top-right nopan nodrag nowheel">
        <ng-content select="[modelingAssessmentTopRight]" />
    </div>
    <div
        #bottomCenterRegion
        class="modeling-assessment__region modeling-assessment__region--bottom-center nopan nodrag nowheel"
        [class.modeling-assessment__region--bottom-center-elevated]="bottomCenterElevated()"
    >
        @if (explanation()) {
            <jhi-modeling-explanation-editor [explanation]="explanation()" [readOnly]="true" [autosizeMaxRows]="6" [autosizeMinRows]="4" />
        }
    </div>

    <jhi-apollon-rail-disclosure
        #panelRegion
        [label]="panelLabel()"
        [icon]="faPanel"
        testId="modeling-assessment-panel"
        [(visible)]="panelVisible"
        (visibleChange)="onPanelVisibilityChanged()"
        [maxHeight]="panelMaxHeight()"
        [hidden]="!hasPanel()"
        (resized)="scheduleChromePlacement()"
    >
        <ng-content select="[modelingAssessmentPanel]" />
    </jhi-apollon-rail-disclosure>

    <div
        #resizeContainer
        class="modeling-assessment__canvas-shell"
        [class.resizable]="resizeOptions()"
        jhiResizable
        [resizableEdges]="resizableEdges()"
        [resizableConstraints]="{
            minWidth: MODELING_EDITOR_MIN_WIDTH,
            maxWidth: MODELING_EDITOR_MAX_WIDTH,
            minHeight: MODELING_EDITOR_MIN_HEIGHT,
            maxHeight: MODELING_EDITOR_MAX_HEIGHT,
        }"
    >
        <div class="apollon-row" id="apollon-assessment-row">
            <div #editorContainer class="apollon-container artemis-apollon-theme"></div>
            @if (resizeOptions()?.horizontalResize) {
                <div class="draggable-right" [attr.aria-label]="'artemisApp.modelingSubmission.resizeEditor' | artemisTranslate">
                    <fa-icon [icon]="faGripLinesVertical" />
                </div>
            }
        </div>
        @if (resizeOptions()?.verticalResize) {
            <div class="draggable-bottom" [attr.aria-label]="'artemisApp.modelingSubmission.resizeEditor' | artemisTranslate">
                <fa-icon [icon]="faGripLines" />
            </div>
        }
    </div>
</div>
