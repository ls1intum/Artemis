<main class="modeling-assessment-page">
    <jhi-assessment-layout
        class="modeling-assessment-page__layout"
        [isLoading]="isLoading()"
        [nextSubmissionBusy]="nextSubmissionBusy()"
        [isTeamMode]="!!modelingExercise()?.teamMode"
        [isAssessor]="isAssessor()"
        [isTestRun]="isTestRun()"
        [exerciseDashboardLink]="exerciseDashboardLink()"
        [canOverride]="canOverride"
        [result]="result()"
        [assessmentsAreValid]="assessmentsAreValid()"
        [complaint]="complaint()"
        [exercise]="modelingExercise()!"
        [submission]="submission()"
        [showAssessmentNote]="false"
        [showComplaintSection]="false"
        [hasAssessmentDueDatePassed]="hasAssessmentDueDatePassed()"
        (save)="onSaveAssessment()"
        (onSubmit)="onSubmitAssessment()"
        (onCancel)="onCancelAssessment()"
        (nextSubmission)="assessNext()"
        (updateAssessmentAfterComplaint)="onUpdateAssessmentAfterComplaint($event)"
        [(highlightDifferences)]="highlightDifferences"
        [correctionRound]="correctionRound()"
        (useAsExampleSubmission)="useStudentSubmissionAsExampleSubmission()"
    >
        @if (submission()) {
            <jhi-assessment-workspace class="modeling-assessment-page__workspace" storageKey="modeling-submission-assessment-split" [customDetailsHeader]="true">
                <div assessmentWorkspaceCanvas class="modeling-assessment-page__canvas">
                    <jhi-assessment-submission-panel [score]="scoreSummary()" [maxPoints]="getTotalMaxPoints(modelingExercise())" [scrollContent]="false">
                        <jhi-modeling-assessment
                            [diagramType]="modelingExercise()?.diagramType"
                            [umlModel]="model()!"
                            [readOnly]="readOnly"
                            [resultFeedbacks]="result()?.feedbacks || []"
                            [highlightedElements]="highlightedElements()"
                            (feedbackChanged)="onFeedbackChanged($event)"
                            [explanation]="submission()?.explanationText || ''"
                            [highlightDifferences]="highlightDifferences"
                            [elementCounts]="submission()?.similarElements"
                        >
                            <jhi-feedback-suggestions-banner
                                [modelingAssessmentTopLeft]="feedbackSuggestionsNotice() === 'loading'"
                                appearance="chrome"
                                [isLoading]="loadingFeedbackSuggestions()"
                                [hasAutomaticFeedback]="hasAutomaticFeedback()"
                                [isAssessor]="isAssessor()"
                                [resultCompletionDate]="result()?.completionDate"
                                [isFeedbackSuggestionsEnabled]="isFeedbackSuggestionsEnabled"
                            />

                            <jhi-modeling-assessment-legend [modelingAssessmentTopRight]="true" [highlights]="legendHighlights()" />
                        </jhi-modeling-assessment>
                    </jhi-assessment-submission-panel>
                </div>

                <div assessmentWorkspaceInstructions>
                    @if (modelingExercise()) {
                        <jhi-assessment-instructions [readOnly]="readOnly" [exercise]="modelingExercise()!" [showAssessmentInstructions]="true" [embeddedInEditorChrome]="true" />
                    }
                </div>

                <jhi-assessment-details-header
                    assessmentWorkspaceDetailsHeader
                    [(activeTab)]="detailsTab"
                    [feedbackCount]="unreferencedFeedback().length"
                    [hasNote]="hasTutorNote()"
                    [complaintType]="complaint()?.complaintType"
                    [complaintAwaitsResponse]="complaint()?.accepted === undefined"
                    [disabled]="readOnly || !result()?.id"
                    (addGeneralFeedback)="addGeneralFeedback()"
                />

                <div assessmentWorkspaceDetails class="modeling-assessment-page__details">
                    <!-- Both tabs stay rendered: the general feedback list must stay registered for the instruction checkboxes. -->
                    <div [hidden]="detailsTab() !== 'feedback'">
                        @if (result()?.id) {
                            <jhi-unreferenced-feedback
                                [feedbacks]="unreferencedFeedback()"
                                (feedbacksChange)="unreferencedFeedback.set($event); validateFeedback()"
                                [readOnly]="readOnly"
                                [showAddButton]="false"
                                [showHeader]="false"
                                [highlightDifferences]="highlightDifferences"
                                [resultId]="result()!.id!"
                                [gradingCriteria]="modelingExercise()?.gradingCriteria ?? []"
                                [allFeedbacks]="allAssessmentFeedbacks()"
                                [maxPoints]="getTotalMaxPoints(modelingExercise())"
                            />
                        }
                    </div>
                    <div [hidden]="detailsTab() !== 'notes'">
                        <jhi-assessment-note [assessmentNote]="result()?.assessmentNote" [showTitle]="false" (onAssessmentNoteChange)="onAssessmentNoteChange($event)" />
                    </div>
                    @if (complaint(); as complaint) {
                        <div [hidden]="detailsTab() !== 'complaint'">
                            <jhi-complaints-for-tutor-form
                                [complaint]="complaint"
                                [stacked]="true"
                                [exercise]="modelingExercise()"
                                [isAssessor]="isAssessor()"
                                [submission]="submission()"
                                [isTestRun]="isTestRun()"
                                (updateAssessmentAfterComplaint)="onUpdateAssessmentAfterComplaint($event)"
                            />
                        </div>
                    }
                </div>
            </jhi-assessment-workspace>
        } @else {
            @if (assessmentNotPossibleYet(); as assessmentNotPossibleYetReason) {
                <jhi-assessment-not-possible-yet [reason]="assessmentNotPossibleYetReason" />
            } @else if (!loadingInitialSubmission()) {
                <div class="modeling-assessment-not-found mt-4">
                    <tumaet-ui-message severity="warn">
                        <span jhiTranslate="artemisApp.modelingAssessment.notFound"></span>
                    </tumaet-ui-message>
                    <a [routerLink]="exerciseDashboardLink()" tumAetUiButton severity="info" size="small" class="assessment-dashboard">
                        <span jhiTranslate="entity.action.exerciseDashboard"></span>
                    </a>
                </div>
            }
        }
    </jhi-assessment-layout>
</main>
