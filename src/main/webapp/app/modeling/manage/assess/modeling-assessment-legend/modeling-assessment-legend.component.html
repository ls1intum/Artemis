@for (scoreTone of scoreTones; track scoreTone.tone) {
    <span class="assessment-legend__item">
        <span class="assessment-legend__marker" [attr.data-tone]="scoreTone.tone" aria-hidden="true">
            <fa-icon [icon]="scoreTone.icon" />
        </span>
        <span>{{ scoreTone.text | artemisTranslate }}</span>
    </span>
}
@for (highlight of highlights(); track highlight.text) {
    <span class="assessment-legend__item">
        <!-- The swatch takes the colour the canvas paints, so the two cannot drift apart. -->
        <span class="assessment-legend__highlight" [style.background]="highlight.color" aria-hidden="true"></span>
        <span [jhiTranslate]="highlight.text"></span>
    </span>
}
