<button
    tumAetUiButton
    type="button"
    data-testid="course-sidebar-toggle"
    [attr.aria-expanded]="!isCollapsed()"
    [tumAetUiTooltip]="'artemisApp.course.toggleSidebar' | artemisTranslate"
    size="small"
    severity="secondary"
    [class]="{ 'is-collapsed': isCollapsed(), 'is-communication-module': isCommunicationModule() }"
    class="sidebar-toggle rounded-lg"
    [attr.aria-label]="'artemisApp.course.toggleSidebar' | artemisTranslate"
    (click)="toggleSidebar.emit()"
>
    <fa-icon [fixedWidth]="true" [icon]="facSidebar" class="sidebar-toggle-icon flex justify-center items-center" size="lg" />
    <div class="sidebar-toggle-chevron flex gap-1">
        <fa-icon [fixedWidth]="true" [icon]="faChevronRight" class="sidebar-toggle-chevron-start flex justify-center items-center" size="xs" />
        <fa-icon [fixedWidth]="true" [icon]="faChevronRight" class="flex justify-center items-center" size="xs" />
    </div>
</button>
