<!-- Height, vertical padding, action-control sizing and the surrounding dividers come from
     `title-bar-frame` / `title-bar-compact-controls` in the component stylesheet, so this bar stays identical
     to the admin title bar. The frame applies to the row below, not to this element: a page may also project a
     toolbar, which renders as a second row and makes the bar taller than `--title-bar-height` by design. -->
<div id="course-title-bar" class="bg-(--module-bg) px-4 rounded-sm sticky top-0" [style.display]="displayStyle()">
    <div class="course-title-bar-row">
        <div class="title-bar-title self-center flex">
            <div class="self-center">
                @if (customTitleTemplate()) {
                    <ng-container *ngTemplateOutlet="customTitleTemplate()!" />
                } @else {
                    <jhi-course-title-bar-title [title]="pageTitle()" />
                }
            </div>
        </div>

        <div class="title-bar-actions flex gap-2 items-center">
            @if (customActionsTemplate()) {
                <ng-container *ngTemplateOutlet="customActionsTemplate()!" />
            }
            <ng-content />
        </div>
    </div>

    @if (customToolbarTemplate()) {
        <div class="mt-2! pt-2 border-t border-(--border-color)">
            <ng-container *ngTemplateOutlet="customToolbarTemplate()!" />
        </div>
    }
</div>
