<!-- Height, vertical padding, action-control sizing and the surrounding dividers come from
     `title-bar-frame` / `title-bar-compact-controls` in the component stylesheet, so this bar stays identical
     to the admin title bar. -->
<div id="course-title-bar" class="module-bg px-3 rounded rounded-3 sticky-top" [style.display]="displayStyle()">
    <div class="title-bar-title align-self-center d-flex">
        <div class="align-self-center">
            @if (customTitleTemplate()) {
                <ng-container *ngTemplateOutlet="customTitleTemplate()!" />
            } @else {
                <jhi-course-title-bar-title [title]="pageTitle()" />
            }
        </div>
    </div>

    <div class="d-flex gap-2 align-items-center">
        @if (customActionsTemplate()) {
            <ng-container *ngTemplateOutlet="customActionsTemplate()!" />
        }
        <ng-content />
    </div>
</div>
