@if (course().isAtLeastInstructor) {
    @if (irisEnabled()) {
        <div class="ai-panel" data-testid="iris-panel">
            <div class="ai-header">
                <div class="ai-title">
                    <jhi-iris-logo [size]="IrisLogoSize.TEXT" />
                    <span jhiTranslate="artemisApp.course.onboarding.generalSettings.irisTitle"></span>
                    <button type="button" class="ai-learn-more" (click)="openAboutIrisModal()" jhiTranslate="artemisApp.iris.aboutIrisModal.learnMore"></button>
                </div>
            </div>
            <div class="ai-body">
                <jhi-iris-enabled [course]="course()" />
            </div>
        </div>
    }
    @if (athenaEnabled()) {
        <div class="ai-panel" data-testid="athena-panel">
            <div class="ai-header">
                <div class="ai-title">
                    <jhi-athena-logo />
                    <span jhiTranslate="artemisApp.course.athenaConfig.title"></span>
                </div>
            </div>
            <div class="ai-body">
                <jhi-athena-enabled [course]="course()" />
            </div>
        </div>
    }
}
