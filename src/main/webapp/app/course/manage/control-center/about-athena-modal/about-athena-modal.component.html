<!-- Sized like the About Iris dialog on the same page: 40rem wide and at most 40rem tall, the header scrolling with
     the content, and its own close button instead of the dialog header. The dialog panel caps the width at 90dvw on
     narrow screens, and the negative margin cancels the dialog content's own padding, so this box is the whole panel.
     The close button is placed by a wrapper, as in the About Iris dialog: the button's own unlayered
     `:host { position: relative }` beats Tailwind's layered `absolute`, which left the button offset to the top left.
     It overrides the small button's padding and text size so that, like Iris's, its 1rem icon sits in a 24px box
     0.75rem from the corner. Spacing that Bootstrap also defines under the same class name with another size (gap-4,
     gap-5, mb-4) is written as an arbitrary value instead, since Bootstrap's `!important` version would win, and the
     dividers are plain separators rather than <hr>, which Bootstrap styles. -->
<tumaet-ui-dialog [(visible)]="visible" [dismissableMask]="true" [showHeader]="false" [ariaLabel]="'artemisApp.course.athenaConfig.aboutAthenaModal.meetAthena' | artemisTranslate">
    <div class="relative -mx-4 -mb-4 w-[40rem] max-w-[90dvw] bg-(--hover-slightly-darker-body-bg)">
        <div class="absolute top-3 right-3 z-10">
            <button
                type="button"
                tumAetUiButton
                severity="secondary"
                variant="text"
                size="small"
                class="p-[3px]! text-base! leading-none!"
                (click)="close()"
                [attr.aria-label]="'artemisApp.course.athenaConfig.aboutAthenaModal.close' | artemisTranslate"
            >
                <fa-icon [icon]="faXmark" aria-hidden="true" />
            </button>
        </div>

        <div class="max-h-[40rem] overflow-y-auto p-10 [scrollbar-gutter:stable]">
            <div class="mb-[1rem] flex items-start gap-[1rem]">
                <!-- The top padding aligns the logo vertically with the header text. -->
                <div class="pt-1.5">
                    <jhi-athena-logo [size]="40" />
                </div>
                <div class="flex-1">
                    <h2 class="about-athena-title" jhiTranslate="artemisApp.course.athenaConfig.aboutAthenaModal.meetAthena"></h2>
                    <p class="m-0 mb-2 text-base text-(--body-color)" jhiTranslate="artemisApp.course.athenaConfig.aboutAthenaModal.subtitle"></p>
                    <p class="m-0 text-sm text-(--text-body-secondary)" jhiTranslate="artemisApp.course.athenaConfig.aboutAthenaModal.description"></p>
                </div>
            </div>

            <div role="separator" class="my-8 h-px bg-(--border-color)"></div>

            <!-- Section: What Athena can do -->
            <section>
                <h3 class="about-athena-section-title" jhiTranslate="artemisApp.course.athenaConfig.aboutAthenaModal.whatAthenaCanDo"></h3>
                <div class="flex flex-col gap-[1.25rem]">
                    @for (card of whatAthenaCanDo; track card.titleKey) {
                        <div class="flex items-start gap-[1rem]">
                            <div class="mt-1 flex size-8 shrink-0 items-center justify-center rounded-lg bg-(--primary)/10 text-(--primary)" aria-hidden="true">
                                <fa-icon [icon]="card.icon" />
                            </div>
                            <div>
                                <p class="m-0 mb-1 text-sm text-(--body-color)" [jhiTranslate]="card.titleKey"></p>
                                <p class="m-0 text-sm text-(--text-body-secondary)" [jhiTranslate]="card.descKey"></p>
                            </div>
                        </div>
                    }
                </div>
            </section>

            <div role="separator" class="my-8 h-px bg-(--border-color)"></div>

            <!-- Section: What to expect -->
            <section>
                <h3 class="about-athena-section-title" jhiTranslate="artemisApp.course.athenaConfig.aboutAthenaModal.whatToExpect"></h3>
                <div class="flex flex-col gap-[1.25rem]">
                    @for (card of whatToExpect; track card.titleKey) {
                        <div class="flex items-start gap-[1rem]">
                            <div
                                class="mt-1 flex size-8 shrink-0 items-center justify-center rounded-lg bg-(--text-body-secondary)/10 text-(--text-body-secondary)"
                                aria-hidden="true"
                            >
                                <fa-icon [icon]="card.icon" />
                            </div>
                            <div>
                                <p class="m-0 mb-1 text-sm text-(--body-color)" [jhiTranslate]="card.titleKey"></p>
                                <p class="m-0 text-sm text-(--text-body-secondary)" [jhiTranslate]="card.descKey"></p>
                            </div>
                        </div>
                    }
                </div>
            </section>
        </div>
    </div>
</tumaet-ui-dialog>
