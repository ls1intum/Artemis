<div class="course-detail-parent-container">
    <div class="flex flex-nowrap justify-center gap-2 mt-4">
        <a [routerLink]="['/course-management', course().id, 'course-statistics']" class="text-center">
            <h5 jhiTranslate="artemisApp.courseStatistics.activeStudents"></h5>
        </a>
        <jhi-help-icon class="chart-explanation-tooltip" placement="right auto" text="artemisApp.courseStatistics.activeStudentsExplanation" />
    </div>
    @if (startDateAlreadyPassed) {
        <ng-container>
            <div>
                <div class="flex gap-4 justify-end me-4">
                    @if (course().startDate) {
                        <div class="flex">
                            <button
                                tumAetUiButton
                                type="button"
                                variant="text"
                                severity="secondary"
                                [disabled]="!showLifetimeOverview() && displayedNumberOfWeeks() === 4"
                                (click)="displayPeriodOverview(4)"
                                [tumAetUiTooltip]="'artemisApp.courseStatistics.scopeButton.periodTooltip' | artemisTranslate: { amount: 4 }"
                                jhiTranslate="artemisApp.courseStatistics.scopeButton.period"
                                [translateValues]="{ amount: 4 }"
                            ></button>
                            <button
                                tumAetUiButton
                                type="button"
                                variant="text"
                                severity="secondary"
                                [disabled]="!showLifetimeOverview() && displayedNumberOfWeeks() === 8"
                                (click)="displayPeriodOverview(8)"
                                [tumAetUiTooltip]="'artemisApp.courseStatistics.scopeButton.periodTooltip' | artemisTranslate: { amount: 8 }"
                                jhiTranslate="artemisApp.courseStatistics.scopeButton.period"
                                [translateValues]="{ amount: 8 }"
                            ></button>
                            <button
                                tumAetUiButton
                                type="button"
                                variant="text"
                                severity="secondary"
                                [disabled]="showLifetimeOverview()"
                                (click)="displayLifetimeOverview()"
                                [tumAetUiTooltip]="'artemisApp.courseStatistics.scopeButton.overviewTooltip' | artemisTranslate"
                                jhiTranslate="artemisApp.courseStatistics.scopeButton.overview"
                            ></button>
                        </div>
                        <span class="pt-1">|</span>
                    }
                    <div class="flex gap-1">
                        <button
                            tumAetUiButton
                            type="button"
                            variant="text"
                            severity="secondary"
                            [disabled]="startDateDisplayed()"
                            (click)="switchTimeSpan(SwitchTimeSpanDirection.LEFT)"
                        >
                            <fa-icon [icon]="faArrowLeft" />
                        </button>
                        <button
                            tumAetUiButton
                            type="button"
                            variant="text"
                            severity="secondary"
                            [disabled]="showsCurrentWeek()"
                            (click)="switchTimeSpan(SwitchTimeSpanDirection.RIGHT)"
                        >
                            <fa-icon [icon]="faArrowRight" />
                        </button>
                    </div>
                </div>
                <div class="flex mt-1 justify-center items-center h-99">
                    @if (!loading()) {
                        <div class="active-students-chart" style="height: 320px; width: 100%">
                            <tumaet-ui-line-chart
                                [labels]="chartData().labels"
                                [series]="chartData().series"
                                [config]="chartConfig()"
                                [ariaLabel]="'artemisApp.courseStatistics.activeStudents' | artemisTranslate"
                            />
                        </div>
                    } @else {
                        <h1 class="spinner">
                            <fa-icon [icon]="faSpinner" animation="spin" />
                        </h1>
                    }
                </div>
            </div>
        </ng-container>
    } @else {
        <ng-container>
            <h4 class="text-center mt-4" jhiTranslate="artemisApp.course.notStartedYet"></h4>
            <h3 class="text-center">{{ course().startDate | artemisDate }}</h3>
        </ng-container>
    }
</div>
