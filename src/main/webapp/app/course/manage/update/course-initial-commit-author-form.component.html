<fieldset class="m-0 flex flex-col gap-3 border-0 p-0" [formGroup]="group()" data-testid="course-initial-commit-author">
    <legend class="mb-1 text-base font-semibold" jhiTranslate="artemisApp.course.initialCommitAuthor.label"></legend>
    <p class="m-0 text-sm text-muted-color" jhiTranslate="artemisApp.course.initialCommitAuthor.hint"></p>

    <div class="flex items-start gap-3" role="radiogroup" [attr.aria-label]="'artemisApp.course.initialCommitAuthor.label' | artemisTranslate">
        <div class="flex flex-col gap-3">
            <div class="flex items-start gap-3">
                <tumaet-ui-radio-button
                    inputId="initialCommitAuthorCreator"
                    [ariaLabel]="'artemisApp.course.initialCommitAuthor.creator.label' | artemisTranslate"
                    name="initialCommitAuthorMode"
                    formControlName="mode"
                    [value]="InitialCommitAuthorMode.EXERCISE_CREATOR"
                    data-testid="initial-commit-author-creator"
                />
                <span class="m-0">
                    <span class="font-medium" jhiTranslate="artemisApp.course.initialCommitAuthor.creator.label"></span>
                    <span class="block text-sm text-muted-color" jhiTranslate="artemisApp.course.initialCommitAuthor.creator.description"></span>
                </span>
            </div>
            <div class="flex items-start gap-3">
                <tumaet-ui-radio-button
                    inputId="initialCommitAuthorPlaceholder"
                    [ariaLabel]="'artemisApp.course.initialCommitAuthor.placeholder.label' | artemisTranslate"
                    name="initialCommitAuthorMode"
                    formControlName="mode"
                    [value]="InitialCommitAuthorMode.PLACEHOLDER"
                    data-testid="initial-commit-author-placeholder"
                />
                <span class="m-0">
                    <span class="font-medium" jhiTranslate="artemisApp.course.initialCommitAuthor.placeholder.label"></span>
                    <span class="block text-sm text-muted-color" jhiTranslate="artemisApp.course.initialCommitAuthor.placeholder.description"></span>
                </span>
            </div>
            <div class="flex items-start gap-3">
                <tumaet-ui-radio-button
                    inputId="initialCommitAuthorCustom"
                    [ariaLabel]="'artemisApp.course.initialCommitAuthor.custom.label' | artemisTranslate"
                    name="initialCommitAuthorMode"
                    formControlName="mode"
                    [value]="InitialCommitAuthorMode.CUSTOM"
                    data-testid="initial-commit-author-custom"
                />
                <span class="m-0">
                    <span class="font-medium" jhiTranslate="artemisApp.course.initialCommitAuthor.custom.label"></span>
                    <span class="block text-sm text-muted-color" jhiTranslate="artemisApp.course.initialCommitAuthor.custom.description"></span>
                </span>
            </div>
        </div>
    </div>

    @if (isCustom()) {
        <div class="grid gap-4 ps-8 md:grid-cols-2">
            <tumaet-ui-form-field
                controlId="initialCommitAuthorName"
                required
                [label]="'artemisApp.course.initialCommitAuthor.name.label' | artemisTranslate"
                [invalid]="group().controls.name.touched && group().controls.name.invalid"
                [error]="nameError() ? ('artemisApp.course.initialCommitAuthor.name.' + nameError() | artemisTranslate: { max: nameMaxLength }) : ''"
            >
                <input
                    tumAetUiInput
                    id="initialCommitAuthorName"
                    [attr.aria-label]="'artemisApp.course.initialCommitAuthor.name.label' | artemisTranslate"
                    type="text"
                    class="w-full"
                    formControlName="name"
                    [maxLength]="nameMaxLength"
                    data-testid="initial-commit-author-name"
                />
            </tumaet-ui-form-field>
            <tumaet-ui-form-field
                controlId="initialCommitAuthorEmail"
                required
                [label]="'artemisApp.course.initialCommitAuthor.email.label' | artemisTranslate"
                [invalid]="group().controls.email.touched && group().controls.email.invalid"
                [error]="emailError() ? ('artemisApp.course.initialCommitAuthor.email.' + emailError() | artemisTranslate: { max: emailMaxLength }) : ''"
            >
                <input
                    tumAetUiInput
                    id="initialCommitAuthorEmail"
                    [attr.aria-label]="'artemisApp.course.initialCommitAuthor.email.label' | artemisTranslate"
                    type="email"
                    class="w-full"
                    formControlName="email"
                    [maxLength]="emailMaxLength"
                    data-testid="initial-commit-author-email"
                />
            </tumaet-ui-form-field>
        </div>
    }
</fieldset>
