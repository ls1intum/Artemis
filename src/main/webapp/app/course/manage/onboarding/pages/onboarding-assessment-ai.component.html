<div>
    <div class="step-hero step-hero--assessment">
        <div class="step-hero-icon">
            <fa-icon [icon]="faChartLine" />
        </div>
        <div class="step-hero-text">
            <h4>
                <span jhiTranslate="artemisApp.course.onboarding.assessment.title"></span>
                <jhi-documentation-button [type]="'Assessment'" />
            </h4>
            <p jhiTranslate="artemisApp.course.onboarding.assessment.description"></p>
        </div>
    </div>
    <div class="step-body">
        <div class="grid grid-cols-1 gap-4! mb-4! md:grid-cols-2">
            <tumaet-ui-form-field class="min-w-0" [label]="'artemisApp.course.maxPoints.title' | artemisTranslate" controlId="onboarding-maxPoints">
                <jhi-points-input
                    fluid
                    inputId="onboarding-maxPoints"
                    [ariaLabel]="'artemisApp.course.maxPoints.title' | artemisTranslate"
                    [ngModel]="course().maxPoints"
                    (ngModelChange)="updateField('maxPoints', $event)"
                    [min]="1"
                    pattern="\d*"
                    [max]="MAX_GRADING_POINTS"
                    #maxPointsInput="ngModel"
                />
                @if (maxPointsInput.errors?.['min']) {
                    <tumaet-ui-message severity="error" class="mt-1" data-testid="onboarding-maxPoints-error">
                        <span jhiTranslate="artemisApp.course.maxPoints.min"></span>
                    </tumaet-ui-message>
                }
                @if (maxPointsInput.errors?.['max']) {
                    <tumaet-ui-message severity="error" class="mt-1" data-testid="onboarding-maxPoints-error">
                        <span jhiTranslate="artemisApp.course.maxPoints.max" [translateValues]="{ max: MAX_GRADING_POINTS }"></span>
                    </tumaet-ui-message>
                }
                @if (maxPointsInput.errors?.['pattern']) {
                    <tumaet-ui-message severity="error" class="mt-1" data-testid="onboarding-maxPoints-error">
                        <span jhiTranslate="artemisApp.course.maxPoints.wholeNumber"></span>
                    </tumaet-ui-message>
                }
            </tumaet-ui-form-field>
            <tumaet-ui-form-field class="min-w-0" [label]="'artemisApp.course.accuracyOfScores.title' | artemisTranslate" controlId="onboarding-accuracyOfScores">
                <input
                    [attr.aria-label]="'artemisApp.course.accuracyOfScores.title' | artemisTranslate"
                    id="onboarding-accuracyOfScores"
                    tumAetUiInput
                    class="w-full"
                    type="number"
                    [ngModel]="course().accuracyOfScores"
                    (ngModelChange)="updateField('accuracyOfScores', $event)"
                    min="0"
                    max="5"
                />
            </tumaet-ui-form-field>
        </div>

        <div class="flex items-center gap-4! mb-1">
            <strong jhiTranslate="artemisApp.course.complaintsEnabled.title"></strong>
            <div class="feature-toggle">
                <button
                    type="button"
                    data-testid="onboarding_complaintsEnabled"
                    class="toggle-btn"
                    [ngClass]="{ 'active-enabled': complaintsToggled() }"
                    [attr.aria-pressed]="complaintsToggled()"
                    (click)="!complaintsToggled() && toggleComplaints()"
                >
                    <fa-icon [icon]="faCheck" />
                    <span jhiTranslate="artemisApp.iris.settings.enabled"></span>
                </button>
                <button
                    type="button"
                    class="toggle-btn"
                    [ngClass]="{ 'active-disabled': !complaintsToggled() }"
                    [attr.aria-pressed]="!complaintsToggled()"
                    (click)="complaintsToggled() && toggleComplaints()"
                >
                    <fa-icon [icon]="faTimes" />
                    <span jhiTranslate="artemisApp.iris.settings.disabled"></span>
                </button>
            </div>
        </div>
        @if (complaintsToggled()) {
            <p class="text-(--text-body-secondary) text-[0.875em] mb-4!" jhiTranslate="artemisApp.course.onboarding.assessment.complaintsEnabled"></p>
        } @else {
            <p class="text-(--text-body-secondary) text-[0.875em] mb-4!" jhiTranslate="artemisApp.course.onboarding.assessment.complaintsDisabled"></p>
        }

        @if (complaintsToggled()) {
            <div class="ms-6! mb-4!">
                <div class="grid grid-cols-1 items-end gap-4! mb-2 md:grid-cols-3">
                    <tumaet-ui-form-field class="min-w-0" [label]="'artemisApp.course.maxComplaints.title' | artemisTranslate" controlId="onboarding-maxComplaints">
                        <input
                            [attr.aria-label]="'artemisApp.course.maxComplaints.title' | artemisTranslate"
                            id="onboarding-maxComplaints"
                            tumAetUiInput
                            class="w-full"
                            type="number"
                            [ngModel]="course().maxComplaints"
                            (ngModelChange)="updateField('maxComplaints', $event)"
                            min="0"
                        />
                    </tumaet-ui-form-field>
                    <tumaet-ui-form-field class="min-w-0" [label]="'artemisApp.course.maxTeamComplaints.title' | artemisTranslate" controlId="onboarding-maxTeamComplaints">
                        <input
                            [attr.aria-label]="'artemisApp.course.maxTeamComplaints.title' | artemisTranslate"
                            id="onboarding-maxTeamComplaints"
                            tumAetUiInput
                            class="w-full"
                            type="number"
                            [ngModel]="course().maxTeamComplaints"
                            (ngModelChange)="updateField('maxTeamComplaints', $event)"
                            min="0"
                        />
                    </tumaet-ui-form-field>
                    <tumaet-ui-form-field class="min-w-0" [label]="'artemisApp.course.maxComplaintTimeDays.title' | artemisTranslate" controlId="onboarding-maxComplaintTimeDays">
                        <input
                            [attr.aria-label]="'artemisApp.course.maxComplaintTimeDays.title' | artemisTranslate"
                            id="onboarding-maxComplaintTimeDays"
                            tumAetUiInput
                            class="w-full"
                            type="number"
                            [ngModel]="course().maxComplaintTimeDays"
                            (ngModelChange)="updateField('maxComplaintTimeDays', $event)"
                            min="0"
                        />
                    </tumaet-ui-form-field>
                </div>
            </div>
        }

        <div class="flex items-center gap-4! mb-1">
            <strong jhiTranslate="artemisApp.course.requestMoreFeedbackEnabled.title"></strong>
            <div class="feature-toggle">
                <button
                    type="button"
                    class="toggle-btn"
                    [ngClass]="{ 'active-enabled': requestMoreFeedbackToggled() }"
                    [attr.aria-pressed]="requestMoreFeedbackToggled()"
                    (click)="!requestMoreFeedbackToggled() && toggleRequestMoreFeedback()"
                >
                    <fa-icon [icon]="faCheck" />
                    <span jhiTranslate="artemisApp.iris.settings.enabled"></span>
                </button>
                <button
                    type="button"
                    class="toggle-btn"
                    [ngClass]="{ 'active-disabled': !requestMoreFeedbackToggled() }"
                    [attr.aria-pressed]="!requestMoreFeedbackToggled()"
                    (click)="requestMoreFeedbackToggled() && toggleRequestMoreFeedback()"
                >
                    <fa-icon [icon]="faTimes" />
                    <span jhiTranslate="artemisApp.iris.settings.disabled"></span>
                </button>
            </div>
        </div>
        @if (requestMoreFeedbackToggled()) {
            <p class="text-(--text-body-secondary) text-[0.875em] mb-4!" jhiTranslate="artemisApp.course.onboarding.assessment.moreFeedbackEnabled"></p>
        } @else {
            <p class="text-(--text-body-secondary) text-[0.875em] mb-4!" jhiTranslate="artemisApp.course.onboarding.assessment.moreFeedbackDisabled"></p>
        }

        @if (requestMoreFeedbackToggled()) {
            <tumaet-ui-form-field
                class="ms-6! mb-4!"
                [label]="'artemisApp.course.maxRequestMoreFeedbackTimeDays.title' | artemisTranslate"
                controlId="onboarding-maxRequestMoreFeedbackTimeDays"
            >
                <input
                    [attr.aria-label]="'artemisApp.course.maxRequestMoreFeedbackTimeDays.title' | artemisTranslate"
                    id="onboarding-maxRequestMoreFeedbackTimeDays"
                    tumAetUiInput
                    class="w-full"
                    type="number"
                    [ngModel]="course().maxRequestMoreFeedbackTimeDays"
                    (ngModelChange)="updateField('maxRequestMoreFeedbackTimeDays', $event)"
                    min="0"
                />
            </tumaet-ui-form-field>
        }
    </div>
</div>
