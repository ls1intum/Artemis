<div>
    <div class="step-hero step-hero--enrollment">
        <div class="step-hero-icon">
            <fa-icon [icon]="faUserPlus" />
        </div>
        <div class="step-hero-text">
            <h4>
                <span jhiTranslate="artemisApp.course.onboarding.enrollment.title"></span>
                <jhi-documentation-button [type]="'Course'" />
            </h4>
            <p jhiTranslate="artemisApp.course.onboarding.enrollment.description"></p>
        </div>
    </div>
    <div class="step-body">
        @if (ltiEnabled) {
            <div class="flex items-center gap-4 mb-1">
                <strong jhiTranslate="artemisApp.course.onlineCourse.title"></strong>
                <div class="feature-toggle">
                    <button
                        type="button"
                        class="toggle-btn"
                        [ngClass]="{ 'active-enabled': course().onlineCourse }"
                        [attr.aria-pressed]="course().onlineCourse"
                        (click)="!course().onlineCourse && toggleOnlineCourse()"
                    >
                        <fa-icon [icon]="faCheck" />
                        <span jhiTranslate="artemisApp.iris.settings.enabled"></span>
                    </button>
                    <button
                        type="button"
                        class="toggle-btn"
                        [ngClass]="{ 'active-disabled': !course().onlineCourse }"
                        [attr.aria-pressed]="!course().onlineCourse"
                        (click)="course().onlineCourse && toggleOnlineCourse()"
                    >
                        <fa-icon [icon]="faTimes" />
                        <span jhiTranslate="artemisApp.iris.settings.disabled"></span>
                    </button>
                </div>
            </div>
            @if (course().onlineCourse) {
                <p class="text-(--text-body-secondary) text-[0.875em] mb-4!" jhiTranslate="artemisApp.course.onboarding.enrollment.onlineCourseEnabled"></p>
            } @else {
                <p class="text-(--text-body-secondary) text-[0.875em] mb-4!" jhiTranslate="artemisApp.course.onboarding.enrollment.onlineCourseDisabled"></p>
            }
        }

        <div class="flex items-center gap-4 mb-1">
            <strong jhiTranslate="artemisApp.course.enrollmentEnabled.title"></strong>
            <div class="feature-toggle">
                <button
                    type="button"
                    data-testid="onboarding_enrollmentEnabled"
                    class="toggle-btn"
                    [ngClass]="{ 'active-enabled': course().enrollmentEnabled }"
                    [attr.aria-pressed]="course().enrollmentEnabled"
                    (click)="!course().enrollmentEnabled && toggleEnrollment()"
                >
                    <fa-icon [icon]="faCheck" />
                    <span jhiTranslate="artemisApp.iris.settings.enabled"></span>
                </button>
                <button
                    type="button"
                    class="toggle-btn"
                    [ngClass]="{ 'active-disabled': !course().enrollmentEnabled }"
                    [attr.aria-pressed]="!course().enrollmentEnabled"
                    (click)="course().enrollmentEnabled && toggleEnrollment()"
                >
                    <fa-icon [icon]="faTimes" />
                    <span jhiTranslate="artemisApp.iris.settings.disabled"></span>
                </button>
            </div>
        </div>
        @if (course().enrollmentEnabled) {
            <p class="text-(--text-body-secondary) text-[0.875em] mb-4!" jhiTranslate="artemisApp.course.onboarding.enrollment.selfEnrollmentEnabled"></p>
        } @else {
            <p class="text-(--text-body-secondary) text-[0.875em] mb-4!" jhiTranslate="artemisApp.course.onboarding.enrollment.selfEnrollmentDisabled"></p>
        }

        @if (course().enrollmentEnabled) {
            <div class="step-indent mb-4">
                <div class="grid grid-cols-1 gap-4 mb-4 md:grid-cols-2">
                    <div class="min-w-0">
                        <tumaet-ui-date-picker
                            inputId="onboarding-enrollmentStartDate"
                            labelName="artemisApp.course.enrollmentStartDate"
                            [value]="course().enrollmentStartDate"
                            (valueChange)="updateField('enrollmentStartDate', $event)"
                            (inputValidityChange)="setStartTextValid($event)"
                        />
                    </div>
                    <div class="min-w-0">
                        <tumaet-ui-date-picker
                            inputId="onboarding-enrollmentEndDate"
                            labelName="artemisApp.course.enrollmentEndDate"
                            [value]="course().enrollmentEndDate"
                            (valueChange)="updateField('enrollmentEndDate', $event)"
                            (inputValidityChange)="setEndTextValid($event)"
                        />
                    </div>
                </div>

                <div class="mb-4">
                    <span class="mb-2 inline-block" jhiTranslate="artemisApp.course.enrollmentConfirmationMessage"></span>
                    <jhi-markdown-editor-monaco class="markdown-editor" [markdown]="course().enrollmentConfirmationMessage" (markdownChange)="updateEnrollmentMessage($event)" />
                </div>

                <div class="flex items-center gap-4 mb-1">
                    <strong jhiTranslate="artemisApp.course.unenrollmentEnabled.title"></strong>
                    <div class="feature-toggle">
                        <button
                            type="button"
                            class="toggle-btn"
                            [ngClass]="{ 'active-enabled': course().unenrollmentEnabled }"
                            [attr.aria-pressed]="course().unenrollmentEnabled"
                            (click)="!course().unenrollmentEnabled && toggleUnenrollment()"
                        >
                            <fa-icon [icon]="faCheck" />
                            <span jhiTranslate="artemisApp.iris.settings.enabled"></span>
                        </button>
                        <button
                            type="button"
                            class="toggle-btn"
                            [ngClass]="{ 'active-disabled': !course().unenrollmentEnabled }"
                            [attr.aria-pressed]="!course().unenrollmentEnabled"
                            (click)="course().unenrollmentEnabled && toggleUnenrollment()"
                        >
                            <fa-icon [icon]="faTimes" />
                            <span jhiTranslate="artemisApp.iris.settings.disabled"></span>
                        </button>
                    </div>
                </div>
                @if (course().unenrollmentEnabled) {
                    <p class="text-(--text-body-secondary) text-[0.875em] mb-4!" jhiTranslate="artemisApp.course.onboarding.enrollment.unenrollmentEnabled"></p>
                } @else {
                    <p class="text-(--text-body-secondary) text-[0.875em] mb-4!" jhiTranslate="artemisApp.course.onboarding.enrollment.unenrollmentDisabled"></p>
                }

                @if (course().unenrollmentEnabled) {
                    <div class="step-indent mb-4">
                        <tumaet-ui-date-picker
                            inputId="onboarding-unenrollmentEndDate"
                            labelName="artemisApp.course.unenrollmentEndDate"
                            [value]="course().unenrollmentEndDate"
                            (valueChange)="updateField('unenrollmentEndDate', $event)"
                            (inputValidityChange)="setUnenrollmentEndTextValid($event)"
                        />
                    </div>
                }
            </div>
        }
    </div>
</div>
