<image-cropper
    [imageFile]="uploadFile()"
    [maintainAspectRatio]="true"
    [format]="fileFormat()"
    [aspectRatio]="1"
    [resizeToWidth]="200"
    [cropperMinWidth]="100"
    [onlyScaleDown]="true"
    [roundCropper]="roundCropper()"
    (imageCropped)="imageCropped($event)"
/>
<div class="mt-4 flex justify-end gap-2">
    <button type="button" tumUiButton severity="secondary" variant="outlined" data-testid="cancel-cropping-button" (click)="onCancel()">
        <span jhiTranslate="entity.action.cancel"></span>
    </button>
    <button type="button" tumUiButton severity="primary" data-testid="save-cropping-button" (click)="onSave()">
        <span jhiTranslate="entity.action.save"></span>
    </button>
</div>
