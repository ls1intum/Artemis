<jhi-exercise-action-bar [items]="mainActions()" [hasReservedContent]="hasQuizButtons()" (columnMinWidthChange)="quizActionsMinWidth.emit($event)">
    <ng-container actionBarReserved>
        @if (quizExercise(); as quiz) {
            <jhi-quiz-exercise-lifecycle-buttons [quizExercise]="quiz" (handleNewQuizExercise)="onQuizLifecycleUpdate($event)" (loadOne)="onQuizReload()" />
        }
    </ng-container>
</jhi-exercise-action-bar>

<!-- Placement happens server-side in FINALIZING; the wizard's "Open in Editor" navigates on its own. -->
<jhi-exercise-variant-ai-modal-wizard
    [visible]="aiVariantModalVisible()"
    (visibleChange)="aiVariantModalVisible.set($event)"
    [sourceExercise]="exercise()"
    [courseId]="courseId()"
/>
