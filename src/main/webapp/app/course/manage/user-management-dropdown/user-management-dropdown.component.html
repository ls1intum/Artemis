<button
    id="user-management-dropdown"
    data-testid="user-management-dropdown"
    type="button"
    tumUiButton
    severity="secondary"
    variant="outlined"
    size="small"
    [tumUiMenuTrigger]="userAddMenu"
>
    <fa-icon [icon]="faUser" />
    <span class="hidden sm:inline">{{ 'global.menu.admin.userManagement' | artemisTranslate }}</span>
</button>
<ng-template #userAddMenu>
    <tum-ui-menu>
        @for (userAddAction of userAddActions(); track userAddAction.id) {
            <a tumUiMenuItem [routerLink]="userAddAction.routerLink" [id]="userAddAction.id">
                <fa-icon [fixedWidth]="true" [icon]="userAddAction.icon" />
                <span [jhiTranslate]="userAddAction.label"></span>
            </a>
        }
    </tum-ui-menu>
</ng-template>
