<div
    id="test-sidebar-card-large"
    class="pointer item-border rounded-3 col-12 px-1 py-2 border-5 highlight-card bg-module"
    [routerLink]="'./' + sidebarItem()?.id"
    (click)="emitStoreAndRefresh(sidebarItem().id)"
    [routerLinkActive]="'bg-selected border-selected'"
    #keyboardAction1
    role="button"
    tabindex="0"
    (keydown.enter)="$event.target === $event.currentTarget && keyboardAction1.click()"
    (keydown.space)="$event.target === $event.currentTarget && $event.preventDefault()"
    (keyup.space)="$event.target === $event.currentTarget && keyboardAction1.click()"
>
    <!-- groupKey is used to determine the display format of channel names in different sidebar sections -->
    <jhi-sidebar-card-item [groupKey]="groupKey()" [sidebarType]="sidebarType()" [sidebarItem]="sidebarItem()" />
</div>
