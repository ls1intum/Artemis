@if (sidebarType() === 'inExam') {
    <div
        id="test-sidebar-card-medium"
        class="pointer item-border rounded-3 col-12 px-1 pt-2 pb-1 border-5 highlight-card bg-module hover-effect"
        [ngClass]="{ 'bg-selected border-selected': itemSelected() }"
        (click)="onExamCardClicked()"
        [attr.aria-current]="itemSelected() ? true : null"
        #keyboardAction2
        role="button"
        tabindex="0"
        (keydown.enter)="$event.target === $event.currentTarget ? keyboardAction2.click() : undefined"
        (keydown.space)="$event.target === $event.currentTarget ? $event.preventDefault() : undefined"
        (keyup.space)="$event.target === $event.currentTarget ? keyboardAction2.click() : undefined"
    >
        <jhi-sidebar-card-item [groupKey]="groupKey()" [sidebarType]="sidebarType()" [sidebarItem]="sidebarItem()" />
    </div>
} @else {
    <div class="item-border rounded-3 col-12">
        <div
            id="test-sidebar-card-medium"
            class="flex rounded-3 col-12 border-start border-5 highlight-card bg-module hover-effect"
            [ngClass]="{
                'bg-selected border-selected': sidebarItem().active,
                'border-success': sidebarItem()?.difficulty === DifficultyLevel.EASY,
                'border-warning': sidebarItem()?.difficulty === DifficultyLevel.MEDIUM,
                'border-danger': sidebarItem()?.difficulty === DifficultyLevel.HARD,
                'border-variant-group': isVariantGroup(),
                'border-module': !sidebarItem()?.difficulty && !isVariantGroup(),
                'bg-group-selected': containsActiveVariant(),
            }"
            [routerLinkActive]="'bg-selected border-selected'"
        >
            <a
                class="block min-w-0 flex-1 px-1 py-2 text-inherit no-underline focus-visible:outline-2 focus-visible:outline-offset-2"
                [routerLink]="
                    sidebarItem().disableNavigation
                        ? null
                        : sidebarItem()?.targetComponentSubRoute
                          ? ['./', sidebarItem().targetComponentSubRoute, sidebarItem().id]
                          : ['./', sidebarItem().id]
                "
                (click)="onNonExamCardClicked($event)"
                [attr.role]="sidebarItem().disableNavigation ? 'button' : null"
                [attr.tabindex]="sidebarItem().disableNavigation ? 0 : null"
                (keydown.enter)="onSelectionCardKeydown($event)"
                (keydown.space)="onSelectionCardKeydown($event)"
            >
                <jhi-sidebar-card-item
                    [unreadCount]="this.sidebarItem().conversation?.unreadMessagesCount ?? 0"
                    [groupKey]="groupKey()"
                    [sidebarType]="sidebarType()"
                    [sidebarItem]="sidebarItem()"
                    [showTriggerBuildButton]="sidebarType() !== 'exercise'"
                />
            </a>
            @if (sidebarType() === 'exercise' && sidebarItem().exercise?.type === ExerciseType.PROGRAMMING && sidebarItem().studentParticipation) {
                <jhi-programming-exercise-student-trigger-build-button
                    class="self-end pb-2 pe-1 empty:hidden"
                    [exercise]="sidebarItem().exercise!"
                    [participation]="sidebarItem().studentParticipation!"
                    [triggerLastGraded]="false"
                />
            }
        </div>
    </div>
}
