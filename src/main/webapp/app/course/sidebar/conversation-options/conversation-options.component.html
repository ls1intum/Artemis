<div class="option-buttons flex items-center">
    <button class="favorite sidebar-button p-0" (click)="onFavoriteClicked($event)" type="button">
        <fa-icon [icon]="conversation().isFavorite ? faHeartSolid : faHeartRegular" size="sm" />
    </button>
    <div class="options-menu flex items-center">
        <button
            class="sidebar-button flex! items-center justify-center px-1! py-0!"
            type="button"
            data-testid="conversation-options-toggle"
            [tumAetUiMenuTrigger]="optionsMenu"
            (click)="$event.stopPropagation()"
        >
            <fa-icon [icon]="faEllipsisVertical" size="sm" />
        </button>
        <ng-template #optionsMenu>
            <tumaet-ui-menu>
                @if (conversationAsChannel()?.subTypeReferenceId) {
                    <a class="sub-type-reference" tumAetUiMenuItem [routerLink]="channelSubTypeReferenceRouterLink()">
                        {{ channelSubTypeReferenceTranslationKey() | artemisTranslate }}
                    </a>
                }
                @if (!isOneToOneChat(conversation())) {
                    <button type="button" class="setting" tumAetUiMenuItem (triggered)="openConversationDetailDialog()">
                        <fa-icon [icon]="faGear" size="sm" />
                        {{ 'artemisApp.conversationsLayout.conversationSelectionSideBar.sideBarSection.settings' | artemisTranslate }}
                    </button>
                }
                <button type="button" class="mute" tumAetUiMenuItem (triggered)="onMuteClicked()">
                    <fa-icon [icon]="conversation().isMuted ? faVolumeUp : faVolumeXmark" size="sm" />
                    {{
                        conversation().isMuted
                            ? ('artemisApp.conversationsLayout.conversationSelectionSideBar.sideBarSection.unmute' | artemisTranslate)
                            : ('artemisApp.conversationsLayout.conversationSelectionSideBar.sideBarSection.mute' | artemisTranslate)
                    }}
                </button>
                <button type="button" class="hide" tumAetUiMenuItem (triggered)="onArchiveClicked()">
                    <fa-icon [icon]="conversation().isHidden ? faBoxOpen : faBoxArchive" size="sm" />
                    {{
                        conversation().isHidden
                            ? ('artemisApp.conversationsLayout.conversationSelectionSideBar.sideBarSection.show' | artemisTranslate)
                            : ('artemisApp.conversationsLayout.conversationSelectionSideBar.sideBarSection.hide' | artemisTranslate)
                    }}
                </button>
            </tumaet-ui-menu>
        </ng-template>
    </div>
</div>
