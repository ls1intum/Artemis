@if (course().enrollmentConfirmationMessage!) {
    <jhi-confirm-button
        (onConfirm)="registerForCourse(course().id!)"
        title="artemisApp.studentDashboard.enroll.enrollInCourse"
        confirmationText="{{ course().enrollmentConfirmationMessage! }}"
        confirmationTitle="artemisApp.studentDashboard.enroll.courseEnrollmentConfirmationTitle"
        [confirmationTitleTranslationParams]="{ courseName: course().title! }"
        [disabled]="loading()"
        [translateText]="false"
        [textIsMarkdown]="true"
    />
}
@if (!course().enrollmentConfirmationMessage!) {
    <button type="button" tumAetUiButton (click)="registerForCourse(course().id!)" [disabled]="loading()" jhiTranslate="artemisApp.studentDashboard.enroll.enrollInCourse"></button>
}
