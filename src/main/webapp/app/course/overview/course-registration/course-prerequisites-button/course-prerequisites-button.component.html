@if (course().prerequisites?.length) {
    <button
        type="button"
        tumAetUiButton
        severity="secondary"
        (click)="showPrerequisites(course().id!)"
        jhiTranslate="artemisApp.studentDashboard.enroll.coursePrerequisites"
    ></button>
}
<jhi-course-prerequisites-modal [(visible)]="showModal" [courseId]="course().id!" />
