<tumaet-ui-dialog [(visible)]="visible" size="large" dismissableMask [header]="'artemisApp.prerequisite.title' | artemisTranslate">
    <div class="w-full">
        @if (isLoading()) {
            <div class="flex justify-center">
                <tumaet-ui-progress-spinner [ariaLabel]="'loading' | artemisTranslate" />
            </div>
        } @else {
            <div class="grid grid-cols-1 gap-x-12 gap-y-2 min-[992px]:grid-cols-2">
                @for (prerequisite of prerequisites(); track prerequisite.id; let i = $index) {
                    <jhi-competency-card class="min-w-0" [competency]="prerequisite" [isPrerequisite]="true" [noProgressRings]="true" />
                }
            </div>
        }
    </div>
</tumaet-ui-dialog>
