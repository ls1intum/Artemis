<div>
    <h3 jhiTranslate="artemisApp.studentDashboard.enroll.title"></h3>
    <tumaet-ui-table-layout [loading]="loading()" [empty]="filteredCoursesToSelect().length === 0 && !loading()" emptyTitle="artemisApp.studentDashboard.enroll.noCourse">
        <div tumAetUiTableToolbar class="flex min-w-0 flex-1 items-center gap-2">
            <input
                tumAetUiInput
                tumAetUiInputSize="small"
                type="search"
                class="max-w-96 min-w-24 flex-1"
                [attr.aria-label]="'artemisApp.course.searchForCourse' | artemisTranslate"
                [(ngModel)]="searchTermString"
                (input)="applySearch()"
                [placeholder]="'artemisApp.course.searchForCourse' | artemisTranslate"
            />
        </div>
        <table tumAetUiTable size="small" striped [sortField]="predicate()" [sortOrder]="ascending() ? 1 : -1" (sortChange)="onSort($event)">
            <thead>
                <tr>
                    <th class="w-1/4" tumAetUiSortableColumn="title">
                        <span jhiTranslate="artemisApp.studentDashboard.course"></span>
                    </th>
                    <th tumAetUiSortableColumn="semester">
                        <span jhiTranslate="artemisApp.course.semester"></span>
                    </th>
                    <th>
                        <span jhiTranslate="artemisApp.course.description"></span>
                    </th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                @for (course of filteredCoursesToSelect(); track course) {
                    <tr>
                        <td>
                            <span>{{ course.title }}</span>
                        </td>
                        <td class="whitespace-nowrap">
                            <span>{{ course.semester }}</span>
                        </td>
                        <td>
                            <span>{{ course.description }}</span>
                        </td>
                        <td class="text-end">
                            <jhi-course-prerequisites-button [course]="course" />
                        </td>
                        <td class="text-end">
                            <jhi-course-registration-button [course]="course" (onRegistration)="removeCourseFromList(course.id!)" />
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </tumaet-ui-table-layout>
</div>
