<!-- @if can't be used for isShownViaLti as it removes the element from the DOM, disrupting dropdown stability for the More-Menu. -->
<div class="sidebar-wrapper" [class.hidden]="isShownViaLti()">
    <div class="shell-background w-screen">
        <div
            class="layout-container w-screen"
            [ngClass]="{
                'exam-wrapper exam-is-active': isExamStarted(),
                'exam-height-dev': isExamStarted() && (!isProduction || isTestServer),
                'container-closed': isNavbarCollapsed(),
            }"
        >
            <div class="sidebar bg-(--module-bg) rounded-sm" [hidden]="isExamStarted() || isolatedView()">
                <jhi-course-sidebar
                    [course]="course()"
                    [sidebarItems]="sidebarItems()"
                    [courseActionItems]="courseActionItems()"
                    [isNavbarCollapsed]="isNavbarCollapsed()"
                    [isExamStarted]="isExamStarted()"
                    [hasUnreadMessages]="hasUnreadMessages()"
                    [communicationRouteLoaded]="communicationRouteLoaded()"
                    (courseActionItemClick)="courseActionItemClick($event)"
                    (toggleCollapseState)="toggleCollapseState()"
                />
            </div>

            <div
                class="layout-content"
                [ngClass]="{
                    'exam-wrapper': isExamStarted(),
                    'exam-height-dev': isExamStarted() && (!isProduction || isTestServer),
                }"
            >
                @if (course()) {
                    @if (showCourseTitleBar()) {
                        <jhi-course-title-bar [pageTitle]="pageTitle()" [isExamStarted]="isExamStarted()">
                            <!-- Pages that expose a `controlConfiguration` render their controls here, so the legacy
                                 mechanism lands in the title bar like `titleBarActions` does, instead of above the page. -->
                            @if (!hasSidebar()) {
                                <ng-container #controlsViewContainer />
                            }
                        </jhi-course-title-bar>
                    }

                    <!-- cdkScrollable registers the container with the CDK ScrollDispatcher so drag-and-drop auto-scrolls it (#13187) -->
                    <div
                        class="course-body-container"
                        [ngClass]="{
                            'bg-(--module-bg) scrollable-content rounded-sm p-4!': !hasSidebar(),
                            'shell-divider-x': !isExamStarted(),
                        }"
                        [class.no-header-bar-height]="!hasSidebar() && !showCourseTitleBar()"
                        cdkScrollable
                    >
                        <!-- Check for !isLTI to render the router outlet only once and avoid side effects on route updates. -->
                        @if (!isShownViaLti()) {
                            <ng-template *ngTemplateOutlet="routerOutlet" />
                        }
                    </div>
                }
            </div>
        </div>
    </div>
</div>
<div class="course-body-container" [class.hidden]="!isShownViaLti()">
    @if (!hasSidebar()) {
        <ng-container #controlsViewContainer />
    }
    <!-- Check isLTI to render the router outlet only once and avoid side effects on route updates. -->
    @if (isShownViaLti()) {
        <ng-template *ngTemplateOutlet="routerOutlet" />
    }
</div>

<!-- TEMPLATES -->

<ng-template #routerOutlet>
    <router-outlet (activate)="onSubRouteActivate($event)" (deactivate)="onSubRouteDeactivate()" />
</ng-template>

<jhi-course-unenrollment-modal [(visible)]="showUnenrollModal" [course]="course()" />

<tumaet-ui-dialog
    size="medium"
    data-testid="science-consent-dialog"
    [visible]="showScienceConsentModal()"
    [header]="'artemisApp.courseOverview.scienceConsent.title' | artemisTranslate"
    ariaDescribedBy="science-consent-description"
    (visibleChange)="dismissScienceConsent()"
>
    <p id="science-consent-description">
        {{
            'artemisApp.courseOverview.scienceConsent.description'
                | artemisTranslate
                    : {
                          courseTitle: course()?.title,
                      }
        }}
    </p>
    <ng-template #footer>
        <button
            type="button"
            tumAetUiButton
            severity="secondary"
            variant="outlined"
            data-testid="science-consent-decline"
            [disabled]="scienceConsentSaving()"
            (click)="declineScienceConsent()"
        >
            {{ 'artemisApp.courseOverview.scienceConsent.decline' | artemisTranslate }}
        </button>
        <button type="button" tumAetUiButton data-testid="science-consent-accept" [disabled]="scienceConsentSaving()" (click)="acceptScienceConsent()">
            {{ 'artemisApp.courseOverview.scienceConsent.accept' | artemisTranslate }}
        </button>
    </ng-template>
</tumaet-ui-dialog>
