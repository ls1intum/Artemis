<section class="h-full overflow-hidden rounded-xl border border-(--tumaet-ui-border-color) bg-(--tumaet-ui-content-background) p-5" aria-labelledby="statistics-performance-title">
    <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
            <h2 id="statistics-performance-title" class="m-0 text-lg font-semibold" jhiTranslate="artemisApp.exercise-scores-chart.title"></h2>
            <p class="mt-1 text-sm text-(--tumaet-ui-muted-color)" jhiTranslate="artemisApp.courseOverview.statistics.redesign.performanceScope"></p>
        </div>
        <label class="flex items-center gap-2 text-sm"
            ><tum-aet-ui-checkbox
                [checked]="showComparison()"
                (checkedChange)="showComparison.set($event)"
                [ariaLabel]="'artemisApp.courseOverview.statistics.redesign.similarStudents' | artemisTranslate" /><span
                jhiTranslate="artemisApp.courseOverview.statistics.redesign.similarStudents"
            ></span
        ></label>
    </div>
    @if (loading()) {
        <p class="py-12 text-center text-(--tumaet-ui-muted-color)" role="status" jhiTranslate="artemisApp.courseOverview.statistics.redesign.loading"></p>
    } @else if (failed()) {
        <tum-aet-ui-message severity="warn"
            ><span jhiTranslate="artemisApp.courseOverview.statistics.redesign.comparisonError"></span
            ><tum-aet-ui-button size="small" variant="text" (clicked)="reload()"><span jhiTranslate="artemisApp.courseOverview.statistics.redesign.retry"></span></tum-aet-ui-button
        ></tum-aet-ui-message>
    } @else if (exercises().length) {
        <div class="max-w-full overflow-x-auto" tabindex="0" role="region" [attr.aria-label]="'artemisApp.exercise-scores-chart.title' | artemisTranslate">
            <tum-aet-ui-line-chart
                class="block h-72"
                [style.width.px]="chartWidth()"
                [labels]="chartLabels()"
                [series]="chartSeries()"
                [config]="chartConfig()"
                interactive
                (dataSelect)="onSelect($event)"
                [ariaLabel]="'artemisApp.exercise-scores-chart.title' | artemisTranslate"
            />
        </div>
        @if (showComparison()) {
            <p
                class="mt-3 mb-0 text-xs text-(--tumaet-ui-muted-color)"
                [jhiTranslate]="
                    hasComparison() ? 'artemisApp.courseOverview.statistics.redesign.comparisonExplanation' : 'artemisApp.courseOverview.statistics.redesign.comparisonUnavailable'
                "
            ></p>
        }
    } @else {
        <p class="py-12 text-center text-(--tumaet-ui-muted-color)" jhiTranslate="artemisApp.courseOverview.statistics.redesign.noGradedResults"></p>
    }
</section>
