@if (!isExamExercise() && requestFeedbackEnabled()) {
    @if (athenaEnabled() && hasUserAcceptedLLMUsage()) {
        @if (exercise().type === ExerciseType.TEXT || exercise().type === ExerciseType.MODELING) {
            <button
                class="btn btn-primary"
                (click)="requestAIFeedback()"
                [class.btn-sm]="smallButtons()"
                [disabled]="(exercise().type !== ExerciseType.PROGRAMMING && !isSubmitted()) || isFeedbackGenerationInProgress() || isFeedbackLimitReached()"
                [id]="'request-feedback-' + exercise().id"
            >
                <fa-icon [icon]="faPenSquare" [fixedWidth]="true" />
                <span class="d-none d-md-inline" jhiTranslate="artemisApp.exerciseActions.requestAutomaticFeedback"></span>
            </button>
        } @else {
            <button
                class="btn btn-primary"
                (click)="requestAIFeedback()"
                [class.btn-sm]="smallButtons()"
                [disabled]="!isSubmitted() || isFeedbackGenerationInProgress() || isFeedbackLimitReached()"
                [id]="'request-feedback-' + exercise().id"
            >
                <fa-icon [icon]="faPenSquare" [fixedWidth]="true" />
                <span class="d-none d-md-inline" jhiTranslate="artemisApp.exerciseActions.requestAutomaticFeedback"></span>
            </button>
        }
    } @else if (athenaEnabled()) {
        <div class="ai-feedback-hint flex items-center gap-2" [id]="'ai-feedback-hint-' + exercise().id">
            <span class="text-muted" jhiTranslate="artemisApp.exerciseActions.aiFeedbackAvailableHint"></span>
            <tum-ui-button
                variant="outlined"
                [size]="smallButtons() ? 'small' : 'default'"
                [icon]="faPenSquare"
                [disabled]="isFeedbackRequestBlocked()"
                [id]="'enable-ai-feedback-' + exercise().id"
                [ariaLabel]="'artemisApp.exerciseActions.enableAiFeedback' | artemisTranslate"
                [tumUiTooltip]="'artemisApp.exerciseActions.enableAiFeedbackTooltip' | artemisTranslate"
                (clicked)="showLLMSelectionModal()"
            >
                <span class="hidden md:inline" jhiTranslate="artemisApp.exerciseActions.enableAiFeedback"></span>
            </tum-ui-button>
        </div>
    } @else {
        <a
            class="btn btn-primary"
            (click)="requestFeedback()"
            [class.btn-sm]="smallButtons()"
            [id]="'request-feedback-' + exercise().id"
            [ngbTooltip]="'artemisApp.exerciseActions.requestManualFeedbackTooltip' | artemisTranslate"
        >
            <fa-icon [icon]="faPenSquare" [fixedWidth]="true" />
            <span class="d-none d-md-inline" jhiTranslate="artemisApp.exerciseActions.requestManualFeedback"></span>
        </a>
    }
}
