<ng-container>
    @if (participations()?.length && participations()?.length === 1) {
        <button
            type="button"
            jhi-exercise-action-button
            [id]="'open-exercise-' + exercise().id!"
            [buttonIcon]="faFolderOpen"
            class="open-code-editor"
            [jhiFeatureToggle]="FeatureToggle.ProgrammingExercises"
            [buttonLabel]="'artemisApp.exerciseActions.openCodeEditor' | artemisTranslate"
            [buttonLoading]="loading()"
            [smallButton]="smallButtons()"
            [hideLabelMobile]="hideLabelMobile()"
            [routerLink]="[courseAndExerciseNavigationUrl(), participations()[0].id]"
        ></button>
    }
    @if (participations()?.length && participations().length! > 1) {
        <button
            type="button"
            jhi-exercise-action-button
            [buttonIcon]="faFolderOpen"
            class="open-code-editor"
            [jhiFeatureToggle]="FeatureToggle.ProgrammingExercises"
            [buttonLabel]="'artemisApp.exerciseActions.openCodeEditor' | artemisTranslate"
            [buttonLoading]="loading()"
            [smallButton]="smallButtons()"
            [hideLabelMobile]="hideLabelMobile()"
            [tumAetUiPopoverTrigger]="codeEditorPopover"
        ></button>
    }
    <tumaet-ui-popover #codeEditorPopover placement="right" [ariaLabel]="'artemisApp.exerciseActions.openCodeEditor' | artemisTranslate">
        <!-- Rendered only while open, so a closed popover adds no second button to the page. -->
        @if (codeEditorPopover.isOpen()) {
            @if (participations() && participations().length > 1) {
                <div class="mb-2 flex items-center gap-2">
                    <tumaet-ui-toggle-switch inputId="switchPracticeMode" [ngModel]="isPracticeMode()" (changed)="switchPracticeMode()" />
                    <label for="switchPracticeMode" class="mb-0" jhiTranslate="artemisApp.exerciseActions.practiceMode.title"></label>
                </div>
            }
            <button
                type="button"
                jhi-exercise-action-button
                [id]="'open-exercise-popover-' + exercise().id!"
                [buttonIcon]="faFolderOpen"
                class="open-code-editor"
                [jhiFeatureToggle]="FeatureToggle.ProgrammingExercises"
                [buttonLabel]="'artemisApp.exerciseActions.' + (isPracticeMode() ? 'openPracticeCodeEditor' : 'openGradedCodeEditor') | artemisTranslate"
                [buttonLoading]="loading()"
                [smallButton]="smallButtons()"
                [hideLabelMobile]="hideLabelMobile()"
                [routerLink]="[courseAndExerciseNavigationUrl(), activeParticipation()?.id]"
            ></button>
        }
    </tumaet-ui-popover>
</ng-container>
