<tumaet-ui-dialog [(visible)]="visible" [closable]="false" [closeOnEscape]="false" size="medium" [header]="'artemisApp.lti.initialization.header' | artemisTranslate">
    <span jhiTranslate="artemisApp.lti.initialization.body.welcome"></span>
    <div class="mt-4! mb-4! flex items-center gap-2">
        <label class="mb-0 flex-none min-[576px]:w-1/6" for="userLoginName"> <span jhiTranslate="artemisApp.lti.initialization.body.loginLabel"></span>: </label>
        <input id="userLoginName" type="text" tumAetUiInput class="min-w-0 flex-auto" disabled [ngModel]="loginName()" />
        <jhi-copy-to-clipboard-button [copyText]="loginName()" />
    </div>
    <div class="mt-4! mb-4! flex items-center gap-2">
        <label class="mb-0 flex-none min-[576px]:w-1/6" for="userPassword"> <span jhiTranslate="artemisApp.lti.initialization.body.passwordLabel"></span>: </label>
        <input id="userPassword" type="text" tumAetUiInput class="min-w-0 flex-auto" disabled [ngModel]="password()" />
        <jhi-copy-to-clipboard-button [copyText]="password()" />
    </div>
    <p>
        <span jhiTranslate="artemisApp.lti.initialization.body.passwordHint">
            Make sure to remember your password as you will need it to log in manually or connect with our services for programming exercises.<br />
            If you forget your password, you can reset it on the login page. You can also change your password now:
        </span>
        <a target="_blank" [routerLink]="this.passwordResetLocation" jhiTranslate="artemisApp.lti.initialization.body.passwordChange"></a>
    </p>
    <p class="flex items-center gap-2">
        <tumaet-ui-checkbox inputId="lti-read-and-understood" [(ngModel)]="readAndUnderstood" />
        <label class="mb-0 font-bold" for="lti-read-and-understood" jhiTranslate="artemisApp.lti.initialization.body.readAndUnderstood"></label>
    </p>
    <button type="button" tumAetUiButton [disabled]="!readAndUnderstood" (click)="clear()" jhiTranslate="artemisApp.lti.initialization.body.confirm"></button>
</tumaet-ui-dialog>
