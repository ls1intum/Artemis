<div
    class="exam-bar sticky top-0 z-[1020] mt-0 mb-3! rounded-lg bg-(--module-bg) px-4 py-2 text-xl font-medium"
    [class]="isEndView() ? 'mx-auto max-w-[900px] max-[900px]:max-w-[600px] max-[600px]:max-w-[500px]' : !isTestRun() ? 'mx-4' : ''"
>
    <div class="flex justify-between">
        <h3 class="mr-4 mb-0! self-center" data-testid="exam-bar-title">
            {{ examTitle() }}
        </h3>
        @if (!examTimeLineView()) {
            <div class="flex items-center justify-between">
                <jhi-exam-timer
                    class="mr-4!"
                    [criticalTime]="isEndView() ? criticalTimeEndView : criticalTime"
                    [endDate]="endDate()"
                    [isEndView]="isEndView()"
                    (timerAboutToEnd)="triggerExamAboutToEnd()"
                />
                <jhi-exam-live-events-button [examStartDate]="examStartDate()" />
                @if (!isEndView()) {
                    <button
                        type="button"
                        tumAetUiButton
                        severity="danger"
                        size="small"
                        data-testid="hand-in-early"
                        class="ml-2!"
                        aria-label="Hand In Early"
                        (click)="handInEarly()"
                    >
                        <span>
                            <fa-icon [fixedWidth]="true" [icon]="faDoorClosed" />
                            <span class="hidden sm:inline" jhiTranslate="artemisApp.examParticipation.handInEarly"></span>
                        </span>
                    </button>
                }
            </div>
        }
    </div>
</div>
