<div class="question card">
    <div
        class="card-header d-flex align-items-center justify-content-between"
        (click)="toggleCollapse()()"
        #keyboardAction2
        role="button"
        tabindex="0"
        [attr.aria-expanded]="!isCardContentCollapsed()"
        (keydown.enter)="$event.target === $event.currentTarget ? keyboardAction2.click() : undefined"
        (keydown.space)="$event.target === $event.currentTarget ? $event.preventDefault() : undefined"
        (keyup.space)="$event.target === $event.currentTarget ? keyboardAction2.click() : undefined"
    >
        <ng-content select=".header" />
        <span class="btn rotate-icon" [class.rotated]="!isCardContentCollapsed()" aria-hidden="true">
            <fa-icon size="2x" [icon]="faAngleRight" />
        </span>
    </div>

    <div class="card-body question-card-body" [ngbCollapse]="isCardContentCollapsed()">
        <ng-content select=".collapsible-content" />
    </div>
</div>
