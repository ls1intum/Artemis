@if (isVisible()) {
    <button
        type="button"
        id="requestAIFeedbackButton"
        tumAetUiButton
        severity="secondary"
        size="small"
        (click)="requestAIFeedback()"
        [disabled]="
            isRequestingFeedback() || feedbackRequested() || hasAnyAthenaResultForCurrentAttempt() || (athenaFeedbackLimit() > 0 && athenaFeedbackUsed() >= athenaFeedbackLimit())
        "
    >
        @if (isGenerating()) {
            <fa-icon [icon]="faSpinner" animation="spin" />
        } @else {
            <fa-icon [icon]="faRobot" />
        }
        @if (feedbackRequested()) {
            <span jhiTranslate="artemisApp.exam.examSummary.feedbackRequested"></span>
        } @else {
            <span jhiTranslate="artemisApp.exam.examSummary.requestAIFeedback"></span>
        }
        @if (athenaFeedbackLimit() > 0) {
            <span class="ml-1">({{ athenaFeedbackUsed() }} / {{ athenaFeedbackLimit() }})</span>
        }
    </button>
}
