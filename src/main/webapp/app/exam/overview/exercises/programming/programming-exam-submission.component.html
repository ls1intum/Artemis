<jhi-exam-exercise-header [exercise]="exercise()" [actionsLabel]="'artemisApp.examParticipation.programmingActions' | artemisTranslate" />
<!-- ngIf online-code-editor -->
@if (exercise().allowOnlineEditor) {
    <div>
        <jhi-code-editor-container
            [isProblemStatementVisible]="false"
            [editable]="!repositoryIsLocked"
            [participation]="studentParticipation()"
            [showEditorInstructions]="showEditorInstructions"
            [course]="getCourseFromExercise(exercise())"
            [disableAutoSave]="true"
            (onCommitStateChange)="onCommitStateChange($event)"
            (onFileChanged)="onFileChanged()"
        >
            <div submissionPolicy class="ps-4!">
                <jhi-programming-submission-policy-status [exercise]="exercise()" [submissionCount]="submissionCount()" />
            </div>
            <div editorTitleActions>
                @if (exercise().allowOfflineIde) {
                    <div [style.align-self]="'flex-start'">
                        <jhi-exercise-details-student-actions
                            data-testid="exam-programming-code"
                            [examMode]="true"
                            [smallButtons]="true"
                            [exercise]="exercise()"
                            [courseId]="courseId()"
                        />
                    </div>
                }
            </div>
            <div editorToolbar class="inline-flex items-center">
                @if (repositoryIsLocked) {
                    <jhi-code-editor-repository-is-locked class="me-6!" />
                }
                @if (studentParticipation()) {
                    <jhi-updating-result
                        data-testid="exam-programming-result"
                        [exercise]="exercise()"
                        [showUngradedResults]="true"
                        [showBadge]="true"
                        [participation]="studentParticipation()"
                        [personalParticipation]="true"
                        [showProgressBar]="true"
                        [showProgressBarBorder]="true"
                        class="me-2"
                    />
                }
                <jhi-programming-exercise-student-trigger-build-button class="me-2" [exercise]="exercise()" [participation]="studentParticipation()" [btnSize]="ButtonSize.SMALL" />
            </div>
            <jhi-programming-exercise-instructions
                editorSidebar
                (onNoInstructionsAvailable)="showEditorInstructions = false"
                [exercise]="exercise()"
                [participation]="studentParticipation()"
                [personalParticipation]="true"
                class="instructions-wrapper__content flex-auto [&_.stepwizard]:px-4 [&_.stepwizard]:pt-3"
            />
        </jhi-code-editor-container>
    </div>
}
<!-- ngIf Offline IDE code button start -->
@if (!exercise().allowOnlineEditor && exercise().allowOfflineIde) {
    <div>
        <!-- The title row can take the toolbar over (see jhi-exam-exercise-header): the wrapper, which holds the margins, then takes no room. -->
        <div class="my-6! ms-1 [&:not(:has(*))]:hidden">
            <div #offlineToolbar class="flex items-center justify-between gap-6!" data-testid="programming-toolbar">
                <div class="flex items-center gap-6!">
                    <jhi-exercise-details-student-actions
                        data-testid="exam-programming-code"
                        [exercise]="exercise()"
                        [courseId]="courseId()"
                        [examMode]="true"
                        [smallButtons]="true"
                    />
                    <jhi-programming-submission-policy-status [exercise]="exercise()" [submissionCount]="submissionCount()" class="grow" />
                </div>
                <div class="flex items-center gap-6!">
                    @if (repositoryIsLocked) {
                        <jhi-code-editor-repository-is-locked class="me-1" />
                    }
                    @if (studentParticipation()) {
                        <jhi-updating-result
                            data-testid="exam-programming-result"
                            [exercise]="exercise()"
                            [showUngradedResults]="true"
                            [showBadge]="true"
                            [participation]="studentParticipation()"
                            [personalParticipation]="true"
                            [showProgressBar]="true"
                            [showProgressBarBorder]="true"
                            class="me-1"
                        />
                    }
                </div>
            </div>
        </div>
        @if (exercise()) {
            <jhi-programming-exercise-instructions [exercise]="exercise()" [participation]="studentParticipation()" [personalParticipation]="true" />
        }
    </div>
}
