@if (!isHidden()) {
    <button type="button" tumAetUiButton severity="warn" size="small" id="highlightDiffButton" class="ms-2!" (click)="toggleHighlightedProblemStatement($event)">
        {{
            showHighlightedDifferences()
                ? ('artemisApp.exam.problemStatementUpdate.showNew' | artemisTranslate)
                : ('artemisApp.exam.problemStatementUpdate.showDiff' | artemisTranslate)
        }}
    </button>
}
