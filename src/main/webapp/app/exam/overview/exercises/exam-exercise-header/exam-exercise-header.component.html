<div class="mb-3 flex min-h-9 items-center justify-between gap-3 border-b border-(--border-color) pb-2" data-testid="exam-exercise-header">
    <h3 class="m-0! min-w-0 text-lg! leading-tight! font-semibold!" data-testid="exam-exercise-title">
        @if (exercise(); as exercise) {
            <span>{{ exercise.exerciseGroup?.title }}</span>
            <span
                class="font-normal"
                [jhiTranslate]="exercise.bonusPoints ? 'artemisApp.examParticipation.bonus' : 'artemisApp.examParticipation.points'"
                [translateValues]="{ points: exercise.maxPoints, bonusPoints: exercise.bonusPoints }"
            ></span>
            @if (exercise.includedInOverallScore !== IncludedInOverallScore.INCLUDED_COMPLETELY) {
                <jhi-included-in-score-badge [includedInOverallScore]="exercise.includedInOverallScore" />
            }
        } @else if (titleKey(); as key) {
            <span [jhiTranslate]="key"></span>
        }
    </h3>
    <div class="flex shrink-0 items-center gap-2">
        <ng-content />
    </div>
</div>
