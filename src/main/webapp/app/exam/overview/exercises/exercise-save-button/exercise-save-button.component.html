<button id="save-exam" type="submit" [disabled]="isSynced()" class="btn btn-primary" (click)="onSave()">
    <fa-icon class="saved" [fixedWidth]="true" [icon]="submission()?.submitted && isSynced() ? facSaveSuccess : faFloppyDisk" />
    <span
        class="d-none d-sm-inline"
        [jhiTranslate]="submission()?.submitted && isSynced() ? 'artemisApp.examParticipation.exerciseSaved' : 'artemisApp.examParticipation.saveExercise'"
    >
    </span>
</button>
