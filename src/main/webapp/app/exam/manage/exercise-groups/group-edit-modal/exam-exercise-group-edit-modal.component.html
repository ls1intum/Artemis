<tumaet-ui-dialog [(visible)]="visible" [header]="headerKey() | artemisTranslate" [closable]="true" [closeOnEscape]="true" [dismissableMask]="false" size="small">
    <div class="flex flex-col gap-3">
        <div>
            <label class="font-semibold block mb-1" for="exam-group-edit-title" jhiTranslate="artemisApp.examManagement.exerciseGroup.title"></label>
            <input
                id="exam-group-edit-title"
                tumAetUiInput
                class="w-full"
                [attr.maxlength]="MAX_TITLE_LENGTH"
                [ngModel]="draftTitle()"
                (ngModelChange)="draftTitle.set($event)"
                [tumAetUiInputInvalid]="!isTitleValid()"
            />
        </div>
        <div class="flex items-center gap-2">
            <tumaet-ui-checkbox inputId="exam-group-edit-mandatory" [ngModel]="draftIsMandatory()" (ngModelChange)="draftIsMandatory.set($event)" />
            <label for="exam-group-edit-mandatory" jhiTranslate="artemisApp.examManagement.exerciseGroup.mandatory"></label>
        </div>
    </div>

    <ng-template #footer>
        <tumaet-ui-button severity="secondary" variant="text" (clicked)="onCancel()">
            <span jhiTranslate="entity.action.cancel"></span>
        </tumaet-ui-button>
        <tumaet-ui-button data-testid="save-group" [disabled]="!isTitleValid()" (clicked)="onSave()">
            <span jhiTranslate="entity.action.save"></span>
        </tumaet-ui-button>
    </ng-template>
</tumaet-ui-dialog>
