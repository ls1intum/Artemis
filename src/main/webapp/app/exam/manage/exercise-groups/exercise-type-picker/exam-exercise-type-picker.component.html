<tum-ui-dialog
    [(visible)]="visible"
    [header]="'artemisApp.exerciseManagement.addModal.header' | artemisTranslate"
    [closable]="true"
    [closeOnEscape]="true"
    [dismissableMask]="false"
    size="medium"
>
    <div class="tab-bar mb-3" role="tablist">
        <button
            type="button"
            role="tab"
            class="tab-btn {{ activeTab() === 'create' ? 'tab-btn--active' : '' }}"
            [attr.aria-selected]="activeTab() === 'create'"
            (click)="setActiveTab('create')"
            jhiTranslate="artemisApp.exerciseManagement.addModal.tab.create"
        ></button>
        <button
            type="button"
            role="tab"
            class="tab-btn {{ activeTab() === 'import' ? 'tab-btn--active' : '' }}"
            [attr.aria-selected]="activeTab() === 'import'"
            (click)="setActiveTab('import')"
            jhiTranslate="artemisApp.exerciseManagement.addModal.tab.import"
        ></button>
    </div>

    <p
        class="text-muted-color text-sm mb-3"
        [jhiTranslate]="activeTab() === 'import' ? 'artemisApp.exerciseManagement.addModal.importHint' : 'artemisApp.exerciseManagement.addModal.createHint'"
    ></p>
    <div class="exercise-grid">
        @for (card of typeCards(); track card.type) {
            <button
                class="exercise-card hover:shadow-lg"
                [attr.data-testid]="(activeTab() === 'import' ? 'import-' : 'create-') + card.type + '-exercise'"
                (click)="onCardClick(card.type)"
                type="button"
            >
                <div class="exercise-card-icon shadow-md">
                    <fa-icon [icon]="card.icon" />
                </div>
                <h6 [jhiTranslate]="card.labelKey"></h6>
                <p [jhiTranslate]="card.descriptionKey"></p>
                <span class="exercise-card-cta">
                    <span
                        [jhiTranslate]="activeTab() === 'import' ? 'artemisApp.exerciseManagement.addModal.cta.select' : 'artemisApp.exerciseManagement.addModal.cta.create'"
                    ></span>
                    <fa-icon [icon]="faArrowRight" class="ms-1" />
                </span>
            </button>
        }
    </div>
</tum-ui-dialog>
