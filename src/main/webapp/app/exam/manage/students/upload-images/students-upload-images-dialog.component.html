<tumaet-ui-dialog [(visible)]="visible" [header]="'artemisApp.exam.examUsers.dialogTitle' | artemisTranslate" size="medium">
    <!-- The dialog projects its content only once, so the form is rebuilt on every opening to drop the file chosen before. -->
    @if (visible()) {
        <form id="userImportDialogForm" name="importForm" role="form" novalidate class="flex flex-col gap-4">
            <div class="flex flex-col gap-2">
                <p class="my-0!" jhiTranslate="artemisApp.exam.examUsers.introText"></p>
                <p class="my-0!" jhiTranslate="artemisApp.exam.examUsers.pdfExampleText"></p>
            </div>
            <div class="flex items-center justify-center">
                <img
                    class="border border-(--border-color)"
                    width="300"
                    height="425"
                    ngSrc="/content/images/upload_student_images_pdf_example_img.png"
                    [alt]="'artemisApp.exam.examUsers.pdfExampleAlt' | artemisTranslate"
                />
            </div>
            <div class="flex flex-col gap-2">
                <div class="flex items-end gap-2">
                    <div class="flex items-center gap-1">
                        <label for="importPDF" class="m-0 font-semibold" jhiTranslate="artemisApp.exam.examUsers.pdfFile.label"></label>
                        <jhi-help-icon text="artemisApp.exam.examUsers.pdfFile.tooltip" />
                    </div>
                    @if (isParsing()) {
                        <fa-icon [icon]="faSpinner" animation="spin" />
                    }
                </div>
                <input
                    id="importPDF"
                    type="file"
                    accept=".pdf"
                    class="cursor-pointer file:mr-3 file:cursor-pointer file:rounded-md file:border file:border-(--border-color) file:bg-(--hover-slightly-darker-body-bg) file:px-3 file:py-2 file:text-base file:text-(--tumaet-ui-text-color) hover:file:bg-(--border-color)"
                    (change)="onPDFFileSelect($event)"
                />
            </div>
            @if (hasParsed()) {
                @if (usersNotFound() > 0 || imagesSaved() === 0) {
                    <div class="flex flex-col gap-1">
                        <div>
                            <strong jhiTranslate="artemisApp.importUsers.numberOfUsersNotFound"></strong>
                            <span class="font-bold text-state-danger">{{ usersNotFound() }}</span>
                        </div>
                        <div>
                            <strong>{{ 'artemisApp.exam.examUsers.numberOfImagesSaved' | artemisTranslate }}:</strong>
                            <span class="font-bold text-state-success">{{ imagesSaved() }}</span>
                        </div>
                    </div>
                } @else {
                    <strong class="text-state-success" jhiTranslate="artemisApp.exam.examUsers.allImagesSaved"></strong>
                }
            }
        </form>
    }
    <ng-template #footer>
        @if (!hasParsed()) {
            <button tumAetUiButton type="button" severity="secondary" (click)="clear()">
                <fa-icon [icon]="faBan" />
                <span jhiTranslate="entity.action.cancel"></span>
            </button>
            <button id="import" tumAetUiButton type="button" name="importButton" [disabled]="!file() || isParsing()" (click)="parsePDFFile()">
                <fa-icon [icon]="faUpload" />
                <span jhiTranslate="artemisApp.exam.examUsers.saveImages"></span>
                @if (isParsing()) {
                    <fa-icon [icon]="faCircleNotch" animation="spin" />
                }
            </button>
        } @else {
            <button id="finish-button" tumAetUiButton type="button" [severity]="usersNotFound() === 0 ? 'success' : 'danger'" (click)="onFinish()">
                <fa-icon [icon]="faCheck" />
                <span jhiTranslate="entity.action.finish"></span>
            </button>
        }
    </ng-template>
</tumaet-ui-dialog>
