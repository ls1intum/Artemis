<button
    type="button"
    tumAetUiButton
    size="small"
    variant="outlined"
    [disabled]="disabled()"
    [tumAetUiMenuTrigger]="menu"
    [title]="label() | artemisTranslate"
    [attr.aria-label]="label() | artemisTranslate"
    [severity]="severity()"
>
    <fa-icon [icon]="buttonIcon()" />
    <span class="title-bar-collapsible-label" [jhiTranslate]="label()"></span>
    <fa-icon [icon]="faChevronDown" size="xs" />
</button>
<ng-template #menu>
    <tumaet-ui-menu [attr.aria-label]="label() | artemisTranslate">
        @for (item of model(); track item.label) {
            <button
                type="button"
                tumAetUiMenuItem
                data-testid="exam-students-menu-entry"
                [disabled]="item.disabled ?? false"
                [class.text-state-danger]="item.danger"
                [tumAetUiTooltip]="item.tooltip ? (item.tooltip | artemisTranslate) : ''"
                (triggered)="item.command()"
            >
                @if (item.icon) {
                    <fa-icon [fixedWidth]="true" [icon]="item.icon" />
                }
                <span data-testid="exam-students-menu-item" [jhiTranslate]="item.label"></span>
            </button>
        }
    </tumaet-ui-menu>
</ng-template>
