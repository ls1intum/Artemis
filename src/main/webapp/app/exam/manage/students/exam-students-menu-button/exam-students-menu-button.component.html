<p-menu #menu [model]="model()" [popup]="true" appendTo="body">
    <ng-template #item let-item>
        <span class="p-menu-item-link" [class]="item.styleClass || ''" [title]="item.tooltip ? (item.tooltip | artemisTranslate) : ''">
            @if (item.icon) {
                <i [class]="item.icon + ' me-1'"></i>
            }
            <span class="p-menu-item-label" [jhiTranslate]="item.label"></span>
        </span>
    </ng-template>
    @if (endTemplate(); as endTpl) {
        <ng-template #end>
            <ng-container *ngTemplateOutlet="endTpl" />
        </ng-template>
    }
</p-menu>

<button
    type="button"
    tumUiButton
    [disabled]="disabled()"
    [class]="buttonClass()"
    (click)="toggleMenu($event)"
    [title]="label() | artemisTranslate"
    [attr.aria-label]="label() | artemisTranslate"
    [severity]="severity()"
    variant="outlined"
>
    <i [class]="buttonIconClass()"></i>
    <span class="title-bar-collapsible-label" [jhiTranslate]="label()"></span>
    <i class="pi pi-chevron-down fs-6"></i>
</button>
