<tumaet-ui-dialog [(visible)]="dialogVisible" [header]="'artemisApp.exam.examUsers.export.dialogTitle' | artemisTranslate" size="small">
    <form id="studentsExportDialogForm" name="studentsExportForm" role="form" novalidate class="flex flex-col gap-4" (keydown.enter)="$event.preventDefault()">
        <p class="m-0" jhiTranslate="artemisApp.exam.examUsers.export.introText"></p>
        @if (lastExportAttemptFailed()) {
            <tumaet-ui-message severity="warn">
                <span jhiTranslate="artemisApp.exam.examUsers.export.exportFailed"></span>
            </tumaet-ui-message>
        }
    </form>
    <ng-template #footer>
        <button id="cancel-button" tumAetUiButton type="button" severity="secondary" (click)="closeDialog()">
            <fa-icon [icon]="faBan" />
            <span jhiTranslate="entity.action.cancel"></span>
        </button>
        <button id="finish-button" tumAetUiButton type="button" (click)="exportUsers()">
            <fa-icon [icon]="faFileExport" />
            <span jhiTranslate="artemisApp.exam.examUsers.export.finalize"></span>
        </button>
    </ng-template>
</tumaet-ui-dialog>
