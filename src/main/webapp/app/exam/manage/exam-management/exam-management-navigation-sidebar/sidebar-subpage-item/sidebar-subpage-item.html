<a
    [routerLink]="subpage() ? [subjectId(), subpage()] : [subjectId()]"
    routerLinkActive="active"
    [routerLinkActiveOptions]="{ exact: !subpage() }"
    class="nav-link-subpage flex items-center gap-2 px-2 py-1 rounded-md no-underline"
>
    <fa-icon [icon]="icon()" class="w-4 text-center" />
    <span> {{ title() }} </span>
</a>
