<tumaet-ui-dialog [(visible)]="visible" [header]="'artemisApp.examManagement.announcementCreate.title' | artemisTranslate" size="medium">
    <form name="makeLiveExamAnnouncementForm" class="flex flex-col gap-4">
        @if (status() === 'not_submitted') {
            <div class="flex flex-col gap-4">
                <div jhiTranslate="artemisApp.examManagement.announcementCreate.task"></div>
                <jhi-markdown-editor-monaco
                    class="markdown-editor"
                    [markdown]="textContent()"
                    [showPreviewButton]="false"
                    [showEditButton]="false"
                    [enableFileUpload]="false"
                    [colorAction]="undefined"
                    [defaultActions]="actions"
                    (markdownChange)="textContentChanged($event)"
                />
            </div>
            @if (announcement(); as announcement) {
                <h3 class="my-0! text-lg font-semibold" jhiTranslate="artemisApp.examManagement.announcementCreate.preview"></h3>
                <jhi-exam-live-event [event]="announcement" />
            }
        }
        @if (status() === 'submitting') {
            <h2 class="my-0! text-2xl font-semibold">
                <fa-icon [icon]="faSpinner" animation="spin" />
                <span jhiTranslate="artemisApp.examManagement.announcementCreate.sending"></span>
            </h2>
        }
        @if (status() === 'submitted') {
            <h2 class="my-0! text-2xl font-semibold">
                <fa-icon [icon]="faCheckCircle" class="text-state-success" />
                <span jhiTranslate="artemisApp.examManagement.announcementCreate.sent"></span>
            </h2>
            @if (announcement(); as announcement) {
                <jhi-exam-live-event [event]="announcement" />
            }
        }
    </form>
    <ng-template #footer>
        <button tumAetUiButton type="button" [severity]="status() === 'submitted' ? 'primary' : 'secondary'" (click)="clear()" jhiTranslate="entity.action.close"></button>
        @if (status() !== 'submitted') {
            <button
                tumAetUiButton
                type="button"
                [disabled]="status() === 'submitting' || !textContent()"
                (click)="submitAnnouncement()"
                jhiTranslate="artemisApp.examManagement.announcementCreate.sendButton"
            ></button>
        }
    </ng-template>
</tumaet-ui-dialog>
