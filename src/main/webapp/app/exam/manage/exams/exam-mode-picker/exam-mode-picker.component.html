<div data-testid="exam-mode-picker" class="flex items-start">
    <tumaet-ui-button-group>
        <button
            tumAetUiButton
            type="button"
            id="standard-mode"
            [severity]="exam().testExam ? 'secondary' : 'primary'"
            [disabled]="disableInput()"
            [attr.aria-pressed]="!exam().testExam"
            (click)="setExamMode(false)"
            jhiTranslate="artemisApp.examManagement.testExam.realExam"
        ></button>
        <button
            tumAetUiButton
            type="button"
            data-testid="test-mode"
            [severity]="exam().testExam ? 'primary' : 'secondary'"
            [disabled]="disableInput()"
            [attr.aria-pressed]="exam().testExam"
            (click)="setExamMode(true)"
            jhiTranslate="artemisApp.examManagement.testExam.testExam"
        ></button>
    </tumaet-ui-button-group>
</div>
