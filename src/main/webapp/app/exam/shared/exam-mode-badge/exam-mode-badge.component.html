<tum-ui-tag class="inline-flex items-center" severity="secondary" data-testid="exam-mode-tag">
    @if (examMode() === ExamMode.REAL) {
        <span class="flex items-center gap-1 font-bold text-state-success text-xs">
            <fa-icon [icon]="faGraduationCap" />
            <span jhiTranslate="artemisApp.examManagement.testExam.realExam"></span>
        </span>
    } @else if (examMode() === ExamMode.TEST) {
        <span class="flex items-center gap-1 font-bold text-state-info text-xs">
            <fa-icon [icon]="faVial" />
            <span jhiTranslate="artemisApp.examManagement.testExam.testExam"></span>
        </span>
    } @else {
        <span class="flex items-center gap-1 font-bold text-state-info text-xs">
            <fa-icon [icon]="faFlaskVial" />
            <span jhiTranslate="artemisApp.examManagement.testExam.testExamWithSimulation"></span>
        </span>
    }
</tum-ui-tag>
