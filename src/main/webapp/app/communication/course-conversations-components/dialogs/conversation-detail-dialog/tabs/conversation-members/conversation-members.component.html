@if (course() && activeConversation()) {
    <div class="flex h-full flex-col">
        <div class="flex shrink-0 flex-col gap-2 p-2">
            @if (canAddUsersToConversation(activeConversation()!)) {
                <div>
                    <button type="button" tumAetUiButton severity="secondary" variant="outlined" class="addUsers" (click)="openAddUsersDialog($event)">
                        <fa-icon [icon]="faUserPlus" />
                        {{ 'artemisApp.dialogs.conversationDetail.memberTab.addUsers' | artemisTranslate }}
                    </button>
                </div>
            }
            <div class="flex items-start gap-2">
                <tumaet-ui-input-group class="basis-2/3">
                    <tumaet-ui-input-group-addon>
                        <fa-icon [icon]="faMagnifyingGlass" size="xs" />
                    </tumaet-ui-input-group-addon>
                    <input
                        tumAetUiInput
                        tumAetUiInputSize="small"
                        class="min-w-0 grow"
                        id="searchQuery"
                        type="text"
                        [attr.aria-label]="'artemisApp.dialogs.conversationDetail.memberTab.findMembers' | artemisTranslate"
                        [placeholder]="'artemisApp.dialogs.conversationDetail.memberTab.findMembers' | artemisTranslate"
                        (input)="onSearchQueryInput($event)"
                    />
                </tumaet-ui-input-group>
                <div class="basis-1/3">
                    <tumaet-ui-select
                        inputId="searchFilter"
                        [ariaLabel]="'artemisApp.dialogs.conversationDetail.memberTab.filter' | artemisTranslate"
                        class="flex! w-full"
                        size="small"
                        optionLabel="label"
                        optionValue="value"
                        [options]="filterOptions()"
                        [(ngModel)]="selectedFilter"
                        (ngModelChange)="onFilterChange($event)"
                    />
                </div>
            </div>
            @if (isSearching()) {
                <small class="leading-[calc(1.25/0.875)] text-muted-color" jhiTranslate="artemisApp.dialogs.conversationDetail.memberTab.searching"></small>
            }
        </div>
        @if (members().length > 0) {
            <div class="flex-1 overflow-y-auto p-2">
                <tumaet-ui-list>
                    @for (user of members(); track trackIdentity(i, user); let i = $index) {
                        <li
                            tumAetUiListItem
                            class="py-2!"
                            [id]="'user-' + user.id"
                            jhi-conversation-member-row
                            [conversationMember]="user"
                            [activeConversation]="activeConversation()!"
                            [course]="course()"
                            (changePerformed)="onChangePerformed()"
                            (onUserNameClicked)="userNameClicked.emit($event)"
                        ></li>
                    }
                </tumaet-ui-list>
            </div>
            <tumaet-ui-paginator
                class="shrink-0"
                [page]="page() - 1"
                [pageSize]="itemsPerPage"
                [totalRecords]="totalItems()"
                [showRowsPerPage]="false"
                (pageChange)="onPageChange($event)"
            />
        }
    </div>
}
