@if (isInitialized) {
    <div class="flex flex-col gap-4">
        <div class="flex items-start justify-between gap-2 pt-4">
            <h4 class="m-0 text-xl font-medium">
                @if (getAsChannel(activeConversation()); as channel) {
                    <span>
                        {{ 'artemisApp.dialogs.addUsers.addUsersToChannel' | artemisTranslate }}
                        <jhi-channel-icon [isPublic]="channel.isPublic!" [isAnnouncementChannel]="channel.isAnnouncementChannel!" />
                        {{ conversationService.getConversationName(channel) }}
                    </span>
                }
                @if (getAsGroupChat(activeConversation())) {
                    <span jhiTranslate="artemisApp.dialogs.addUsers.addUsersToGroupChat">Add users to group chat</span>
                }
            </h4>
            <button
                type="button"
                tumAetUiButton
                severity="secondary"
                variant="text"
                rounded
                class="size-8 shrink-0 p-0!"
                data-testid="dialog-close-button"
                [attr.aria-label]="'entity.action.close' | artemisTranslate"
                (click)="dismiss()"
            >
                <fa-icon [icon]="faXmark" />
            </button>
        </div>
        <jhi-conversation-add-users-form
            [isLoading]="isLoading()"
            [maxSelectable]="maxSelectable()"
            [courseId]="course()!.id!"
            (formSubmitted)="onFormSubmitted($event)"
            [activeConversation]="activeConversation()!"
        />
    </div>
}
