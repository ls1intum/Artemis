@if (activeConversation() && courseId()) {
    <div class="flex flex-col gap-4">
        @if (maxSelectable() !== undefined) {
            <tumaet-ui-message severity="info">
                <span jhiTranslate="artemisApp.dialogs.addUsers.addUsersForm.maxUsersNote" [translateValues]="{ max: maxSelectable() }"></span>
            </tumaet-ui-message>
        }
        <div [hidden]="maxSelectable() === 0">
            <div class="flex flex-col gap-4">
                <div class="mode-switch" [hidden]="!getAsChannel(activeConversation())">
                    <tumaet-ui-select-button
                        data-testid="add-users-mode-select"
                        [options]="modeOptions()"
                        optionLabel="label"
                        optionValue="value"
                        [allowEmpty]="false"
                        [(ngModel)]="mode"
                        [ngModelOptions]="{ standalone: true }"
                    />
                </div>
                <form class="flex flex-col gap-4" (ngSubmit)="submitForm()" [formGroup]="form">
                    <div class="individual-select" [hidden]="mode !== 'individual'">
                        <div class="flex flex-col gap-4">
                            <jhi-course-users-selector
                                formControlName="selectedUsers"
                                [courseId]="courseId()"
                                [label]="'artemisApp.dialogs.addUsers.addUsersForm.addUserLabel' | artemisTranslate"
                            />
                            @if (selectedUsersControl?.invalid && (selectedUsersControl?.dirty || selectedUsersControl?.touched)) {
                                <tumaet-ui-message severity="error">
                                    @if (selectedUsersControl?.errors?.required) {
                                        <div jhiTranslate="artemisApp.dialogs.addUsers.addUsersForm.requiredError"></div>
                                    }
                                    @if (selectedUsersControl?.errors?.maxlength) {
                                        <div jhiTranslate="artemisApp.dialogs.addUsers.addUsersForm.maxError" [translateValues]="{ max: maxSelectable() }"></div>
                                    }
                                </tumaet-ui-message>
                            }
                        </div>
                    </div>
                    <div class="group-select" [hidden]="mode !== 'group'">
                        <div class="flex flex-wrap gap-4">
                            <div class="flex items-center gap-2">
                                <tumaet-ui-checkbox inputId="allStudents" formControlName="addAllStudents" />
                                <label for="allStudents" jhiTranslate="artemisApp.dialogs.addUsers.addUsersForm.addAllStudents"></label>
                            </div>
                            <div class="flex items-center gap-2">
                                <tumaet-ui-checkbox inputId="allTutors" formControlName="addAllTutors" />
                                <label for="allTutors" jhiTranslate="artemisApp.dialogs.addUsers.addUsersForm.addAllTutors"></label>
                            </div>
                            <div class="flex items-center gap-2">
                                <tumaet-ui-checkbox inputId="allInstructors" formControlName="addAllInstructors" />
                                <label for="allInstructors" jhiTranslate="artemisApp.dialogs.addUsers.addUsersForm.addAllInstructors"></label>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" id="submitButton" tumAetUiButton [disabled]="!isSubmitPossible">
                            <span jhiTranslate="artemisApp.dialogs.addUsers.addUsersForm.addUsersButton"></span>
                            @if (isLoading()) {
                                <fa-icon [icon]="faSpinner" animation="spin" />
                            }
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
}
