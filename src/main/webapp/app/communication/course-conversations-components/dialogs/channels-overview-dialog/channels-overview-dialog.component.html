<jhi-loading-indicator-container [isLoading]="isLoading()">
    @if (isInitialized) {
        <div class="flex flex-col gap-4" data-testid="channels-overview-dialog">
            <div class="flex items-start justify-between gap-2 pt-4">
                <h4 class="m-0 text-xl font-medium!">
                    <span>{{ 'artemisApp.dialogs.channelOverview.title' | artemisTranslate: { courseTitle: course()?.title } }}</span>
                </h4>
                <button
                    type="button"
                    tumAetUiButton
                    severity="secondary"
                    variant="text"
                    rounded
                    class="size-8 shrink-0 p-0!"
                    data-testid="dialog-close-button"
                    [attr.aria-label]="'entity.action.close' | artemisTranslate"
                    (click)="clear()"
                >
                    <fa-icon [icon]="faXmark" />
                </button>
            </div>
            <!-- Overview Table -->
            @if (channels().length > 0) {
                <div class="relative max-h-[500px] overflow-auto">
                    <tumaet-ui-list>
                        @for (channel of channels(); track channel.id) {
                            <li tumAetUiListItem class="p-0!" [attr.data-channel-id]="channel.id" data-testid="channel-overview-item">
                                <jhi-channel-item [channel]="channel" (channelAction)="onChannelAction($event)" />
                            </li>
                        }
                    </tumaet-ui-list>
                </div>
            }
        </div>
    }
</jhi-loading-indicator-container>
