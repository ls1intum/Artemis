@if (isInitialized) {
    <div class="flex flex-col gap-4">
        <div class="flex items-start justify-between gap-2 pt-4">
            <h4 class="m-0 text-xl font-medium!" jhiTranslate="artemisApp.dialogs.createGroupChat.title">Start a group chat between you and a maximum of 9 other users</h4>
            <button
                type="button"
                tumAetUiButton
                severity="secondary"
                variant="text"
                rounded
                class="size-8 shrink-0 p-0!"
                data-testid="dialog-close-button"
                [attr.aria-label]="'entity.action.close' | artemisTranslate"
                (click)="clear()"
            >
                <fa-icon [icon]="faXmark" />
            </button>
        </div>
        <form class="flex flex-col gap-4" (ngSubmit)="onSubmit()" [formGroup]="form">
            <jhi-course-users-selector
                formControlName="selectedUsers"
                [courseId]="course()!.id!"
                [label]="'artemisApp.dialogs.createGroupChat.userSelectorLabel' | artemisTranslate"
            />
            @if (selectedUsersControl?.invalid && (selectedUsersControl?.dirty || selectedUsersControl?.touched)) {
                <tumaet-ui-message severity="error">
                    @if (selectedUsersControl?.errors?.required) {
                        <div jhiTranslate="artemisApp.dialogs.createGroupChat.requiredError"></div>
                    }
                    @if (selectedUsersControl?.errors?.maxlength) {
                        <div jhiTranslate="artemisApp.dialogs.createGroupChat.maxError" [translateValues]="{ max: 9 }"></div>
                    }
                </tumaet-ui-message>
            }
            <div class="flex justify-end">
                <button type="submit" id="submitButton" tumAetUiButton [disabled]="!isSubmitPossible">
                    <span jhiTranslate="artemisApp.dialogs.createGroupChat.confirmButton"></span>
                </button>
            </div>
        </form>
    </div>
}
