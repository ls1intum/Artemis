<!-- expanded post to display post and answerPosts as thread -->
<div class="h-full">
    <div
        class="postings-container expanded-thread"
        #threadContainer
        [ngClass]="{ expanded: isExpanded() }"
        jhiResizable
        [resizableEdges]="{ left: '.draggable-left' }"
        [resizableConstraints]="resizableConstraints()"
    >
        @if (!isExpanded()) {
            <div class="draggable-left panel-divider-x"></div>
        }
        <div class="thread-card" data-testid="conversation-thread-card">
            <!-- header -->
            <div class="thread-card-header cursor-default!">
                <h5 class="mb-0 font-medium" jhiTranslate="artemisApp.conversationsLayout.threadSideBar.label">Thread</h5>
                <div class="flex items-center gap-2">
                    <fa-icon
                        class="cursor-pointer me-2"
                        [icon]="isExpanded() ? faCompress : faExpand"
                        (click)="toggleExpand()"
                        [tumAetUiTooltip]="
                            isExpanded()
                                ? ('artemisApp.conversationsLayout.threadSideBar.collapse' | artemisTranslate)
                                : ('artemisApp.conversationsLayout.threadSideBar.expand' | artemisTranslate)
                        "
                    />
                    <fa-icon
                        class="cursor-pointer"
                        [tumAetUiTooltip]="'artemisApp.conversationsLayout.threadSideBar.close' | artemisTranslate"
                        [icon]="faXmark"
                        (click)="closeThread()"
                    />
                </div>
            </div>
            <!-- body -->
            <div #scrollBody class="scrollbar wrapper-scroll-y thread-answer-post mx-1 pt-0" data-testid="conversation-thread-scroll-body">
                @if (post() !== undefined) {
                    <div class="my-2">
                        <div class="py-4 px-0">
                            <jhi-post
                                [readOnlyMode]="readOnlyMode()"
                                [posting]="post()"
                                [forwardedPosts]="post()?.forwardedPosts ?? []"
                                [forwardedAnswerPosts]="post()?.forwardedAnswerPosts ?? []"
                                (onNavigateToPost)="onNavigateToPost.emit($event)"
                                [showAnswers]="true"
                                [isCommunicationPage]="true"
                                [isThreadSidebar]="true"
                                [lastReadDate]="conversation()?.lastReadDate"
                                [hasChannelModerationRights]="hasChannelModerationRights()"
                            />
                        </div>
                        <div class="message-input mx-4 pt-2">
                            @if (!readOnlyMode()) {
                                <jhi-message-reply-inline-input
                                    [activeConversation]="conversation()"
                                    [posting]="createdAnswerPost()"
                                    (onCreate)="createdAnswerPost.set(createEmptyAnswerPost())"
                                    (valueChange)="scrollEditorIntoView()"
                                />
                            }
                        </div>
                    </div>
                }
                <jhi-tutor-suggestion [post]="post()" [course]="course()" />
            </div>
        </div>
    </div>
</div>
