<div class="flex justify-center">
    <div class="w-full md:w-2/3">
        <form name="editForm" role="form" class="flex flex-col gap-6" (ngSubmit)="save()" #editForm="ngForm">
            <h2 id="jhi-faq-heading" class="m-0" jhiTranslate="artemisApp.faq.home.createOrEditLabel">Create or edit FAQ</h2>
            <tumaet-ui-form-field controlId="field_title" [label]="'artemisApp.faq.table.questionTitle' | artemisTranslate">
                <input id="field_title" tumAetUiInput type="text" name="title" [(ngModel)]="faq.questionTitle" (change)="validate()" />
            </tumaet-ui-form-field>
            <div class="flex flex-col gap-1">
                <span id="field_description_label" class="text-sm font-medium" jhiTranslate="artemisApp.faq.table.questionAnswer"></span>
                <jhi-markdown-editor-monaco
                    id="field_description"
                    class="markdown-editor"
                    aria-labelledby="field_description_label"
                    [domainActions]="domainActionsDescription"
                    [artemisIntelligenceActions]="artemisIntelligenceActions()"
                    [markdown]="faq.questionAnswer || ''"
                    (markdownChange)="handleMarkdownChange($event)"
                />
            </div>

            @if (showConsistencyCheck()) {
                <faq-consistency-check
                    [suggestions]="renderedConsistencyCheckResultMarkdown().suggestions"
                    [inconsistencies]="renderedConsistencyCheckResultMarkdown().inconsistencies"
                    [improvement]="renderedConsistencyCheckResultMarkdown().improvement"
                    (closeConsistencyWidget)="dismissConsistencyCheck()"
                />
            }
            <div class="relative flex flex-col gap-1">
                <label class="text-sm font-medium" for="field_categories" jhiTranslate="artemisApp.exercise.categories"></label>
                <jhi-category-selector [categories]="faqCategories()" [existingCategories]="existingCategories()" (selectedCategories)="updateCategories($event)" />
            </div>
            @if (faq.course) {
                <tumaet-ui-form-field controlId="field_course" [label]="'artemisApp.faq.course' | artemisTranslate">
                    <input id="field_course" tumAetUiInput disabled type="text" name="course" [(ngModel)]="faq.course.title" />
                </tumaet-ui-form-field>
            }
            <div class="flex flex-wrap gap-2">
                <button type="button" id="cancel-save" tumAetUiButton severity="secondary" (click)="previousState()">
                    <fa-icon [icon]="faBan" />
                    <span jhiTranslate="entity.action.cancel"></span>
                </button>
                <button type="submit" id="save-entity" tumAetUiButton [disabled]="!isAllowedToSave() || isSaving()">
                    <fa-icon [icon]="faSave" />
                    <span jhiTranslate="entity.action.save"></span>
                </button>
            </div>
        </form>
    </div>
</div>
