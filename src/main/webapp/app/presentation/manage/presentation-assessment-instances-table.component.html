<table tumAetUiTable data-testid="presentation-instances-table">
    <thead>
        <tr>
            <th><span jhiTranslate="artemisApp.presentationAssessment.student"></span></th>
            <th><span jhiTranslate="artemisApp.presentationAssessment.status"></span></th>
            <th><span jhiTranslate="artemisApp.presentationAssessment.assessment"></span></th>
            <th><span jhiTranslate="artemisApp.presentationAssessment.presentationDate"></span></th>
            <th><span jhiTranslate="artemisApp.presentationAssessment.remark"></span></th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        @for (row of rows(); track row.rowKey) {
            <tr>
                <td>
                    <button
                        type="button"
                        class="inline-flex items-center gap-3 rounded-sm border-0 bg-transparent p-0 text-left text-inherit focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-(--primary)"
                        [attr.aria-expanded]="row.expanded"
                        [attr.aria-controls]="'presentation-detail-' + row.rowKey"
                        [attr.aria-label]="(row.expanded ? 'artemisApp.presentationAssessment.hideDetails' : 'artemisApp.presentationAssessment.showDetails') | artemisTranslate"
                        (click)="toggleDetails.emit(row)"
                    >
                        <jhi-profile-picture
                            imageSizeInRem="2"
                            fontSizeInRem="0.75"
                            [imageId]="'presentation-student-profile-picture-' + row.rowKey"
                            [defaultPictureId]="'presentation-student-default-picture-' + row.rowKey"
                            [authorName]="row.displayName"
                        />
                        <div class="flex flex-col">
                            <strong>{{ row.displayName }}</strong>
                            <small class="text-muted-color">{{ row.student.email || row.studentLogin }}</small>
                        </div>
                    </button>
                </td>
                <td>
                    @if (row.assessed) {
                        <tumaet-ui-tag severity="success" size="sm" [value]="'artemisApp.presentationAssessment.assessed' | artemisTranslate" />
                    } @else {
                        <tumaet-ui-tag severity="warn" size="sm" [value]="'artemisApp.presentationAssessment.pending' | artemisTranslate" />
                    }
                </td>
                <td>
                    @if (row.assessed) {
                        <tumaet-ui-tag
                            severity="info"
                            size="sm"
                            [value]="row.instance.resultPoints + ' / ' + presentationAssessment().maxPoints"
                            data-testid="instance-result-points"
                        />
                    } @else {
                        -
                    }
                </td>
                <td>{{ row.instance.presentationDate ? (row.instance.presentationDate | artemisDate) : '-' }}</td>
                <td class="text-muted-color">{{ row.instance.remark || '-' }}</td>
                <td>
                    <div class="flex justify-end gap-2">
                        <tumaet-ui-button
                            size="small"
                            variant="text"
                            [icon]="faPencilAlt"
                            [ariaLabel]="'entity.action.edit' | artemisTranslate"
                            (clicked)="editInstance.emit(row.instance)"
                            data-testid="edit-instance-button"
                        />
                        @if (canDelete()) {
                            <tumaet-ui-button
                                size="small"
                                severity="danger"
                                variant="text"
                                [icon]="faTrash"
                                [ariaLabel]="'entity.action.delete' | artemisTranslate"
                                jhiDeleteButton
                                [renderButtonStyle]="false"
                                [renderButtonText]="false"
                                [actionType]="ActionType.Delete"
                                deleteQuestion="artemisApp.presentationAssessment.delete.instanceQuestion"
                                (delete)="deleteInstance.emit(row.instance)"
                                data-testid="delete-instance-button"
                            />
                        }
                    </div>
                </td>
            </tr>
            @if (row.expanded) {
                <tr class="presentation-detail-row" [id]="'presentation-detail-' + row.rowKey">
                    <td colspan="6">
                        <jhi-presentation-assessment-instance-details [instance]="row.instance" />
                    </td>
                </tr>
            }
        } @empty {
            <tr>
                <td colspan="6" class="text-center text-muted-color" jhiTranslate="artemisApp.presentationAssessment.noMatchingStudents"></td>
            </tr>
        }
    </tbody>
</table>
