<div>
    <div *titleBarActions class="flex justify-end">
        <p-button id="create-presentation-assessment" size="small" (onClick)="startCreate()">
            <fa-icon [icon]="faPlus" />
            <span jhiTranslate="artemisApp.presentationAssessment.home.createLabel"></span>
        </p-button>
    </div>

    @if (presentationAssessments().length) {
        <p-table
            [value]="presentationAssessments()"
            [tableStyle]="{ 'min-width': '100%' }"
            [stripedRows]="true"
            [loading]="isLoadingAssignedStudents() || isSaving()"
            sortField="presentationDate"
            [sortOrder]="1"
            data-testid="presentation-assessments-table"
        >
            <ng-template #header>
                <tr>
                    <th pSortableColumn="title">
                        <span jhiTranslate="artemisApp.presentationAssessment.title"></span>
                        <p-sortIcon field="title" />
                    </th>
                    <th pSortableColumn="maxPoints">
                        <span jhiTranslate="artemisApp.presentationAssessment.maxPoints"></span>
                        <p-sortIcon field="maxPoints" />
                    </th>
                    <th pSortableColumn="resultPoints">
                        <span jhiTranslate="artemisApp.presentationAssessment.resultPoints"></span>
                        <p-sortIcon field="resultPoints" />
                    </th>
                    <th pSortableColumn="presentationDate">
                        <span jhiTranslate="artemisApp.presentationAssessment.presentationDate"></span>
                        <p-sortIcon field="presentationDate" />
                    </th>
                    <th>
                        <span jhiTranslate="artemisApp.presentationAssessment.description"></span>
                    </th>
                    <th></th>
                </tr>
            </ng-template>
            <ng-template #body let-presentationAssessment>
                <tr id="presentation-assessment-{{ presentationAssessment.id }}">
                    <td>{{ presentationAssessment.title }}</td>
                    <td>{{ presentationAssessment.maxPoints }}</td>
                    <td>{{ presentationAssessment.resultPoints ?? '-' }}</td>
                    <td>{{ presentationAssessment.presentationDate | artemisDate }}</td>
                    <td>{{ presentationAssessment.description }}</td>
                    <td>
                        <div class="flex justify-end gap-2">
                            <p-button size="small" (onClick)="startEdit(presentationAssessment)">
                                <fa-icon [icon]="faPencilAlt" />
                                <span class="hidden md:inline" jhiTranslate="entity.action.edit"></span>
                            </p-button>
                            <button
                                jhiDeleteButton
                                id="delete-presentation-assessment-{{ presentationAssessment.id }}"
                                [entityTitle]="presentationAssessment.title || ''"
                                deleteQuestion="artemisApp.presentationAssessment.delete.question"
                                deleteConfirmationText="artemisApp.presentationAssessment.delete.typeNameToConfirm"
                                (delete)="deletePresentationAssessment(presentationAssessment)"
                                [dialogError]="dialogError$"
                            >
                                <fa-icon [icon]="faTrash" />
                            </button>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    } @else {
        <p-message severity="secondary" data-testid="presentation-assessments-empty-message">
            <span jhiTranslate="artemisApp.presentationAssessment.noExisting"></span>
        </p-message>
    }
</div>
