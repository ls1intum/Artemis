@if (hyperionEnabled && (isOpen() || externalReasoning() !== undefined) && !isRefinementPanelCollapsed()) {
    <div class="bg-(--overview-card-bg) px-6 pb-6" data-testid="quiz-ai-refinement-panel">
        @if (refinementExplanation() !== undefined || externalReasoning() !== undefined) {
            <div class="mb-3 rounded-md border border-border bg-surface-raised px-4 py-3.5" data-testid="refinement-explanation-card">
                <div class="mb-2 flex items-center gap-2">
                    <fa-icon [icon]="faWandMagicSparkles" class="text-sm text-primary" />
                    <span class="text-xs font-bold tracking-wide text-primary uppercase" jhiTranslate="artemisApp.quizExercise.aiGeneration.refinement.changesLabel"></span>
                    <div class="ms-auto flex gap-0.5">
                        @if (restorable()) {
                            <button
                                tumAetUiButton
                                type="button"
                                severity="secondary"
                                variant="text"
                                size="small"
                                class="size-6 rounded-full! p-0!"
                                data-testid="refinement-restore-button"
                                (click)="restorePreviousQuestion()"
                                [attr.aria-label]="'artemisApp.quizExercise.aiGeneration.refinement.restoreChanges' | artemisTranslate"
                                [tumAetUiTooltip]="'artemisApp.quizExercise.aiGeneration.refinement.restoreChanges' | artemisTranslate"
                            >
                                <fa-icon [icon]="faRotateLeft" />
                            </button>
                        }
                        <button
                            tumAetUiButton
                            type="button"
                            severity="secondary"
                            variant="text"
                            size="small"
                            class="size-6 rounded-full! p-0!"
                            data-testid="refinement-dismiss-button"
                            (click)="dismissReasoning()"
                            [attr.aria-label]="'artemisApp.quizExercise.aiGeneration.refinement.dismissChanges' | artemisTranslate"
                            [tumAetUiTooltip]="'artemisApp.quizExercise.aiGeneration.refinement.dismissChanges' | artemisTranslate"
                        >
                            <fa-icon [icon]="faCloseMark" />
                        </button>
                    </div>
                </div>
                <p class="m-0" data-testid="refinement-explanation-text">{{ refinementExplanation() ?? externalReasoning() }}</p>
            </div>
        }
        @if (isOpen()) {
            <div class="flex items-start gap-2.5">
                <textarea
                    tumAetUiInput
                    [attr.aria-label]="promptPlaceholder()"
                    class="h-11 flex-1"
                    data-testid="refinement-textarea"
                    [placeholder]="promptPlaceholder()"
                    maxlength="2000"
                    [ngModel]="refinePrompt()"
                    (ngModelChange)="refinePrompt.set($event)"
                    [disabled]="isRefining()"
                    (keydown.enter)="onEnterKey($event)"
                ></textarea>
                <button
                    tumAetUiButton
                    type="button"
                    class="size-11 shrink-0 p-0!"
                    data-testid="refinement-submit-button"
                    [disabled]="!refinePrompt().trim() || isRefining()"
                    (click)="submitRefinement()"
                >
                    @if (isRefining()) {
                        <fa-icon [icon]="faCircleNotch" animation="spin" />
                    } @else {
                        <fa-icon [icon]="faPaperPlane" />
                    }
                </button>
            </div>
        }
    </div>
}
