<div class="flex min-w-0 flex-col gap-3" data-testid="hyperion-repository-preview">
    <p class="m-0 text-sm text-muted-color" jhiTranslate="artemisApp.hyperion.generation.artifacts.review.currentContent"></p>
    @if (canCompare()) {
        <div class="flex flex-wrap items-center gap-3">
            <button
                tumUiButton
                severity="secondary"
                variant="outlined"
                size="small"
                [attr.aria-pressed]="compare()"
                (click)="compare.set(!compare())"
                data-testid="hyperion-compare-student-work"
            >
                <span jhiTranslate="artemisApp.hyperion.generation.artifacts.review.compare"></span>
            </button>
            <span class="text-sm text-muted-color" jhiTranslate="artemisApp.hyperion.generation.artifacts.review.compareHint"></span>
        </div>
    }
    @let view = preview();
    @switch (view.kind) {
        @case ('file') {
            <jhi-hyperion-file-content [file]="file()" [state]="view.state" [editorLink]="editorLink()" (retryRequested)="retryRead()" />
        }
        @case ('missing') {
            <jhi-hyperion-empty titleKey="artemisApp.hyperion.generation.artifacts.review.missing" descriptionKey="artemisApp.hyperion.generation.artifacts.review.missingHint" />
        }
        @case ('comparison') {
            <p class="m-0 text-sm" jhiTranslate="artemisApp.hyperion.generation.artifacts.review.direction"></p>
            @if (view.templateMissing) {
                <p class="m-0 text-sm text-muted-color" jhiTranslate="artemisApp.hyperion.generation.artifacts.review.templateMissing"></p>
            }
            @if (view.solutionMissing) {
                <p class="m-0 text-sm text-muted-color" jhiTranslate="artemisApp.hyperion.generation.artifacts.review.solutionMissing"></p>
            }
            <jhi-git-diff-file [diffInformation]="view.diff" [allowSplitView]="false" />
        }
    }
</div>
