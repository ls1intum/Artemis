<div class="mb-4!">
    <tumaet-ui-select
        [ariaLabel]="'accessibility.theiaImage' | artemisTranslate"
        #select="ngModel"
        required
        class="w-full"
        [options]="theiaImageOptions()"
        optionLabel="label"
        optionValue="value"
        [emptyMessage]="'artemisApp.programmingExercise.theiaImage.noImageAvailable' | artemisTranslate"
        [placeholder]="theiaImageOptions().length ? undefined : ('artemisApp.programmingExercise.theiaImage.noImageAvailable' | artemisTranslate)"
        [ngModel]="programmingExercise().buildConfig?.theiaImage"
        (ngModelChange)="onTheiaImageChange($event)"
        name="theiaImage"
        inputId="field_theiaImage"
    />
</div>
<div class="mb-4!">
    <label class="label-narrow" for="field_onlineIdeExperienceLevel" jhiTranslate="artemisApp.programmingExercise.onlineIdeExperienceLevel.title"></label>
    <jhi-help-icon placement="auto" text="artemisApp.programmingExercise.onlineIdeExperienceLevel.description" />
    <tumaet-ui-select
        class="w-full"
        [options]="experienceLevelOptions()"
        [placeholder]="experienceLevelOptions()[0].label"
        optionLabel="label"
        optionValue="value"
        [ngModel]="programmingExercise().buildConfig?.onlineIdeExperienceLevel"
        (ngModelChange)="onExperienceLevelChange($event)"
        name="onlineIdeExperienceLevel"
        inputId="field_onlineIdeExperienceLevel"
        data-testid="online-ide-experience-level"
    />
</div>
