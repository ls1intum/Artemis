<tumaet-ui-dialog [visible]="true" (visibleChange)="onVisibleChange($event)" size="medium" [header]="TRANSLATION_BASE + '.modalTitle' | artemisTranslate">
    <fieldset class="mb-4!">
        <legend class="mb-2 text-base!" [jhiTranslate]="TRANSLATION_BASE + '.task'"></legend>
        <div class="grid grid-cols-3 gap-x-4 gap-y-1">
            @for (task of taskArray(); track task) {
                <div class="flex items-start gap-2">
                    <tumaet-ui-checkbox [inputId]="'task-' + task" [checked]="filters.tasks.includes(task.toString())" (changed)="onFilterToggle($event.checked, 'tasks', task)" />
                    <label class="mb-0 wrap-break-word" [for]="'task-' + task">{{ task }}</label>
                </div>
            }
        </div>
    </fieldset>
    <fieldset class="mb-4!">
        <legend class="mb-2 text-base!" [jhiTranslate]="TRANSLATION_BASE + '.testcase'"></legend>
        <div class="grid grid-cols-3 gap-x-4 gap-y-1">
            @for (testCase of testCaseNames(); track testCase) {
                <div class="flex min-w-0 items-start gap-2">
                    <tumaet-ui-checkbox
                        [inputId]="'testCase-' + testCase"
                        [checked]="filters.testCases.includes(testCase)"
                        (changed)="onFilterToggle($event.checked, 'testCases', testCase)"
                    />
                    <label class="mb-0 min-w-0 wrap-break-word" [for]="'testCase-' + testCase">{{ testCase }}</label>
                </div>
            }
        </div>
    </fieldset>
    <fieldset class="mb-4!">
        <legend class="mb-2 text-base!" [jhiTranslate]="TRANSLATION_BASE + '.errorCategory'"></legend>
        <div class="grid grid-cols-3 gap-x-4 gap-y-1">
            @for (errorCategory of errorCategories(); track errorCategory) {
                <div class="flex items-start gap-2">
                    <tumaet-ui-checkbox
                        [inputId]="'errorCategory-' + errorCategory"
                        [checked]="filters.errorCategories.includes(errorCategory)"
                        (changed)="onFilterToggle($event.checked, 'errorCategories', errorCategory)"
                    />
                    <label class="mb-0" [for]="'errorCategory-' + errorCategory">{{ errorCategory }}</label>
                </div>
            }
        </div>
    </fieldset>
    <span class="mb-2 inline-block" [jhiTranslate]="TRANSLATION_BASE + '.occurrence'"></span>
    <jhi-range-slider [generalMinValue]="minCount()" [generalMaxValue]="maxCount()" [(selectedMinValue)]="filters.occurrence[0]" [(selectedMaxValue)]="filters.occurrence[1]" />
    <ng-template #footer>
        <button type="button" tumAetUiButton severity="secondary" variant="outlined" class="me-auto" (click)="clearFilter()" [jhiTranslate]="TRANSLATION_BASE + '.clear'"></button>
        <button type="button" tumAetUiButton severity="secondary" (click)="closeModal()" [jhiTranslate]="TRANSLATION_BASE + '.cancel'"></button>
        <button type="submit" tumAetUiButton (click)="applyFilter()" [jhiTranslate]="TRANSLATION_BASE + '.apply'"></button>
    </ng-template>
</tumaet-ui-dialog>
