<tumaet-ui-dialog [visible]="true" (visibleChange)="onVisibleChange($event)" size="small" [header]="TRANSLATION_BASE + '.header' | artemisTranslate">
    <p [jhiTranslate]="TRANSLATION_BASE + '.confirmationMessage'" [translateValues]="{ count: affectedStudentsCount() }"></p>
    <ng-template #footer>
        <button type="button" tumAetUiButton severity="secondary" (click)="dismiss()" [jhiTranslate]="TRANSLATION_BASE + '.cancel'"></button>
        <button type="button" tumAetUiButton (click)="confirm()" [jhiTranslate]="TRANSLATION_BASE + '.confirm'"></button>
    </ng-template>
</tumaet-ui-dialog>
