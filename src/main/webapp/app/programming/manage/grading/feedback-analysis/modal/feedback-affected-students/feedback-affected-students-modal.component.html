<div class="modal-header">
    <h4 class="modal-title" [jhiTranslate]="TRANSLATION_BASE + '.header'"></h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
    <div>
        <span [jhiTranslate]="TRANSLATION_BASE + '.description'" [translateValues]="{ count: feedbackDetail().count }"></span>
    </div>
    @if (isLoading()) {
        <div class="row justify-content-center p-2">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden" jhiTranslate="loading"></span>
            </div>
        </div>
    } @else {
        <table class="table table-striped mb-3">
            <thead>
                <tr>
                    <th scope="col" class="col-4" [jhiTranslate]="TRANSLATION_BASE + '.name'"></th>
                    <th scope="col" class="col-4" [jhiTranslate]="TRANSLATION_BASE + '.login'"></th>
                    <th scope="col" class="col-2" [jhiTranslate]="TRANSLATION_BASE + '.repository'"></th>
                </tr>
            </thead>
            <tbody class="table-group-divider">
                @for (item of participation(); track item) {
                    <tr>
                        <td>{{ item.firstName }} {{ item.lastName }}</td>
                        <td>{{ item.login }}</td>
                        <td>
                            <jhi-code-button
                                class="ms-2"
                                [smallButtons]="true"
                                [exerciseId]="exerciseId()"
                                [participationId]="item.participationId"
                                [repositoryUri]="item.repositoryURI"
                                [routerLinkForRepositoryView]="['/courses', courseId(), 'exercises', exerciseId(), 'repository', item.participationId]"
                            />
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    }
</div>
