<tumaet-ui-dialog dismissableMask [visible]="true" (visibleChange)="onVisibleChange($event)" size="medium" [header]="TRANSLATION_BASE + '.header' | artemisTranslate">
    <div>
        <span [jhiTranslate]="TRANSLATION_BASE + '.description'" [translateValues]="{ count: feedbackDetail().count }"></span>
    </div>
    @if (isLoading()) {
        <div class="flex justify-center p-2">
            <tumaet-ui-progress-spinner [ariaLabel]="'loading' | artemisTranslate" />
        </div>
    } @else {
        <tumaet-ui-table-layout class="mt-4 [--table-layout-offset:20rem] max-md:[--table-layout-offset:28rem]" [empty]="participation().length === 0">
            <table tumAetUiTable size="small" striped>
                <thead>
                    <tr>
                        <th scope="col" [jhiTranslate]="TRANSLATION_BASE + '.name'"></th>
                        <th scope="col" [jhiTranslate]="TRANSLATION_BASE + '.login'"></th>
                        <th scope="col" [jhiTranslate]="TRANSLATION_BASE + '.repository'"></th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of participation(); track item) {
                        <tr>
                            <td>{{ item.firstName }} {{ item.lastName }}</td>
                            <td>{{ item.login }}</td>
                            <td>
                                <jhi-code-button
                                    class="ms-2"
                                    size="small"
                                    [allowOnlineIde]="false"
                                    [exerciseId]="exerciseId()"
                                    [repositoryUri]="item.repositoryURI"
                                    [repositoryViewLink]="['/courses', courseId(), 'exercises', exerciseId(), 'repository', item.participationId]"
                                    [vcsAccessTokenSourceInfo]="{
                                        returnedTokenType: 'repository-token',
                                        repositoryType: RepositoryType.USER,
                                        participationId: item.participationId,
                                    }"
                                />
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </tumaet-ui-table-layout>
    }
</tumaet-ui-dialog>
