<div [class]="secondary() ? 'editor-panel-second-header flex justify-between' : 'flex justify-between editor-panel-header code-editor-panel-header'">
    <h3 class="mt-1! editor-panel-title">
        <fa-icon [icon]="farFileAlt" />
        <span> &nbsp;{{ fileName() }}</span>
        @if (isLoading()) {
            <fa-icon [icon]="faCircleNotch" animation="spin" class="ms-2" title="{{ 'artemisApp.editor.loadingFile' | artemisTranslate }}" />
        }
    </h3>
    @if (showTabSizeSelector()) {
        <div class="ms-2">
            <button tumAetUiButton size="small" type="button" id="dropdownCodeEditorSettings" aria-label="Code Editor Settings" [tumAetUiPopoverTrigger]="settingsPopover">
                <fa-icon [icon]="faGear" />
            </button>
            <tumaet-ui-popover #settingsPopover placement="bottom" alignment="end" ariaLabel="Code Editor Settings">
                <div class="flex items-center gap-2">
                    <label for="codeEditorTabSize" class="mb-0" jhiTranslate="artemisApp.editor.tabSize"></label>
                    <input
                        id="codeEditorTabSize"
                        [attr.aria-label]="'artemisApp.editor.tabSize' | artemisTranslate"
                        tumAetUiInput
                        tumAetUiInputId="codeEditorTabSize"
                        tumAetUiInputSize="small"
                        class="w-16"
                        type="number"
                        min="1"
                        [max]="MAX_TAB_SIZE"
                        step="1"
                        [(ngModel)]="tabSize"
                        (change)="validateTabSize()"
                    />
                </div>
            </tumaet-ui-popover>
        </div>
    }
</div>
