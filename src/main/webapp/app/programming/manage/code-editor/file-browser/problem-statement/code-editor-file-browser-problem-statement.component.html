<!-- Problem Statement -->
<div
    (click)="onNodeSelect.emit(item())"
    class="file-tree-item file-item problem-statement-entry"
    [class.node-selected]="item().checked"
    id="file-browser-problem-statement"
    [attr.aria-pressed]="item().checked"
    #keyboardAction2
    role="button"
    tabindex="0"
    (keydown.enter)="$event.target === $event.currentTarget ? keyboardAction2.click() : undefined"
    (keydown.space)="$event.target === $event.currentTarget ? $event.preventDefault() : undefined"
    (keyup.space)="$event.target === $event.currentTarget ? keyboardAction2.click() : undefined"
>
    <fa-icon aria-hidden="true" [icon]="faListAlt" [fixedWidth]="true" class="problem-statement-icon" />
    <span class="file-label-group">
        <span class="ms-1 file-tree-item__fileName problem-statement-text" jhiTranslate="artemisApp.exercise.problemStatement" [class.text-white!]="item().checked"></span>
        @for (badge of badges(); track badges().indexOf(badge)) {
            <jhi-file-browser-badge [badge]="badge" [onColoredBackground]="item().checked" />
        }
    </span>
</div>
