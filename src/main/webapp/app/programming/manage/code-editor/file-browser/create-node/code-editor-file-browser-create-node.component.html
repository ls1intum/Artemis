<div class="file-tree-item" data-testid="file-browser-create-node">
    <fa-icon aria-hidden="true" [icon]="createFileType() === FileType.FILE ? faFile : faFolder" [fixedWidth]="true" />
    <span class="ms-1"
        ><input
            [attr.aria-label]="'accessibility.createFileOrFolder' | artemisTranslate"
            #creatingInput
            value=""
            (keyup.enter)="createFile($event)"
            (focusout)="createFile($event)"
            (keyup.esc)="onClearCreatingFile.emit($event)"
            class="file-tree-item__input"
    /></span>
</div>
