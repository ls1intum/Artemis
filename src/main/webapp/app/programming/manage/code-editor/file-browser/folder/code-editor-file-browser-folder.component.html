<!--Folder-->
<li class="list-group-item list-group-item--folder" id="file-browser-folder">
    <button
        type="button"
        (click)="onCollapseExpand()()"
        [attr.aria-label]="item().text"
        [attr.aria-expanded]="!item().collapsed"
        class="flex min-w-0 items-center border-0 bg-transparent p-0 text-start text-inherit focus-visible:outline-2 focus-visible:outline-offset-2"
        [class.flex-1]="!isBeingRenamed()"
    >
        <fa-icon aria-hidden="true" [icon]="item().collapsed ? faChevronRight : faChevronDown" [fixedWidth]="true" class="me-1" size="xs" />
        <fa-icon aria-hidden="true" [icon]="item().collapsed ? faFolder : faFolderOpen" [fixedWidth]="true" />
        @if (!isBeingRenamed()) {
            <span class="file-label-group">
                <span class="ms-1 list-group-item__fileName">{{ item().text }}</span>
                @for (badge of badges(); track badges().indexOf(badge)) {
                    <jhi-file-browser-badge [badge]="badge" />
                }
            </span>
        }
    </button>
    <!-- Renaming folder tree item -->
    @if (isBeingRenamed()) {
        <span class="file-label-group">
            <span class="ms-1 rename-input-wrapper"
                ><input
                    #renamingInput
                    value="{{ item().text }}"
                    (keyup.enter)="renameNode($event)"
                    (focusout)="renameNode($event)"
                    (keyup.esc)="clearRenamingNode($event)"
                    class="list-group-item__input"
            /></span>
        </span>
    }
    <!-- Folder level actions -->
    @if (!disableActions()) {
        <span class="file-icons">
            <button type="button" (click)="setCreatingNodeInFolder($event, FileType.FILE)" class="btn btn-small">
                <fa-icon data-testid="file-browser-folder-create-file" [icon]="faFile" title="{{ 'artemisApp.editor.fileBrowser.createFile' | artemisTranslate }}" />
            </button>
            <button type="button" (click)="setCreatingNodeInFolder($event, FileType.FOLDER)" class="btn btn-small">
                <fa-icon [icon]="faFolder" title="{{ 'artemisApp.editor.fileBrowser.createFolder' | artemisTranslate }}" />
            </button>
            <button type="button" [disabled]="isCompressed() && item().value.includes('/')" (click)="setRenamingNode($event)" class="btn btn-small">
                <fa-icon
                    [icon]="faEdit"
                    title="{{
                        (isCompressed() && item().value.includes('/') ? 'artemisApp.editor.fileBrowser.renameFolderDisabledTooltip' : 'artemisApp.editor.fileBrowser.renameFolder')
                            | artemisTranslate
                    }}"
                />
            </button>
            <button type="button" (click)="deleteNode($event)" class="btn btn-small">
                <fa-icon [icon]="faTrash" title="{{ 'artemisApp.editor.fileBrowser.deleteFolder' | artemisTranslate }}" />
            </button>
        </span>
    }
</li>
