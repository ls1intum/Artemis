<tumaet-ui-dialog
    [(visible)]="visible"
    size="large"
    [header]="(fileType() === FileType.FOLDER ? 'artemisApp.editor.fileBrowser.deleteFolderTitle' : 'artemisApp.editor.fileBrowser.deleteFileTitle') | artemisTranslate"
>
    @if (fileType() === FileType.FILE) {
        <p class="text-state-danger" [innerHtml]="'artemisApp.editor.fileBrowser.deleteFileConfirm' | artemisTranslate: { filename: fileNameToDelete() }"></p>
    }
    @if (fileType() === FileType.FOLDER) {
        <p class="text-state-danger" [innerHtml]="'artemisApp.editor.fileBrowser.deleteFolderConfirm' | artemisTranslate: { filename: fileNameToDelete() }"></p>
    }
    <ng-template #footer>
        <button type="button" tumAetUiButton severity="secondary" (click)="closeModal()">
            <fa-icon [icon]="faBan" />
            <span jhiTranslate="entity.action.cancel"></span>
        </button>
        <button type="button" tumAetUiButton severity="danger" [disabled]="isLoading()" (click)="deleteFile()">
            <fa-icon data-testid="delete-file" [icon]="faTrashAlt" />
            <span jhiTranslate="artemisApp.editor.fileBrowser.delete"></span>
        </button>
    </ng-template>
</tumaet-ui-dialog>
