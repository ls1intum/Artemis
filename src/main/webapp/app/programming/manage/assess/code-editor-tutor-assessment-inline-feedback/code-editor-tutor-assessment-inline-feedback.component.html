@let feedback = currentFeedback();
<jhi-unified-feedback
    class="unified-feedback-inline-editor"
    [assessmentLayout]="true"
    (applyInstruction)="applyArmedInstruction()"
    [editable]="!viewOnly()"
    [readOnly]="readOnly()"
    [feedback]="feedback"
    [title]="displayTitle()"
    [showTitle]="Feedback.isFeedbackSuggestion(feedback) || !!displayTitle()"
    [titleEditable]="Feedback.isFeedbackSuggestion(feedback)"
    [feedbackContent]="buildFeedbackTextForCodeEditor(feedback)"
    [points]="feedback.credits ?? 0"
    [scoreAccuracy]="course()?.accuracyOfScores"
    [showReference]="false"
    [highlightDifferences]="highlightDifferences()"
    [(feedbackTitle)]="feedback.text"
    [(feedbackDetail)]="feedback.detailText"
    [(feedbackCredits)]="feedback.credits!"
    (feedbackTitleChange)="onFieldChanged()"
    (feedbackDetailChange)="onFieldChanged()"
    (feedbackCreditsChange)="onFieldChanged()"
    (instructionUnlinked)="onFieldChanged()"
    (onDelete)="removeFeedback()"
    (drop)="updateFeedbackOnDrop($event)"
    (dragover)="$event.preventDefault()"
    (keydown)="handleKeydown($event)"
    (input)="inputEdited.set(true)"
>
    <ng-container ngProjectAs="[unifiedFeedbackViewControls]">
        @if (viewOnly() && !readOnly()) {
            <button tumAetUiButton size="small" variant="text" severity="warn" type="button" data-testid="feedback-edit" (click)="editFeedback(codeLine())">
                <fa-icon [icon]="faPencilAlt" /><span jhiTranslate="entity.action.edit"></span>
            </button>
        }
    </ng-container>
    <ng-container ngProjectAs="[unifiedFeedbackFooter]">
        @if (!readOnly() && !viewOnly()) {
            <div class="inline-feedback-actions">
                <button tumAetUiButton size="small" variant="outlined" severity="secondary" type="button" data-testid="feedback-cancel" (click)="cancelFeedback()">
                    <fa-icon [icon]="faBan" /><span jhiTranslate="entity.action.cancel"></span>
                </button>
                <button tumAetUiButton size="small" type="button" data-testid="feedback-save" [disabled]="!saveEnabled()" (click)="updateFeedback()">
                    <fa-icon [icon]="faSave" /><span jhiTranslate="entity.action.save"></span>
                </button>
            </div>
        }
    </ng-container>
</jhi-unified-feedback>
