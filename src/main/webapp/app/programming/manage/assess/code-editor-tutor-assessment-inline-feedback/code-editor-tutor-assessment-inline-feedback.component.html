@let feedback = currentFeedback();
<div
    id="code-editor-inline-feedback-{{ codeLine() }}"
    class="alert p-0 mb-0 border rounded"
    [style.max-width.%]="95"
    [class.alert-success]="feedback.credits! > 0 && feedback.isSubsequent === undefined"
    [class.alert-danger]="feedback.credits! < 0 && feedback.isSubsequent === undefined"
    [class.alert-warning]="!feedback.credits && feedback.isSubsequent === undefined && !Feedback.isNonGradedFeedbackSuggestion(feedback)"
    [class.alert-info]="Feedback.isNonGradedFeedbackSuggestion(feedback)"
    [class.alert-secondary]="readOnly() && feedback.isSubsequent"
>
    @if (!viewOnly()) {
        <jhi-unified-feedback
            [editable]="true"
            [readOnly]="readOnly()"
            [feedback]="feedback"
            [titleEditable]="Feedback.isFeedbackSuggestion(feedback)"
            [showReference]="false"
            [highlightDifferences]="highlightDifferences()"
            [(feedbackTitle)]="feedback.text"
            [(feedbackDetail)]="feedback.detailText"
            [(feedbackCredits)]="feedback.credits!"
            (onDelete)="cancelFeedback()"
            (drop)="updateFeedbackOnDrop($event)"
            (dragover)="$event.preventDefault()"
            (keydown)="handleKeydown($event)"
        >
            <div unifiedFeedbackExtraControls class="inline-feedback-actions">
                @if (feedback.type === MANUAL) {
                    <button
                        jhiDeleteButton
                        [buttonSize]="ButtonSize.MEDIUM"
                        [translateValues]="{ text: feedback | feedbackContent | quoted: ' ' }"
                        deleteQuestion="artemisApp.feedback.delete.question"
                        type="submit"
                        (delete)="deleteFeedback()"
                        [dialogError]="dialogError$"
                        class="btn btn-danger btn-sm me-1"
                    >
                        <fa-icon [icon]="faTrashAlt" />
                    </button>
                }
                <button data-testid="feedback-save" type="submit" [disabled]="feedback.credits === undefined" class="btn btn-primary btn-sm" (click)="updateFeedback()">
                    <fa-icon [icon]="faSave" />&nbsp;<span jhiTranslate="entity.action.save"></span>
                </button>
            </div>
        </jhi-unified-feedback>
    } @else {
        <div class="d-flex flex-nowrap align-items-start gap-1 p-1">
            <div class="flex-grow-1 flex-shrink-1">
                <jhi-unified-feedback
                    [feedbackContent]="buildFeedbackTextForCodeEditor(feedback)"
                    [points]="feedback.credits || 0"
                    [feedback]="feedback"
                    [showReference]="false"
                    [scoreAccuracy]="course()?.accuracyOfScores"
                />
            </div>
            @if (!readOnly()) {
                <button type="submit" (click)="editFeedback(codeLine())" class="btn btn-primary btn-sm">
                    <fa-icon [icon]="faPencilAlt" />
                    <span jhiTranslate="entity.action.edit"></span>
                </button>
            }
            @if (readOnly() && feedback.isSubsequent) {
                <fa-icon class="text-secondary mt-1" [icon]="faExclamationTriangle" [ngbTooltip]="'artemisApp.assessment.subsequentFeedback' | artemisTranslate" />
            }
        </div>
    }
</div>
