<div class="border border-(--border-color) rounded-lg">
    @for (phase of phases(); track $index) {
        <jhi-build-phase
            [phase]="phase"
            [index]="$index"
            [phaseNames]="phaseNames()"
            [isLast]="$index === phaseCount() - 1"
            [readonly]="readonly()"
            [isExamMode]="isExamMode()"
            (phaseChange)="updatePhase($index, $event)"
            (delete)="deletePhase($index)"
            (moveUp)="moveUp($index)"
            (moveDown)="moveDown($index)"
        />
    }

    <button type="button" id="add-phase-button" class="m-1" tumAetUiButton variant="text" size="small" severity="secondary" [hidden]="readonly()" (click)="addPhase()">
        <fa-icon [icon]="faPlus" />
        <span jhiTranslate="artemisApp.programmingExercise.buildPhasesEditor.addPhase"></span>
    </button>
</div>
