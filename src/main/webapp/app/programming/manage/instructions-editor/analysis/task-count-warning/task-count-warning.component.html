@if (numOfTasks() > advisedMaxNumOfTasks()) {
    <div id="instruction_analysis_num-of-tasks-issues" class="editable-instruction-container__status__item">
        <fa-icon [icon]="faExclamationTriangle" class="text-state-warning me-1" [tumAetUiTooltip]="tasksTooltipContent" />
        <span class="text-state-info" jhiTranslate="artemisApp.programmingExercise.tasksAnalysis.issues"></span>
    </div>
} @else {
    <div id="instruction_analysis_num-of-tasks-ok" class="editable-instruction-container__status__item">
        <fa-icon [icon]="faCheckCircle" class="text-state-success me-1" />
        <span class="text-state-info" jhiTranslate="artemisApp.programmingExercise.tasksAnalysis.ok"></span>
    </div>
}
<ng-template #tasksTooltipContent>
    <div class="text-start w-full">
        @if (numOfTasks() > advisedMaxNumOfTasks()) {
            <div class="text-start">
                <span jhiTranslate="artemisApp.programmingExercise.tasksAnalysis.numOfTasks" [translateValues]="{ number: numOfTasks(), limit: advisedMaxNumOfTasks() }"></span>
            </div>
        }
    </div>
</ng-template>
