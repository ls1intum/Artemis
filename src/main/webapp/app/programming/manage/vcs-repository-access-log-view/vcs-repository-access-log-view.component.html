<div *titleBarTitle>
    <h5 class="m-0" jhiTranslate="artemisApp.repository.vcsAccessLog.title"></h5>
</div>

<jhi-table-view [cols]="columns()" [vals]="rows()" [loading]="loading()" [options]="tableOptions" />

<ng-template #timestampTemplate let-cell>
    <span class="whitespace-nowrap">{{ cell.data.timestamp | artemisDate: 'long' : true }}</span>
</ng-template>

<ng-template #commitHashTemplate let-cell>
    <span class="select-all whitespace-nowrap font-mono text-sm">{{ cell.data.commitHash }}</span>
</ng-template>
