<div class="my-2 ps-1 file-path-with-badge">
    {{ diffInformation().title }}
    @if (diffInformation().fileStatus !== FileStatus.UNCHANGED) {
        <tumaet-ui-tag class="file-status-tag" data-testid="file-status-tag" [severity]="statusSeverity()" [attr.data-severity]="statusSeverity()">
            <span [jhiTranslate]="'artemisApp.programmingExercise.diffReport.fileChange.' + diffInformation().fileStatus"></span>
        </tumaet-ui-tag>
    }
</div>
