<div
    class="editor-wrapper"
    #editorWrapper
    [class.assessment-wrapper]="isTutorAssessment()"
    [class.assessment-workspace]="assessmentWorkspace()"
    [class.editor-wrapper--fill]="fillLayout()"
    [class.editor-wrapper--bottom-collapsed]="buildOutputIsCollapsed()"
>
    <!-- Top bar -->
    <nav class="editor-statusbar" [hidden]="!showEditorNavbar()">
        <ng-content select="[editorNavbar]" />
    </nav>
    <!-- The three columns, each declared once and put into the two splitters that hold them: one for the file browser and the editor,
         and one that sets that area beside the instructions. In an assessment the bottom panel lies in that area, under the file browser
         and the editor only. -->
    <ng-template #fileBrowserPanel>
        <div #fileBrowser class="editor-sidebar-left collapsable" data-testid="editor-sidebar-left">
            <ng-content select="[editorSidebarLeft]" />
        </div>
    </ng-template>
    <ng-template #centerPanel>
        <div class="editor-center">
            <ng-content select="[editorCenter]" />
        </div>
    </ng-template>
    <ng-template #instructionsPanel>
        <div #instructions class="editor-sidebar-right collapsable" data-testid="editor-sidebar-right">
            <!-- The column of an assessment is only its rail while it is collapsed -->
            @if (assessmentWorkspace() && rightPanelIsCollapsed()) {
                <jhi-collapsed-panel-rail
                    [items]="instructionsRailItems() ?? defaultInstructionsRailItems"
                    (itemSelected)="instructionsRailItemSelected.emit($event)"
                    testId="collapsed-assessment-sidebar"
                    (expand)="toggleCollapse({ event: $event, horizontal: true }, CollapsableCodeEditorElement.Instructions)"
                />
            }
            <ng-content select="[editorSidebarRight]" />
        </div>
    </ng-template>
    <!-- A collapsed file browser keeps just its rail and the line beside it is not there to drag; the kit's splitter collapses only its
         second panel, so the stylesheet does that for the first. -->
    <ng-template #fileBrowserAndEditor>
        <tumaet-ui-splitter
            class="editor-sidebars editor-sidebars--inner"
            [class.editor-sidebars--left-collapsed]="fileBrowserIsCollapsed()"
            [panelSizes]="innerSizes()"
            [minSizes]="innerMinSizes"
            (resizeEnd)="onInnerResizeEnd($event)"
        >
            <ng-template #panel><ng-container [ngTemplateOutlet]="fileBrowserPanel" /></ng-template>
            <ng-template #panel><ng-container [ngTemplateOutlet]="centerPanel" /></ng-template>
        </tumaet-ui-splitter>
    </ng-template>
    <!-- Collapsed, the instructions keep just their rail, and without instructions their panel takes no room. -->
    <ng-template #columns>
        <tumaet-ui-splitter
            class="editor-sidebars editor-sidebars--outer"
            [class.editor-sidebars--right-collapsed]="rightPanelIsCollapsed()"
            [panelSizes]="outerSizes()"
            [minSizes]="outerMinSizes"
            [collapsedSecondSize]="!showEditorSidebarRight() ? '0px' : rightPanelIsCollapsed() ? '3rem' : undefined"
            (resizeEnd)="onOuterResizeEnd($event)"
        >
            <ng-template #panel>
                @if (assessmentWorkspace()) {
                    <jhi-feedback-split
                        class="editor-split"
                        storageKey="code-editor-assessment-main-bottom-split"
                        [bottomTemplate]="bottomArea"
                        [expanded]="!buildOutputIsCollapsed()"
                        [minSizes]="[30, 8]"
                        [collapseSnapPercent]="15"
                        (collapseRequested)="collapseBuildOutput()"
                        (resizeEnd)="onPanelResized(ResizeType.MAIN_BOTTOM)"
                    >
                        <div feedbackSplitTop class="editor-split__top"><ng-container [ngTemplateOutlet]="fileBrowserAndEditor" /></div>
                    </jhi-feedback-split>
                } @else {
                    <ng-container [ngTemplateOutlet]="fileBrowserAndEditor" />
                }
            </ng-template>
            <ng-template #panel><ng-container [ngTemplateOutlet]="instructionsPanel" /></ng-template>
        </tumaet-ui-splitter>
    </ng-template>
    <!-- The editor and the bottom area are rendered in one of two places: a filling grid divides them with a splitter, as the
         assessment pages do; any other grid stacks them and gives the editor a grip to drag. -->
    <ng-template #mainArea>
        <div
            class="editor-main"
            jhiResizable
            [resizableEdges]="fillLayout() ? {} : { bottom: '.rg-main-bottom' }"
            [resizableConstraints]="{ minHeight: resizableMinHeightMain, maxHeight: maxConstraints().heightMain }"
            (resizeEnd)="onPanelResized(ResizeType.MAIN_BOTTOM)"
        >
            <div class="editor-main__content">
                <ng-container [ngTemplateOutlet]="columns" />
            </div>
            @if (!fillLayout()) {
                <div class="rg-main-bottom" data-testid="draggableIconForMain"></div>
            }
        </div>
    </ng-template>
    <ng-template #bottomArea>
        <div
            #buildOutput
            class="editor-bottom collapsable"
            jhiResizable
            [resizableEdges]="fillLayout() ? {} : { bottom: '.rg-bottom-bottom' }"
            [resizableConstraints]="{ minHeight: resizableMinHeightBottom, maxHeight: maxConstraints().heightBottom }"
            [resizableEnabled]="bottomResizable() && !buildOutputIsCollapsed() && !fillLayout()"
            (resizeEnd)="onPanelResized(ResizeType.BOTTOM)"
        >
            <ng-content select="[editorBottomArea]" class="editor-bottom-resizable" />
            @if (bottomResizable() && !buildOutputIsCollapsed() && !fillLayout()) {
                <div class="rg-bottom-bottom" data-testid="draggableIconForBuildOutput"></div>
            }
        </div>
    </ng-template>
    @if (assessmentWorkspace()) {
        <!-- An assessment: the area of the file browser and the editor with the bottom panel under it, beside the instructions that run
             the whole height. The columns are styled inside the main area, as everywhere else. -->
        <div class="editor-main">
            <div class="editor-main__content">
                <ng-container [ngTemplateOutlet]="columns" />
            </div>
        </div>
    } @else if (fillHeight()) {
        <jhi-feedback-split
            class="editor-split"
            storageKey="code-editor-main-bottom-split"
            [bottomTemplate]="bottomArea"
            [expanded]="!buildOutputIsCollapsed()"
            [minSizes]="[30, 8]"
            [collapseSnapPercent]="15"
            (collapseRequested)="collapseBuildOutput()"
            (resizeEnd)="onPanelResized(ResizeType.MAIN_BOTTOM)"
        >
            <div feedbackSplitTop class="editor-split__top"><ng-container [ngTemplateOutlet]="mainArea" /></div>
        </jhi-feedback-split>
    } @else {
        <ng-container [ngTemplateOutlet]="mainArea" />
        <ng-container [ngTemplateOutlet]="bottomArea" />
    }
    @if (isTutorAssessment()) {
        <div class="editor-assessment-bottom">
            <ng-content select="[editorBottom]" />
        </div>
    }
</div>
