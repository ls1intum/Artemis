<div class="editor-wrapper" #editorWrapper [class.assessment-wrapper]="isTutorAssessment()">
    <!-- Top bar -->
    <nav class="editor-statusbar" [hidden]="!showEditorNavbar()">
        <ng-content select="[editorNavbar]" />
    </nav>
    <div
        id="code-editor-main"
        class="editor-main"
        jhiResizable
        [resizableEdges]="{ bottom: '.rg-main-bottom' }"
        [resizableConstraints]="{ minHeight: resizableMinHeightMain(), maxHeight: maxConstraints().heightMain }"
        (resizeMove)="onPanelResizeMove(ResizeType.MAIN_BOTTOM, $event)"
        (resizeEnd)="onPanelResized(ResizeType.MAIN_BOTTOM)"
    >
        <div class="editor-main__content">
            <!-- File browser -->
            <div
                id="code-editor-file-browser"
                #fileBrowser
                class="editor-sidebar-left collapsable"
                jhiResizable
                [resizableEdges]="{ right: '.rg-sidebar-left' }"
                [resizableConstraints]="{ minWidth: resizableMinWidthLeft(), maxWidth: maxConstraints().widthLeft }"
                [resizableEnabled]="!fileBrowserIsCollapsed()"
                (resizeMove)="onPanelResizeMove(ResizeType.SIDEBAR_LEFT, $event)"
                (resizeEnd)="onPanelResized(ResizeType.SIDEBAR_LEFT)"
            >
                <ng-content select="[editorSidebarLeft]" />
                @if (!fileBrowserIsCollapsed()) {
                    <span
                        id="draggableIconForFileBrowser"
                        class="rg-sidebar-left"
                        role="separator"
                        tabindex="0"
                        aria-orientation="vertical"
                        aria-controls="code-editor-file-browser"
                        [attr.aria-label]="'artemisApp.editor.resizeFileBrowser' | artemisTranslate"
                        [attr.aria-valuemin]="resizableMinWidthLeft()"
                        [attr.aria-valuemax]="maxConstraints().widthLeft"
                        [attr.aria-valuenow]="panelSizes().widthLeft"
                        (keydown)="onResizeHandleKeydown($event, ResizeType.SIDEBAR_LEFT)"
                    >
                        <fa-icon [icon]="faGripLinesVertical" />
                    </span>
                }
                @if (fileBrowserIsCollapsed()) {
                    <span class="separator"></span>
                }
            </div>
            <!-- Editor -->
            <div class="editor-center">
                <ng-content select="[editorCenter]" />
            </div>
            <!-- Instructions -->
            <div
                id="code-editor-instructions"
                #instructions
                class="editor-sidebar-right collapsable"
                [hidden]="!showEditorSidebarRight()"
                jhiResizable
                [resizableEdges]="{ left: '.rg-sidebar-right' }"
                [resizableConstraints]="{ minWidth: resizableMinWidthRight(), maxWidth: maxConstraints().widthRight }"
                [resizableEnabled]="!rightPanelIsCollapsed()"
                (resizeMove)="onPanelResizeMove(ResizeType.SIDEBAR_RIGHT, $event)"
                (resizeEnd)="onPanelResized(ResizeType.SIDEBAR_RIGHT)"
            >
                @if (!rightPanelIsCollapsed()) {
                    <span
                        id="draggableIconForInstructions"
                        class="rg-sidebar-right"
                        role="separator"
                        tabindex="0"
                        aria-orientation="vertical"
                        aria-controls="code-editor-instructions"
                        [attr.aria-label]="'artemisApp.editor.resizeInstructions' | artemisTranslate"
                        [attr.aria-valuemin]="resizableMinWidthRight()"
                        [attr.aria-valuemax]="maxConstraints().widthRight"
                        [attr.aria-valuenow]="panelSizes().widthRight"
                        (keydown)="onResizeHandleKeydown($event, ResizeType.SIDEBAR_RIGHT)"
                    >
                        <fa-icon [icon]="faGripLinesVertical" />
                    </span>
                }
                @if (rightPanelIsCollapsed()) {
                    <span class="separator"></span>
                }
                <ng-content select="[editorSidebarRight]" />
            </div>
        </div>
        <span
            id="draggableIconForEditorMain"
            class="rg-main-bottom"
            role="separator"
            tabindex="0"
            aria-orientation="horizontal"
            aria-controls="code-editor-main code-editor-bottom"
            [attr.aria-label]="'artemisApp.editor.resizeMainEditor' | artemisTranslate"
            [attr.aria-valuemin]="resizableMinHeightMain()"
            [attr.aria-valuemax]="maxConstraints().heightMain"
            [attr.aria-valuenow]="panelSizes().heightMain"
            (keydown)="onResizeHandleKeydown($event, ResizeType.MAIN_BOTTOM)"
        >
            <fa-icon [icon]="faGripLines" />
        </span>
    </div>
    <!-- Build Output -->
    <div
        #buildOutput
        id="code-editor-bottom"
        class="editor-bottom collapsable"
        jhiResizable
        [resizableEdges]="{ bottom: '.rg-bottom-bottom' }"
        [resizableConstraints]="{ minHeight: resizableMinHeightBottom(), maxHeight: maxConstraints().heightBottom }"
        [resizableEnabled]="!buildOutputIsCollapsed()"
        (resizeMove)="onPanelResizeMove(ResizeType.BOTTOM, $event)"
        (resizeEnd)="onPanelResized(ResizeType.BOTTOM)"
    >
        <ng-content select="[editorBottomArea]" class="editor-bottom-resizable" />
        @if (!buildOutputIsCollapsed()) {
            <span
                id="draggableIconForBuildOutput"
                class="rg-bottom-bottom"
                role="separator"
                tabindex="0"
                aria-orientation="vertical"
                aria-controls="code-editor-bottom"
                [attr.aria-label]="'artemisApp.editor.resizeBottomPanel' | artemisTranslate"
                [attr.aria-valuemin]="resizableMinHeightBottom()"
                [attr.aria-valuemax]="maxConstraints().heightBottom"
                [attr.aria-valuenow]="panelSizes().heightBottom"
                (keydown)="onResizeHandleKeydown($event, ResizeType.BOTTOM)"
            >
                <fa-icon [icon]="faGripLines" />
            </span>
        }
    </div>
    @if (isTutorAssessment()) {
        <div>
            <ng-content select="[editorBottom]" />
        </div>
    }
</div>
