<div
    class="editor-wrapper"
    #editorWrapper
    [class.assessment-wrapper]="isTutorAssessment()"
    [class.assessment-workspace]="assessmentWorkspace()"
    [class.editor-wrapper--fill]="fillHeight()"
    [class.editor-wrapper--bottom-collapsed]="buildOutputIsCollapsed()"
>
    <!-- Top bar -->
    <nav class="editor-statusbar" [hidden]="!showEditorNavbar()">
        <ng-content select="[editorNavbar]" />
    </nav>
    <!-- The editor and the bottom area are rendered in one of two places: a filling grid divides them with a splitter, as the
         assessment pages do; any other grid stacks them and gives the editor a grip to drag. -->
    <ng-template #mainArea>
        <div
            class="editor-main"
            jhiResizable
            [resizableEdges]="fillHeight() ? {} : { bottom: '.rg-main-bottom' }"
            [resizableConstraints]="{ minHeight: resizableMinHeightMain, maxHeight: maxConstraints().heightMain }"
            (resizeEnd)="onPanelResized(ResizeType.MAIN_BOTTOM)"
        >
            <div class="editor-main__content">
                <!-- The file browser, the editor and the instructions are the panels of one splitter, the same as the panels of
                     the assessment pages. A collapsed or hidden side keeps its panel; the styles shrink or hide it. -->
                <p-splitter
                    class="editor-sidebars"
                    [class.editor-sidebars--left-collapsed]="fileBrowserIsCollapsed()"
                    [class.editor-sidebars--right-collapsed]="rightPanelIsCollapsed()"
                    [class.editor-sidebars--right-hidden]="!showEditorSidebarRight()"
                    layout="horizontal"
                    [panelSizes]="sidebarSizes()"
                    [minSizes]="sidebarMinSizes()"
                    [gutterSize]="gutterSize"
                    [pt]="passThrough"
                    [stateKey]="assessmentWorkspace() ? 'code-editor-assessment-sidebars' : 'code-editor-sidebars'"
                    stateStorage="local"
                    (onResizeEnd)="onSidebarsResized($event)"
                >
                    <ng-template #panel>
                        <div #fileBrowser class="editor-sidebar-left collapsable" data-testid="editor-sidebar-left">
                            <ng-content select="[editorSidebarLeft]" />
                        </div>
                    </ng-template>
                    <ng-template #panel>
                        <div class="editor-center">
                            <ng-content select="[editorCenter]" />
                        </div>
                    </ng-template>
                    <ng-template #panel>
                        <div #instructions class="editor-sidebar-right collapsable" data-testid="editor-sidebar-right">
                            <ng-content select="[editorSidebarRight]" />
                        </div>
                    </ng-template>
                </p-splitter>
            </div>
            @if (!fillHeight()) {
                <div class="rg-main-bottom" data-testid="draggableIconForMain"></div>
            }
        </div>
    </ng-template>
    <ng-template #bottomArea>
        <div
            #buildOutput
            class="editor-bottom collapsable"
            jhiResizable
            [resizableEdges]="fillHeight() ? {} : { bottom: '.rg-bottom-bottom' }"
            [resizableConstraints]="{ minHeight: resizableMinHeightBottom, maxHeight: maxConstraints().heightBottom }"
            [resizableEnabled]="bottomResizable() && !buildOutputIsCollapsed() && !fillHeight()"
            (resizeEnd)="onPanelResized(ResizeType.BOTTOM)"
        >
            <ng-content select="[editorBottomArea]" class="editor-bottom-resizable" />
            @if (bottomResizable() && !buildOutputIsCollapsed() && !fillHeight()) {
                <div class="rg-bottom-bottom" data-testid="draggableIconForBuildOutput"></div>
            }
        </div>
    </ng-template>
    @if (fillHeight()) {
        <jhi-feedback-split
            class="editor-split"
            storageKey="code-editor-main-bottom-split"
            [bottomTemplate]="bottomArea"
            [expanded]="!buildOutputIsCollapsed()"
            (resizeEnd)="onPanelResized(ResizeType.MAIN_BOTTOM)"
        >
            <div feedbackSplitTop class="editor-split__top"><ng-container [ngTemplateOutlet]="mainArea" /></div>
        </jhi-feedback-split>
    } @else {
        <ng-container [ngTemplateOutlet]="mainArea" />
        <ng-container [ngTemplateOutlet]="bottomArea" />
    }
    @if (isTutorAssessment()) {
        <div class="editor-assessment-bottom">
            <ng-content select="[editorBottom]" />
        </div>
    }
</div>
