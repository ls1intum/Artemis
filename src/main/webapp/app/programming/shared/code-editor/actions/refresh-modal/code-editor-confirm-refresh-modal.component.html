<form #confirmForm="ngForm" name="confirmForm" (ngSubmit)="refreshFiles()">
    <span class="inline-flex items-center gap-2">
        <fa-icon [icon]="faExclamationTriangle" class="text-state-warning" />
        <span jhiTranslate="artemisApp.editor.refresh.refreshExplanationLong"></span>
    </span>
    <div class="flex justify-end gap-2 mt-4">
        <button tumAetUiButton severity="secondary" type="button" (click)="closeModal()">
            <fa-icon [icon]="faBan" />
            <span jhiTranslate="entity.action.cancel"></span>
        </button>
        <button
            data-button-intent="destructive"
            data-button-intent-reason="Discards local repository changes before refreshing"
            tumAetUiButton
            severity="danger"
            type="submit"
            [disabled]="!confirmForm.valid"
        >
            <fa-icon [icon]="faTimes" />
            <span jhiTranslate="artemisApp.editor.refresh.performRefresh"></span>
        </button>
    </div>
</form>
