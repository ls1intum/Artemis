<form #deleteForm="ngForm" name="deleteForm" (ngSubmit)="resetRepository()">
    <div jhiTranslate="artemisApp.editor.conflict.conflictExplanationLong"></div>
    <span class="inline-flex items-center gap-2 mt-2">
        <fa-icon [icon]="faExclamationTriangle" class="text-state-warning" />
        <span jhiTranslate="artemisApp.editor.conflict.conflictWarning"></span>
    </span>
    <div class="flex justify-end gap-2 mt-4!">
        <button tumAetUiButton severity="secondary" type="button" (click)="closeModal()">
            <fa-icon [icon]="faBan" />
            <span jhiTranslate="entity.action.cancel"></span>
        </button>
        <button tumAetUiButton severity="danger" type="submit" [disabled]="!deleteForm.valid">
            <fa-icon [icon]="faTimes" />
            <span jhiTranslate="artemisApp.editor.conflict.resolveConflict"></span>
        </button>
    </div>
</form>
