<div class="editor-panel-footer code-editor-status text-nowrap">
    <div id="commit_state">
        @switch (commitState()) {
            @case (CommitState.UNDEFINED) {
                <div>
                    <span [tumAetUiTooltip]="'artemisApp.editor.changesUndefinedTooltip' | artemisTranslate">
                        <fa-icon [icon]="faCircleNotch" animation="spin" class="text-state-info me-1" />
                        <span class="text-state-info" jhiTranslate="artemisApp.editor.changesUndefined"></span>
                    </span>
                </div>
            }
            @case (CommitState.COULD_NOT_BE_RETRIEVED) {
                <div>
                    <span [tumAetUiTooltip]="'artemisApp.editor.changesErrorTooltip' | artemisTranslate">
                        <fa-icon [icon]="faTimesCircle" class="text-state-danger me-1" />
                        <span class="text-state-danger" jhiTranslate="artemisApp.editor.changesError"></span>
                    </span>
                </div>
            }
            @case (CommitState.CONFLICT) {
                <div>
                    <span [tumAetUiTooltip]="'artemisApp.editor.changesConflictTooltip' | artemisTranslate">
                        <fa-icon [icon]="faTimesCircle" class="text-state-danger me-1" />
                        <span class="text-state-danger" jhiTranslate="artemisApp.editor.changesConflict"></span>
                    </span>
                </div>
            }
            @case (CommitState.CLEAN) {
                <div>
                    <span [tumAetUiTooltip]="'artemisApp.editor.changesSubmittedTooltip' | artemisTranslate">
                        <fa-icon [icon]="faCheckCircle" class="text-state-success me-1" />
                        <span class="text-state-info" jhiTranslate="artemisApp.editor.changesSubmitted"></span>
                    </span>
                </div>
            }
            @case (CommitState.UNCOMMITTED_CHANGES) {
                <div>
                    <span [tumAetUiTooltip]="'artemisApp.editor.unsubmittedChangesTooltip' | artemisTranslate">
                        <fa-icon [icon]="faExclamationTriangle" class="text-state-warning me-1" />
                        <span class="text-state-info" jhiTranslate="artemisApp.editor.unsubmittedChanges"></span>
                    </span>
                </div>
            }
            @case (CommitState.COMMITTING) {
                <div>
                    <span [tumAetUiTooltip]="'artemisApp.editor.submittingChangesTooltip' | artemisTranslate">
                        <fa-icon [icon]="faCircleNotch" class="text-state-info me-1" animation="spin" />
                        <span class="text-state-info" jhiTranslate="artemisApp.editor.submittingChanges"></span>
                    </span>
                </div>
            }
            @default {}
        }
    </div>
</div>
