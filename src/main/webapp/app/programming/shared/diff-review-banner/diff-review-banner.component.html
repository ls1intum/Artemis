<tumaet-ui-message severity="info">
    <div class="flex flex-wrap items-center gap-2">
        <strong class="text-sm" jhiTranslate="artemisApp.programmingExercise.problemStatement.reviewChanges"></strong>
        <span class="text-muted-color text-sm" jhiTranslate="artemisApp.programmingExercise.problemStatement.reviewChangesDescription"></span>
        <button
            tumAetUiButton
            type="button"
            data-testid="toggle-split-view"
            size="small"
            severity="primary"
            [tumAetUiTooltip]="'artemisApp.programmingExercise.diffReport.splitView.tooltip' | artemisTranslate"
            tumAetUiTooltipPlacement="bottom"
            (click)="allowSplitView.set(!allowSplitView())"
        >
            <fa-icon [icon]="faTableColumns" />
            <span [jhiTranslate]="'artemisApp.programmingExercise.diffReport.splitView.' + (allowSplitView() ? 'disable' : 'enable')"></span>
        </button>
        <button
            tumAetUiButton
            type="button"
            data-testid="revert-diff"
            size="small"
            severity="secondary"
            [disabled]="actionsDisabled()"
            [tumAetUiTooltip]="'artemisApp.programmingExercise.problemStatement.revertAllTooltip' | artemisTranslate"
            tumAetUiTooltipPlacement="bottom"
            (click)="revertRequested.emit()"
        >
            <fa-icon [icon]="faBan" />
            <span jhiTranslate="artemisApp.programmingExercise.problemStatement.revertAll"></span>
        </button>
        <jhi-git-diff-line-stat
            class="font-bold mx-1"
            [addedLineCount]="addedLineCount()"
            [removedLineCount]="removedLineCount()"
            [tumAetUiTooltip]="'artemisApp.programmingExercise.problemStatement.diffLineStatTooltip' | artemisTranslate"
            tumAetUiTooltipPlacement="bottom"
        />
        <button
            tumAetUiButton
            type="button"
            data-testid="done-reviewing"
            size="small"
            severity="success"
            [disabled]="actionsDisabled()"
            [tumAetUiTooltip]="'artemisApp.programmingExercise.problemStatement.doneReviewingTooltip' | artemisTranslate"
            tumAetUiTooltipPlacement="bottom"
            (click)="doneRequested.emit()"
        >
            <fa-icon [icon]="faSave" />
            <span jhiTranslate="artemisApp.programmingExercise.problemStatement.doneReviewing"></span>
        </button>
    </div>
</tumaet-ui-message>
