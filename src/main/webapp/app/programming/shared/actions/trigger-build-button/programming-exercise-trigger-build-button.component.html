@if (participationBuildCanBeTriggered() && (showForSuccessfulSubmissions() || participationHasLatestSubmissionWithoutResult())) {
    <jhi-button
        [btnSize]="btnSize()"
        [btnType]="!personalParticipation && !participationHasLatestSubmissionWithoutResult() && lastResultIsManual() ? ButtonType.ERROR : ButtonType.PRIMARY"
        [icon]="faRedo"
        [title]="title()"
        [shouldToggle]="!!title()"
        [disabled]="isRetrievingBuildStatus() || isBlockedByBuildWindow()"
        [isLoading]="isBuilding()"
        (onClick)="triggerBuild($event)"
        [tooltip]="
            isBlockedByBuildWindow()
                ? 'artemisApp.programmingExercise.buildTimeWindow.triggerDisabled'
                : participationHasLatestSubmissionWithoutResult()
                  ? 'artemisApp.programmingExercise.resubmitOnFailedSubmission'
                  : 'artemisApp.programmingExercise.resubmit'
        "
        [featureToggle]="FeatureToggle.ProgrammingExercises"
    />
}
