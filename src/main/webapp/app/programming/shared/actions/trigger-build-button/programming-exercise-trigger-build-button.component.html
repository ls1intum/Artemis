@if (participationBuildCanBeTriggered() && (showForSuccessfulSubmissions() || participationHasLatestSubmissionWithoutResult())) {
    <button
        type="button"
        tumAetUiButton
        [size]="btnSize() === ButtonSize.SMALL ? 'small' : btnSize() === ButtonSize.LARGE ? 'large' : 'default'"
        [severity]="participationHasLatestSubmissionWithoutResult() ? 'danger' : 'primary'"
        [jhiFeatureToggle]="FeatureToggle.ProgrammingExercises"
        [overwriteDisabled]="isRetrievingBuildStatus() || isBuilding()"
        [attr.aria-label]="title() || 'artemisApp.programmingExercise.resubmit' | artemisTranslate"
        [attr.aria-busy]="isBuilding()"
        [tumAetUiTooltip]="
            (participationHasLatestSubmissionWithoutResult() ? 'artemisApp.programmingExercise.resubmitOnFailedSubmission' : 'artemisApp.programmingExercise.resubmit')
                | artemisTranslate
        "
        (click)="triggerBuild($event)"
    >
        <fa-icon [icon]="faRedo" [animation]="isBuilding() ? 'spin' : undefined" />
        <span [class]="title() ? 'hidden xl:inline' : ''" [jhiTranslate]="title()"></span>
    </button>
}
