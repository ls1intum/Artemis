@if (ssrEnabled()) {
    <jhi-programming-exercise-instruction-ssr
        [exercise]="exercise()"
        [participation]="participation()"
        [result]="result()"
        [liveUpdates]="liveUpdates()"
        (onNoInstructionsAvailable)="onNoInstructionsAvailable.emit()"
    />
} @else {
    <jhi-programming-exercise-instructions
        [exercise]="exercise()"
        [participation]="participation()"
        [personalParticipation]="liveUpdates() === 'personal'"
        (onNoInstructionsAvailable)="onNoInstructionsAvailable.emit()"
    />
}
