@if (tasks().length) {
    <div class="stepwizard">
        <div class="stepwizard-title" jhiTranslate="artemisApp.programmingExercise.problemStatement.tasksOfExercise"></div>
        <div class="stepwizard-row">
            <hr class="stepwizard-row-line" />
            @for (task of tasks(); track task.index) {
                <div class="stepwizard-step">
                    <button
                        type="button"
                        class="stepwizard-circle"
                        [attr.aria-label]="task.taskName"
                        [tumUiTooltip]="task.taskName"
                        [class.stepwizard-step--success]="task.status === 'success'"
                        [class.stepwizard-step--failed]="task.status === 'fail'"
                        [class.stepwizard-step--not-executed]="task.status === 'not-executed'"
                        [class.stepwizard-step--no-result]="task.status === 'no-result' || task.status === 'no-tests'"
                        (click)="taskSelected.emit(task)"
                    >
                        @if (task.status === 'success') {
                            <fa-icon [icon]="faCheck" size="lg" class="icon-success" />
                        } @else if (task.status === 'fail') {
                            <fa-icon [icon]="faTimes" size="lg" class="icon-fail" />
                        } @else {
                            <fa-icon [icon]="faCircle" size="lg" class="icon-neutral" />
                        }
                    </button>
                </div>
            }
        </div>
    </div>
}
