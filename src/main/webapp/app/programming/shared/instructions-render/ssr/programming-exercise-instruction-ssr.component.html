<jhi-programming-exercise-instruction-ssr-step-wizard [tasks]="tasks()" [interactive]="canOpenFeedback()" (taskSelected)="openTaskFeedback($event)" />
@if (isLoading()) {
    <div class="ssr-status" aria-busy="true">
        <fa-icon animation="spin" size="lg" [icon]="faCircleNotch" />
    </div>
}
@if (initialLoadFailed()) {
    <tum-ui-message severity="warn" styleClass="mb-3" [text]="errorMessageKey() | artemisTranslate" />
}
@if (refreshFailed()) {
    <tum-ui-message severity="info" styleClass="mb-3" [text]="'artemisApp.programmingExercise.problemStatement.renderStale' | artemisTranslate" />
}
<div class="ssr-scroll-area">
    <jhi-programming-exercise-instruction-ssr-content
        [html]="renderedHtml()"
        [tasks]="tasks()"
        [interactive]="canOpenFeedback()"
        [attr.aria-busy]="isRefreshing()"
        (taskActivated)="onTaskActivated($event)"
    />
</div>
