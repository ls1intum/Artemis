<h2 jhiTranslate="artemisApp.userSettings.sshSettingsPage.keysTablePageTitle"></h2>
@if (!isLoading()) {
    <tum-ui-list [ariaLabel]="'artemisApp.userSettings.sshSettingsPage.keysTablePageTitle' | artemisTranslate">
        <li tumUiListItem>
            <dt>
                <span jhiTranslate="artemisApp.userSettings.sshSettingsPage.whatToUseSSHForInfo"></span>
                <jhi-documentation-link [documentationType]="documentationType" [displayString]="'artemisApp.userSettings.sshSettingsPage.learnMore'" />
            </dt>
        </li>

        <li tumUiListItem>
            @if (keyCount() > 0) {
                <table tumUiTable [striped]="true" class="w-full">
                    <thead>
                        <tr>
                            <th jhiTranslate="artemisApp.userSettings.sshSettingsPage.keys"></th>
                            <th jhiTranslate="artemisApp.userSettings.sshSettingsPage.actions"></th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (key of sshPublicKeys(); track key.id) {
                            <tr>
                                <td>
                                    <div class="font-bold">{{ key.label }}</div>
                                    <div class="text-sm text-muted-color">{{ key.keyHash }}</div>
                                    @if (key.expiryDate) {
                                        <div class="text-sm text-muted-color">
                                            <span jhiTranslate="artemisApp.userSettings.sshSettingsPage.{{ key.hasExpired ? 'hasExpiredOn' : 'expiresOn' }}"></span>
                                            {{ key.expiryDate | artemisDate: 'long-date' }}
                                        </div>
                                    }
                                </td>
                                <td>
                                    <button
                                        type="button"
                                        tumUiButton
                                        severity="secondary"
                                        variant="outlined"
                                        size="small"
                                        [tumUiMenuTrigger]="keyMenu"
                                        [attr.aria-label]="'artemisApp.userSettings.sshSettingsPage.actions' | artemisTranslate"
                                    >
                                        <fa-icon [icon]="faEllipsis" />
                                    </button>
                                    <ng-template #keyMenu>
                                        <tum-ui-menu>
                                            <a tumUiMenuItem [routerLink]="['view', key.id]">
                                                <span jhiTranslate="artemisApp.userSettings.sshSettingsPage.viewExistingSshKey"></span>
                                            </a>
                                            <!-- The confirmation is opened from the component, not from a
                                                 jhiDeleteButton here: activating an item closes the menu and
                                                 destroys its content, so the directive would be gone before
                                                 the user confirms and the deletion would never run. -->
                                            <button tumUiMenuItem (triggered)="confirmDeleteSshKey(key)">
                                                <span jhiTranslate="artemisApp.userSettings.sshSettingsPage.deleteSshKey"></span>
                                            </button>
                                        </tum-ui-menu>
                                    </ng-template>
                                </td>
                            </tr>
                        }
                    </tbody>
                </table>
                <div class="flex items-center justify-between">
                    <a [routerLink]="['fingerprints']" jhiTranslate="artemisApp.userSettings.sshSettingsPage.fingerprints"></a>
                    <a tumUiButton size="small" data-testid="addNewSshKeyButton" [routerLink]="['add']">
                        <fa-icon [icon]="faPlus" />
                        <span jhiTranslate="artemisApp.userSettings.sshSettingsPage.addNewSshKey"></span>
                    </a>
                </div>
            } @else {
                <div jhiTranslate="artemisApp.userSettings.sshSettingsPage.noKeysHaveBeenAdded"></div>
            }
        </li>

        @if (keyCount() === 0) {
            <li tumUiListItem>
                <a tumUiButton class="self-start" size="small" data-testid="addNewSshKeyButton" [routerLink]="['add']">
                    <fa-icon [icon]="faPlus" />
                    <span jhiTranslate="artemisApp.userSettings.sshSettingsPage.addNewSshKey"></span>
                </a>
            </li>
        }
    </tum-ui-list>
}
