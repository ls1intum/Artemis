<h2 class="text-xl! font-bold!">
    {{ 'artemisApp.userSettings.categories.' + userSettingsCategory | artemisTranslate }}
</h2>
<p class="text-muted-color">
    <span jhiTranslate="artemisApp.userSettings.scienceSettingsInfo"></span>
    @if (!featureToggleActive()) {
        {{ ' ' }}<span jhiTranslate="artemisApp.userSettings.scienceSettingsFeatureDisabled"></span>
    }
</p>
@if (userSettings()) {
    <tumaet-ui-list [ariaLabel]="'artemisApp.userSettings.categories.' + userSettingsCategory | artemisTranslate">
        @for (settingGroup of userSettings().groups; track settingGroup) {
            @for (setting of settingGroup.settings; track setting) {
                <li tumAetUiListItem *jhiHasAnyAuthority="settingGroup.restrictionLevels">
                    <div class="flex items-center gap-2">
                        <tumaet-ui-toggle-switch
                            [inputId]="setting.settingId"
                            [ngModel]="setting.active"
                            [ngModelOptions]="{ standalone: true }"
                            (changed)="toggleSetting(setting, $event)"
                        />
                        <label [for]="setting.settingId">
                            {{ 'artemisApp.userSettings.settingDescriptions.' + setting.descriptionKey | artemisTranslate }}
                        </label>
                    </div>
                </li>
            }
        }
    </tumaet-ui-list>
}
