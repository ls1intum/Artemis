<div class="flex justify-between">
    <h2 jhiTranslate="artemisApp.userSettings.categories.LLMUsage"></h2>
</div>

<hr />

<div class="mb-3 flex items-center">
    <span jhiTranslate="artemisApp.exerciseActions.aiExperienceConfirmation.popUpMessage"></span>
</div>

<div class="flex items-center gap-3">
    <div class="flex-1">
        @if (currentLLMSelectionDecision() === 'CLOUD_AI') {
            <span
                jhiTranslate="artemisApp.userSettings.LLMUsageSettingsPage.cloudAccepted"
                [translateValues]="{ acceptedDate: (currentLLMSelectionDecisionDate() | artemisDate: 'long-date') }"
            ></span>
        } @else if (currentLLMSelectionDecision() === 'LOCAL_AI') {
            <span
                jhiTranslate="artemisApp.userSettings.LLMUsageSettingsPage.onPremiseAccepted"
                [translateValues]="{ acceptedDate: (currentLLMSelectionDecisionDate() | artemisDate: 'long-date') }"
            ></span>
        } @else if (currentLLMSelectionDecision() === 'NO_AI') {
            <span
                jhiTranslate="artemisApp.userSettings.LLMUsageSettingsPage.AIDeclined"
                [translateValues]="{ acceptedDate: (currentLLMSelectionDecisionDate() | artemisDate: 'long-date') }"
            ></span>
        } @else {
            <span jhiTranslate="artemisApp.userSettings.LLMUsageSettingsPage.noAISelected"></span>
        }
    </div>

    <tum-ui-button (clicked)="openSelectionModal()">
        <span jhiTranslate="artemisApp.userSettings.LLMUsageSettingsPage.chooseAI"></span>
    </tum-ui-button>
</div>
