<div class="flex flex-col gap-10">
    @if (isPasskeyAvailable) {
        <section>
            <jhi-passkey-settings />
        </section>
    }

    <section>
        <jhi-ssh-user-settings />
    </section>

    @if (isVcsTokenAvailable()) {
        <section>
            <jhi-vcs-access-tokens-settings />
        </section>
    }

    <section>
        <jhi-vcs-access-token-overview />
    </section>

    @if (isAgentAccessAvailable()) {
        <section>
            <jhi-agent-access-settings />
        </section>
    }

    <section>
        <jhi-credential-revocation-settings (credentialsRevoked)="onCredentialsRevoked($event)" />
    </section>
</div>
