<div class="flex flex-col">
    <h3 jhiTranslate="artemisApp.userSettings.credentialRevocation.title"></h3>
    <p class="text-muted-color" jhiTranslate="artemisApp.userSettings.credentialRevocation.explanation"></p>

    <div class="mt-2 flex flex-col gap-2" data-testid="credential-revocation-options">
        <div class="flex items-center gap-2">
            <tum-ui-checkbox
                inputId="revokePasskeys"
                name="revokePasskeys"
                data-testid="revoke-passkeys"
                [ngModel]="revokePasskeys()"
                [ngModelOptions]="{ standalone: true }"
                (changed)="revokePasskeys.set($event.checked)"
            />
            <label for="revokePasskeys" jhiTranslate="artemisApp.userSettings.credentialRevocation.passkeys"></label>
        </div>
        <div class="flex items-center gap-2">
            <tum-ui-checkbox
                inputId="revokeSshKeys"
                name="revokeSshKeys"
                data-testid="revoke-ssh-keys"
                [ngModel]="revokeSshKeys()"
                [ngModelOptions]="{ standalone: true }"
                (changed)="revokeSshKeys.set($event.checked)"
            />
            <label for="revokeSshKeys" jhiTranslate="artemisApp.userSettings.credentialRevocation.sshKeys"></label>
        </div>
        <div class="flex items-center gap-2">
            <tum-ui-checkbox
                inputId="revokeVcsAccessTokens"
                name="revokeVcsAccessTokens"
                data-testid="revoke-vcs-access-tokens"
                [ngModel]="revokeVcsAccessTokens()"
                [ngModelOptions]="{ standalone: true }"
                (changed)="revokeVcsAccessTokens.set($event.checked)"
            />
            <label for="revokeVcsAccessTokens" jhiTranslate="artemisApp.userSettings.credentialRevocation.vcsAccessTokens"></label>
        </div>
    </div>

    <div class="mt-4">
        <button
            id="revoke-credentials-button"
            data-testid="revoke-credentials-button"
            type="button"
            tumUiButton
            severity="danger"
            size="small"
            jhiDeleteButton
            [renderButtonStyle]="false"
            [actionType]="ActionType.Remove"
            [renderButtonText]="false"
            [disabled]="!hasSelection() || isRevoking()"
            deleteQuestion="artemisApp.userSettings.credentialRevocation.confirmationQuestion"
            [dialogError]="dialogError$"
            (delete)="revokeSelectedCredentials()"
        >
            <span jhiTranslate="artemisApp.userSettings.credentialRevocation.revoke"></span>
        </button>
    </div>
</div>
