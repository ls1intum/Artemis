<div class="container module-bg p-3 mb-5 rounded rounded-3">
    <div class="flex flex-col md:flex-row md:gap-4">
        <div class="md:w-1/3 md:shrink-0 lg:w-1/4">
            <!-- profile header -->
            <div class="d-flex flex-column">
                @if (currentUser()?.imageUrl) {
                    <img class="user-settings-container-profile-picture rounded-3" [src]="addPublicFilePrefix(currentUser()!.imageUrl!)" alt="User Profile Picture" />
                } @else {
                    <fa-icon id="avatar" size="3x" [icon]="faUser" />
                }
                @if (currentUser(); as user) {
                    <div>
                        @if (user.name) {
                            <span id="user-header">{{ user.name }}</span>
                        }
                        <br />
                        <span id="login">{{ user.login }}</span>
                    </div>
                }
            </div>
            <!-- links to the different settings -->
            <section id="navigation-bar" class="list-group d-block pt-2">
                <span class="list-group-item disabled fw-bold" jhiTranslate="artemisApp.userSettings.userSettings"></span>
                <a class="list-group-item btn btn-outline-primary" routerLink="account" routerLinkActive="active" jhiTranslate="artemisApp.userSettings.accountInformation"></a>
                @if (isAiEnabled()) {
                    <a class="list-group-item btn btn-outline-primary" routerLink="ai-experience" routerLinkActive="active" jhiTranslate="artemisApp.userSettings.aiExperience"></a>
                }
                <a class="list-group-item btn btn-outline-primary" routerLink="profile" routerLinkActive="active" jhiTranslate="artemisApp.userSettings.learnerProfile"></a>
                @if (isScienceEnabled()) {
                    <a class="list-group-item btn btn-outline-primary" routerLink="science" routerLinkActive="active" jhiTranslate="artemisApp.userSettings.scienceSettings"></a>
                }
                <a class="list-group-item btn btn-outline-primary" routerLink="ssh" routerLinkActive="active" jhiTranslate="artemisApp.userSettings.sshSettings"></a>
                <a
                    class="list-group-item btn btn-outline-primary"
                    routerLink="credentials"
                    routerLinkActive="active"
                    jhiTranslate="artemisApp.userSettings.credentialRevocation.title"
                ></a>
                @if (isAtLeastTutor()) {
                    <a
                        class="list-group-item btn btn-outline-primary"
                        routerLink="vcs-token"
                        routerLinkActive="active"
                        jhiTranslate="artemisApp.userSettings.vcsAccessTokenSettings"
                    >
                    </a>
                }
                <a
                    class="list-group-item btn btn-outline-primary"
                    routerLink="access-tokens"
                    routerLinkActive="active"
                    jhiTranslate="artemisApp.userSettings.vcsAccessTokensOverview.title"
                ></a>
                @if (isPasskeyEnabled()) {
                    <a class="list-group-item btn btn-outline-primary" routerLink="passkeys" routerLinkActive="active" jhiTranslate="artemisApp.userSettings.passkeys"></a>
                }
                <a class="list-group-item btn btn-outline-primary" routerLink="ide-preferences" routerLinkActive="active">
                    <!--Default IDE Settings-->
                    <span jhiTranslate="artemisApp.userSettings.categories.IDE_PREFERENCES"></span>
                </a>
                <a class="list-group-item btn btn-outline-primary" routerLink="notifications" routerLinkActive="active">
                    <span jhiTranslate="artemisApp.userSettings.categories.GLOBAL_NOTIFICATIONS"></span>
                </a>
                <a class="list-group-item btn btn-outline-primary" routerLink="quiz-training" routerLinkActive="active">
                    <span jhiTranslate="artemisApp.userSettings.quizTrainingSettings.quizTraining"></span>
                </a>
            </section>
        </div>
        <!-- the currently opened settings -->
        <div class="mt-4 md:mt-0 md:min-w-0 md:flex-1">
            <section id="current-settings">
                <router-outlet />
            </section>
        </div>
    </div>
</div>
