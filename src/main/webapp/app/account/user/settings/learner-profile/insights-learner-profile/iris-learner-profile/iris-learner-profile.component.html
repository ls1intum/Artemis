<h4 jhiTranslate="artemisApp.learnerProfile.insightsLearnerProfile.iris.title"></h4>
<span jhiTranslate="artemisApp.learnerProfile.insightsLearnerProfile.iris.description"></span>

<div class="mt-2 flex items-center gap-2">
    <tum-ui-toggle-switch inputId="memirisEnabled" [ngModel]="memirisEnabled()" [ngModelOptions]="{ standalone: true }" (changed)="onMemirisEnabledChange($event)" />
    <label for="memirisEnabled" jhiTranslate="artemisApp.learnerProfile.insightsLearnerProfile.iris.memirisEnabledToggle"></label>
</div>

@if (memirisEnabled()) {
    <div class="mt-3">
        <jhi-memiris-memories-list />
    </div>
}
