<h5 jhiTranslate="artemisApp.iris.memories.title"></h5>

@if (hasConflicts()) {
    <tumaet-ui-message severity="warn">
        <div class="flex w-full items-center justify-between gap-3">
            <span jhiTranslate="artemisApp.iris.memories.conflict.warning"></span>
            <tumaet-ui-button severity="warn" size="small" (clicked)="openResolveConflictsModal()">
                <span jhiTranslate="artemisApp.iris.memories.conflict.resolve"></span>
            </tumaet-ui-button>
        </div>
    </tumaet-ui-message>
}

@if (loading()) {
    <div class="text-sm text-muted-color" jhiTranslate="artemisApp.iris.memories.loadingList"></div>
} @else {
    @if (memories()?.length === 0) {
        <div class="text-sm text-muted-color" jhiTranslate="artemisApp.iris.memories.empty"></div>
    } @else {
        <tumaet-ui-list [ariaLabel]="'artemisApp.iris.memories.title' | artemisTranslate">
            @for (memory of memories(); track memory.id) {
                <li tumAetUiListItem>
                    <div class="flex items-center justify-between gap-3">
                        <button type="button" class="flex cursor-pointer items-center gap-2 border-0 bg-transparent p-0 text-start" (click)="toggleOpen(memory)">
                            <fa-icon [icon]="open()[memory.id] ? faChevronDown : faChevronRight" />
                            <span class="font-semibold">{{ memory.title || memory.id }}</span>
                        </button>
                        <tumaet-ui-button severity="danger" variant="outlined" size="small" [disabled]="deleting()[memory.id]" (clicked)="deleteMemory(memory)">
                            @if (deleting()[memory.id]) {
                                <span jhiTranslate="artemisApp.iris.memories.deleting"></span>
                            } @else {
                                <span jhiTranslate="artemisApp.iris.memories.delete"></span>
                            }
                        </tumaet-ui-button>
                    </div>

                    @if (open()[memory.id]) {
                        <div class="mt-2 ms-4">
                            <jhi-memiris-memory-details [details]="details()[memory.id]" />
                        </div>
                    }
                </li>
            }
        </tumaet-ui-list>
    }
}

<tumaet-ui-dialog
    [(visible)]="conflictDialogVisible"
    size="large"
    [header]="'artemisApp.iris.memories.conflict.modalTitle' | artemisTranslate"
    (visibleChange)="conflictDialogVisible.set($event)"
>
    @if (conflictDialogVisible()) {
        <jhi-resolve-memories-conflicts-modal
            [conflictGroups]="conflictDialogGroups()"
            [details]="conflictDialogDetails()"
            (resolved)="onConflictsResolved($event)"
            (closed)="conflictDialogVisible.set(false)"
        />
    }
</tumaet-ui-dialog>
