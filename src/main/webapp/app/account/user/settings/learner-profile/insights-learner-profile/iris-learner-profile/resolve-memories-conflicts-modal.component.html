<div>
    @if (groups()?.length) {
        <div class="mb-2 flex items-center justify-between gap-3">
            <div
                class="font-semibold"
                jhiTranslate="artemisApp.iris.memories.conflict.conflictCount"
                [translateValues]="{ current: currentIndex() + 1, total: groups().length }"
            ></div>
            <tum-ui-button-group>
                <button
                    type="button"
                    tumUiButton
                    severity="secondary"
                    variant="outlined"
                    size="small"
                    (click)="prev()"
                    [disabled]="currentIndex() === 0"
                    jhiTranslate="artemisApp.iris.memories.conflict.previous"
                ></button>
                <button
                    type="button"
                    tumUiButton
                    severity="secondary"
                    variant="outlined"
                    size="small"
                    (click)="next()"
                    [disabled]="currentIndex() >= groups().length - 1"
                    jhiTranslate="artemisApp.iris.memories.conflict.next"
                ></button>
            </tum-ui-button-group>
        </div>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
            @for (gid of currentGroup(); track gid) {
                <tum-ui-card class="h-full">
                    <div class="mb-2 flex items-center justify-between">
                        <span class="font-semibold">{{ details()[gid]?.title || gid }}</span>
                    </div>
                    <div class="mb-2 text-sm text-muted-color"><span jhiTranslate="artemisApp.iris.memories.conflict.memoryId"></span>: {{ gid }}</div>
                    <div class="mb-2 break-words">{{ details()[gid]?.content }}</div>
                    <tum-ui-button severity="success" size="small" [disabled]="busy()" (clicked)="keep(currentIndex(), gid)">
                        <span jhiTranslate="artemisApp.iris.memories.conflict.keepThis"></span>
                    </tum-ui-button>
                </tum-ui-card>
            }
        </div>
    } @else {
        <div class="text-sm text-muted-color" jhiTranslate="artemisApp.iris.memories.conflict.noConflicts"></div>
    }
</div>
<div class="mt-4 flex justify-end">
    <tum-ui-button severity="secondary" (clicked)="close()">
        <span jhiTranslate="entity.action.close"></span>
    </tum-ui-button>
</div>
