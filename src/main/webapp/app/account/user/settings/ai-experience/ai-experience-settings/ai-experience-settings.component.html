<div class="flex flex-col gap-10">
    <section class="flex flex-col gap-8">
        <div class="flex flex-col gap-2">
            <h2 class="m-0! text-xl! font-bold!" jhiTranslate="artemisApp.userSettings.aiExperienceSettingsPage.yourAiMode"></h2>
            <p class="m-0!" jhiTranslate="artemisApp.userSettings.aiExperienceSettingsPage.description"></p>
        </div>
        <div class="flex flex-col gap-4!">
            <jhi-ai-mode-selector [currentSelection]="currentSelection()" [isOnPremiseEnabled]="isOnPremiseEnabled" (choice)="selectMode($event)" />
            <a class="self-center" routerLink="/ai-experience-info" jhiTranslate="artemisApp.llmSelectionPopup.disclaimerButton"></a>
        </div>
    </section>
    <section class="flex flex-col gap-4!">
        <h2 class="m-0! text-xl! font-bold!" jhiTranslate="artemisApp.userSettings.aiExperienceSettingsPage.dataManagement"></h2>
        <p class="m-0!" jhiTranslate="artemisApp.userSettings.aiExperienceSettingsPage.dataManagementInfo"></p>

        @if (hasData) {
            <p class="m-0!">
                <span jhiTranslate="artemisApp.userSettings.aiExperienceSettingsPage.dataStats" [translateValues]="{ sessions: sessionCount(), messages: messageCount() }"></span>
            </p>
            <div>
                <button
                    type="button"
                    tumAetUiButton
                    severity="danger"
                    size="small"
                    jhiDeleteButton
                    [renderButtonStyle]="false"
                    [actionType]="ActionType.Cleanup"
                    [renderButtonText]="false"
                    [deleteQuestion]="'artemisApp.userSettings.aiExperienceSettingsPage.deleteQuestion'"
                    [entityTitle]="'delete all'"
                    [deleteConfirmationText]="'artemisApp.userSettings.aiExperienceSettingsPage.typeDeleteAllToConfirm'"
                    (delete)="deleteAllIrisInteractions()"
                    [dialogError]="dialogError$"
                >
                    <span jhiTranslate="entity.action.cleanup"></span>
                </button>
            </div>
        } @else {
            <p class="m-0! text-muted-color" jhiTranslate="artemisApp.userSettings.aiExperienceSettingsPage.noData"></p>
        }
    </section>
</div>
