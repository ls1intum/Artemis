<h2 jhiTranslate="artemisApp.userSettings.vcsAccessTokenSettings"></h2>
@if (currentUser(); as currentUser) {
    <tum-ui-list [ariaLabel]="'artemisApp.userSettings.vcsAccessTokenSettings' | artemisTranslate">
        <li tumUiListItem>
            <dt>
                <span jhiTranslate="artemisApp.userSettings.vcsAccessTokensSettingsPage.infoText"></span>
            </dt>
        </li>
        @if (!edit()) {
            <li tumUiListItem>
                @if (currentUser.vcsAccessToken) {
                    <table tumUiTable [striped]="true" class="w-full">
                        <thead>
                            <tr>
                                <th>
                                    <span jhiTranslate="artemisApp.userSettings.vcsAccessTokensSettingsPage.vcsAccessToken"></span>
                                </th>
                                <th></th>
                                <th>
                                    <span jhiTranslate="artemisApp.userSettings.vcsAccessTokensSettingsPage.expiryDate"></span>
                                </th>
                                <th>
                                    <span jhiTranslate="artemisApp.userSettings.vcsAccessTokensSettingsPage.actions"></span>
                                </th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td>***************</td>
                                <td>
                                    <jhi-copy-to-clipboard-button [copyText]="currentUser.vcsAccessToken" [class]="'me-2'" />
                                </td>
                                <td>{{ currentUser.vcsAccessTokenExpiryDate | artemisDate }}</td>
                                <td>
                                    <button
                                        type="button"
                                        tumUiButton
                                        severity="danger"
                                        size="small"
                                        id="delete-vcs-token-button"
                                        jhiDeleteButton
                                        [renderButtonStyle]="false"
                                        [renderButtonText]="false"
                                        (delete)="deleteVcsAccessToken()"
                                        deleteQuestion="artemisApp.userSettings.vcsAccessTokensSettingsPage.deleteVcsAccessTokenQuestion"
                                        [dialogError]="dialogError$"
                                    >
                                        <fa-icon [icon]="faTrash" />
                                        <span jhiTranslate="entity.action.delete"></span>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                } @else {
                    <div jhiTranslate="artemisApp.userSettings.vcsAccessTokensSettingsPage.noTokenSet"></div>
                }
            </li>
            @if (!currentUser.vcsAccessToken) {
                <li tumUiListItem>
                    <tum-ui-button class="self-start" id="add-new-token-button" size="small" [icon]="faPlus" (clicked)="addNewVcsAccessToken()">
                        <span jhiTranslate="artemisApp.userSettings.vcsAccessTokensSettingsPage.addToken"></span>
                    </tum-ui-button>
                </li>
            }
        } @else {
            <li tumUiListItem>
                <h4 jhiTranslate="artemisApp.userSettings.vcsAccessTokensSettingsPage.addTokenTitle"></h4>

                <div class="mb-3 sm:w-1/2">
                    <jhi-date-time-picker
                        [shouldDisplayTimeZoneWarning]="false"
                        labelName="{{ 'artemisApp.userSettings.vcsAccessTokensSettingsPage.expiryDate' | artemisTranslate }}"
                        [(ngModel)]="expiryDate"
                        (valueChange)="validateDate()"
                        [error]="!!expiryDate && !validExpiryDate()"
                        name="expiryDate"
                        id="expiryDate"
                    />
                </div>

                <div class="flex gap-2">
                    <tum-ui-button id="create-vcs-token-button" size="small" [disabled]="!validExpiryDate()" [icon]="faSave" (clicked)="sendTokenCreationRequest()">
                        <span jhiTranslate="artemisApp.userSettings.vcsAccessTokensSettingsPage.createAccessToken"></span>
                    </tum-ui-button>
                    <tum-ui-button id="cancel-vcs-token-creation-button" severity="secondary" size="small" [icon]="faBan" (clicked)="cancelTokenCreation()">
                        <span jhiTranslate="entity.action.cancel"></span>
                    </tum-ui-button>
                </div>
            </li>
        }
    </tum-ui-list>
}
