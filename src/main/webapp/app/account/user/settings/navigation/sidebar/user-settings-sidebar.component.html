<nav class="flex h-full min-h-full w-full flex-col justify-between" [attr.aria-label]="'artemisApp.userSettings.userSettings' | artemisTranslate">
    <ul class="grow list-none p-0 pt-2">
        @for (item of navigationItems(); track item.routerLink) {
            <li>
                <a
                    class="group flex w-full items-center px-2 py-2 whitespace-nowrap text-text! no-underline hover:bg-(--link-item-bg)! hover:text-(--link-item-color)! hover:no-underline!"
                    [class.justify-center]="isCollapsed() || !canExpand()"
                    [routerLink]="item.routerLink"
                    routerLinkActive="bg-(--link-item-bg)! text-(--link-item-color)!"
                    [tumAetUiTooltip]="isCollapsed() ? (item.translation | artemisTranslate) : ''"
                    tumAetUiTooltipPlacement="right"
                    [attr.aria-label]="item.translation | artemisTranslate"
                >
                    <fa-icon [fixedWidth]="true" [icon]="item.icon" />
                    @if (!isCollapsed() && canExpand()) {
                        <span class="ms-2 group-hover:underline group-hover:decoration-1 group-hover:underline-offset-[3px]">
                            {{ item.translation | artemisTranslate }}
                        </span>
                    }
                </a>
            </li>
        }
    </ul>

    <div class="my-2 shrink-0">
        @if (!isCollapsed() && canExpand()) {
            <button
                type="button"
                class="flex w-full justify-end border-none bg-transparent px-2"
                [tumAetUiTooltip]="'artemisApp.userSettings.navigation.collapse' | artemisTranslate"
                tumAetUiTooltipPlacement="right"
                (click)="toggleCollapseState.emit()"
                [attr.aria-expanded]="true"
                data-testid="user-settings-sidebar-collapse"
            >
                <span class="inline-flex min-w-10 rotate-180 items-center gap-1 transition-transform duration-300">
                    <fa-icon class="-me-[10px] fa-xs" [icon]="faChevronRight" />
                    <fa-icon class="fa-xs" [icon]="faChevronRight" />
                </span>
            </button>
        } @else if (canExpand()) {
            <button
                type="button"
                class="w-full border-none bg-transparent text-center"
                [tumAetUiTooltip]="'artemisApp.userSettings.navigation.expand' | artemisTranslate"
                tumAetUiTooltipPlacement="right"
                (click)="toggleCollapseState.emit()"
                [attr.aria-expanded]="false"
                data-testid="user-settings-sidebar-expand"
            >
                <span class="inline-flex gap-1 transition-transform duration-300">
                    <fa-icon class="-me-[10px] fa-xs" [icon]="faChevronRight" />
                    <fa-icon class="fa-xs" [icon]="faChevronRight" />
                </span>
            </button>
        }
    </div>
</nav>
