<div class="flex flex-col gap-3.5">
    <div class="flex flex-col gap-3.5">
        <div class="flex flex-col items-start gap-4 sm:flex-row sm:items-center sm:justify-between">
            <h2 class="m-0 text-xl leading-none font-bold" jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.title"></h2>
            @if (isProfileSetup()) {
                <tumaet-ui-button severity="secondary" size="small" (clicked)="openOnboardingModal()">
                    <span jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.replayOnboardingButton"></span>
                </tumaet-ui-button>
            }
        </div>

        <!-- Description section -->
        <div class="flex items-center">
            <span jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.description"></span>
        </div>
    </div>

    @if (!isProfileSetup()) {
        <tumaet-ui-button class="self-start" size="small" (clicked)="openOnboardingModal()">
            <span jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.setPreferencesButton"></span>
        </tumaet-ui-button>
    } @else {
        <!-- Profile settings section -->
        @if (!disabled()) {
            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                <!-- Brief vs. Detailed setting -->
                <tumaet-ui-panel>
                    <span tumAetUiPanelHeader id="feedback-detail-label" jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.feedbackDetail.label"></span>
                    <div class="flex flex-col items-start gap-4 sm:flex-row md:flex-col lg:flex-row">
                        <div class="min-w-0 flex-1 text-sm" jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.feedbackDetail.description"></div>
                        <tumaet-ui-select
                            size="small"
                            class="w-36 max-w-full shrink-0"
                            [ariaLabel]="'artemisApp.learnerProfile.feedbackLearnerProfile.feedbackDetail.label' | artemisTranslate"
                            [options]="feedbackDetailOptions"
                            optionLabel="label"
                            optionValue="value"
                            [ngModel]="feedbackDetail()"
                            [ngModelOptions]="{ standalone: true }"
                            (selectionChange)="onSelectionChange(feedbackDetail, $event)"
                        />
                    </div>
                </tumaet-ui-panel>
                <tumaet-ui-panel>
                    <span tumAetUiPanelHeader id="feedback-formality-label" jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.feedbackFormality.label"></span>
                    <div class="flex flex-col items-start gap-4 sm:flex-row md:flex-col lg:flex-row">
                        <div class="min-w-0 flex-1 text-sm" jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.feedbackFormality.description"></div>
                        <tumaet-ui-select
                            size="small"
                            class="w-36 max-w-full shrink-0"
                            [ariaLabel]="'artemisApp.learnerProfile.feedbackLearnerProfile.feedbackFormality.label' | artemisTranslate"
                            [options]="feedbackFormalityOptions"
                            optionLabel="label"
                            optionValue="value"
                            [ngModel]="feedbackFormality()"
                            [ngModelOptions]="{ standalone: true }"
                            (selectionChange)="onSelectionChange(feedbackFormality, $event)"
                        />
                    </div>
                </tumaet-ui-panel>
            </div>
        }
    }
</div>

<jhi-feedback-onboarding-modal [(visible)]="showOnboardingModal" (completed)="onOnboardingCompleted()" />
