<div class="flex flex-col gap-3.5">
    <div class="flex flex-col gap-3.5">
        <div class="flex items-center justify-between gap-4!">
            <h2 class="m-0! text-xl! leading-none! font-bold!" jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.title"></h2>
            @if (isProfileSetup()) {
                <tumaet-ui-button severity="secondary" size="small" (clicked)="openOnboardingModal()">
                    <span jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.replayOnboardingButton"></span>
                </tumaet-ui-button>
            }
        </div>

        <!-- Description section -->
        <div class="flex items-center">
            <span jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.description"></span>
        </div>
    </div>

    @if (!isProfileSetup()) {
        <tumaet-ui-button class="self-start" size="small" (clicked)="openOnboardingModal()">
            <span jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.setPreferencesButton"></span>
        </tumaet-ui-button>
    } @else {
        <!-- Profile settings section -->
        @if (!disabled()) {
            <div class="grid grid-cols-1 gap-4! xl:grid-cols-2">
                <!-- Brief vs. Detailed setting -->
                <tumaet-ui-panel>
                    <span tumAetUiPanelHeader id="feedback-detail-label" jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.feedbackDetail.label"></span>
                    <div class="flex flex-col gap-4.5">
                        <div class="text-sm" jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.feedbackDetail.description"></div>
                        <tumaet-ui-select-button
                            class="w-full"
                            aria-labelledby="feedback-detail-label"
                            [options]="feedbackDetailOptions"
                            optionLabel="label"
                            optionValue="value"
                            [allowEmpty]="false"
                            [ngModel]="feedbackDetail()"
                            [ngModelOptions]="{ standalone: true }"
                            (changed)="onSelectionChange(feedbackDetail, $event)"
                        />
                    </div>
                </tumaet-ui-panel>
                <tumaet-ui-panel>
                    <span tumAetUiPanelHeader id="feedback-formality-label" jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.feedbackFormality.label"></span>
                    <div class="flex flex-col gap-4.5">
                        <div class="text-sm" jhiTranslate="artemisApp.learnerProfile.feedbackLearnerProfile.feedbackFormality.description"></div>
                        <tumaet-ui-select-button
                            class="w-full"
                            aria-labelledby="feedback-formality-label"
                            [options]="feedbackFormalityOptions"
                            optionLabel="label"
                            optionValue="value"
                            [allowEmpty]="false"
                            [ngModel]="feedbackFormality()"
                            [ngModelOptions]="{ standalone: true }"
                            (changed)="onSelectionChange(feedbackFormality, $event)"
                        />
                    </div>
                </tumaet-ui-panel>
            </div>
        }
    }
</div>

<jhi-feedback-onboarding-modal [(visible)]="showOnboardingModal" (completed)="onOnboardingCompleted()" />
