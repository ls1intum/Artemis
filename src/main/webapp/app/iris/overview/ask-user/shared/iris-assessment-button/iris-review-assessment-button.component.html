<button
    pButton
    type="button"
    [severity]="buttonSeverity()"
    [size]="buttonSize()"
    [jhiFeatureToggle]="FeatureToggle.AskUserMode"
    [disabled]="irisAssessment()?.verdict === undefined || irisAssessment()?.verdict === null"
    [routerLink]="['/course-management', course().id, assessmentReviewPath(), irisAssessment()?.id, 'details']"
>
    <fa-icon [icon]="faBrain" />
    <span class="md:inline" [class.hidden]="hideLabelMobile()">{{ label() | artemisTranslate }}</span>
</button>
