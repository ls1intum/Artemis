<div class="quiz-timer-bar" [class.open]="open()" [class.compact]="!showProgress()">
    <div class="display">
        <fa-icon [icon]="faStopwatch" />
        <div>{{ displayedRemainingTime() }} {{ remainingTimeTranslationKey() | artemisTranslate }}</div>
    </div>
    @if (showProgress()) {
        <div class="progress-bar">
            <div
                class="progress-fill"
                [style.width.%]="progress()"
                [class.success]="progress() > 50"
                [class.warning]="progress() <= 50 && progress() > 20"
                [class.danger]="progress() <= 20"
            ></div>
        </div>
    }
</div>
