<span class="inline-flex" [jhiFeatureToggle]="featureToggle() ?? []" [forceDisabled]="disabled() || isLoading()">
    <tumaet-ui-button
        [severity]="buttonOptions().severity"
        [size]="buttonOptions().size"
        [variant]="buttonOptions().variant"
        [type]="shouldSubmit() ? 'submit' : 'button'"
        [rounded]="!title()"
        [disabled]="featureToggleControl()?.disabled() ?? disabled()"
        [loading]="isLoading()"
        [ariaLabel]="!title() ? (tooltip() || 'artemisApp.iris.logoButtonLabel' | artemisTranslate) : undefined"
        [ariaDescribedBy]="tooltip() ? tooltipId : undefined"
        [tumAetUiTooltip]="tooltip() || (!title() ? 'artemisApp.iris.logoButtonLabel' : '') | artemisTranslate"
        [tumAetUiTooltipDescribesHost]="false"
        (clicked)="onClick.emit($event)"
    >
        @if (!isLoading()) {
            <jhi-iris-logo [size]="SMALL" [decorative]="true" />
        }
        @if (title(); as titleValue) {
            <span [jhiTranslate]="titleValue"></span>
        }
    </tumaet-ui-button>
    @if (tooltip(); as tooltipKey) {
        <span class="sr-only" [id]="tooltipId" [jhiTranslate]="tooltipKey"></span>
    }
</span>
