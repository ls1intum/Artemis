<button
    tumAetUiButton
    class="jhi-btn"
    [severity]="buttonOptions().severity"
    [size]="buttonOptions().size"
    [variant]="buttonOptions().variant"
    [type]="shouldSubmit() ? 'submit' : 'button'"
    [tumAetUiTooltip]="tooltip() | artemisTranslate"
    (click)="onClick.emit($event)"
    [jhiFeatureToggle]="featureToggle() ?? []"
    [forceDisabled]="disabled() || isLoading()"
>
    @if (isLoading()) {
        <fa-icon class="jhi-btn__loading" [icon]="faCircleNotch" animation="spin" size="sm" />
    } @else {
        <jhi-iris-logo [size]="SMALL" />
    }
    @if (title(); as titleValue) {
        <span class="jhi-btn__title ms-1" [jhiTranslate]="titleValue"></span>
    }
</button>
