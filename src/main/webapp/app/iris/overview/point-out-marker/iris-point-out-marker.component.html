@for (marker of markers(); track $index) {
    <div class="marker-row">
        <button type="button" tumUiButton severity="secondary" variant="outlined" size="small" [tumUiTooltip]="openTooltip()" (click)="onMarkerClick(marker.data)">
            <fa-icon [icon]="faLocationArrow" />
            <span>{{ marker.label }}</span>
        </button>
    </div>
}
