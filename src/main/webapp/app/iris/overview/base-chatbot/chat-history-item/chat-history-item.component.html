<div
    class="chat-history-item"
    [ngClass]="{ 'chat-history-item-selected': active() }"
    (click)="onItemClick()"
    role="button"
    tabindex="0"
    (keydown.space)="onItemClick()"
    (keydown.enter)="onItemClick()"
>
    <div class="chat-history-text">
        @if (isNewChat()) {
            <fa-icon [icon]="faPlus" class="new-chat-icon" />
        }
        <span class="chat-history-label">{{ session().title ? session().title : (session().creationDate | date: 'dd.MM.yy HH:mm') }}</span>
        @if (!isNewChat()) {
            <!-- Keep the click from also choosing the session row; the menu already stops the Enter and Space it opens on. -->
            <button
                type="button"
                class="menu-trigger"
                [tumAetUiMenuTrigger]="sessionActions"
                (click)="$event.stopPropagation()"
                [attr.aria-label]="'artemisApp.iris.chatHistory.sessionMenuAriaLabel' | artemisTranslate"
            >
                <fa-icon [icon]="faEllipsisVertical" />
            </button>
            <ng-template #sessionActions>
                <tumaet-ui-menu>
                    <button type="button" tumAetUiMenuItem class="delete-session-item" (triggered)="onDeleteClick()">
                        <fa-icon [icon]="faTrash" aria-hidden="true" />
                        <span>{{ 'artemisApp.iris.chatHistory.deleteSession' | artemisTranslate }}</span>
                    </button>
                </tumaet-ui-menu>
            </ng-template>
        }
    </div>
    @if (icon() && entityRoute()) {
        <a
            class="related-entity-icon"
            [routerLink]="entityRoute()!"
            queryParamsHandling="preserve"
            [tumAetUiTooltip]="tooltipText()"
            tumAetUiTooltipPlacement="right"
            [tumAetUiTooltipDescribesHost]="false"
            [attr.aria-label]="ariaLabelText()!"
            (click)="onEntityIconClick($event)"
            (keydown.enter)="$event.stopPropagation()"
            (keydown.space)="$event.stopPropagation()"
        >
            <fa-icon [icon]="icon()!" />
        </a>
    }
</div>
