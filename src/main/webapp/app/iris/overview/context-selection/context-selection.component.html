<div class="iris-context-selection flex items-center gap-2">
    <span
        class="iris-context-trigger-wrapper"
        [tumAetUiTooltip]="isPickerOpen() ? undefined : ('artemisApp.iris.contextSelection.addContextTooltip' | artemisTranslate)"
        tumAetUiTooltipPlacement="bottom"
    >
        <p-select
            [ariaLabel]="'artemisApp.iris.contextSelection.label' | artemisTranslate"
            [disabled]="disabled()"
            [pt]="{
                header: { style: 'padding-left: 12px; padding-right: 12px;' },
                listContainer: { 'data-testid': 'iris-context-overlay' },
                option: { 'data-testid': 'iris-context-option' },
            }"
            [options]="allGroups()"
            [group]="true"
            optionGroupLabel="label"
            optionGroupChildren="items"
            optionLabel="label"
            optionValue="value"
            [ngModel]="selectedValue()"
            (onChange)="onSelectionChange($event.value)"
            (onShow)="onPickerShow()"
            (onHide)="isPickerOpen.set(false)"
            [filter]="true"
            filterBy="label"
            [filterPlaceholder]="'artemisApp.iris.contextSelection.search' | artemisTranslate"
            [ariaFilterLabel]="'artemisApp.iris.contextSelection.searchLabel' | artemisTranslate"
            [resetFilterOnHide]="true"
            scrollHeight="40vh"
            [panelStyle]="{ 'min-width': '250px' }"
            variant="outlined"
            size="small"
            class="iris-context-trigger"
        >
            <ng-template #dropdownicon>
                <fa-icon [icon]="faPlus" />
            </ng-template>
            <ng-template #item let-option>
                <div class="flex items-center gap-2">
                    <fa-icon [icon]="option.faIcon" />
                    <span>{{ option.label }}</span>
                </div>
            </ng-template>
            <ng-template #group let-group>
                <span [jhiTranslate]="group.label"></span>
            </ng-template>
        </p-select>
    </span>

    @if (activeChip(); as chip) {
        <tumaet-ui-chip
            class="iris-context-chip"
            size="small"
            data-testid="iris-context-chip"
            [removable]="!disabled()"
            [removeAriaLabel]="'artemisApp.iris.contextSelection.removeContext' | artemisTranslate"
            (removed)="onChipRemove()"
        >
            <span [tumAetUiTooltip]="chip.label" tumAetUiTooltipPlacement="bottom"><fa-icon [icon]="chip.faIcon" class="me-1" aria-hidden="true" />{{ chip.label }}</span>
        </tumaet-ui-chip>
    }
</div>
