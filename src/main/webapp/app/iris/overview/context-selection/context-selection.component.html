<div class="flex items-center gap-2">
    <!-- Load the options before the panel opens: an empty panel is positioned for its tiny height and then grows out of the viewport. -->
    <span
        class="inline-flex shrink-0 items-center"
        (pointerenter)="loadContextOptions()"
        (focusin)="loadContextOptions()"
        [tumAetUiTooltip]="isPickerOpen() ? undefined : ('artemisApp.iris.contextSelection.addContextTooltip' | artemisTranslate)"
        tumAetUiTooltipPlacement="bottom"
    >
        <button
            type="button"
            data-testid="iris-context-trigger"
            class="inline-flex cursor-pointer items-center justify-center rounded-lg border-0 bg-transparent px-2 py-1.5 leading-normal text-(--body-color) transition-colors hover:enabled:bg-primary hover:enabled:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="disabled()"
            [attr.aria-label]="'artemisApp.iris.contextSelection.label' | artemisTranslate"
            [tumAetUiPopoverTrigger]="picker"
        >
            <fa-icon [icon]="faPlus" aria-hidden="true" />
        </button>
        <tumaet-ui-popover #picker padding="none" [ariaLabel]="'artemisApp.iris.contextSelection.label' | artemisTranslate" (openChange)="onPickerOpenChange($event)">
            <div class="w-72 max-w-[85vw]" data-testid="iris-context-overlay">
                <div class="px-3! py-2">
                    <tumaet-ui-search-field
                        size="small"
                        placeholder="artemisApp.iris.contextSelection.search"
                        ariaLabel="artemisApp.iris.contextSelection.searchLabel"
                        [(value)]="filterTerm"
                    />
                </div>
                <div class="max-h-[40vh] overflow-y-auto pb-2">
                    @for (group of filteredGroups(); track group.label) {
                        <div role="group" [attr.aria-label]="group.label | artemisTranslate">
                            <div class="px-3! pt-2 pb-1 text-[0.8rem] font-semibold text-(--text-body-secondary)" [jhiTranslate]="group.label"></div>
                            @for (option of group.items; track option.value) {
                                <button
                                    type="button"
                                    data-testid="iris-context-option"
                                    class="flex w-full cursor-pointer items-center gap-2 border-0 bg-transparent px-3! py-1.5 text-start hover:bg-(--tumaet-ui-hover-background) focus-visible:bg-(--tumaet-ui-hover-background)"
                                    [class.font-semibold]="option.value === selectedValue()"
                                    [attr.aria-current]="option.value === selectedValue() ? 'true' : null"
                                    (click)="selectOption(option, picker)"
                                >
                                    <fa-icon [icon]="option.faIcon" aria-hidden="true" />
                                    <span class="min-w-0 truncate">{{ option.label }}</span>
                                </button>
                            }
                        </div>
                    } @empty {
                        @if (optionsLoading()) {
                            <output class="m-0 block px-3! py-2 text-(--text-body-secondary)" data-testid="iris-context-loading" jhiTranslate="loading"></output>
                        } @else {
                            <p class="m-0 px-3! py-2 text-(--text-body-secondary)" jhiTranslate="artemisApp.iris.contextSelection.noResults"></p>
                        }
                    }
                </div>
            </div>
        </tumaet-ui-popover>
    </span>

    @if (activeChip(); as chip) {
        <tumaet-ui-chip
            class="max-w-56 min-w-0 flex-[0_1_auto]"
            size="small"
            data-testid="iris-context-chip"
            [removable]="!disabled()"
            [removeAriaLabel]="'artemisApp.iris.contextSelection.removeContext' | artemisTranslate"
            (removed)="onChipRemove()"
        >
            <span [tumAetUiTooltip]="chip.label" tumAetUiTooltipPlacement="bottom"><fa-icon [icon]="chip.faIcon" class="me-1" aria-hidden="true" />{{ chip.label }}</span>
        </tumaet-ui-chip>
    }
</div>
