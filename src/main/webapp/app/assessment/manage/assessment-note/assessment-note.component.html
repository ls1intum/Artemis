<section class="assessment-note">
    <header class="assessment-note__header">
        <h3 id="assessment-note-label" jhiTranslate="artemisApp.assessment.detail.assessmentNote"></h3>
        <p id="assessment-note-description" jhiTranslate="artemisApp.assessment.detail.assessmentNoteInfo"></p>
    </header>
    <textarea
        tumUiTextarea
        class="assessment-note__textarea"
        rows="3"
        (input)="onAssessmentNoteInput($event)"
        [value]="assessmentNote()?.note ?? ''"
        name="assessment_note"
        id="assessment_note"
        aria-labelledby="assessment-note-label"
        aria-describedby="assessment-note-description"
    ></textarea>
</section>
