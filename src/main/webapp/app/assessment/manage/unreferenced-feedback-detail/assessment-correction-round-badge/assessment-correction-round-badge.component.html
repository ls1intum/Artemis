<div>
    <!-- correction round label-->
    @if (highlightDifferences() && feedback().copiedFeedbackId) {
        <h5 class="correction-label">
            <span class="correction-round-badge correction-round-badge--first" jhiTranslate="artemisApp.assessment.diffView.correctionRoundDiffFirst">First correction round</span>
        </h5>
    }
    @if (highlightDifferences() && !feedback().copiedFeedbackId) {
        <h5 class="correction-label">
            <span class="correction-round-badge correction-round-badge--second" jhiTranslate="artemisApp.assessment.diffView.correctionRoundDiffSecond"
                >Second correction round</span
            >
        </h5>
    }
</div>
