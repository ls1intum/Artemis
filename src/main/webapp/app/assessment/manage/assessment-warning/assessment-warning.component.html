<h6>
    @if (showWarning()) {
        <div class="feedback-panel-header border-b border-border bg-surface-hover px-6! py-4!">
            <fa-icon [icon]="faExclamationTriangle" size="2x" class="text-state-warning" tumAetUiTooltipPlacement="bottom" />
            @if (isBeforeExerciseDueDate()) {
                <span jhiTranslate="artemisApp.assessment.dashboard.warning"></span>
            }
            @if (!isBeforeExerciseDueDate()) {
                <span jhiTranslate="artemisApp.assessment.dashboard.warningIndividual"></span>
            }
        </div>
    }
</h6>
