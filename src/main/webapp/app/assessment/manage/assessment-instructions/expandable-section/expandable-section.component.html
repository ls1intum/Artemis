@if (headerKey() !== null) {
    <div class="expandable-header-row">
        @if (isSubHeader()) {
            <!-- Sub-header (used only by the structured criteria panel): chevron leads the title, per the design. -->
            <h6
                class="expandable-header expandable-header--sub"
                (click)="toggleCollapsed()"
                [attr.aria-expanded]="!isCollapsed()"
                #keyboardAction4
                role="button"
                tabindex="0"
                (keydown.enter)="$event.target === $event.currentTarget ? keyboardAction4.click() : undefined"
                (keydown.space)="$event.target === $event.currentTarget ? $event.preventDefault() : undefined"
                (keyup.space)="$event.target === $event.currentTarget ? keyboardAction4.click() : undefined"
            >
                <fa-icon [icon]="isCollapsed() ? faAngleRight : faAngleDown" />
                {{ hasTranslation() ? (headerKey() | artemisTranslate) : headerKey() }}
            </h6>
        } @else {
            <h5
                class="expandable-header"
                (click)="toggleCollapsed()"
                [attr.aria-expanded]="!isCollapsed()"
                #keyboardAction9
                role="button"
                tabindex="0"
                (keydown.enter)="$event.target === $event.currentTarget ? keyboardAction9.click() : undefined"
                (keydown.space)="$event.target === $event.currentTarget ? $event.preventDefault() : undefined"
                (keyup.space)="$event.target === $event.currentTarget ? keyboardAction9.click() : undefined"
            >
                {{ hasTranslation() ? (headerKey() | artemisTranslate) : headerKey() }}
                <fa-icon [icon]="isCollapsed() ? faAngleRight : faAngleDown" />
            </h5>
        }
        <ng-content select="[expandableSectionHeaderActions]" />
    </div>
}
<div data-testid="expandable-section-content" [ngbCollapse]="isCollapsed()">
    <ng-content />
</div>
