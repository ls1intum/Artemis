@if (!collapsed()) {
    <div class="expanded-instructions instructions-container" jhiResizable [resizableEdges]="{ left: '.draggable-left' }" [resizableConstraints]="{ minWidth: 288, maxWidth: 640 }">
        <div
            class="draggable-left"
            [attr.aria-label]="'artemisApp.assessmentInstructions.instructions.resize' | artemisTranslate"
            [title]="'artemisApp.assessmentInstructions.instructions.resize' | artemisTranslate"
        >
            <fa-icon [icon]="faGripLinesVertical" aria-hidden="true" />
        </div>
        <section class="instructions-panel apollon-glass">
            <header class="instructions-header">
                <button type="button" class="apollon-chrome-actionbtn instructions-disclosure" (click)="collapsed.set(true)" [attr.aria-expanded]="true">
                    <fa-icon [icon]="farListAlt" />
                    <span jhiTranslate="artemisApp.assessmentInstructions.instructions.instructions"></span>
                    <fa-icon class="instructions-disclosure__chevron" [icon]="faChevronRight" aria-hidden="true" />
                </button>
            </header>
            <div class="instructions-content scroll-container">
                <jhi-assessment-instructions
                    [readOnly]="readOnly()"
                    class="markdown-preview"
                    [exercise]="exercise()"
                    [isAssessmentTraining]="isAssessmentTraining()"
                    [showAssessmentInstructions]="showAssessmentInstructions()"
                />
            </div>
        </section>
    </div>
} @else {
    <div class="collapsed-instructions instructions-container apollon-glass apollon-chrome-cluster">
        <button type="button" class="apollon-chrome-actionbtn instructions-disclosure" (click)="collapsed.set(false)" [attr.aria-expanded]="false">
            <fa-icon [icon]="farListAlt" />
            <span jhiTranslate="artemisApp.assessmentInstructions.instructions.instructions"></span>
            <fa-icon [icon]="faChevronLeft" aria-hidden="true" />
        </button>
    </div>
}
