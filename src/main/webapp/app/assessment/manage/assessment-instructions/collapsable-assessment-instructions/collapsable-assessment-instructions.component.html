<tumaet-ui-panel
    class="instructions-panel [&[data-collapsed=false]_.tumaet-ui-panel-content-container]:!grid-rows-[max-content]"
    [toggleable]="true"
    [(collapsed)]="collapsed"
    [toggleAriaLabel]="'artemisApp.assessmentInstructions.instructions.instructions' | artemisTranslate"
>
    <div tumAetUiPanelHeader class="flex w-full items-center justify-between gap-3!">
        <span class="flex items-center gap-3!">
            <fa-icon [icon]="farListAlt" />
            <span jhiTranslate="artemisApp.assessmentInstructions.instructions.instructions"></span>
        </span>
        @if (showReadCheckmark()) {
            <fa-icon
                class="text-state-success"
                [icon]="faCheckCircle"
                role="img"
                [attr.aria-label]="'artemisApp.exerciseAssessmentDashboard.tutorParticipationStatus.title.REVIEWED_INSTRUCTIONS' | artemisTranslate"
            />
        }
    </div>
    <jhi-assessment-instructions
        [readOnly]="readOnly()"
        class="markdown-preview"
        [exercise]="exercise()"
        [isAssessmentTraining]="isAssessmentTraining()"
        [showAssessmentInstructions]="showAssessmentInstructions()"
    />
</tumaet-ui-panel>
