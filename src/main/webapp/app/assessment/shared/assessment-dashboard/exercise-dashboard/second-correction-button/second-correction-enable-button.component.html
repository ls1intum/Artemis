<div class="flex flex-wrap gap-2">
    <!-- Enable second correction with this button -->
    @if (!secondCorrectionEnabled()) {
        <button
            type="button"
            tumUiButton
            severity="success"
            size="small"
            (click)="triggerSecondCorrectionButton()"
            [attr.aria-label]="'artemisApp.exerciseAssessmentDashboard.toggleSecondCorrectionOn' | artemisTranslate"
        >
            <fa-icon [icon]="faToggleOn" [fixedWidth]="true" />
            <span>{{ 'artemisApp.exerciseAssessmentDashboard.toggleSecondCorrectionOn' | artemisTranslate }}</span>
            @if (togglingSecondCorrectionButton()) {
                <fa-icon [icon]="faSpinner" animation="spin" />
            }
        </button>
    }
    <!-- Disable second correction with this button -->
    @if (secondCorrectionEnabled()) {
        <button
            type="button"
            tumUiButton
            severity="danger"
            size="small"
            (click)="triggerSecondCorrectionButton()"
            [attr.aria-label]="'artemisApp.exerciseAssessmentDashboard.toggleSecondCorrectionOff' | artemisTranslate"
        >
            <fa-icon [icon]="faToggleOff" [fixedWidth]="true" />
            <span>{{ 'artemisApp.exerciseAssessmentDashboard.toggleSecondCorrectionOff' | artemisTranslate }}</span>
            @if (togglingSecondCorrectionButton()) {
                <fa-icon [icon]="faSpinner" animation="spin" />
            }
        </button>
    }
</div>
