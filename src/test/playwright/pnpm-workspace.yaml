# pnpm 11+ install/resolution settings for the Playwright tests subproject.
# Default isolated layout: no hoist shim.

preferFrozenLockfile: true
enablePrePostScripts: true
autoInstallPeers: true

# Dependency overrides. pnpm 11 reads overrides from this file in preference to
# `pnpm.overrides` in package.json (which it silently ignores).
overrides:
  brace-expansion: '5.0.9'
  nodemailer: '9.0.3'
  lodash: '4.18.1'
  shell-quote: '1.10.0'

allowBuilds:
  esbuild: true

# pnpm 11 enforces a default `minimumReleaseAge` (24h): a frozen install rejects any
# lockfile entry published within the last day as a supply-chain safeguard. brace-expansion
# 5.0.9 was published <24h before this bump, so it is listed here to let the frozen install
# pass. Remove the entry once the version has aged past the cutoff (the gate then passes on
# its own) — keep this list minimal.
minimumReleaseAgeExclude:
  - brace-expansion@5.0.9
