# ----------------------------------------------------------------------------------------------------------------------
# ActiveMQ broker
# ----------------------------------------------------------------------------------------------------------------------

services:
    activemq-broker:
        container_name: artemis-activemq-broker
        image: docker.io/apache/artemis:${ACTIVEMQ_VERSION}${ACTIVEMQ_IMAGE_VARIANT}
        pull_policy: missing
        environment:
            ARTEMIS_USER: ${BROKER_USER:-guest}
            ARTEMIS_PASSWORD: ${BROKER_PASSWORD:-guest}
            # "--http-host 0.0.0.0 --relax-jolokia" is the default
            # "--nio" is apparently required to make it work on ARM CPUs
            EXTRA_ARGS: --http-host 0.0.0.0 --relax-jolokia --nio
            # Temporary: the image ships a JDK older than 25.0.5.1, so the Base64 intrinsics stay off (CVE-2026-114938).
            # Remove the option once the image of ACTIVEMQ_VERSION ships JDK 25.0.5.1 or newer.
            JDK_JAVA_OPTIONS: -XX:-UseBASE64Intrinsics
        ports:
            - "61613:61616"
        healthcheck:
            test: wget -nv -t1 --spider http://localhost:8161/ || exit 1
            start_period: 600s
            interval: 1s

networks:
  artemis:
    driver: "bridge"
    name: artemis
