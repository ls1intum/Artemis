{{- /* Load-balanced HTTP service across all ready core pods; HTTPRoute target. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artemis.httpName" . }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
spec:
  type: {{ .Values.artemis.service.type }}
  selector:
    {{- include "artemis.coreSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.artemis.service.type "NodePort") .Values.artemis.service.nodePort }}
      nodePort: {{ .Values.artemis.service.nodePort }}
      {{- end }}
