{{- /*
Stable DNS names for the core StatefulSet pods. Members can resolve the
leader's name while it starts because the service publishes unready addresses.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artemis.headlessName" . }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "artemis.coreSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: ssh
      port: {{ .Values.gateway.ssh.port }}
      targetPort: ssh
