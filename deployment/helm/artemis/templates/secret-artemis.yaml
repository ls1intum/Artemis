apiVersion: v1
kind: Secret
metadata:
  name: {{ include "artemis.secretName" . }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ---- Database ----
  SPRING_DATASOURCE_PASSWORD: {{ required "postgresql.auth.password is required" .Values.postgresql.auth.password | quote }}

  # ---- JWT signing secret (shared by all nodes + the registry) ----
  JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64SECRET: {{ required "artemis.config.jwtBase64Secret is required" .Values.artemis.config.jwtBase64Secret | quote }}

  # ---- Internal admin account ----
  ARTEMIS_USERMANAGEMENT_INTERNALADMIN_USERNAME: {{ required "artemis.config.admin.username is required" .Values.artemis.config.admin.username | quote }}
  ARTEMIS_USERMANAGEMENT_INTERNALADMIN_PASSWORD: {{ required "artemis.config.admin.password is required" .Values.artemis.config.admin.password | quote }}

  # ---- Service registry (Eureka) ----
  JHIPSTER_REGISTRY_PASSWORD: {{ required "registry.password is required" .Values.registry.password | quote }}
  # The Eureka URL embeds the registry password, so it must not be published through the ConfigMap, whose read access is usually broader than the one of this Secret.
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: {{ include "artemis.eurekaUrl" . | quote }}

  # ---- WebSocket broker ----
  SPRING_WEBSOCKET_BROKER_USERNAME: {{ .Values.broker.auth.username | quote }}
  SPRING_WEBSOCKET_BROKER_PASSWORD: {{ required "broker.auth.password is required" .Values.broker.auth.password | quote }}
