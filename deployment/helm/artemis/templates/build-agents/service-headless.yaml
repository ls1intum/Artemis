{{- /*
Headless service giving each pod in the build-agent StatefulSet a stable DNS name.
*/ -}}
{{- if .Values.buildAgents.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artemis.buildAgentName" . }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
    app.kubernetes.io/component: build-agent
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "artemis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: build-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
