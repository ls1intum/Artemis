{{- if and .Values.buildAgents.enabled .Values.buildAgents.autoscaling.enabled }}
{{- $autoscaling := .Values.buildAgents.autoscaling -}}
{{- $serverAddress := required "buildAgents.autoscaling.prometheus.serverAddress is required when buildAgents.autoscaling.enabled is true" ($autoscaling.prometheus.serverAddress | trim) -}}
{{- if lt (int $autoscaling.maxReplicas) (int $autoscaling.minReplicas) -}}
{{- fail "buildAgents.autoscaling.maxReplicas must not be lower than minReplicas" -}}
{{- end -}}
{{- /*
The gauges are cluster-wide values that every core node reports, so max() takes one of them instead of adding them up.
Queued plus running builds is the number of build slots that are needed at the moment. Dividing by the concurrent builds
of one controller, which is the threshold with an AverageValue metric, gives the number of controllers.
*/ -}}
{{- $defaultQuery := "max(artemis_global_localci_queued) + max(artemis_global_localci_running)" -}}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "artemis.buildAgentName" . }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
    app.kubernetes.io/component: build-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "artemis.buildAgentName" . }}
  minReplicaCount: {{ $autoscaling.minReplicas }}
  maxReplicaCount: {{ $autoscaling.maxReplicas }}
  pollingInterval: {{ $autoscaling.pollingIntervalSeconds }}
  cooldownPeriod: {{ $autoscaling.cooldownPeriodSeconds }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: {{ $autoscaling.scaleUp.pods }}
              periodSeconds: {{ $autoscaling.scaleUp.periodSeconds }}
        scaleDown:
          stabilizationWindowSeconds: {{ $autoscaling.scaleDown.stabilizationWindowSeconds }}
          policies:
            - type: Pods
              value: {{ $autoscaling.scaleDown.pods }}
              periodSeconds: {{ $autoscaling.scaleDown.periodSeconds }}
  triggers:
    - type: prometheus
      metricType: AverageValue
      metadata:
        serverAddress: {{ $serverAddress | quote }}
        query: {{ $autoscaling.prometheus.query | default $defaultQuery | quote }}
        threshold: {{ .Values.buildAgents.concurrentBuildsPerAgent | quote }}
        # A missing series, for example while Prometheus does not scrape the core pods, is an error and not zero.
        # With zero KEDA would scale the controllers down to the minimum while builds are waiting.
        ignoreNullValues: "false"
{{- end }}
