{{- if .Values.buildAgents.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "artemis.buildControllerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
    app.kubernetes.io/component: build-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "artemis.workloadServiceAccountName" . }}
  namespace: {{ .Values.buildAgents.namespace }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
    app.kubernetes.io/component: build-workload
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "artemis.buildAgentName" . }}
  namespace: {{ .Values.buildAgents.namespace }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    # Kubernetes supports both POST and WebSocket GET transports for exec.
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "artemis.buildAgentName" . }}
  namespace: {{ .Values.buildAgents.namespace }}
  labels:
    {{- include "artemis.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "artemis.buildControllerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "artemis.buildAgentName" . }}
{{- end }}
